              raise ValueError('UNKNOWN_SOURCE_LABEL')
          
          
          def safe_fetch(url, requester=None):
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme != 'https' or parsed.hostname not in SOURCE_DOMAINS:
                  raise ValueError('UNAPPROVED_SOURCE_HOST')
              if requester is not None:
                  raw, final_url = requester(url)
              else:
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'KRX-v5-Stage28-source-contract-audit/1.0',
                      'Accept': 'text/html,application/xhtml+xml',
                  })
                  with urllib.request.urlopen(req, timeout=6) as res:
                      final_url = res.geturl()
                      raw = res.read(MAX_RESPONSE + 1)
              dest = urllib.parse.urlparse(final_url)
              if dest.scheme != 'https' or dest.hostname != parsed.hostname:
                  raise ValueError('SOURCE_REDIRECT_OUTSIDE_OFFICIAL_HOST')
              if len(raw) > MAX_RESPONSE:
                  raise ValueError('SOURCE_RESPONSE_TOO_LARGE')
              if not isinstance(raw, bytes):
                  raise ValueError('SOURCE_RESPONSE_NOT_BYTES')
              return raw
          
          
