          #!/usr/bin/env python3
          """Stage28 #35: conservative evidence tiering of existing calculated ratio research.
          
          This is a read-only post-processing audit. It does NOT authenticate official
          KRX ratios, receipt-bound historical financial values, share class, or a trade.
          No missing-correction recovery, DART calls, or KRX data collection.
          """
          from __future__ import annotations
          
          import collections
          import csv
          from datetime import datetime
          from decimal import Decimal, InvalidOperation
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys
          from zoneinfo import ZoneInfo
          
          ROOT=Path('v5_reports/stage28')
          FILTERED=ROOT/'r14_eligible_research_candidates.json'
          EXCLUSION=ROOT/'r14_candidate_exclusion_gate.json'
          CALCULATED=ROOT/'r14_calculated_per_pbr_research.json'
          QUALITY=ROOT/'r14_calculated_ratio_quality_gate.json'
          VALUATION=ROOT/'r14_valuation_readiness_gate.json'
          STAGE27=Path('v5_reports/stage27/status.json')
          FIN_CACHE=Path('data/v5_financial_m/dart_financial_cache.json')
          REPORT=ROOT/'r14_calculated_ratio_evidence_triage.json'
          PRIORITIES=ROOT/'r14_calculated_ratio_missing_evidence_queue.json'
          CSV_FILE=ROOT/'r14_calculated_ratio_evidence_tiers.csv'
          TIER_DUAL='RESEARCH_TWO_SUPPORTING_CHECKS_NOT_PIT_AUTHENTICATED'
          TIER_SINGLE='RESEARCH_ONE_SUPPORTING_CHECK_NOT_PIT_AUTHENTICATED'
          TIER_WEAK='RESEARCH_NO_SUPPORTING_CHECKS_NOT_PIT_AUTHENTICATED'
          TIER_BLOCK='RESEARCH_CALCULATION_BLOCKED'
          TIERS=(TIER_DUAL,TIER_SINGLE,TIER_WEAK,TIER_BLOCK)
          DATE=re.compile(r'^20\d{6}$')
          CODE=re.compile(r'^\d{6}$')
          
          
          def load(p):
              return json.loads(Path(p).read_text(encoding='utf-8-sig'))
          
          
          def checksum(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          
          
          def positive(v):
              try:
                  if v is None or isinstance(v,bool): return False
                  d=Decimal(str(v).replace(',',''))
                  return d.is_finite() and d>0
              except (TypeError,ValueError,InvalidOperation):
                  return False
          
          
          def indexed(rows,label):
              if not isinstance(rows,list):raise ValueError(label+'_NOT_ARRAY')
              d={}
              for item in rows:
                  if not isinstance(item,dict): raise ValueError(label+'_ITEM_NOT_OBJECT')
                  code=item.get('code')
                  if not isinstance(code,str) or not CODE.fullmatch(code):raise ValueError(label+'_BAD_CODE')
                  if code in d:raise ValueError(label+'_DUPLICATE_'+code)
                  d[code]=item
              return d
          
          
          def validate_inputs(filtered,exclusion,ratios,quality,valuation):
              if filtered.get('result')!='R14_FILTERED_RESEARCH_ONLY_CANDIDATES_V1':raise ValueError('WRONG_FILTERED_FEED')
              if exclusion.get('result')!='R14_MISSING_CORRECTION_EXCLUSION_GATE_V1':raise ValueError('EXCLUSION_GATE_MISSING')
              if ratios.get('result')!='R14_OWNER_ATTRIBUTABLE_MARKETCAP_RATIOS_RESEARCH_V1':raise ValueError('WRONG_CALCULATION_REPORT')
              if quality.get('result')!='R14_OWNER_ATTRIBUTABLE_CALCULATED_RATIO_EVIDENCE_GATE_RESEARCH_V1':raise ValueError('WRONG_CALCULATION_QUALITY_GATE')
              if valuation.get('result')!='R14_FILTERED_VALUATION_EVIDENCE_GATE_V1':raise ValueError('WRONG_VALUATION_GATE')
              date=filtered.get('research_market_date')
              if not isinstance(date,str) or not DATE.fullmatch(date):raise ValueError('BAD_MARKET_DATE')
              datetime.strptime(date,'%Y%m%d')
              for src in (exclusion,ratios,quality,valuation):
                  if src.get('research_market_date')!=date:raise ValueError('SNAPSHOT_MARKET_DATE_MISMATCH')
              excluded=exclusion.get('excluded_codes')
              if not isinstance(excluded,list) or len(excluded)!=len(set(excluded)) or not all(isinstance(x,str) and CODE.fullmatch(x) for x in excluded):
                  raise ValueError('BAD_EXCLUSION_SET')
              if sorted(excluded)!=sorted(filtered.get('excluded_codes',[])) or sorted(excluded)!=sorted(ratios.get('excluded_codes',[])):
                  raise ValueError('EXCLUSION_NOT_PROPAGATED')
              if sorted(excluded)!=sorted(quality.get('excluded_missing_corrected_filing_codes',[])) or sorted(excluded)!=sorted(valuation.get('excluded_for_missing_corrected_filing',[])):
                  raise ValueError('EXCLUSION_NOT_ENFORCED_AT_GATES')
              f=indexed(filtered.get('candidates'),'FILTERED')
              r=indexed(ratios.get('calculated_ratios'),'CALCULATED')
              if set(f)!=set(r):raise ValueError('CALCULATED_RATIO_CODES_NOT_FILTERED')
              if set(excluded)&set(f):raise ValueError('EXCLUDED_CORRECTION_REINTRODUCED')
              n=len(f)
              if n!=filtered.get('candidate_count') or n!=ratios.get('candidate_count') or n!=quality.get('filtered_input_candidate_count') or n!=exclusion.get('eligible_research_candidate_count') or n!=valuation.get('filtered_input_candidate_count'):
                  raise ValueError('FILTERED_INPUT_COUNT_MISMATCH')
              if ratios.get('official_krx_ratios_verified')!=0 or quality.get('official_per_pbr_independently_verified_count')!=0:
                  raise ValueError('OFFICIAL_RATIO_MISREPRESENTED')
              if ratios.get('shares_and_pit_verified') is not False or quality.get('historical_point_in_time_financials_verified') is not False:
                  raise ValueError('SHARE_PIT_MISREPRESENTED')
              if ratios.get('research_only') is not True or quality.get('research_only') is not True or ratios.get('investment_decisions_authorized') is not False or ratios.get('final_buy_signals')!=0 or valuation.get('ready_for_research_valuation_count')!=0:
                  raise ValueError('VALUATION_OR_TRADE_GATE_UNSAFE')
              if sorted({x['grade'] for x in f.values()})!=sorted(set(filtered.get('candidate_grades',{}))):
                  raise ValueError('GRADE_MISMATCH')
              for code,x in f.items():
                  if x.get('grade') not in ('A','B','B+'):raise ValueError('NON_AB_RESEARCH_CANDIDATE_'+code)
                  if x.get('market_date')!=date or x.get('buy_signal') is not False:raise ValueError('FILTERED_ROW_UNSAFE_'+code)
                  y=r[code]
                  if y.get('market_date')!=date or y.get('research_grade')!=x.get('grade') or y.get('buy_signal') is not False or y.get('official_krx_per_pbr') is not False:
                      raise ValueError('CALCULATED_ROW_NOT_ALIGNED_'+code)
                  if y.get('share_class_independently_verified') is not False or y.get('historical_point_in_time_verified') is not False or y.get('investment_decisions_authorized') is not False or y.get('actionable_entry_price') is not False:
                      raise ValueError('CALCULATED_ROW_CLAIMS_PROOF_'+code)
              return date,excluded,f,r
          
          
          def tier_one(src):
              comp=src.get('independent_annual_comparative_cache_matches_owner_profit') is True
              receipt=(src.get('filing_evidence') or {}).get('asof_receipt_listed') is True
              cash=src.get('cache_source_checks') or {}
              complete=(src.get('calculated_ratio_status')=='RESEARCH_ESTIMATE_BOTH_METRICS'
                        and positive(src.get('per_calculated_research')) and positive(src.get('pbr_calculated_research'))
                        and cash.get('annual_reconciled') is True and cash.get('ttm_reconciled') is True)
              reasons=[]
              if not complete: reasons.append('PER_PBR_OR_CACHED_OWNER_VALUES_NOT_RECONCILED')
              if not comp: reasons.append('ANNUAL_OWNER_PROFIT_COMPARATIVE_NOT_MATCHED')
              if not receipt: reasons.append('ANNUAL_REPORT_RECEIPT_DATE_NOT_EVIDENCED_AS_OF_MARKET_DATE')
              if not ((src.get('filing_evidence') or {}).get('cached_values_matched_to_receipt') is True):
                  reasons.append('CACHED_FINANCIAL_VALUES_NOT_AUTHENTICATED_TO_HISTORICAL_RECEIPT')
              reasons += ['MARKET_CAP_SHARE_CLASS_SCOPE_NOT_VERIFIED','OFFICIAL_KRX_PER_PBR_NOT_VERIFIED']
              if not complete: tier=TIER_BLOCK
              elif comp and receipt: tier=TIER_DUAL
              elif comp or receipt: tier=TIER_SINGLE
              else: tier=TIER_WEAK
              return tier,reasons,comp,receipt,complete
          
          
          def audit(filtered,exclusion,ratios,quality,valuation):
              date,excluded,filtered_idx,ratio_idx=validate_inputs(filtered,exclusion,ratios,quality,valuation)
              counts=collections.Counter();flags=collections.Counter();rows=[];followups=[]
              for code,stock in filtered_idx.items():
                  src=ratio_idx[code]
                  tier,reasons,comp,receipt,complete=tier_one(src)
                  counts[tier]+=1
                  for name in reasons:flags[name]+=1
                  row={'code':code,'name':stock.get('name'),'grade_research_only':stock['grade'],
                       'research_market_date':date,'evidence_tier':tier,
                       'annual_owner_profit_comparative_matches_cache':comp,
                       'annual_report_receipt_listed_by_market_date':receipt,
                       'receipt_bound_financial_values_verified':False,
                       'share_class_and_market_cap_scope_verified':False,
                       'official_krx_per_pbr_verified':False,
                       'per_calculated_research':src.get('per_calculated_research') if complete else None,
                       'pbr_calculated_research':src.get('pbr_calculated_research') if complete else None,
                       'calculated_ratio_is_research_only':True,
                       'investment_decisions_authorized':False,'actionable_price_verified':False,
                       'final_buy_signal':False,'missing_evidence_reasons':reasons}
                  rows.append(row)
                  if tier!=TIER_DUAL:
                      followups.append({'code':code,'name':row['name'],'grade_research_only':row['grade_research_only'],
                                        'evidence_tier':tier,'missing_evidence_reasons':reasons,
                                        'excluded_missing_correction_stock':False,
                                        'source_retrieval_attempted':False,
                                        'actionable_price_verified':False})
              assert sum(counts.values())==len(filtered_idx)
              calc=sum(t!=TIER_BLOCK for t in (x['evidence_tier'] for x in rows))
              if calc!=quality.get('calculated_both_research_count'):
                  raise ValueError('STAGE34_CALCULATION_COUNT_CHANGED')
              if counts[TIER_BLOCK]!=quality.get('calculation_blocked_count'):
                  raise ValueError('STAGE34_CALCULATION_BLOCK_MISMATCH')
              comp_matches=sum(x['annual_owner_profit_comparative_matches_cache'] for x in rows)
              receipts=sum(x['annual_report_receipt_listed_by_market_date'] for x in rows)
              if comp_matches!=quality.get('annual_parent_owner_comparative_match_count') or receipts!=quality.get('annual_filing_receipt_listed_asof_count'):
                  raise ValueError('STAGE34_EVIDENCE_COUNTERS_MISMATCH')
              assert not(set(excluded)&{x['code'] for x in rows})
              shared={'research_market_date':date,'source_ratio_report':str(CALCULATED),
                      'source_quality_gate':str(QUALITY),'source_candidate_feed':str(FILTERED),
                      'excluded_correction_codes':sorted(excluded),
                      'official_krx_ratios_independently_verified':0,
                      'receipt_bound_financial_values_authenticated':False,
                      'market_cap_share_class_authenticated':False,
                      'historical_point_in_time_verified':False,
                      'investment_decisions_authorized':False,'final_buy_signals':0,
                      'research_only':True,'new_network_requests_this_stage':0,
                      'missing_corrected_filing_retrieval_disabled':True}
              report={'result':'R14_CALCULATED_RATIO_EVIDENCE_TIERS_RESEARCH_V1',
                      'generated_kst':datetime.now(ZoneInfo('Asia/Seoul')).isoformat(),
                      **shared,'filtered_input_candidate_count':len(rows),
                      'research_calculated_both_count':calc,
                      'tier_counts':{tier:counts[tier] for tier in TIERS},
                      'evidence_gap_counts':dict(flags),
                      'strongest_research_evidence_count_not_verified':counts[TIER_DUAL],
                      'incomplete_research_evidence_count':len(followups),
                      'actionable_valuation_count':0,
                      'candidate_evidence_rows':rows,
                      'limitations':[
                          'Two supporting checks are not provider authentication or point-in-time filing-value verification',
                          'Receipt listing does not prove the cached financial value matches that exact filing version',
                          'KRX market cap may contain share-class scope issues, not independently verified here',
                          'Calculated PER/PBR have no official KRX provider authentication and no approved target prices',
                          'The pre-existing 3 missing-correction exclusions remain permanent for this research snapshot'
                      ]}
              queue={'result':'R14_CALCULATED_RATIO_RESEARCH_EVIDENCE_GAPS_V1',
                     'generated_kst':report['generated_kst'],**shared,
                     'research_candidates_kept':len(rows),
                     'missing_evidence_candidate_count':len(followups),
                     'missing_evidence_candidates':followups,
                     'all_candidates_still_need_share_class_and_pit_authentication':True,
                     'no_automatic_missing_correction_retry':True,
                     'next_development_priorities':[
                        'Confirm ordinary/preferred share-class market cap scope without fabricating share counts',
                        'Validate each cash-flow and balance-sheet value against the receipt version available at the research date',
                        'Keep missing-correction excluded stocks out of all future research feeds',
                        'Continue separate 5-10-20 session outcome research independently of trade authorization'
                     ],'actionable_valuation_count':0}
              return report,queue
          
          
          def write(report,queue):
              ROOT.mkdir(parents=True,exist_ok=True)
