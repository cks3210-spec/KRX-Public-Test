          RESULT_VERSION='R14_RESEARCH_REFERENCE_PRICE_OUTCOMES_V1'
          SUMMARY_VERSION='R14_RESEARCH_5_10_20_SESSION_SUMMARY_V1'
          
          
          def load(path):
              return json.loads(path.read_text(encoding='utf-8-sig'))
          
          
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          
          def value(x):
              try:
                  if x is None or isinstance(x,bool):return None
                  d=Decimal(str(x).replace(',','').strip())
                  return d if d.is_finite() and d>0 else None
              except (TypeError,InvalidOperation,ValueError):return None
          
          
          def valid_date(x):
              if not isinstance(x,str) or not DATE.fullmatch(x):raise ValueError('INVALID_SESSION_DATE_'+str(x))
              dt.datetime.strptime(x,'%Y%m%d')
              return x
          
          
          def index(rows,label):
              if not isinstance(rows,list):raise ValueError(label+'_NOT_LIST')
              result={}
              for x in rows:
                  if not isinstance(x,dict) or not isinstance(x.get('code'),str) or not CODE.fullmatch(x['code']):
                      raise ValueError(label+'_BAD_CODE')
                  if x['code'] in result:raise ValueError(label+'_DUPLICATE_CODE_'+x['code'])
                  result[x['code']]=x
              return result
          
          
          def validate_inputs(shortlist,exclusion,triage):
              if shortlist.get('result')!='R14_FILTERED_RESEARCH_ONLY_CANDIDATES_V1':raise ValueError('UNFILTERED_SHORTLIST')
              if exclusion.get('result')!='R14_MISSING_CORRECTION_EXCLUSION_GATE_V1':raise ValueError('EXCLUSION_POLICY_MISSING')
              if triage.get('result')!='R14_CALCULATED_RATIO_EVIDENCE_TIERS_RESEARCH_V1':raise ValueError('TRIAGE_MISSING')
              date=valid_date(shortlist.get('research_market_date'))
              if exclusion.get('research_market_date')!=date or triage.get('research_market_date')!=date:
                  raise ValueError('MIXED_COHORT_DATE')
              excluded=exclusion.get('excluded_codes')
              if not isinstance(excluded,list) or not all(isinstance(x,str) and CODE.fullmatch(x) for x in excluded):
                  raise ValueError('INVALID_EXCLUDED_CODES')
              if len(excluded)!=len(set(excluded)):raise ValueError('DUPLICATE_EXCLUSIONS')
              if sorted(excluded)!=sorted(shortlist.get('excluded_codes',[])) or sorted(excluded)!=sorted(triage.get('excluded_correction_codes',[])):
                  raise ValueError('EXCLUSIONS_NOT_PROPAGATED')
              a=index(shortlist.get('candidates'),'RESEARCH')
              b=index(triage.get('candidate_evidence_rows'),'TRIAGE')
              if set(a)&set(excluded):raise ValueError('CORRECTION_EXCLUDED_CODE_PRESENT')
              if set(a)!=set(b):raise ValueError('EVIDENCE_TRIAGE_CODE_MISMATCH')
              n=len(a)
              if n!=shortlist.get('candidate_count') or n!=exclusion.get('eligible_research_candidate_count') or n!=triage.get('filtered_input_candidate_count'):
                  raise ValueError('CANDIDATE_COUNT_MISMATCH')
              if n==0:raise ValueError('EMPTY_RESEARCH_FEED')
              for code,row in a.items():
                  if row.get('market_date')!=date or row.get('grade') not in ('A','B','B+'):
                      raise ValueError('GRADE_OR_DATE_INVALID_'+code)
                  if row.get('buy_signal') is not False or row.get('actionable_entry_price') is not False:
                      raise ValueError('UNAUTHORIZED_ENTRY_PRICE_'+code)
                  if b[code].get('research_market_date')!=date or b[code].get('grade_research_only')!=row['grade']:
                      raise ValueError('TRIAGE_UNMATCHED_DATE_GRADE_'+code)
                  if b[code].get('actionable_price_verified') is not False:
                      raise ValueError('TRIAGE_PRICE_PROMOTION_'+code)
              for o in (shortlist,exclusion,triage):
                  if o.get('investment_decisions_authorized') is not False or o.get('final_buy_signals')!=0:
                      raise ValueError('INPUT_UNAUTHORIZED_INVESTMENT_FLAGS')
              return date,a,b,sorted(excluded)
          
          
          def read_archived_history(path,latest,summary,tracked_codes):
              latest_day=valid_date(summary.get('latest_trading_date'))
              if summary.get('sessions_stored')!=70:raise ValueError('HISTORY_SESSION_COUNT_NOT_VERIFIED')
              dates=collections.Counter()
              prices={}
              markets={}
              with gzip.open(path,'rt',encoding='utf-8-sig',newline='') as f:
                  for row in csv.DictReader(f):
                      day=valid_date(row.get('BAS_DD'))
                      market=row.get('MARKET')
                      code=row.get('ISU_CD')
                      if market not in ('KOSPI','KOSDAQ') or not isinstance(code,str):raise ValueError('INVALID_MARKET_HISTORY_ROW')
                      dates[day]+=1
                      if code in tracked_codes:
                          k=(day,code)
                          if k in prices:raise ValueError('DUPLICATE_TRACKED_SECURITY_DATE_'+str(k))
                          close=value(row.get('TDD_CLSPRC'))
                          if close is not None:prices[k]=close
                          markets[k]=market
              if len(dates)!=70 or max(dates)!=latest_day or sum(dates.values())!=summary.get('total_rows_stored'):
                  raise ValueError('ARCHIVE_NOT_MATCHING_VERIFIED_MARKET_SUMMARY')
              if min(dates.values())<1500:raise ValueError('ARCHIVE_SESSION_MARKET_COVERAGE_TOO_LOW')
              if latest is not None:
                  with latest.open(encoding='utf-8-sig',newline='') as f:
                      rows=list(csv.DictReader(f))
                  if len(rows)!=dates[latest_day]:raise ValueError('ARCHIVE_LATEST_COUNT_MISMATCH')
                  sample={r['ISU_CD']:r for r in rows if r.get('ISU_CD') in tracked_codes}
                  for code,r in sample.items():
                      if r.get('BAS_DD')!=latest_day or prices.get((latest_day,code))!=value(r.get('TDD_CLSPRC')):
                          raise ValueError('ARCHIVE_LATEST_TRACKED_PRICE_MISMATCH_'+code)
              return sorted(dates),prices,markets,latest_day
          
          
          def frozen_cohorts(old,market_date,filtered,triage,excluded,sessions,prices):
              if old is None:
                  ledger={'version':COHORT_VERSION,'cohorts':[],'research_only':True,'investment_decisions_authorized':False,'final_buy_signals':0}
              else:
                  if old.get('version')!=COHORT_VERSION or old.get('research_only') is not True or old.get('investment_decisions_authorized') is not False or old.get('final_buy_signals')!=0:
                      raise ValueError('OLD_COHORT_LEDGER_NOT_VALID')
                  ledger=json.loads(json.dumps(old))
              cohorts=ledger.get('cohorts')
              if not isinstance(cohorts,list) or len({c.get('research_market_date') for c in cohorts})!=len(cohorts):
                  raise ValueError('OLD_COHORT_DUPLICATE_DATE')
              for c in cohorts:
                  valid_date(c.get('research_market_date'))
                  codes=index(c.get('candidates'),'FROZEN_COHORT')
                  if any(x in excluded for x in codes):raise ValueError('EXCLUDED_CODE_IN_FROZEN_COHORT')
                  for row in codes.values():
                      if value(row.get('reference_close_krw')) is None:raise ValueError('INVALID_FROZEN_PRICE')
              previous=next((c for c in cohorts if c['research_market_date']==market_date),None)
              if market_date not in sessions and previous is None:
                  raise ValueError('NEW_COHORT_MARKET_DATE_NOT_IN_VERIFIED_ARCHIVE')
              new_candidates=[]
              for code,c in sorted(filtered.items()):
                  p=value(c.get('close_krw'))
                  if p is None:raise ValueError('INVALID_REFERENCE_CLOSE_'+code)
                  if market_date in sessions and prices.get((market_date,code))!=p:
                      raise ValueError('RESEARCH_CLOSE_NOT_MATCHING_ARCHIVED_MARKET_'+code)
                  tier=triage[code]['evidence_tier']
