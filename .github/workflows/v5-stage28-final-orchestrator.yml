      - name: Classify original versus corrected XBRL candidate facts (read-only)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: xbrl_revision_delta
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r14_xbrl_revision_delta.py <<'PYCODE'
          #!/usr/bin/env python3
          """Read-only revision-value comparison using Stage28's existing receipt XBRL cache.
          
          No additional OpenDART queries. Comparisons are research *candidates*: facts have not
          been independently authenticated for CFS/OFS or availability at evaluation time.
          Never authorize trading or modify any underlying R14, Stage27, v4, or GC cache.
          """
          import collections
          import datetime as dt
          import json
          import re
          from pathlib import Path
          from zoneinfo import ZoneInfo
          
          ROOT=Path('v5_reports/stage28')
          FILING=ROOT/'r14_filing_receipt_cache.json'
          COMPARE=ROOT/'r14_financial_value_reconciliation_cache.json'
          XBRL=ROOT/'r14_xbrl_receipt_financial_cache.json'
          DOCUMENTS=ROOT/'r14_filing_document_version_cache.json'
          REPORT=ROOT/'r14_xbrl_revision_delta_research.json'
          FIELDS=('profit','equity','revenue','assets','liabilities')
          
          
          def load(path,default):
              try: return json.loads(path.read_text(encoding='utf-8-sig'))
              except (OSError,ValueError): return default
          
          
          def save(path,value):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp=path.with_name(path.name+'.tmp')
              tmp.write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              tmp.replace(path)
          
          
          def receipt_valid(r):
              return bool(re.fullmatch(r'20\d{12}',str(r or '')))
          
          
          def candidates_from_xbrl(entry):
              if not isinstance(entry,dict) or entry.get('state')!='XBRL_RECEIPT_ZIP_RETRIEVED':
                  return {},[], 'NOT_RETRIEVED'
              seen=collections.defaultdict(set)
              for f in entry.get('files',[]):
                  if not isinstance(f,dict) or f.get('state')!='EXTRACTED_PERIOD_FACTS_RESEARCH_ONLY':
                      continue
                  for k,v in (f.get('fields') or {}).items():
                      if k in FIELDS and type(v) is int:
                          seen[k].add(v)
              unique={k:next(iter(vals)) for k,vals in seen.items() if len(vals)==1}
              ambiguous=sorted(k for k,vals in seen.items() if len(vals)>1)
              return unique,ambiguous,'FACT_CANDIDATES_PRESENT' if seen else 'NO_DIRECT_FACTS'
          
          
          def period_delta(code,period,filing_row,period_row,financial_period,cache,docs):
              cutoff=str(filing_row.get('evaluation_date') or '')
              entries=(period_row.get('pre_evaluation_receipts') or [])
              eligible=sorted(set(str(x.get('rcept_no')) for x in entries if isinstance(x,dict)
                                  and receipt_valid(x.get('rcept_no'))
                                  and re.fullmatch(r'20\d{6}',str(x.get('rcept_dt') or ''))
                                  and str(x['rcept_no'])[:8]==str(x['rcept_dt'])
                                  and str(x['rcept_dt'])<=cutoff))
              selected=str(period_row.get('latest_available_asof_evaluation') or '')
              r={'code':code,'period':period,'evaluation_date':cutoff,
                 'financial_receipt_mismatch_reported':financial_period.get('status')=='DART_RECEIPT_MISMATCH',
                 'original_receipt':eligible[0] if eligible else None,
                 'latest_pre_evaluation_receipt':selected if selected in eligible else None,
                 'original_document_hash_saved':False,'latest_document_hash_saved':False,
                 'comparison_status':'WAITING_EVIDENCE','candidate_field_differences':{},
                 'candidate_field_equal':[],'ambiguous_fields':[],
                 'financial_basis_verified':False,'point_in_time_financial_values_verified':False,
                 'official_ratios_verified':False,'investment_decisions_authorized':False}
              if not eligible or selected not in eligible:
                  r['comparison_status']='INVALID_OR_MISSING_ASOF_RECEIPTS';return r
              old,new=eligible[0],selected
              rows=cache.get('rows') or {}
              docs_rows=docs.get('rows') or {}
              r['original_document_hash_saved']=(docs_rows.get(old) or {}).get('state')=='DOCUMENT_ZIP_HASH_CAPTURED'
              r['latest_document_hash_saved']=(docs_rows.get(new) or {}).get('state')=='DOCUMENT_ZIP_HASH_CAPTURED'
              if old==new:
                  r['comparison_status']='SINGLE_RECEIPT_NO_REVISION_PAIR';return r
              orig,oa,os=candidates_from_xbrl(rows.get(old))
              newer,na,ns=candidates_from_xbrl(rows.get(new))
              r['original_xbrl_state']=os;r['latest_xbrl_state']=ns
              if 'NOT_RETRIEVED' in (os,ns):
                  r['comparison_status']='WAITING_XBRL_RECEIPT';return r
              shared=sorted(set(orig)&set(newer))
              r['ambiguous_fields']=sorted(set(oa)|set(na))
              for k in shared:
                  if orig[k]!=newer[k]:
                      r['candidate_field_differences'][k]={'original_candidate':orig[k],
                                                            'latest_candidate':newer[k]}
                  else: r['candidate_field_equal'].append(k)
              if r['candidate_field_differences']:
                  r['comparison_status']='POTENTIAL_FINANCIAL_FACT_REVISION'
              elif shared:
                  r['comparison_status']='NO_CHANGE_IN_COMPARABLE_FACT_CANDIDATES'
              elif r['ambiguous_fields']:
                  r['comparison_status']='AMBIGUOUS_XBRL_FACT_BASIS'
              else:
                  r['comparison_status']='NO_SHARED_DIRECT_FACTS'
              return r
          
          
          def build(filing,fin,xbrl,documents):
              if filing.get('format')!='R14_RECEIPT_EVIDENCE_CACHE_V1':
                  raise ValueError('MISSING_OR_INVALID_FILING_CACHE')
              if fin.get('format')!='R14_FINANCIAL_COMPARISON_CACHE_V1':
                  raise ValueError('MISSING_OR_INVALID_FINANCIAL_RECONCILIATION_CACHE')
              if xbrl and xbrl.get('format')!='R14_RECEIPT_XBRL_RESEARCH_CACHE_V1':
                  raise ValueError('UNKNOWN_XBRL_CACHE_FORMAT')
              items=[]
              for code,row in sorted(filing.get('rows',{}).items()):
                  finrow=(fin.get('rows') or {}).get(code,{})
                  if finrow.get('status')!='RECEIPT_VERSION_MISMATCH': continue
                  if row.get('evaluation_date_source')!='FROZEN_STAGE27_RESEARCH_SNAPSHOT':continue
                  if not re.fullmatch(r'20\d{6}',str(row.get('evaluation_date') or '')):continue
                  for period,p in sorted((row.get('filing_periods') or {}).items()):
                      if not re.fullmatch(r'20\d{2}_annual',period):continue
                      finperiod=(finrow.get('periods') or {}).get(period) or {}
                      if finperiod.get('status')!='DART_RECEIPT_MISMATCH':continue
                      items.append(period_delta(code,period,row,p,finperiod,xbrl,documents))
              return items
          
          
          def selftest():
              empty={'rows':{}}
              a={'state':'XBRL_RECEIPT_ZIP_RETRIEVED','files':[{'state':'EXTRACTED_PERIOD_FACTS_RESEARCH_ONLY','fields':{'assets':100,'profit':10}}]}
              b={'state':'XBRL_RECEIPT_ZIP_RETRIEVED','files':[{'state':'EXTRACTED_PERIOD_FACTS_RESEARCH_ONLY','fields':{'assets':120,'profit':10}}]}
              assert candidates_from_xbrl(a)[0]=={'assets':100,'profit':10}
              assert candidates_from_xbrl({'state':'NOT_ZIP_RESPONSE'})[2]=='NOT_RETRIEVED'
              fil={'rows':{'000001':{'evaluation_date':'20261120','evaluation_date_source':'FROZEN_STAGE27_RESEARCH_SNAPSHOT',
                  'filing_periods':{'2025_annual':{'latest_available_asof_evaluation':'20260605000001',
                    'pre_evaluation_receipts':[{'rcept_no':'20260318000001','rcept_dt':'20260318'},
                                               {'rcept_no':'20260605000001','rcept_dt':'20260605'}]}}}},
                  'format':'R14_RECEIPT_EVIDENCE_CACHE_V1'}
              fin={'format':'R14_FINANCIAL_COMPARISON_CACHE_V1','rows':{'000001':{'status':'RECEIPT_VERSION_MISMATCH',
                  'periods':{'2025_annual':{'status':'DART_RECEIPT_MISMATCH'}}}}}
              cache={'format':'R14_RECEIPT_XBRL_RESEARCH_CACHE_V1','rows':{'20260318000001':a,'20260605000001':b}}
              one=build(fil,fin,cache,empty)
              assert len(one)==1
              assert one[0]['comparison_status']=='POTENTIAL_FINANCIAL_FACT_REVISION'
              assert one[0]['candidate_field_differences']['assets']=={'original_candidate':100,'latest_candidate':120}
              assert one[0]['candidate_field_equal']==['profit']
              assert one[0]['point_in_time_financial_values_verified'] is False
              assert build(fil,fin,{},empty)[0]['comparison_status']=='WAITING_XBRL_RECEIPT'
              cache['rows']['20260605000001']=a
              assert build(fil,fin,cache,empty)[0]['comparison_status']=='NO_CHANGE_IN_COMPARABLE_FACT_CANDIDATES'
              fil['rows']['000001']['evaluation_date_source']='AUDIT_TIME_NOT_HISTORICAL_SIGNAL'
              assert not build(fil,fin,cache,empty)
              cache['rows']['20260605000001']={'state':'XBRL_RECEIPT_ZIP_RETRIEVED','files':[
                 {'state':'EXTRACTED_PERIOD_FACTS_RESEARCH_ONLY','fields':{'assets':100}},
                 {'state':'EXTRACTED_PERIOD_FACTS_RESEARCH_ONLY','fields':{'assets':140}}]}
              assert candidates_from_xbrl(cache['rows']['20260605000001'])[1]==['assets']
              return 11
          
          
          def main():
              import sys
              if '--self-test' in sys.argv:
                  print(json.dumps({'self_test':'PASS','tests':selftest()}));return
              f,c,x,d=(load(p,{}) for p in (FILING,COMPARE,XBRL,DOCUMENTS))
              rows=build(f,c,x,d)
              counts=collections.Counter(q['comparison_status'] for q in rows)
              report={'result':'R14_XBRL_REVISION_DELTA_RESEARCH_ONLY',
                      'generated_kst':dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat(),
                      'research_market_date':load(ROOT/'r14_full_market_grade_research.json',{}).get('market_date'),
                      'mismatch_periods':len(rows),'status_counts':dict(counts),
                      'candidate_fact_revision_periods':counts['POTENTIAL_FINANCIAL_FACT_REVISION'],
                      'comparisons':rows,
                      'official_per_independently_verified':0,'official_pbr_independently_verified':0,
                      'point_in_time_financials_verified':False,
                      'investment_decisions_authorized':False,'final_buy_signals':0,
                      'limitations':['Multiple XBRL files can differ in financial basis (CFS/OFS); values are only candidates',
                                     'Source documents and XBRL retrieved today do not prove what was available historically',
                                     'No promotion to final investment A/B grade, fair value, or buy signal']}
              save(REPORT,report)
              print(json.dumps({k:v for k,v in report.items() if k not in ('comparisons','limitations')},ensure_ascii=False))
          
          
          if __name__=='__main__': main()
          PYCODE
          python -m py_compile /tmp/r14_xbrl_revision_delta.py
          python /tmp/r14_xbrl_revision_delta.py --self-test
          python /tmp/r14_xbrl_revision_delta.py
      - name: Diagnose prior XBRL receipt structures (no cache mutation)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: xbrl_structure_diag
        shell: bash
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          cat > /tmp/r14_xbrl_structure_probe.py <<'PYCODE'
          #!/usr/bin/env python3
          """Stage28 strictly research-only XBRL structure diagnostic, no cache mutation.
          Retrieves at most six previously fingerprinted XBRL receipts to identify why no
          IFRS annual facts were extracted. Never treats structural data as PIT evidence.
          """
          import collections
          import datetime as dt
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import time
          from urllib import request, parse, error
          from zoneinfo import ZoneInfo
          import zipfile
          import xml.etree.ElementTree as ET
          
          ROOT = Path('v5_reports/stage28')
          XBRL_CACHE = ROOT / 'r14_xbrl_receipt_financial_cache.json'
          DELTA = ROOT / 'r14_xbrl_revision_delta_research.json'
          RESEARCH = ROOT / 'r14_full_market_grade_research.json'
          OUTPUT = ROOT / 'r14_xbrl_structure_diagnostic.json'
          ENDPOINT = 'https://opendart.fss.or.kr/api/fnlttXbrl.xml'
          VERSION = 'STRICT_XBRL_STRUCTURE_DIAGNOSTIC_V1'
          MAX_ZIP = 16_000_000
          MAX_XML = 24_000_000
          MAX_UNCOMP = 48_000_000
          MAX_FILES = 60
          IFRS = {'ProfitLossAttributableToOwnersOfParent', 'EquityAttributableToOwnersOfParent', 'Revenue', 'Assets', 'Liabilities'}
          XBRLI = 'http://www.xbrl.org/2003/instance'
          
          
          def load(path, default):
              try:
                  return json.loads(path.read_text(encoding='utf-8-sig'))
              except (OSError, ValueError):
                  return default
          
          
          def kst():
              return dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat()
          
          
          def loc(tag):
              return tag.rsplit('}', 1)[-1] if isinstance(tag, str) else ''
          
          
          def analyze_xml(data, year):
              if len(data) > MAX_XML or b'<!DOCTYPE' in data.upper() or b'<!ENTITY' in data.upper():
                  return {'state': 'UNSAFE_OR_TOO_LARGE_XML'}
              try:
                  root = ET.fromstring(data)
              except ET.ParseError:
                  return {'state': 'INVALID_XML'}
              if root.tag != '{' + XBRLI + '}xbrl':
                  return {'state': 'NOT_XBRL_INSTANCE', 'root_local_name': loc(root.tag)[:60]}
              valid_year = bool(re.fullmatch(r'20\d{2}', str(year)))
              if not valid_year:
                  return {'state': 'INVALID_YEAR'}
              end, start = f'{year}-12-31', f'{year}-01-01'
              contexts_total, dims = 0, 0
              years = collections.Counter()
              undimensioned = {}
              unit_krw = set()
              account_ns = collections.Counter()
              concept_total, strict_count, usable_count = 0, 0, 0
              ref_counts = collections.Counter()
              for child in root:
                  if child.tag == '{' + XBRLI + '}context':
                      contexts_total += 1
                      cid = str(child.attrib.get('id') or '')
                      if any(loc(x.tag) in ('segment', 'scenario') for x in child.iter()):
                          dims += 1
                          continue
                      periods = {loc(x.tag): (x.text or '').strip() for x in child.iter()
                                 if loc(x.tag) in ('instant', 'startDate', 'endDate')}
                      if periods.get('instant') == end:
                          undimensioned[cid] = 'instant';years['annual_instant'] += 1
                      elif periods.get('startDate') == start and periods.get('endDate') == end:
                          undimensioned[cid] = 'duration';years['annual_duration'] += 1
                      elif periods.get('instant') or periods.get('endDate'):
                          years['other_period'] += 1
                  elif child.tag == '{' + XBRLI + '}unit':
                      measures = [(x.text or '').strip() for x in child.iter() if loc(x.tag) == 'measure']
                      if not any(loc(x.tag) == 'divide' for x in child.iter()) and len(measures) == 1 and measures[0].split(':')[-1].upper() == 'KRW':
                          if child.attrib.get('id'):unit_krw.add(str(child.attrib['id']))
              for child in root:
                  if not isinstance(child.tag, str) or loc(child.tag) not in IFRS:
                      continue
                  concept_total += 1
                  uri = child.tag[1:].split('}', 1)[0] if child.tag.startswith('{') else ''
                  is_ifrs = uri.endswith('/ifrs-full') or uri.endswith('/ifrs')
                  account_ns['ifrs_namespace' if is_ifrs else 'non_ifrs_namespace'] += 1
                  if not is_ifrs:
                      continue
                  strict_count += 1
                  context = str(child.attrib.get('contextRef') or '')
                  unit = str(child.attrib.get('unitRef') or '')
                  if context not in undimensioned:
                      ref_counts['context_ineligible'] += 1
                  elif unit not in unit_krw:
                      ref_counts['unit_ineligible'] += 1
                  elif not re.fullmatch(r'[+-]?\d{1,25}', (child.text or '').strip()):
                      ref_counts['numeric_ineligible'] += 1
                  else:
                      usable_count += 1
              if not concept_total:
                  reason = 'NO_DIRECT_STANDARD_CONCEPTS'
              elif not strict_count:
                  reason = 'DIRECT_CONCEPTS_NON_IFRS_NAMESPACE'
              elif not contexts_total:
                  reason = 'NO_XBRL_CONTEXTS'
              elif not undimensioned:
                  reason = 'NO_UNDIMENSIONED_ANNUAL_CONTEXT'
              elif not unit_krw:
                  reason = 'NO_KRW_UNITS'
              elif not usable_count:
                  reason = 'CONTEXT_UNIT_OR_NUMERIC_FACT_MISMATCH'
              else:
                  reason = 'ELIGIBLE_FACTS_EXIST_NEED_ACCOUNT_LEVEL_REVIEW'
              return {'state': 'XBRL_STRUCTURE_INSPECTED', 'reason': reason,
                      'xbrl_context_count': contexts_total, 'dimensioned_context_count': dims,
                      'context_counts': dict(years), 'krw_unit_count': len(unit_krw),
                      'direct_concept_occurrences': concept_total, 'ifrs_concept_occurrences': strict_count,
                      'eligible_fact_occurrences': usable_count, 'concept_namespaces': dict(account_ns),
                      'fact_exclusion_counts': dict(ref_counts),
                      'contains_no_financial_values': True, 'financial_basis_verified': False}
          
          
          def zip_inspect(blob, year):
              if not blob.startswith(b'PK'):
                  status = re.search(rb'<status>\s*([A-Za-z0-9_-]{2,12})\s*</status>', blob[:8192], re.I)
                  return {'state': 'DART_API_STATUS_' + status.group(1).decode('ascii').upper() if status else 'NOT_ZIP_RESPONSE'}
              if len(blob) > MAX_ZIP:
                  return {'state': 'ZIP_TOO_LARGE'}
              try:
                  with zipfile.ZipFile(io.BytesIO(blob)) as z:
                      allfiles = z.infolist()
                      if len(allfiles) > MAX_FILES or sum(x.file_size for x in allfiles) > MAX_UNCOMP:
                          return {'state': 'ZIP_UNSAFE_SIZE_OR_MEMBERS'}
                      files = []
                      for entry in allfiles:
                          name = entry.filename.replace('\\', '/')
                          if name.startswith('/') or '..' in name.split('/'):
                              return {'state': 'ZIP_UNSAFE_PATH'}
                          if entry.is_dir() or not name.lower().endswith(('.xml', '.xbrl')):
                              continue
                          if entry.file_size > MAX_XML:
                              files.append({'name': name[:150], 'state': 'XML_MEMBER_TOO_LARGE'})
                              continue
                          contents = z.read(entry)
                          report = analyze_xml(contents, year)
                          if report['state'] != 'NOT_XBRL_INSTANCE':
                              files.append({'name': name[:150], 'sha256': hashlib.sha256(contents).hexdigest(), **report})
                      return {'state': 'ARCHIVE_DIAGNOSED', 'zip_sha256': hashlib.sha256(blob).hexdigest(),
                              'file_count': len(allfiles), 'xbrl_files': files,
                              'full_xbrl_files_retained': False}
              except (zipfile.BadZipFile, RuntimeError, ValueError, OSError, NotImplementedError):
                  return {'state': 'ZIP_UNREADABLE'}
          
          
          def fetch_receipt(receipt, key):
              url = ENDPOINT + '?' + parse.urlencode({'crtfc_key': key, 'rcept_no': receipt, 'reprt_code': '11011'})
              try:
                  req = request.Request(url, headers={'User-Agent': 'KRX-v5-XBRL-Structure/1.0'})
                  with request.urlopen(req, timeout=35) as res:
                      if int(res.headers.get('Content-Length', '0') or 0) > MAX_ZIP:
                          return {'state': 'ZIP_TOO_LARGE'}
                      blob = res.read(MAX_ZIP + 1)
                  return zip_inspect(blob, '2025')
              except error.HTTPError as ex:
                  return {'state': 'HTTP_ERROR', 'http_status': ex.code}
              except (error.URLError, TimeoutError, OSError, ValueError):
                  return {'state': 'FETCH_UNAVAILABLE'}
          
          
          def digest_pair_report(deltas, cached):
              byreceipt = cached.get('rows') or {}
              out = []
              for v in deltas.get('comparisons') or []:
                  original = str(v.get('original_receipt') or '')
                  revised = str(v.get('latest_pre_evaluation_receipt') or '')
                  a, b = byreceipt.get(original) or {}, byreceipt.get(revised) or {}
                  af = {f.get('name'): f.get('xml_sha256') for f in a.get('files', []) if f.get('name') and f.get('xml_sha256')}
                  bf = {f.get('name'): f.get('xml_sha256') for f in b.get('files', []) if f.get('name') and f.get('xml_sha256')}
                  shared = sorted(set(af) & set(bf))
                  if not af or not bf:
                      evidence = 'PENDING_OR_UNAVAILABLE_XBRL'
                  elif not shared:
                      evidence = 'NO_SHARED_XBRL_FILENAMES'
                  elif any(af[n] != bf[n] for n in shared):
                      evidence = 'XBRL_XML_BYTES_DIFFER'
                  else:
                      evidence = 'SHARED_XBRL_XML_BYTES_IDENTICAL'
                  out.append({'code': v.get('code'), 'period': v.get('period'),
                              'original_receipt': original, 'revised_receipt': revised,
                              'xml_digest_evidence': evidence,
                              'matching_xml_files_count': len(shared),
                              'financial_values_verified': False,
                              'historical_asof_attested': False})
              return out
          
          
          def run():
              cache = load(XBRL_CACHE, {})
              deltas = load(DELTA, {})
              if cache.get('format') != 'R14_RECEIPT_XBRL_RESEARCH_CACHE_V1':
                  raise SystemExit('INVALID_XBRL_CACHE_FORMAT')
              if deltas.get('result') != 'R14_XBRL_REVISION_DELTA_RESEARCH_ONLY':
                  raise SystemExit('INVALID_XBRL_DELTA_INPUT')
              market_date = str(load(RESEARCH, {}).get('market_date', ''))
              prev = load(OUTPUT, {})
              old_details = prev.get('diagnostic_by_receipt') if (prev.get('version') == VERSION and prev.get('market_date') == market_date) else {}
              if not isinstance(old_details, dict):
                  old_details = {}
              diagnostics = {}
              token = (os.getenv('DART_API_KEY') or '').strip()
              candidates = [(receipt, rec) for receipt, rec in sorted((cache.get('rows') or {}).items())
                            if rec.get('state') == 'XBRL_RECEIPT_ZIP_RETRIEVED']
              # Bound one-time re-fetch: cache contains fingerprints, not full XML.
              candidates = candidates[:6]
              stats = collections.Counter()
              for receipt, prior in candidates:
                  stored = old_details.get(receipt) or {}
                  if stored.get('source_zip_sha256') == prior.get('zip_sha256') and stored.get('state') == 'SOURCE_HASH_MATCHED':
                      diagnostics[receipt] = stored
                      stats['REUSED_STRUCTURE_DIAGNOSTIC'] += 1
                      continue
                  if not token:
                      diagnostics[receipt] = {'state': 'MISSING_API_KEY'}
                      stats['MISSING_API_KEY'] += 1
                      continue
                  current = fetch_receipt(receipt, token)
                  if current.get('state') == 'ARCHIVE_DIAGNOSED':
                      same = current.get('zip_sha256') == prior.get('zip_sha256')
                      current['state'] = 'SOURCE_HASH_MATCHED' if same else 'SOURCE_HASH_CHANGED_NO_PROMOTION'
                      current['source_zip_sha256'] = prior.get('zip_sha256')
                  diagnostics[receipt] = current
                  stats[current['state']] += 1
                  time.sleep(.2)
                  if current['state'] == 'DART_API_STATUS_020':
                      stats['HALTED_ON_RATE_LIMIT'] += 1
                      break
              counts = collections.Counter(f.get('reason') for x in diagnostics.values() for f in x.get('xbrl_files', [])
                                           if f.get('state') == 'XBRL_STRUCTURE_INSPECTED')
              report = {'result': 'R14_XBRL_STRUCTURE_AND_VERSION_HASH_DIAGNOSTIC_RESEARCH_ONLY',
                        'version': VERSION, 'generated_kst': kst(), 'market_date': market_date,
                        'cached_receipts_total': len(cache.get('rows') or {}),
                        'eligible_receipts_to_diagnose': len(candidates),
                        'diagnostics_available': len(diagnostics), 'run_states': dict(stats),
                        'extraction_failure_reasons': dict(counts),
                        'revision_xml_digest_comparison': digest_pair_report(deltas, cache),
                        'diagnostic_by_receipt': diagnostics,
                        'xbrl_files_persisted': False, 'stage27_modified': False,
                        'financial_cache_modified': False,
                        'historical_point_in_time_financials_verified': False,
                        'official_per_pbr_verified': False,
                        'investment_decisions_authorized': False, 'final_buy_signals': 0,
                        'limitations': ['ZIP/XML digests prove retrieved-byte equality/difference only; financial values may be unchanged',
                                       'Diagnostic facts are research-only, not verified CFS/OFS or historical decision-time availability',
                                       'No implicit promotion of research grades to buy recommendations']}
              OUTPUT.parent.mkdir(parents=True, exist_ok=True)
              temp = OUTPUT.with_suffix('.tmp')
              temp.write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
              temp.replace(OUTPUT)
              print(json.dumps({k: v for k, v in report.items() if k not in ('diagnostic_by_receipt', 'revision_xml_digest_comparison', 'limitations')}, ensure_ascii=False))
          
          
          def selftest():
              ns = 'http://www.xbrl.org/2003/instance'
              head = f'''<xbrli:xbrl xmlns:xbrli="{ns}" xmlns:ifrs="http://xbrl.ifrs.org/taxonomy/2025-03-27/ifrs-full" xmlns:iso4217="http://www.xbrl.org/2003/iso4217">'''
              ctx = '''<xbrli:context id="bs"><xbrli:entity><xbrli:identifier scheme="test">one</xbrli:identifier></xbrli:entity><xbrli:period><xbrli:instant>2025-12-31</xbrli:instant></xbrli:period></xbrli:context>'''
              unit = '''<xbrli:unit id="krw"><xbrli:measure>iso4217:KRW</xbrli:measure></xbrli:unit>'''
              fact = '<ifrs:Assets contextRef="bs" unitRef="krw">150</ifrs:Assets>'
              good = (head + ctx + unit + fact + '</xbrli:xbrl>').encode()
              v = analyze_xml(good, '2025')
              assert v['state'] == 'XBRL_STRUCTURE_INSPECTED' and v['eligible_fact_occurrences'] == 1
              assert v['reason'] == 'ELIGIBLE_FACTS_EXIST_NEED_ACCOUNT_LEVEL_REVIEW'
              assert analyze_xml(good, '2024')['reason'] == 'NO_UNDIMENSIONED_ANNUAL_CONTEXT'
              assert analyze_xml((head + ctx + unit + '</xbrli:xbrl>').encode(), '2025')['reason'] == 'NO_DIRECT_STANDARD_CONCEPTS'
              assert analyze_xml((head + ctx + fact + '</xbrli:xbrl>').encode(), '2025')['reason'] == 'NO_KRW_UNITS'
              assert analyze_xml(b'<!DOCTYPE x><xbrl/>', '2025')['state'] == 'UNSAFE_OR_TOO_LARGE_XML'
              assert analyze_xml(b'<broken', '2025')['state'] == 'INVALID_XML'
              buf = io.BytesIO()
              with zipfile.ZipFile(buf, 'w') as z:
                  z.writestr('some.xbrl', good)
              assert zip_inspect(buf.getvalue(), '2025')['xbrl_files'][0]['eligible_fact_occurrences'] == 1
              assert zip_inspect(b'<result><status>014</status></result>', '2025')['state'] == 'DART_API_STATUS_014'
              c = {'rows': {'original': {'files': [{'name': 'a.xbrl', 'xml_sha256': '1'}]},
                            'revision': {'files': [{'name': 'a.xbrl', 'xml_sha256': '2'}]}}}
              comparison = digest_pair_report({'comparisons': [{'code': '000001', 'original_receipt': 'original',
                                                                 'latest_pre_evaluation_receipt': 'revision'}]}, c)
              assert comparison[0]['xml_digest_evidence'] == 'XBRL_XML_BYTES_DIFFER'
              return 10
          
          
          if __name__ == '__main__':
              import sys
              if '--self-test' in sys.argv:
                  print(json.dumps({'self_test': 'PASS', 'tests': selftest()}))
              else:
                  run()
          PYCODE
          python -m py_compile /tmp/r14_xbrl_structure_probe.py
          python /tmp/r14_xbrl_structure_probe.py --self-test
          python /tmp/r14_xbrl_structure_probe.py
      - name: Recover dimensioned original and corrected IFRS fact candidates (research only)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: xbrl_dimension_recovery
        shell: bash
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          cat > /tmp/r14_xbrl_dimension_recovery.py <<'PYCODE'
          #!/usr/bin/env python3
          """Stage28 dimension-aware, research-only original/amended XBRL fact recovery.
          
          Why: six 2025 annual XBRL instances contain direct IFRS concepts, but their
          monetary facts point to dimensioned contexts; the earlier strict undimensioned
          extractor therefore found no values. This step records candidate *facts with
          context and unit provenance*. It cannot authenticate CFS/OFS, historical
          availability at the evaluation instant, official KRX ratios or orders.
          
          Never writes Stage27, any original financial caches or previous XBRL caches.
          """
          import collections
          import datetime as dt
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import time
          import zipfile
          import xml.etree.ElementTree as ET
          from urllib import request, parse, error
          from zoneinfo import ZoneInfo
          
          ROOT = Path('v5_reports/stage28')
          SOURCE = ROOT/'r14_xbrl_receipt_financial_cache.json'
          DELTA = ROOT/'r14_xbrl_revision_delta_research.json'
          RESEARCH = ROOT/'r14_full_market_grade_research.json'
          PERSIST = ROOT/'r14_xbrl_dimension_fact_cache.json'
          OUTPUT = ROOT/'r14_xbrl_dimension_financial_research.json'
          VERSION = 'R14_DIMENSION_AWARE_XBRL_RESEARCH_V1'
          ENDPOINT = 'https://opendart.fss.or.kr/api/fnlttXbrl.xml'
          XBRLI = 'http://www.xbrl.org/2003/instance'
          XBRLDI = 'http://xbrl.org/2006/xbrldi'
          DIRECT = {'profit':'ProfitLossAttributableToOwnersOfParent',
                    'equity':'EquityAttributableToOwnersOfParent',
                    'revenue':'Revenue', 'assets':'Assets', 'liabilities':'Liabilities'}
          REVERSE = {v:k for k,v in DIRECT.items()}
          INSTANT_FIELDS = {'assets','liabilities','equity'}
          MAX_ZIP = 16_000_000
          MAX_XML = 24_000_000
          MAX_UNCOMPRESSED = 48_000_000
          MAX_MEMBERS = 60
          MAX_FACT_ITEMS = 50
          
          
          def now():
              return dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat()
          
          
          def load(path, default):
              try:
                  return json.loads(path.read_text('utf-8-sig'))
              except (OSError, ValueError):
                  return default
          
          
          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              temporary=path.with_name(path.name+'.tmp')
              temporary.write_text(json.dumps(value, ensure_ascii=False, indent=2)+'\n','utf-8')
              temporary.replace(path)
          
          
          def local(tag):
              return tag.rsplit('}',1)[-1] if isinstance(tag,str) else ''
          
          
          def safe_xml(blob, year):
              if len(blob)>MAX_XML or b'<!DOCTYPE' in blob.upper() or b'<!ENTITY' in blob.upper():
                  return {'state':'UNSAFE_XML_OR_TOO_LARGE'}
              try:
                  root=ET.fromstring(blob)
              except ET.ParseError:
                  return {'state':'INVALID_XML'}
              if root.tag != '{'+XBRLI+'}xbrl':
                  return {'state':'NOT_XBRL_INSTANCE'}
              year=str(year)
              if not re.fullmatch(r'20\d{2}',year):
                  return {'state':'INVALID_YEAR'}
              annual_start,annual_end=year+'-01-01',year+'-12-31'
              units=set()
              contexts={}
              for node in root:
                  if node.tag=='{'+XBRLI+'}unit':
                      if any(local(p.tag)=='divide' for p in node.iter()):
                          continue
                      m=[str(x.text or '').strip() for x in node.iter() if local(x.tag)=='measure']
                      if len(m)==1 and m[0].split(':')[-1].upper()=='KRW' and node.attrib.get('id'):
                          units.add(node.attrib['id'])
                  elif node.tag=='{'+XBRLI+'}context':
                      cid=node.attrib.get('id')
                      if not cid:continue
                      period=next((e for e in node if e.tag=='{'+XBRLI+'}period'),None)
                      if period is None:continue
                      times={local(e.tag):(e.text or '').strip() for e in period if local(e.tag) in ('instant','startDate','endDate')}
                      if times.get('instant')==annual_end:
                          kind='instant'
                      elif times.get('startDate')==annual_start and times.get('endDate')==annual_end:
                          kind='duration'
                      else:
                          kind='other'
                      dimensions=[]; unsupported=False
                      for container in node.iter():
                          if local(container.tag) not in ('segment','scenario'):continue
                          for dim in container:
                              if dim.tag=='{'+XBRLDI+'}explicitMember':
                                  dimensions.append({'axis':str(dim.attrib.get('dimension') or '')[:160],
                                                     'member':str(dim.text or '').strip()[:160],
                                                     'kind':'explicit'})
                              elif dim.tag=='{'+XBRLDI+'}typedMember':
                                  dimensions.append({'axis':str(dim.attrib.get('dimension') or '')[:160],
                                                     'member':'TYPED_MEMBER_REDACTED','kind':'typed'})
                              else:
                                  unsupported=True
                      contexts[cid]={'kind':kind,'dimensions':sorted(dimensions,key=lambda x:(x['axis'],x['member'])),
                                     'unsupported_segment':unsupported}
              candidates={k:[] for k in DIRECT}
              counts=collections.Counter()
              for node in root:
                  if not isinstance(node.tag,str) or not node.tag.startswith('{'):continue
                  uri,_,name=node.tag[1:].partition('}')
                  field=REVERSE.get(name)
                  if field is None or not (uri.endswith('/ifrs-full') or uri.endswith('/ifrs')):continue
                  counts['direct_ifrs_facts']+=1
                  ctx=contexts.get(str(node.attrib.get('contextRef') or ''))
                  if ctx is None or ctx['kind']=='other':
                      counts['wrong_period_or_no_context']+=1;continue
                  if ctx['kind']!=('instant' if field in INSTANT_FIELDS else 'duration'):
                      counts['wrong_fact_period_type']+=1;continue
                  if ctx['unsupported_segment']:
                      counts['unsupported_segment']+=1;continue
                  if str(node.attrib.get('unitRef') or '') not in units:
                      counts['non_krw_unit']+=1;continue
                  if node.attrib.get('{http://www.w3.org/2001/XMLSchema-instance}nil')=='true':
                      counts['nil_fact']+=1;continue
                  raw=(node.text or '').strip()
                  if not re.fullmatch(r'[+-]?\d{1,30}',raw):
                      counts['non_integer_fact']+=1;continue
                  value=int(raw)
                  counts['candidate_facts']+=1
                  if len(candidates[field])<MAX_FACT_ITEMS:
                      candidates[field].append({'value_krw':value,
                                                'context_ref':str(node.attrib.get('contextRef') or '')[:160],
                                                'period':ctx['kind'],
                                                'dimensions':ctx['dimensions'],
                                                'basis_verified':False})
                  else:counts['items_truncated']+=1
              result={}
              for field,items in candidates.items():
                  if not items:continue
                  values=sorted({v['value_krw'] for v in items})
                  result[field]={'unique_values':values[:12],
                                 'value_count':len(values),
                                 'candidate_contexts':items,
                                 'has_dimensioned_context':any(e['dimensions'] for e in items),
                                 'financial_basis_verified':False,
                                 'research_only':True}
              return {'state':'ANNUAL_DIMENSIONED_FACT_CANDIDATES' if result else 'NO_CANDIDATE_FACTS',
                      'financial_year':year,'annual_context_count':sum(v['kind']!='other' for v in contexts.values()),
                      'dimensioned_annual_context_count':sum(v['kind']!='other' and bool(v['dimensions']) for v in contexts.values()),
                      'counts':dict(counts),'fields':result,
                      'financial_basis_verified':False,
                      'point_in_time_financial_values_verified':False}
          
          
          def inspect_zip(blob,year,source):
              if not blob.startswith(b'PK'):
                  status=re.search(rb'<status>\s*([0-9A-Za-z_-]{2,12})\s*</status>',blob[:8192],re.I)
                  return {'state':'DART_API_STATUS_'+status.group(1).decode('ascii').upper() if status else 'NOT_ZIP_RESPONSE'}
              if len(blob)>MAX_ZIP:return {'state':'ZIP_TOO_LARGE'}
              if hashlib.sha256(blob).hexdigest()!=source.get('zip_sha256'):
                  return {'state':'ZIP_HASH_CHANGED_FROM_PREVIOUS_RECEIPT','investigation_required':True}
              try:
                  with zipfile.ZipFile(io.BytesIO(blob)) as z:
                      files=z.infolist()
                      if len(files)>MAX_MEMBERS or sum(f.file_size for f in files)>MAX_UNCOMPRESSED:
                          return {'state':'ZIP_TOO_MANY_FILES_OR_BYTES'}
                      previous={str(f.get('name')):f.get('xml_sha256') for f in source.get('files',[]) if f.get('name')}
                      out=[]
                      for f in files:
                          name=f.filename.replace('\\','/')
                          if name.startswith('/') or '..' in name.split('/'):
                              return {'state':'UNSAFE_ZIP_PATH'}
                          if f.is_dir() or not name.lower().endswith(('.xbrl','.xml')):continue
                          if f.file_size>MAX_XML:return {'state':'XML_MEMBER_TOO_LARGE'}
                          contents=z.read(f)
                          if name not in previous:continue
                          digest=hashlib.sha256(contents).hexdigest()
                          if digest!=previous[name]:
                              return {'state':'XML_HASH_CHANGED_FROM_PREVIOUS_RECEIPT','investigation_required':True}
                          item=safe_xml(contents,year)
                          if item['state']!='NOT_XBRL_INSTANCE':
                              out.append({'name':name[:200],'xml_sha256':digest,**item})
                      if not out:return {'state':'NO_MATCHING_XBRL_INSTANCE'}
                      return {'state':'SOURCE_HASH_CONFIRMED_FACT_CANDIDATES',
                              'zip_sha256':source['zip_sha256'],'files':out,
                              'source_hashes_verified':True,
                              'historical_point_in_time_financials_verified':False,
                              'financial_basis_verified':False}
              except (zipfile.BadZipFile,RuntimeError,ValueError,OSError,NotImplementedError):
                  return {'state':'ZIP_UNREADABLE'}
          
          
          def get_zip(receipt,token):
              url=ENDPOINT+'?'+parse.urlencode({'crtfc_key':token,'rcept_no':receipt,'reprt_code':'11011'})
              try:
                  req=request.Request(url,headers={'User-Agent':'KRX-v5-XBRL-Dimension-Research/1.0'})
                  with request.urlopen(req,timeout=35) as response:
                      if int(response.headers.get('Content-Length','0') or 0)>MAX_ZIP:return {'state':'ZIP_TOO_LARGE'}
                      b=response.read(MAX_ZIP+1)
                  if len(b)>MAX_ZIP:return {'state':'ZIP_TOO_LARGE'}
                  return {'state':'RAW_ZIP','data':b}
              except error.HTTPError as ex:
                  return {'state':'HTTP_ERROR','http_status':ex.code}
              except (error.URLError,TimeoutError,OSError,ValueError):
                  return {'state':'NETWORK_ERROR'}
          
          
          def discrepancy_comparisons(deltas, byreceipt):
              records=[]
              for x in deltas.get('comparisons') or []:
                  original=str(x.get('original_receipt') or '')
                  latest=str(x.get('latest_pre_evaluation_receipt') or '')
                  a,b=byreceipt.get(original) or {},byreceipt.get(latest) or {}
                  def values(report):
                      v=collections.defaultdict(set)
                      for file in report.get('files',[]):
                          if file.get('state')!='ANNUAL_DIMENSIONED_FACT_CANDIDATES':continue
                          for k,item in file.get('fields',{}).items():
                              for amount in item.get('unique_values',[]):v[k].add(amount)
                      return {k:sorted(xs) for k,xs in v.items()}
                  av,bv=values(a),values(b)
                  fields=sorted(set(av)&set(bv))
                  same=[f for f in fields if av[f]==bv[f]]
                  diff=[f for f in fields if av[f]!=bv[f]]
                  status='CANDIDATE_VALUES_DIFFER_BASIS_UNVERIFIED' if diff else ('CANDIDATE_VALUES_EQUAL_BASIS_UNVERIFIED' if same else 'NO_SHARED_RESEARCH_FACTS')
                  records.append({'code':x.get('code'),'original_receipt':original,'revised_receipt':latest,
                                  'status':status,'candidate_equal_fields':same,'candidate_differing_fields':diff,
                                  'both_xbrl_receipts_available':a.get('state')=='SOURCE_HASH_CONFIRMED_FACT_CANDIDATES' and b.get('state')=='SOURCE_HASH_CONFIRMED_FACT_CANDIDATES',
                                  'financial_basis_verified':False,'historical_point_in_time_verified':False,
                                  'investment_decisions_authorized':False})
              return records
          
          
          def run():
              src, delta=load(SOURCE,{}),load(DELTA,{})
              if src.get('format')!='R14_RECEIPT_XBRL_RESEARCH_CACHE_V1' or delta.get('result')!='R14_XBRL_REVISION_DELTA_RESEARCH_ONLY':
                  raise SystemExit('UNSAFE_OR_MISSING_STAGE28_INPUTS')
              research=load(RESEARCH,{})
              date=str(research.get('market_date') or '')
              if not re.fullmatch(r'20\d{6}',date):raise SystemExit('INVALID_RESEARCH_MARKET_DATE')
              prev=load(PERSIST,{})
              if prev and prev.get('format')!=VERSION:
                  raise SystemExit('UNKNOWN_DIMENSION_CACHE_FORMAT')
              # Cache rows are keyed by immutable receipt, not by current market date.
              # Reuse across trading dates only if the source ZIP digest and report year agree.
              cached=dict(prev.get('rows') or {})
              available={r:v for r,v in (src.get('rows') or {}).items() if v.get('state')=='XBRL_RECEIPT_ZIP_RETRIEVED'
                         and re.fullmatch(r'20\d{12}',r)}
              wanted=set();years={}
              for item in delta.get('comparisons') or []:
                  period=re.fullmatch(r'(20\d{2})_annual',str(item.get('period') or ''))
                  if not period:continue
                  for key in ('original_receipt','latest_pre_evaluation_receipt'):
                      receipt=str(item.get(key) or '')
                      if years.get(receipt) not in (None,period.group(1)):
                          raise SystemExit('AMBIGUOUS_XBRL_FINANCIAL_YEAR')
                      wanted.add(receipt);years[receipt]=period.group(1)
              # Bound to six already verified XBRL sources; not a new broad crawl.
              receipts=sorted(set(available)&wanted)[:6]
              states=collections.Counter()
              token=str(os.getenv('DART_API_KEY') or '').strip()
              checked=0
              for receipt in receipts:
                  previous=available[receipt]
                  if ((cached.get(receipt) or {}).get('state')=='SOURCE_HASH_CONFIRMED_FACT_CANDIDATES'
                          and cached[receipt].get('zip_sha256')==previous.get('zip_sha256')
                          and cached[receipt].get('financial_year')==years[receipt]):
                      states['REUSED_DIMENSION_RESEARCH_CACHE']+=1
                      continue
                  if not token:states['NO_DART_API_KEY']+=1;continue
                  fetched=get_zip(receipt,token)
                  checked+=1
                  if fetched.get('state')!='RAW_ZIP':
                      states[fetched['state']]+=1
                      continue
                  analyzed=inspect_zip(fetched['data'],years[receipt],previous)
                  states[analyzed['state']]+=1
                  if analyzed['state']=='SOURCE_HASH_CONFIRMED_FACT_CANDIDATES':
                      analyzed['financial_year']=years[receipt]
                      cached[receipt]=analyzed
                  time.sleep(.22)
              comparisons=discrepancy_comparisons(delta,cached)
              research_report={'result':'R14_DIMENSIONED_XBRL_ANNUAL_FACT_RESEARCH_ONLY',
                               'generated_kst':now(),'research_market_date':date,
                               'available_prior_xbrl_receipts':len(available),'considered_receipts':len(receipts),
                               'verified_source_hashes_with_candidate_extraction':sum((cached.get(r) or {}).get('state')=='SOURCE_HASH_CONFIRMED_FACT_CANDIDATES' for r in receipts),
                               'requests_this_run':checked,'run_states':dict(states),
                               'receipts':{r:{'state':(cached.get(r) or {}).get('state','NOT_EXTRACTED'),
                                               'accounts_with_candidates':sorted({name for f in (cached.get(r) or {}).get('files',[]) for name in f.get('fields',{})}),
                                               'dimensioned_contexts':sum(f.get('dimensioned_annual_context_count',0) for f in (cached.get(r) or {}).get('files',[]))} for r in receipts},
                               'revision_comparisons':comparisons,
                               'financial_basis_verified':False,
                               'historical_point_in_time_financials_verified':False,
                               'official_per_pbr_independently_verified':0,
                               'financial_cache_modified':False,'stage27_modified':False,
                               'investment_decisions_authorized':False,'final_buy_signals':0,
                               'limitations':['Dimensioned IFRS facts are research candidates, not CFS/OFS verified amounts',
                                              'Values may include multiple members, contexts or financial bases and cannot be treated as financial revision proof',
                                              'Document retrieval and hash comparisons today do not attest historical decision-time availability']}
              save(PERSIST,{'format':VERSION,'market_date':date,'updated_kst':now(),'rows':cached,
                            'investment_decisions_authorized':False,'final_buy_signals':0})
              save(OUTPUT,research_report)
              print(json.dumps({k:v for k,v in research_report.items() if k not in ('receipts','revision_comparisons','limitations')},ensure_ascii=False))
          
          
          def selftest():
              # The critical regression: annual dimensioned reporting contexts are now
              # retained as research candidates, without claiming CFS/OFS verification.
              xml=f'''<xbrli:xbrl xmlns:xbrli="{XBRLI}" xmlns:xbrldi="{XBRLDI}" xmlns:ifrs="http://xbrl.ifrs.org/taxonomy/2025-03-27/ifrs-full">
          <xbrli:context id="A"><xbrli:entity><xbrli:identifier scheme="test">issuer</xbrli:identifier><xbrli:segment><xbrldi:explicitMember dimension="dart:StatementAxis">dart:ConsolidatedMember</xbrldi:explicitMember></xbrli:segment></xbrli:entity><xbrli:period><xbrli:instant>2025-12-31</xbrli:instant></xbrli:period></xbrli:context>
          <xbrli:context id="P"><xbrli:entity><xbrli:identifier scheme="test">issuer</xbrli:identifier><xbrli:segment><xbrldi:explicitMember dimension="dart:StatementAxis">dart:ConsolidatedMember</xbrldi:explicitMember></xbrli:segment></xbrli:entity><xbrli:period><xbrli:startDate>2025-01-01</xbrli:startDate><xbrli:endDate>2025-12-31</xbrli:endDate></xbrli:period></xbrli:context>
          <xbrli:context id="OLD"><xbrli:entity><xbrli:identifier scheme="test">issuer</xbrli:identifier></xbrli:entity><xbrli:period><xbrli:instant>2024-12-31</xbrli:instant></xbrli:period></xbrli:context>
          <xbrli:unit id="U"><xbrli:measure>iso4217:KRW</xbrli:measure></xbrli:unit>
          <ifrs:Assets contextRef="A" unitRef="U">130</ifrs:Assets><ifrs:EquityAttributableToOwnersOfParent contextRef="A" unitRef="U">80</ifrs:EquityAttributableToOwnersOfParent>
          <ifrs:Revenue contextRef="P" unitRef="U">200</ifrs:Revenue><ifrs:ProfitLossAttributableToOwnersOfParent contextRef="P" unitRef="U">20</ifrs:ProfitLossAttributableToOwnersOfParent>
          <ifrs:Assets contextRef="OLD" unitRef="U">999</ifrs:Assets>
          </xbrli:xbrl>'''.encode()
              r=safe_xml(xml,'2025')
              assert r['state']=='ANNUAL_DIMENSIONED_FACT_CANDIDATES'
              assert set(r['fields'])=={'assets','revenue','profit','equity'}
              assert r['fields']['assets']['unique_values']==[130]
              assert r['fields']['assets']['has_dimensioned_context'] is True
              assert r['counts']['wrong_period_or_no_context']==1
              assert not r['financial_basis_verified']
              assert safe_xml(xml,'2024')['fields']['assets']['unique_values']==[999]
              assert safe_xml(b'<!DOCTYPE x>','2025')['state']=='UNSAFE_XML_OR_TOO_LARGE'
              bio=io.BytesIO()
              with zipfile.ZipFile(bio,'w') as z:z.writestr('entity_2025.xbrl',xml)
              blob=bio.getvalue();sha=hashlib.sha256(blob).hexdigest()
              meta={'zip_sha256':sha,'files':[{'name':'entity_2025.xbrl','xml_sha256':hashlib.sha256(xml).hexdigest()}]}
              assert inspect_zip(blob,'2025',meta)['state']=='SOURCE_HASH_CONFIRMED_FACT_CANDIDATES'
              assert inspect_zip(blob,'2025',{**meta,'zip_sha256':'0'*64})['state']=='ZIP_HASH_CHANGED_FROM_PREVIOUS_RECEIPT'
              d={'comparisons':[{'code':'000001','original_receipt':'20260318000001','latest_pre_evaluation_receipt':'20260319000002'}]}
              base=inspect_zip(blob,'2025',meta)
              assert discrepancy_comparisons(d,{'20260318000001':base,'20260319000002':base})[0]['status']=='CANDIDATE_VALUES_EQUAL_BASIS_UNVERIFIED'
              other=inspect_zip(blob,'2025',meta)
              other['files'][0]['fields']['assets']['unique_values']=[155]
              assert discrepancy_comparisons(d,{'20260318000001':base,'20260319000002':other})[0]['status']=='CANDIDATE_VALUES_DIFFER_BASIS_UNVERIFIED'
              return 12
          
          if __name__=='__main__':
              import sys
              if '--self-test' in sys.argv:
                  print(json.dumps({'status':'SELF_TEST_PASS','tests':selftest()}))
              else:
                  run()
          PYCODE
          python -m py_compile /tmp/r14_xbrl_dimension_recovery.py
          python /tmp/r14_xbrl_dimension_recovery.py --self-test
          python /tmp/r14_xbrl_dimension_recovery.py
      - name: Isolate exact single-axis CFS and OFS financial candidates from existing XBRL cache (read only)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: xbrl_basis_isolation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r14_xbrl_basis_isolation.py <<'PYCODE'
          #!/usr/bin/env python3
          """Stage28 research-only exact single-axis CFS/OFS candidate isolation.
          
          Read immutable past receipt financial fact cache; do not fetch, write Stage27,
          modify financial caches, authorize trading, or claim historical point-in-time verification.
          Only isolate a direct IFRS fact whose entire dimension set is exactly the
          IFRS ConsolidatedAndSeparateFinancialStatementsAxis, with a specific member.
          """
          import collections
          import datetime as dt
          import json
          from pathlib import Path
          import re
          from zoneinfo import ZoneInfo
          
          ROOT=Path('v5_reports/stage28')
          DIMENSION=ROOT/'r14_xbrl_dimension_fact_cache.json'
          DELTA=ROOT/'r14_xbrl_revision_delta_research.json'
          FILING=ROOT/'r14_filing_receipt_cache.json'
          OUTPUT=ROOT/'r14_xbrl_basis_isolation_research.json'
          AXIS='ifrs-full:ConsolidatedAndSeparateFinancialStatementsAxis'
          MEMBERS={'CFS':'ifrs-full:ConsolidatedMember','OFS':'ifrs-full:SeparateMember'}
          FIELDS=('profit','equity','revenue','assets','liabilities')
          VERSION='R14_SINGLE_STATEMENT_AXIS_CANDIDATE_RESEARCH_V1'
          
          
          def load(path):
              return json.loads(path.read_text(encoding='utf-8-sig'))
          
          
          def stamp():
              return dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat()
          
          
          def isolate(source):
              """Return exact single-axis research facts, treating any source truncation as ambiguity."""
              out={}
              for basis, member in MEMBERS.items():
                  fields={}
                  for field in FIELDS:
                      values=set(); matched=0; suspicious=0
                      for file in source.get('files') or []:
                          if file.get('state')!='ANNUAL_DIMENSIONED_FACT_CANDIDATES':
                              continue
                          if (file.get('counts') or {}).get('items_truncated',0):
                              suspicious+=1
                          info=(file.get('fields') or {}).get(field) or {}
                          for item in info.get('candidate_contexts') or []:
                              dims=item.get('dimensions') or []
                              if len(dims)!=1 or dims[0].get('axis')!=AXIS or dims[0].get('member')!=member or dims[0].get('kind')!='explicit':
                                  continue
                              value=item.get('value_krw')
                              if type(value) is not int:
                                  suspicious+=1;continue
                              matched+=1
                              values.add(value)
                      if suspicious:
                          status='UNSAFE_OR_TRUNCATED_SOURCE'
                      elif matched==0:
                          status='NO_SINGLE_AXIS_FACT'
                      elif len(values)==1:
                          status='UNIQUE_SINGLE_AXIS_RESEARCH_CANDIDATE'
                      else:
                          status='AMBIGUOUS_SAME_AXIS_VALUES'
                      fields[field]={'status':status,'value_krw':next(iter(values)) if status=='UNIQUE_SINGLE_AXIS_RESEARCH_CANDIDATE' else None,
                                     'matching_context_count':matched,'distinct_value_count':len(values),
                                     'research_only':True,'financial_basis_verified':False}
                  out[basis]=fields
              return out
          
          
          def validate_receipt(receipt,record,year,filing_row):
              if not re.fullmatch(r'20\d{12}',str(receipt)):
                  return 'INVALID_RECEIPT'
              if record.get('state')!='SOURCE_HASH_CONFIRMED_FACT_CANDIDATES' or record.get('source_hashes_verified') is not True:
                  return 'SOURCE_NOT_HASH_VERIFIED'
              if str(record.get('financial_year')) != str(year):
                  return 'FINANCIAL_YEAR_MISMATCH'
              if not re.fullmatch(r'[0-9a-f]{64}',str(record.get('zip_sha256') or '')):
                  return 'MISSING_SOURCE_HASH'
              cutoff=str(filing_row.get('evaluation_date') or '')
              if not re.fullmatch(r'20\d{6}',cutoff) or receipt[:8] > cutoff:
                  return 'POST_EVALUATION_OR_INVALID_CUTOFF'
              return 'SOURCE_YEAR_AND_RECEIPT_DATE_CONSISTENT'
          
          
          def compare_pairs(dimension, deltas, filings):
              byreceipt=dimension.get('rows') or {}
              output=[]
              for pair in deltas.get('comparisons') or []:
                  code=str(pair.get('code') or '').zfill(6)
                  period=str(pair.get('period') or '')
                  pm=re.fullmatch(r'(20\d{2})_annual',period)
                  if not pm:continue
                  original=str(pair.get('original_receipt') or '')
                  revised=str(pair.get('latest_pre_evaluation_receipt') or '')
                  frow=(filings.get('rows') or {}).get(code) or {}
                  selected=((frow.get('filing_periods') or {}).get(period) or {}).get('latest_available_asof_evaluation')
                  permitted_revised=(str(selected or '')==revised)
                  snapshots={}
                  for name,receipt in (('original',original),('selected_asof',revised)):
                      source=byreceipt.get(receipt) or {}
                      status=validate_receipt(receipt,source,pm.group(1),frow)
                      snapshots[name]={'receipt':receipt,'source_state':status,
                                       'bases':isolate(source) if status=='SOURCE_YEAR_AND_RECEIPT_DATE_CONSISTENT' else {},
                                       'financial_basis_verified':False}
                  per_basis={}
                  for basis in MEMBERS:
                      left=snapshots['original']['bases'].get(basis) or {}
                      right=snapshots['selected_asof']['bases'].get(basis) or {}
                      compared={}
                      for field in FIELDS:
                          lv,rv=left.get(field,{}),right.get(field,{})
                          if lv.get('status')=='UNIQUE_SINGLE_AXIS_RESEARCH_CANDIDATE' and rv.get('status')=='UNIQUE_SINGLE_AXIS_RESEARCH_CANDIDATE' and permitted_revised:
                              same=lv['value_krw']==rv['value_krw']
                              compared[field]={'state':'RESEARCH_VALUES_EQUAL' if same else 'RESEARCH_VALUES_DIFFER',
                                               'original_value_krw':lv['value_krw'],'selected_value_krw':rv['value_krw']}
                          else:
                              compared[field]={'state':'UNVERIFIED_OR_UNAVAILABLE',
                                               'original_reason':lv.get('status','MISSING_SOURCE'),
                                               'selected_reason':rv.get('status','MISSING_SOURCE')}
                      counts=collections.Counter(x['state'] for x in compared.values())
                      per_basis[basis]={'field_states':compared,'counts':dict(counts),'research_only':True,'financial_basis_verified':False}
                  output.append({'code':code,'period':period,'original_receipt':original,'selected_asof_receipt':revised,
                                 'selected_receipt_matches_filing_cache':permitted_revised,
                                 'receipt_sources':snapshots,'basis_comparisons':per_basis,
                                 'historical_point_in_time_financials_verified':False,
                                 'official_per_pbr_verified':False,'investment_decisions_authorized':False})
              return output
          
          
          def run():
              d=load(DIMENSION);p=load(DELTA);f=load(FILING)
              if d.get('format')!='R14_DIMENSION_AWARE_XBRL_RESEARCH_V1' or p.get('result')!='R14_XBRL_REVISION_DELTA_RESEARCH_ONLY' or f.get('format')!='R14_RECEIPT_EVIDENCE_CACHE_V1':
                  raise SystemExit('MISSING_OR_UNSAFE_STAGE28_CACHES')
              pairs=compare_pairs(d,p,f)
              total=collections.Counter()
              for pair in pairs:
                  for basis in MEMBERS:
                      total.update((x['state'] for x in pair['basis_comparisons'][basis]['field_states'].values()))
              result={'result':VERSION,'generated_kst':stamp(),'research_market_date':load(ROOT/'r14_full_market_grade_research.json').get('market_date'),
                      'comparison_periods':len(pairs),'available_source_receipts':len(d.get('rows') or {}),
                      'financial_candidates_by_basis':dict(total),'comparisons':pairs,
                      'source':'STAGE28_CACHED_HASH_MATCHED_XBRL_DIMENSION_FACTS',
                      'made_new_api_requests':False,'stage27_modified':False,'financial_cache_modified':False,
                      'financial_basis_verified':False,'historical_point_in_time_financials_verified':False,
                      'official_per_pbr_verified':False,'investment_decisions_authorized':False,'final_buy_signals':0,
                      'limitations':['Exact IFRS statement-axis members isolate accounting candidates but do not independently authenticate the reporting basis',
                                     'Segment and note-specific axes are excluded; truncated source inputs are not promoted',
                                     'These files were retrieved during audit and do not independently prove availability at historical decision time']}
              OUTPUT.parent.mkdir(parents=True,exist_ok=True)
              OUTPUT.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(json.dumps({k:v for k,v in result.items() if k not in ('comparisons','limitations')},ensure_ascii=False))
          
          
          def selftest():
              def fact(value, member, additional=False):
                  dimensions=[{'axis':AXIS,'member':member,'kind':'explicit'}]
                  if additional:dimensions.append({'axis':'ifrs-full:SegmentsAxis','member':'test:Part','kind':'explicit'})
                  return {'value_krw':value,'dimensions':dimensions}
              base={'state':'SOURCE_HASH_CONFIRMED_FACT_CANDIDATES','source_hashes_verified':True,
                    'financial_year':'2025','zip_sha256':'f'*64,
                    'files':[{'state':'ANNUAL_DIMENSIONED_FACT_CANDIDATES','counts':{},
                              'fields':{'assets':{'candidate_contexts':[fact(100,MEMBERS['CFS']),fact(1,MEMBERS['CFS'],True),fact(55,MEMBERS['OFS'])]},
                                        'revenue':{'candidate_contexts':[fact(200,MEMBERS['CFS'])]}}}]}
              selection=isolate(base)
              assert selection['CFS']['assets']['value_krw']==100
              assert selection['OFS']['assets']['value_krw']==55
              assert selection['CFS']['revenue']['value_krw']==200
              assert selection['CFS']['equity']['status']=='NO_SINGLE_AXIS_FACT'
              assert validate_receipt('20260318000001',base,'2025',{'evaluation_date':'20261120'})=='SOURCE_YEAR_AND_RECEIPT_DATE_CONSISTENT'
              assert validate_receipt('20260318000001',base,'2024',{'evaluation_date':'20261120'})=='FINANCIAL_YEAR_MISMATCH'
              assert validate_receipt('20260318000001',base,'2025',{'evaluation_date':'20260310'})=='POST_EVALUATION_OR_INVALID_CUTOFF'
              ambiguous=json.loads(json.dumps(base));ambiguous['files'][0]['fields']['assets']['candidate_contexts'].append(fact(101,MEMBERS['CFS']))
              assert isolate(ambiguous)['CFS']['assets']['status']=='AMBIGUOUS_SAME_AXIS_VALUES'
              truncated=json.loads(json.dumps(base));truncated['files'][0]['counts']={'items_truncated':1}
              assert isolate(truncated)['CFS']['assets']['status']=='UNSAFE_OR_TRUNCATED_SOURCE'
              first,second='20260318000001','20260319000002'
              d={'rows':{first:base,second:json.loads(json.dumps(base))}}
              p={'comparisons':[{'code':'000001','period':'2025_annual','original_receipt':first,'latest_pre_evaluation_receipt':second}]}
              f={'rows':{'000001':{'evaluation_date':'20261120','filing_periods':{'2025_annual':{'latest_available_asof_evaluation':second}}}}}
              pairs=compare_pairs(d,p,f)
              assert pairs[0]['basis_comparisons']['CFS']['field_states']['assets']['state']=='RESEARCH_VALUES_EQUAL'
              d['rows'][second]['files'][0]['fields']['assets']['candidate_contexts'][0]['value_krw']=101
              assert compare_pairs(d,p,f)[0]['basis_comparisons']['CFS']['field_states']['assets']['state']=='RESEARCH_VALUES_DIFFER'
              d['rows'].pop(second)
              assert compare_pairs(d,p,f)[0]['basis_comparisons']['CFS']['field_states']['assets']['state']=='UNVERIFIED_OR_UNAVAILABLE'
              return 12
          
          if __name__=='__main__':
              import sys
              if '--self-test' in sys.argv:
                  print(json.dumps({'result':'SELF_TEST_PASS','tests':selftest()}))
              else:run()
          PYCODE
          python -m py_compile /tmp/r14_xbrl_basis_isolation.py
          python /tmp/r14_xbrl_basis_isolation.py --self-test
          python /tmp/r14_xbrl_basis_isolation.py
      - name: Compare receipt-specific XBRL basis candidates with frozen DART cache and classify missing corrections (read-only)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: xbrl_cache_bridge
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r14_xbrl_cache_bridge.py <<'PYCODE'
          #!/usr/bin/env python3
          """Stage28 receipt-aware XBRL-to-legacy-cache comparison: research only.
          
          No network calls. Neither historical filing availability nor official KRX PER/PBR
          is authenticated. This script is intentionally an append-only research report.
          """
          import collections
          import datetime as dt
          import hashlib
          import json
          from pathlib import Path
          import re
          from zoneinfo import ZoneInfo
          
          ROOT = Path('v5_reports/stage28')
          R14 = ROOT/'r14_full_market_grade_research.json'
          BASIS = ROOT/'r14_xbrl_basis_isolation_research.json'
          FILING = ROOT/'r14_filing_receipt_cache.json'
          RECEIPT_DOCUMENTS = ROOT/'r14_filing_document_version_cache.json'
          FIN_RECONCILIATION = ROOT/'r14_financial_value_reconciliation_cache.json'
          XBRL = ROOT/'r14_xbrl_receipt_financial_cache.json'
          XBRL_SUMMARY = ROOT/'r14_xbrl_correction_financial_research.json'
          CACHE = Path('data/v5_financial_m/dart_financial_cache.json')
          STAGE27 = Path('v5_reports/stage27/status.json')
          OUTPUT = ROOT/'r14_xbrl_cache_bridge_research.json'
          FIELDS = ('profit','equity','revenue','assets','liabilities')
          VERSION = 'R14_RECEIPT_AWARE_XBRL_TO_CACHE_RESEARCH_V1'
          
          
          def load(path):
              with path.open('r',encoding='utf-8-sig') as f:
                  return json.load(f)
          
          
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''):
                      h.update(block)
              return h.hexdigest()
          
          
          def kst():
              return dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat()
          
          
          def check_date(day):
              return bool(re.fullmatch(r'20\d{6}',str(day or ''))) and _real_date(day)
          
          
          def _real_date(day):
              try:
                  dt.datetime.strptime(str(day),'%Y%m%d')
                  return True
              except ValueError:
                  return False
          
          
          def receipt_gate(code,receipt,filings):
              row=(filings.get('rows') or {}).get(code) or {}
              periods=row.get('filing_periods') or {}
              reports=periods.get('2025_annual') or {}
              approved={str(x.get('rcept_no')):str(x.get('rcept_dt')) for x in reports.get('pre_evaluation_receipts') or [] if isinstance(x,dict)}
              cutoff=str(row.get('evaluation_date') or '')
              date=approved.get(str(receipt))
              if not check_date(cutoff) or not date or receipt[:8]!=date or date>cutoff:
                  return 'RECEIPT_NOT_PROVEN_PRE_EVALUATION'
              return 'RECEIPT_LISTED_BEFORE_EVALUATION'
          
          
          def numeric(x):
              # Do not coerce strings/floats into purported exact KRW values.
              return type(x) is int
          
          
          def compare_cache(pair,cache,finance,filings):
              code=str(pair.get('code') or '')
              period=str(pair.get('period') or '')
              source=(finance.get('rows') or {}).get(code) or {}
              selected_expected=((source.get('receipt_selection') or {}).get('receipts') or {}).get(period)
              expected_asof=str(pair.get('selected_asof_receipt') or '')
              cached=cache.get(f'{code}:2025:annual') or {}
              found_basis=cached.get('fs_div') if isinstance(cached,dict) else None
              fields=cached.get('accounts') if isinstance(cached,dict) else None
              report={'code':code,'period':period,'evaluation_date':((filings.get('rows') or {}).get(code) or {}).get('evaluation_date'),
                      'cached_financial_entry_key':f'{code}:2025:annual',
                      'cache_financial_basis':found_basis,'cache_account_status':cached.get('status') if isinstance(cached,dict) else None,
                      'cached_receipt_audit_status':source.get('status'),
                      'selected_receipt_matches_existing_receipt_audit':selected_expected==expected_asof,
                      'sources':{},'financial_basis_independently_authenticated':False,
                      'historical_point_in_time_financials_verified':False,
                      'investment_decisions_authorized':False}
              if period!='2025_annual':
                  return {'code':code,'status':'UNSUPPORTED_PERIOD'}
              for source_name, receipt in [('original',pair.get('original_receipt')),('selected_asof',expected_asof)]:
                  status=receipt_gate(code,receipt,filings)
                  basis_values=((pair.get('receipt_sources') or {}).get(source_name) or {}).get('bases') or {}
                  candidates=(basis_values.get(found_basis) or {}) if found_basis in ('CFS','OFS') else {}
                  comparison={}
                  for field in FIELDS:
                      fact=candidates.get(field) or {}
                      cv=fields.get(field) if isinstance(fields,dict) else None
                      fv=fact.get('value_krw')
                      if status!='RECEIPT_LISTED_BEFORE_EVALUATION':
                          state='UNATTESTED_RECEIPT_BEFORE_EVALUATION'
                      elif not report['selected_receipt_matches_existing_receipt_audit']:
                          state='ASOF_RECEIPT_SELECTION_INCONSISTENT'
                      elif cached.get('status')!='000' or found_basis not in ('CFS','OFS'):
                          state='LEGACY_CACHE_MISSING_OR_BASIS_UNKNOWN'
                      elif not numeric(cv):
                          state='LEGACY_CACHE_FIELD_UNAVAILABLE'
                      elif fact.get('status')!='UNIQUE_SINGLE_AXIS_RESEARCH_CANDIDATE' or not numeric(fv):
                          state='XBRL_SINGLE_AXIS_FIELD_UNAVAILABLE'
                      else:
                          state='RESEARCH_CACHE_VALUE_MATCH' if cv==fv else 'RESEARCH_CACHE_VALUE_DIFFER'
                      entry={'state':state,'no_official_pit_promotion':True}
                      if state in ('RESEARCH_CACHE_VALUE_MATCH','RESEARCH_CACHE_VALUE_DIFFER'):
                          entry.update({'cached_amount_krw':cv,'xbrl_amount_krw':fv,
                                        'difference_krw':fv-cv})
                      else:
                          entry.update({'cache_present':numeric(cv),'xbrl_candidate_state':fact.get('status','NOT_PRESENT')})
                      comparison[field]=entry
                  report['sources'][source_name]={'receipt_no':receipt,'receipt_gate':status,
                                                  'candidate_basis_used':found_basis if found_basis in ('CFS','OFS') else None,
                                                  'counts':dict(collections.Counter(v['state'] for v in comparison.values())),
                                                  'fields':comparison,
                                                  'historical_point_in_time_financials_verified':False}
              return report
          
          
          def missing_correction(pair,filings,docs,xbrl,xbrl_summary):
              code=str(pair.get('code') or '')
              original=str(pair.get('original_receipt') or '')
              selected=str(pair.get('selected_asof_receipt') or '')
              if not selected or not original or selected==original:
                  return None
              doc_rows=docs.get('rows') or {}
              xb_rows=xbrl.get('rows') or {}
              original_document=(doc_rows.get(original) or {}).get('state','NOT_CACHED')
              selected_document=(doc_rows.get(selected) or {}).get('state','NOT_CACHED')
              selected_xbrl=(xb_rows.get(selected) or {}).get('state','NOT_CACHED')
              if selected_xbrl=='XBRL_RECEIPT_ZIP_RETRIEVED':
                  classification='XBRL_PRESENT_FOR_SELECTED_RECEIPT'
              elif selected_document=='DOCUMENT_ZIP_HASH_CAPTURED':
                  classification='CORRECTION_DOCUMENT_PRESENT_XBRL_NOT_AVAILABLE_IN_CACHE'
              else:
                  classification='CORRECTION_DOCUMENT_AND_XBRL_NOT_AVAILABLE_IN_CACHE'
              # The previous API's aggregate 014 count cannot by itself prove which receipt failed.
              batch=(xbrl_summary.get('query_states') or {})
              return {'code':code,'period':pair.get('period'),
                      'original_receipt':original,'selected_asof_receipt':selected,
                      'original_receipt_gate':receipt_gate(code,original,filings),
                      'selected_receipt_gate':receipt_gate(code,selected,filings),
                      'original_document_cache_state':original_document,
                      'selected_document_cache_state':selected_document,
                      'selected_xbrl_cache_state':selected_xbrl,
                      'status':classification,
                      'prior_batch_014_response_count':batch.get('DART_API_STATUS_014',0),
                      'prior_batch_014_not_attributed_to_specific_receipt':True,
                      'fss_014_means':'FILE_DOES_NOT_EXIST_FOR_REQUEST_AS_RETURNED_BY_API',
                      'no_recurring_retry_requested_by_bridge':True,
                      'financial_values_verified':False,'historical_pit_verified':False}
          
          
          def audit(research,basis,filings,financial_cache,fin_recon,documents,xbrl,xbrl_sum):
              date=research.get('market_date')
              if research.get('result')!='PRELIMINARY_RESEARCH_ONLY' or not check_date(date):
                  raise ValueError('INVALID_R14_RESEARCH_MARKET_DATE')
              if basis.get('result')!='R14_SINGLE_STATEMENT_AXIS_CANDIDATE_RESEARCH_V1':
                  raise ValueError('MISSING_OR_INCOMPATIBLE_BASIS_ISOLATION')
              if basis.get('research_market_date') not in (None,date):
                  raise ValueError('BASIS_RESEARCH_MARKET_DATE_DISAGREES')
              if filings.get('format')!='R14_RECEIPT_EVIDENCE_CACHE_V1':
                  raise ValueError('UNEXPECTED_RECEIPT_EVIDENCE_FORMAT')
              if fin_recon.get('format')!='R14_FINANCIAL_COMPARISON_CACHE_V1':
                  raise ValueError('UNEXPECTED_FINANCIAL_AUDIT_FORMAT')
              if documents.get('format')!='R14_DOCUMENT_VERSION_HASH_CACHE_V1' or xbrl.get('format')!='R14_RECEIPT_XBRL_RESEARCH_CACHE_V1':
                  raise ValueError('UNEXPECTED_DOCUMENT_OR_XBRL_CACHE_FORMAT')
              if not isinstance(financial_cache,dict) or not financial_cache:
                  raise ValueError('LEGACY_FINANCIAL_CACHE_UNAVAILABLE')
              pairs=basis.get('comparisons') or []
              if len(pairs)>128: raise ValueError('UNEXPECTED_PAIR_COUNT')
              comparisons=[compare_cache(p,financial_cache,fin_recon,filings) for p in pairs]
              missing=[missing_correction(p,filings,documents,xbrl,xbrl_sum) for p in pairs]
              missing=[m for m in missing if m is not None]
              counters=collections.Counter(v['state'] for comp in comparisons for source in comp.get('sources',{}).values() for v in source['fields'].values())
              missing_status=collections.Counter(x['status'] for x in missing)
              return {'result':VERSION,'generated_kst':kst(),
                      'research_market_date':date,
                      'research_date_source':'v5_reports/stage28/r14_full_market_grade_research.json.market_date',
                      'reference_market_data_day_not_evaluation_day':True,
                      'comparison_periods':len(comparisons),'fields_compared_by_basis':dict(counters),
                      'missing_correction_xbrl_status_counts':dict(missing_status),
                      'receipt_pair_diagnostics':missing,'cache_value_comparisons':comparisons,
                      'official_per_independently_verified':0,'official_pbr_independently_verified':0,
                      'financial_basis_independently_authenticated':False,
                      'historical_point_in_time_financial_values_verified':False,
                      'investment_decisions_authorized':False,'final_buy_signals':0,
                      'data_sources':['STAGE28_EXISTING_R14_SOURCE','STAGE28_EXISTING_RECEIPT_EVIDENCE','STAGE28_EXISTING_CFS_OFS_ISOLATION','DATA_V5_FINANCIAL_M_CACHE'],
                      'new_api_requests':0,'stage27_modified':False,'financial_cache_modified':False,
                      'limitations':['OpenDART fnlttSinglAcntAll reports current account values, not historical as-of versions',
                                     'XBRL exact single-axis facts are candidates until independently validated against reporting basis',
                                     'OpenDART 014 batch aggregate cannot prove the response of an individual receipt',
                                     'Original-vs-correction XBRL values can remain unavailable even when a corrected document ZIP exists',
                                     'Market reference date and historical evaluation date must remain distinct']}
          
          
          def selftest():
              assert check_date('20261119') and not check_date('20261131') and not check_date('2026-11-19')
              f={'format':'R14_RECEIPT_EVIDENCE_CACHE_V1','rows':{'015360':{'evaluation_date':'20261120','filing_periods':{'2025_annual':{'pre_evaluation_receipts':[{'rcept_no':'20260310002563','rcept_dt':'20260310'},{'rcept_no':'20260605000111','rcept_dt':'20260605'}]}}}}}
              orig='20260310002563';sel='20260605000111'
              field=lambda v: {'status':'UNIQUE_SINGLE_AXIS_RESEARCH_CANDIDATE','value_krw':v}
              b={'result':'R14_SINGLE_STATEMENT_AXIS_CANDIDATE_RESEARCH_V1','research_market_date':None,'comparisons':[{'code':'015360','period':'2025_annual','original_receipt':orig,'selected_asof_receipt':sel,
                'receipt_sources':{'original':{'bases':{'CFS':{'assets':field(100),'profit':field(20)}}},'selected_asof':{'bases':{'CFS':{'assets':field(99),'profit':field(20)}}}}}]}
              market={'result':'PRELIMINARY_RESEARCH_ONLY','market_date':'20261119'}
              finance={'015360:2025:annual':{'status':'000','fs_div':'CFS','accounts':{'assets':100,'profit':20}}}
              compare={'format':'R14_FINANCIAL_COMPARISON_CACHE_V1','rows':{'015360':{'status':'RECEIPT_VERSION_MISMATCH','receipt_selection':{'receipts':{'2025_annual':sel}}}}}
              docs={'format':'R14_DOCUMENT_VERSION_HASH_CACHE_V1','rows':{orig:{'state':'DOCUMENT_ZIP_HASH_CAPTURED'},sel:{'state':'DOCUMENT_ZIP_HASH_CAPTURED'}}}
              xb={'format':'R14_RECEIPT_XBRL_RESEARCH_CACHE_V1','rows':{orig:{'state':'XBRL_RECEIPT_ZIP_RETRIEVED'}}}
              summary={'query_states':{'DART_API_STATUS_014':3}}
              out=audit(market,b,f,finance,compare,docs,xb,summary)
              assert out['research_market_date']=='20261119'
              assert out['comparison_periods']==1
              assert out['fields_compared_by_basis']['RESEARCH_CACHE_VALUE_MATCH']==3 # original 2; selected profit 1
              assert out['fields_compared_by_basis']['RESEARCH_CACHE_VALUE_DIFFER']==1
              assert out['receipt_pair_diagnostics'][0]['status']=='CORRECTION_DOCUMENT_PRESENT_XBRL_NOT_AVAILABLE_IN_CACHE'
              assert out['receipt_pair_diagnostics'][0]['prior_batch_014_not_attributed_to_specific_receipt'] is True
              assert out['new_api_requests']==0 and not out['investment_decisions_authorized']
              assert out['cache_value_comparisons'][0]['sources']['original']['receipt_gate']=='RECEIPT_LISTED_BEFORE_EVALUATION'
              b['comparisons'][0]['receipt_sources']['selected_asof']['bases']['CFS']['assets']['value_krw']=100
              assert audit(market,b,f,finance,compare,docs,xb,summary)['fields_compared_by_basis'].get('RESEARCH_CACHE_VALUE_DIFFER',0)==0
              compare['rows']['015360']['receipt_selection']['receipts']['2025_annual']=orig
              bad=audit(market,b,f,finance,compare,docs,xb,summary)
              assert bad['fields_compared_by_basis'].get('RESEARCH_CACHE_VALUE_MATCH',0)==0
              compare['rows']['015360']['receipt_selection']['receipts']['2025_annual']=sel
              del finance['015360:2025:annual']
              assert compare_cache(b['comparisons'][0],finance,compare,f)['sources']['original']['fields']['profit']['state']=='LEGACY_CACHE_MISSING_OR_BASIS_UNKNOWN'
              assert receipt_gate('015360','20280110000001',f)=='RECEIPT_NOT_PROVEN_PRE_EVALUATION'
              return 13
          
          
          def run():
              required=[R14,BASIS,FILING,RECEIPT_DOCUMENTS,FIN_RECONCILIATION,XBRL,XBRL_SUMMARY,CACHE,STAGE27]
              absent=[str(p) for p in required if not p.is_file()]
              if absent:raise SystemExit('MISSING_DEPENDENCY:'+','.join(absent))
              finance_sha=digest(CACHE)
              ledger_sha=digest(STAGE27)
              report=audit(load(R14),load(BASIS),load(FILING),load(CACHE),load(FIN_RECONCILIATION),load(RECEIPT_DOCUMENTS),load(XBRL),load(XBRL_SUMMARY))
              if digest(CACHE)!=finance_sha or digest(STAGE27)!=ledger_sha:
                  raise SystemExit('READ_ONLY_SOURCE_HASH_CHANGED_DURING_AUDIT')
              report['source_file_sha256']={'legacy_dart_financial_cache':finance_sha,'stage27_status':ledger_sha}
              OUTPUT.parent.mkdir(parents=True,exist_ok=True)
              OUTPUT.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(json.dumps({key:value for key,value in report.items() if key not in ('receipt_pair_diagnostics','cache_value_comparisons','limitations')},ensure_ascii=False))
          
          
          if __name__=='__main__':
              import sys
              if '--self-test' in sys.argv:
                  print(json.dumps({'self_test':'PASS','tests':selftest()}))
              else:
                  run()
          PYCODE
          python -m py_compile /tmp/r14_xbrl_cache_bridge.py
          python /tmp/r14_xbrl_cache_bridge.py --self-test
          python /tmp/r14_xbrl_cache_bridge.py
      - name: Exclude incomplete corrected-filing stocks from R14 research candidate feed (no API)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: r14_candidate_gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r14_candidate_gate.py <<'PYCODE'
          #!/usr/bin/env python3
          """Fail-closed R14 research shortlist gate. Never authorize investment actions.

          Unverified corrected receipts are removed from the *eligible research candidate*
          feed without deleting original R14 screening history or modifying financial caches.
          This gate applies to the financial receipt-mismatch cohort; other candidates
          remain unverified research, not trade recommendations.
          """
          from __future__ import annotations
          import collections
          import datetime as dt
          import json
          import re
          import sys
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ROOT=Path('v5_reports/stage28')
          R14=ROOT/'r14_full_market_grade_research.json'
          FILING=ROOT/'r14_filing_receipt_cache.json'
          FIN=ROOT/'r14_financial_value_reconciliation_cache.json'
          BRIDGE=ROOT/'r14_xbrl_cache_bridge_research.json'
          GATE=ROOT/'r14_candidate_exclusion_gate.json'
          FILTERED=ROOT/'r14_eligible_research_candidates.json'
          FIVE=('profit','equity','revenue','assets','liabilities')


          def read(path):
              return json.loads(path.read_text(encoding='utf-8-sig'))


          def stamp():
              return dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat()


          def assess(code, financial, filing, receipt_info, value_info):
              """Conservatively decide if a mismatch candidate has adequate correction evidence."""
              fin_periods=(financial or {}).get('periods') or {}
              mismatched=sorted(p for p,v in fin_periods.items() if (v or {}).get('status')=='DART_RECEIPT_MISMATCH')
              if financial.get('status')=='CURRENT_ACCOUNT_VALUES_MATCHED' and not mismatched:
                  return None
              if financial.get('status') not in ('CURRENT_ACCOUNT_VALUES_MATCHED','RECEIPT_VERSION_MISMATCH'):
                  return {'status':'EXCLUDE','reason':'FINANCIAL_RECONCILIATION_UNVERIFIED',
                          'periods':[],'selected_receipts':[]}
              if not mismatched:
                  return {'status':'EXCLUDE','reason':'UNRESOLVED_RECEIPT_VERSION_MISMATCH',
                          'periods':[],'selected_receipts':[]}
              missing=[]; receipts=[]
              for period in mismatched:
                  p=(filing.get('filing_periods') or {}).get(period) or {}
                  selected=str(p.get('latest_available_asof_evaluation') or '')
                  receipts.append(selected)
                  if not re.fullmatch(r'20\d{12}',selected):
                      missing.append('MISSING_SELECTED_CORRECTION_RECEIPT')
                      continue
                  actual=(fin_periods.get(period) or {}).get('expected_receipt')
                  if actual and str(actual)!=selected:
                      missing.append('SELECTED_RECEIPT_CONFLICT')
                      continue
                  if not receipt_info or receipt_info.get('period')!=period or str(receipt_info.get('selected_asof_receipt'))!=selected:
                      missing.append('MISSING_CORRECTION_AUDIT_EVIDENCE')
                      continue
                  if receipt_info.get('selected_document_cache_state')!='DOCUMENT_ZIP_HASH_CAPTURED':
                      missing.append('CORRECTION_DOCUMENT_UNAVAILABLE')
                  if receipt_info.get('selected_xbrl_cache_state')!='XBRL_RECEIPT_ZIP_RETRIEVED':
                      missing.append('CORRECTION_XBRL_UNAVAILABLE')
                  vpair=value_info if value_info and value_info.get('period')==period else {}
                  chosen=((vpair.get('sources') or {}).get('selected_asof') or {})
                  fields=chosen.get('fields') or {}
                  if any((fields.get(k) or {}).get('state')!='RESEARCH_CACHE_VALUE_MATCH' for k in FIVE):
                      missing.append('CORRECTION_FINANCIAL_VALUES_NOT_RECONCILED')
              if missing:
                  return {'status':'EXCLUDE','reason':missing[0],
                          'all_reasons':sorted(set(missing)),'periods':mismatched,'selected_receipts':receipts}
              return {'status':'RESEARCH_EVIDENCE_GATE_PASSED',
                      'reason':'SELECTED_RECEIPT_AND_CFS_RESEARCH_AMOUNTS_MATCH',
                      'periods':mismatched,'selected_receipts':receipts}


          def screen(r14, fin, filing, bridge):
              if r14.get('result')!='PRELIMINARY_RESEARCH_ONLY' or r14.get('investment_decisions_authorized') is not False:
                  raise ValueError('INVALID_R14_RAW_RESEARCH')
              if fin.get('format')!='R14_FINANCIAL_COMPARISON_CACHE_V1' or filing.get('format')!='R14_RECEIPT_EVIDENCE_CACHE_V1':
                  raise ValueError('MISSING_RECEIPT_SOURCE_PROVENANCE')
              if bridge.get('result')!='R14_RECEIPT_AWARE_XBRL_TO_CACHE_RESEARCH_V1':
                  raise ValueError('MISSING_BRIDGE_RECONCILIATION')
              if str(r14.get('market_date',''))!=str(bridge.get('research_market_date','')):
                  raise ValueError('RESEARCH_MARKET_DATE_CONFLICT')
              pairs=bridge.get('receipt_pair_diagnostics') or []
              values=bridge.get('cache_value_comparisons') or []
              receipt_map={(str(p.get('code')),str(p.get('period'))):p for p in pairs}
              value_map={(str(p.get('code')),str(p.get('period'))):p for p in values}
              original=r14.get('candidates')
              if not isinstance(original,list) or r14.get('candidate_count')!=len(original):
                  raise ValueError('R14_ORIGINAL_COUNT_INVALID')
              seen=set(); eligible=[];excluded=[]; checked=[]
              for candidate in original:
                  code=str(candidate.get('code') or '')
                  if not re.fullmatch(r'\d{6}',code) or code in seen:
                      raise ValueError('UNSAFE_CANDIDATE_IDENTIFIERS')
                  seen.add(code)
                  financial=(fin.get('rows') or {}).get(code) or {}
                  filing_row=(filing.get('rows') or {}).get(code) or {}
                  mismatch_periods=[p for p,x in (financial.get('periods') or {}).items() if (x or {}).get('status')=='DART_RECEIPT_MISMATCH']
                  period=mismatch_periods[0] if len(mismatch_periods)==1 else ''
                  decision=assess(code,financial,filing_row,receipt_map.get((code,period)),value_map.get((code,period)))
                  if decision:
                      checked.append(code)
                      if decision['status']=='EXCLUDE':
                          excluded.append({'code':code,'name':candidate.get('name'),
                              'previous_research_grade':candidate.get('grade'),**decision})
                          continue
                  eligible.append(candidate)
              if len(eligible)+len(excluded)!=len(original):
                  raise AssertionError('CANDIDATE_EXCLUSION_COUNT_MISMATCH')
              if any(x['code'] in {y['code'] for y in eligible} for x in excluded):
                  raise AssertionError('EXCLUDED_CODE_LEAKED_INTO_ELIGIBLE_FEED')
              grades=collections.Counter(x.get('grade') for x in eligible)
              report={'result':'R14_MISSING_CORRECTION_EXCLUSION_GATE_V1',
                  'generated_kst':stamp(),'research_market_date':r14['market_date'],
                  'raw_research_candidate_count':len(original),
                  'receipt_mismatch_candidates_checked':len(checked),
                  'eligible_research_candidate_count':len(eligible),
                  'excluded_candidate_count':len(excluded),
                  'excluded_candidates':excluded,
                  'excluded_codes':sorted(e['code'] for e in excluded),
                  'eligible_research_grade_counts':dict(grades),
                  'eligible_candidate_output':str(FILTERED),
                  'raw_screening_history_untouched':True,
                  'missing_correction_retrieval_disabled':True,
                  'historical_point_in_time_financials_verified':False,
                  'official_per_pbr_independently_verified':0,
                  'investment_decisions_authorized':False,'final_buy_signals':0,
                  'policy':'Exclude receipt-version-mismatch R14 candidates when latest pre-evaluation corrected document, XBRL, or five CFS research field comparisons are unavailable; do not fetch missing corrections.',
                  'limitations':['Research evidence eligibility is NOT official accounting authentication or investment eligibility',
                      'Raw full-market grades are preserved for audit, but must not be shown as filtered final research shortlist',
                      'The separate legacy Stage25/26 module is not a replacement for this filtered R14 candidate feed']}
              output={'result':'R14_FILTERED_RESEARCH_ONLY_CANDIDATES_V1',
                  'generated_kst':report['generated_kst'],'research_market_date':r14['market_date'],
                  'source_raw_report':str(R14), 'candidate_count':len(eligible),
                  'candidate_grades':dict(grades),'candidates':eligible,
                  'excluded_codes':report['excluded_codes'], 'source_gate':str(GATE),
                  'historical_point_in_time_financials_verified':False,
                  'official_per_pbr_independently_verified':0,
                  'investment_decisions_authorized':False,'final_buy_signals':0}
              return report,output


          def save(path, data):
              path.parent.mkdir(parents=True,exist_ok=True)
              tmp=path.with_name(path.name+'.tmp')
              tmp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              tmp.replace(path)


          def selftest():
              def fin(status,selected):
                  return {'status':status,'periods':{'2025_annual':{'status':'DART_RECEIPT_MISMATCH','expected_receipt':selected}}}
              def filing(selected):
                  return {'filing_periods':{'2025_annual':{'latest_available_asof_evaluation':selected}}}
              def pair(code,selected,doc=True,xbrl=True):
                  return {'code':code,'period':'2025_annual','selected_asof_receipt':selected,
                          'selected_document_cache_state':'DOCUMENT_ZIP_HASH_CAPTURED' if doc else 'NOT_CACHED',
                          'selected_xbrl_cache_state':'XBRL_RECEIPT_ZIP_RETRIEVED' if xbrl else 'NOT_CACHED'}
              receipt='20260319000704'
              m=fin('RECEIPT_VERSION_MISMATCH',receipt);f=filing(receipt);p=pair('033500',receipt)
              vals={'code':'033500','period':'2025_annual','sources':{'selected_asof':{'fields':{k:{'state':'RESEARCH_CACHE_VALUE_MATCH'} for k in FIVE}}}}
              assert assess('033500',m,f,p,vals)['status']=='RESEARCH_EVIDENCE_GATE_PASSED'
              assert 'CORRECTION_XBRL_UNAVAILABLE' in assess('033500',m,f,pair('033500',receipt,xbrl=False),vals)['all_reasons']
              assert 'CORRECTION_DOCUMENT_UNAVAILABLE' in assess('033500',m,f,pair('033500',receipt,doc=False),vals)['all_reasons']
              assert 'MISSING_CORRECTION_AUDIT_EVIDENCE' in assess('033500',m,f,None,vals)['all_reasons']
              assert 'CORRECTION_FINANCIAL_VALUES_NOT_RECONCILED' in assess('033500',m,f,p,None)['all_reasons']
              assert assess('033500',{'status':'CURRENT_ACCOUNT_VALUES_MATCHED','periods':{}},f,None,None) is None
              assert assess('033500',{},f,None,None)['status']=='EXCLUDE'
              rows=[{'code':code,'grade':grade,'name':code} for code,grade in
                    [('015360','B'),('033500','B'),('054950','A'),('097230','B'),('000050','B')]]
              pairs=[pair('015360',receipt),pair('033500',receipt,xbrl=False),pair('054950',receipt,xbrl=False),pair('097230',receipt,doc=False,xbrl=False)]
              values=[dict(vals,code='015360'),dict(vals,code='033500'),dict(vals,code='054950'),dict(vals,code='097230')]
              raw={'result':'PRELIMINARY_RESEARCH_ONLY','investment_decisions_authorized':False,'market_date':'20261119','candidate_count':len(rows),'candidates':rows}
              fcache={'format':'R14_FINANCIAL_COMPARISON_CACHE_V1','rows':{**{code:m for code in ['015360','033500','054950','097230']},'000050':{'status':'CURRENT_ACCOUNT_VALUES_MATCHED','periods':{}}}}
              filingcache={'format':'R14_RECEIPT_EVIDENCE_CACHE_V1','rows':{code:f for code in fcache['rows']}}
              bridge={'result':'R14_RECEIPT_AWARE_XBRL_TO_CACHE_RESEARCH_V1','research_market_date':'20261119','receipt_pair_diagnostics':pairs,'cache_value_comparisons':values}
              gate,out=screen(raw,fcache,filingcache,bridge)
              assert out['candidate_count']==2 and gate['excluded_candidate_count']==3
              assert gate['excluded_codes']==['033500','054950','097230']
              assert [x['code'] for x in out['candidates']]==['015360','000050']
              assert gate['final_buy_signals']==0 and out['investment_decisions_authorized'] is False
              assert gate['eligible_research_grade_counts']=={'B':2}
              bridge['receipt_pair_diagnostics'][0]['selected_xbrl_cache_state']='NOT_CACHED'
              assert screen(raw,fcache,filingcache,bridge)[0]['excluded_candidate_count']==4
              bridge['research_market_date']='20261120'
              try:screen(raw,fcache,filingcache,bridge)
              except ValueError: pass
              else: raise AssertionError('MARKET_DATE_GATE_BROKEN')
              return 13


          def main():
              if '--self-test' in sys.argv:
                  print(json.dumps({'status':'SELF_TEST_PASS','tests':selftest()}))
                  return
              raw,fin,filing,bridge=(read(p) for p in (R14,FIN,FILING,BRIDGE))
              gate,output=screen(raw,fin,filing,bridge)
              save(GATE,gate);save(FILTERED,output)
              print(json.dumps({k:v for k,v in gate.items() if k not in ('excluded_candidates','limitations')},ensure_ascii=False))

          if __name__=='__main__':
              main()
          PYCODE
          python -m py_compile /tmp/r14_candidate_gate.py
          python /tmp/r14_candidate_gate.py --self-test
          python /tmp/r14_candidate_gate.py
      - name: Gate dated KRX PER PBR export using existing parser (NO independent authentication)
