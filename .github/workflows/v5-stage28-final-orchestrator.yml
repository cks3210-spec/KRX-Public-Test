name: KRX v5 Stage28 Unified Development Pipeline
on:
  workflow_dispatch:
  # One-off auto-run when this exact workflow file is replaced on main.
  # The Stage28 report-only commit never touches this path, so it cannot loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5-stage28-final-orchestrator.yml'
  workflow_run:
    workflows: ['KRX v5 R14 OpenDART Auto Continue']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 14 * * 1-5' # 23:30 KST weekday fallback; after upstream publication; date-gated
permissions:
  contents: write
concurrency:
  group: v5-stage28-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KRX session calendar for verified daily follow-up
        run: python -m pip install --disable-pip-version-check 'exchange-calendars>=4.5,<5'
      - name: Fetch validate and publish authorized KRX daily prices into the 70-session production archive (Stage38)
        id: stage38_market_publish
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/stage38_verified_market_publisher.py <<'PYCODE'
          #!/usr/bin/env python3
          """Stage28 #38: date-validated official KRX close collector and atomic-in-Git research feed publisher.

          Never collects from undocumented endpoints. Uses the repository's already implemented
          KRX Open API daily market endpoints and the user's existing KRX_API_KEY credential.
          No DART or correction fetching. No Stage27 edits. Market snapshots are not trade prices.
          """
          from __future__ import annotations

          import collections
          import csv
          import datetime as dt
          import gzip
          import hashlib
          import io
          import json
          import math
          import os
          from pathlib import Path
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          import exchange_calendars as xcals

          CALENDAR = 'XKRX'
          DATE = re.compile(r'^20\d{6}$')
          CODE = re.compile(r'^[A-Z0-9]{6}$')
          CANON = ('BAS_DD','MARKET','ISU_CD','ISU_NM','TDD_CLSPRC','ACC_TRDVOL','MKTCAP')
          MARKETS = ('KOSPI','KOSDAQ')
          ENDPOINTS = {'KOSPI':'stk_bydd_trd', 'KOSDAQ':'ksq_bydd_trd'}
          BASE = 'https://data-dbg.krx.co.kr/svc/apis/sto/'
          MIN_ROWS = {'KOSPI':650, 'KOSDAQ':1200}
          GAP_CAP = 5  # bounded catch-up; remaining dates are recovered on the next run
          REPORT_REL = Path('v5_reports/stage28/r14_verified_market_auto_promotion.json')


          def date8(value):
              if not isinstance(value,str) or not DATE.fullmatch(value):
                  raise ValueError('INVALID_YYYYMMDD:'+str(value))
              dt.datetime.strptime(value,'%Y%m%d')
              return value


          def krx_calendar():
              return xcals.get_calendar(CALENDAR)


          def completed_session(now,calendar):
              day=now.date().isoformat()
              if calendar.is_session(day):
                  if (now.hour,now.minute)>=(18,30):
                      return now.strftime('%Y%m%d')
                  return calendar.previous_session(day).strftime('%Y%m%d')
              return calendar.date_to_session(day,direction='previous').strftime('%Y%m%d')


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def load_json(p):
              return json.loads(p.read_text(encoding='utf-8-sig'))


          def write_json(p,value):
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps(value,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')


          def integer(x,label,positive=False):
              if isinstance(x,bool):raise ValueError('BOOLEAN_'+label)
              s=str(x if x is not None else '').replace(',','').strip()
              if not s.isdecimal(): raise ValueError('INVALID_'+label)
              result=int(s)
              if positive and result<=0:raise ValueError('NON_POSITIVE_'+label)
              return result


          def normalize_market_row(source, day, market):
              # Date in row, when published, must match the exact URL's basDd query.
              for date_field in ('BAS_DD','basDd'):
                  if source.get(date_field) not in (None,'',day):
                      raise ValueError('INCONSISTENT_PROVIDER_ROW_DATE')
              code=str(source.get('ISU_CD') or '').strip()
              if not CODE.fullmatch(code):raise ValueError('MISSING_OR_INVALID_CODE')
              name=str(source.get('ISU_NM') or '').strip()
              if not name:raise ValueError('MISSING_SECURITY_NAME')
              if source.get('MARKET') not in (None,'',market):raise ValueError('WRONG_MARKET_LABEL')
              price=integer(source.get('TDD_CLSPRC'),'PRICE',positive=True)
              volume=integer(source.get('ACC_TRDVOL'),'VOLUME')
              cap=integer(source.get('MKTCAP'),'MARKET_CAP',positive=True)
              return {'BAS_DD':day,'MARKET':market,'ISU_CD':code,'ISU_NM':name,
                      'TDD_CLSPRC':str(price),'ACC_TRDVOL':str(volume),'MKTCAP':str(cap)}


          def parse_provider_response(obj, day, market):
              if not isinstance(obj,dict) or not isinstance(obj.get('OutBlock_1'),list):
                  raise ValueError('KRX_PROVIDER_SCHEMA_UNEXPECTED')
              raw=obj['OutBlock_1']
              if len(raw)<MIN_ROWS[market]:raise ValueError('KRX_PROVIDER_UNIVERSE_TOO_SMALL_'+market)
              records={}; bad=[]
              for idx,entry in enumerate(raw):
                  if not isinstance(entry,dict):raise ValueError('NON_OBJECT_PROVIDER_ROW')
                  try:r=normalize_market_row(entry,day,market)
                  except ValueError as e:
                      # A few unavailable/retired securities may be published without prices.
                      # Account for them, never silently substitute stale values.
                      bad.append((idx,str(e)))
                      continue
                  if r['ISU_CD'] in records:raise ValueError('KRX_PROVIDER_DUPLICATE_CODE_'+r['ISU_CD'])
                  records[r['ISU_CD']]=r
              if len(bad)>max(8,int(len(raw)*0.01)):
                  raise ValueError('KRX_PROVIDER_MANY_INVALID_ROWS_'+market)
              if len(records)<MIN_ROWS[market]:raise ValueError('KRX_PROVIDER_INSUFFICIENT_VALID_ROWS_'+market)
              return list(records.values()),{'raw_rows':len(raw),'valid_rows':len(records),'invalid_rows':len(bad),
                                              'invalid_reasons':dict(collections.Counter(c for _,c in bad))}


          class _SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  dest=urllib.parse.urlsplit(newurl)
                  if dest.scheme!='https' or dest.hostname!='data-dbg.krx.co.kr':
                      raise ValueError('UNAUTHORIZED_KRX_REDIRECT')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)


          def official_fetch(day, market, key, opener=None):
              if not key:raise ValueError('KRX_API_KEY_NOT_CONFIGURED')
              url=BASE+ENDPOINTS[market]+'?'+urllib.parse.urlencode({'basDd':day})
              req=urllib.request.Request(url,headers={'AUTH_KEY':key,'Accept':'application/json','User-Agent':'Mozilla/5.0'})
              if opener is None:opener=urllib.request.build_opener(_SafeRedirect)
              last_error=None
              for trial in range(2):
                  try:
                      with opener.open(req,timeout=18) as response:
                          if response.status!=200:raise ValueError('KRX_HTTP_STATUS_'+str(response.status))
                          blob=response.read(8_000_001)
                          if len(blob)>8_000_000:raise ValueError('KRX_RESPONSE_TOO_LARGE')
                      result=json.loads(blob.decode('utf-8-sig'))
                      rows,diagnostic=parse_provider_response(result,day,market)
                      return rows,{**diagnostic,'provider':'KRX_OFFICIAL_OPEN_API','endpoint':ENDPOINTS[market],
                                   'query_date':day,'http_status':200,'source_response_sha256':digest(blob)}
                  except (OSError,TimeoutError,UnicodeError,ValueError,json.JSONDecodeError,urllib.error.HTTPError) as exc:
                      last_error=exc
                      if trial==0:time.sleep(0.5)
              raise RuntimeError('KRX_FETCH_BLOCKED_'+market+'_'+day+':'+type(last_error).__name__+':'+str(last_error)[:130])


          def csv_blob(rows):
              f=io.StringIO(newline='');w=csv.DictWriter(f,fieldnames=CANON,lineterminator='\n')
              w.writeheader();w.writerows(rows)
              return ('\ufeff'+f.getvalue()).encode('utf-8')


          def gzip_blob(rows):
              # Deterministic gzip header. Git diff is quiet if no market data changed.
              return gzip.compress(csv_blob(rows),compresslevel=6,mtime=0)


          def same_market_schema_in_any_order(fieldnames):
              # Existing production archive order predates Stage38. DictReader maps by
              # column name; rejecting a valid permutation blocked the 2026-11-21 run.
              fields=tuple(fieldnames or ())
              return len(fields)==len(CANON) and set(fields)==set(CANON)


          def archive_baseline(root,calendar):
              market=root/'data/latest.csv';summary=root/'data/summary.json';history=root/'data/daily_70d.csv.gz'
              if not all(x.is_file() for x in (market,summary,history)):
                  raise ValueError('PRODUCTION_SOURCE_MISSING')
              meta=load_json(summary)
              last=date8(meta.get('latest_trading_date'))
              if meta.get('sessions_stored')!=70:raise ValueError('BASELINE_NOT_70_SESSIONS')
              with market.open(encoding='utf-8-sig',newline='') as f:
                  latest=list(csv.DictReader(f))
              if len(latest)<2000:raise ValueError('BASELINE_LATEST_UNIVERSE_INSUFFICIENT')
              count=collections.Counter(r['MARKET'] for r in latest)
              if count['KOSPI']!=meta.get('kospi_rows_latest') or count['KOSDAQ']!=meta.get('kosdaq_rows_latest'):
                  raise ValueError('BASELINE_MARKET_COUNTS_MISMATCH')
              unique={(r.get('MARKET'),r.get('ISU_CD')) for r in latest}
              if len(unique)!=len(latest):raise ValueError('BASELINE_LATEST_DUPLICATE')
              for r in latest:
                  if r.get('BAS_DD')!=last:raise ValueError('BASELINE_LATEST_DATES_MIXED')
                  if r.get('MARKET') not in MARKETS:raise ValueError('BASELINE_UNEXPECTED_MARKET')
                  normalize_market_row(r,last,r['MARKET'])
              daily=collections.defaultdict(list); keys=set();allrows=0
              with gzip.open(history,'rt',encoding='utf-8-sig',newline='') as f:
                  rdr=csv.DictReader(f)
                  if not same_market_schema_in_any_order(rdr.fieldnames):
                      raise ValueError('BASELINE_HISTORY_COLUMNS_UNEXPECTED:'+','.join(rdr.fieldnames or ()))
                  for row in rdr:
                      day=date8(row.get('BAS_DD'))
                      key=(day,row.get('MARKET'),row.get('ISU_CD'))
                      if key in keys:raise ValueError('BASELINE_DUPLICATE_HISTORY_SECURITY')
                      keys.add(key);daily[day].append(row);allrows+=1
              if len(daily)!=70 or last!=max(daily):raise ValueError('BASELINE_SESSIONS_OR_LATEST_WRONG')
              if allrows!=meta.get('total_rows_stored'):raise ValueError('BASELINE_TOTAL_ROWS_MISMATCH')
              observed=sorted(daily)
              expected=[x.strftime('%Y%m%d') for x in calendar.sessions_in_range(observed[0],observed[-1])]
              if observed!=expected:raise ValueError('BASELINE_KRX_SESSION_GAP')
              final={r['MARKET']+':'+r['ISU_CD']:r for r in daily[last]}
              if set(final)!={r['MARKET']+':'+r['ISU_CD'] for r in latest}:
                  raise ValueError('BASELINE_LAST_SNAPSHOT_IDENTITY_MISMATCH')
              if any(final[r['MARKET']+':'+r['ISU_CD']]!=r for r in latest):
                  raise ValueError('BASELINE_LAST_SNAPSHOT_CONTENT_MISMATCH')
              return meta,daily,latest,{'source_sha256':{str(p.relative_to(root)):digest(p.read_bytes()) for p in (market,summary,history)},
                                        'baseline_latest':last,'baseline_sessions':70,'baseline_rows':allrows}


          def prepare_market_day(day,markets,prior):
              assert sorted(markets)==sorted(MARKETS)
              counts=collections.Counter()
              keys=set(); merged=[]
              for m in MARKETS:
                  rows=markets[m]
                  if len(rows)<MIN_ROWS[m]:raise ValueError('LOW_MARKET_COVERAGE_'+m)
                  before=sum(r['MARKET']==m for r in prior)
                  if len(rows)<int(before*0.82) or len(rows)>int(before*1.25):
                      raise ValueError('SUSPICIOUS_UNIVERSE_SIZE_CHANGE_'+m)
                  for r in rows:
                      if r['BAS_DD']!=day or r['MARKET']!=m:
                          raise ValueError('MARKET_DAY_ROW_MISMATCH')
                      key=(m,r['ISU_CD'])
                      if key in keys:raise ValueError('MARKET_DAY_DUPLICATE_CODE')
                      keys.add(key);merged.append(r)
                  counts[m]+=len(rows)
              if len(merged)<2000:raise ValueError('WHOLE_MARKET_SNAPSHOT_TOO_SMALL')
              merged.sort(key=lambda r:(r['MARKET'],r['ISU_CD']))
              return merged,counts


          def compose_updated(meta,daily,prior,latest,pending):
              history=dict(daily);history.update(pending)
              dates=sorted(history)
              keep=dates[-70:]
              new_history=[r for day in keep for r in sorted(history[day],key=lambda r:(r['MARKET'],r['ISU_CD']))]
              latest_date=keep[-1];new_latest=history[latest_date]
              counts=collections.Counter(r['MARKET'] for r in new_latest)
              updated=dict(meta)
              previous=meta['latest_trading_date']
              updated.update(latest_trading_date=latest_date,sessions_stored=70,total_rows_stored=len(new_history),
                             kospi_rows_latest=counts['KOSPI'],kosdaq_rows_latest=counts['KOSDAQ'],
                             marketcap_1000uk_screened=sum(integer(r['MKTCAP'],'CAP')>=100_000_000_000 for r in new_latest),
                             market_source='KRX_OFFICIAL_OPEN_API_DAILY_MARKET',
                             market_source_data_date=latest_date,
                             research_market_publication_stage='STAGE28_38_KRX_VERIFIED',
                             market_published_from=previous,
                             market_publication_technical_statistics_stale=True,
                             technical_statistics_asof=meta.get('technical_statistics_asof',previous),
                             note='Official KRX price/cap and 70-session archive updated; historical MA/cross counters are prior-date technical metrics and must be recalculated separately before use')
              return new_latest,new_history,updated


          def run(root,now=None,fetcher=official_fetch,write=True,key=None,max_pending=GAP_CAP):
              root=Path(root);cal=krx_calendar();now=now or dt.datetime.now(ZoneInfo('Asia/Seoul'))
              if now.tzinfo is None:raise ValueError('NOW_MUST_BE_TIMEZONE_AWARE')
              now=now.astimezone(ZoneInfo('Asia/Seoul'))
              target=completed_session(now,cal)
              report={'version':'STAGE28_R14_VERIFIED_OFFICIAL_MARKET_AUTO_PUBLISH_V1',
                      'checked_kst':now.isoformat(),'last_completed_krx_session':target,
                      'source':'KRX_OPEN_API_DAILY_KOSPI_KOSDAQ','data_provider_base':BASE,
                      'market_data_verified_and_promoted':False,'investment_decisions_authorized':False,
                      'research_only':True,'final_buy_signals':0,'stage27_modified':False,
                      'no_missing_corrected_filing_queries':True,'technical_indicators_rebuilt_by_this_stage':False,
                      'report_is_not_per_pbr':True,'attempted_sessions':[],'api_calls':0,'market_data_was_promoted':False}
              report_path=root/REPORT_REL
              event=os.getenv('GITHUB_EVENT_NAME','workflow_dispatch')
              if event in ('schedule','workflow_run') and not cal.is_session(now.date().isoformat()):
                  # The user's no-holiday-report policy: no report file mutation on closed sessions.
                  return {**report,'state':'SKIPPED_KRX_CLOSED','reason':'KRX_SESSION_CLOSED_NO_REPORT'}
              try:
                  meta,daily,latest,baseline=archive_baseline(root,cal)
                  old=baseline['baseline_latest'];report.update(baseline)
                  if target<=old:
                      report.update(state='NO_NEW_COMPLETED_KRX_SESSION',current_market_date=old,remaining_sessions=0)
                      if write:write_json(report_path,report)
                      return report
                  sessions=[x.strftime('%Y%m%d') for x in cal.sessions_in_range(old,target) if x.strftime('%Y%m%d')>old]
                  if not sessions:raise ValueError('SOURCE_DATE_CALENDAR_INCONSISTENT')
                  selected=sessions[:max_pending];report['backlog_trading_sessions']=len(sessions)
                  report['trading_sessions_in_this_batch']=selected
                  pending={};prior=latest
                  for day in selected:
                      responses={};evidence={}
                      for market in MARKETS:
                          fetched,proof=fetcher(day,market,key)
                          responses[market]=fetched;evidence[market]=proof
                          report['api_calls']+=1
                      accepted,counts=prepare_market_day(day,responses,prior)
                      pending[day]=accepted;prior=accepted
                      report['attempted_sessions'].append({'date':day,'state':'VALIDATED_KRX_SESSION',
                          'market_rows':len(accepted),'kospi_rows':counts['KOSPI'],
                          'kosdaq_rows':counts['KOSDAQ'],'provider_evidence':evidence})
                  if not pending:raise ValueError('NO_PENDING_DATA_AFTER_SESSION_CHECK')
                  final_date=max(pending)
                  ref=sorted(set(daily)|set(pending))[-70:]
                  expected=[x.strftime('%Y%m%d') for x in cal.sessions_in_range(ref[0],ref[-1])]
                  if ref!=expected:raise ValueError('ROLLING_HISTORY_NOT_CONSECUTIVE_KRX_SESSIONS')
                  new_latest,new_history,newmeta=compose_updated(meta,daily,prior,latest,pending)
                  report.update(state='PUBLISHED_KRX_VERIFIED_MARKET' if write else 'DRY_RUN_KRX_SNAPSHOT_VALID',
                                market_data_verified_and_promoted=write,market_data_was_promoted=write,
                                current_market_date=final_date,market_rows_published=len(new_latest),
                                history_rows_published=len(new_history),history_sessions=70,
                                remaining_sessions=len(sessions)-len(selected),
                                new_data_sha256={'latest.csv':digest(csv_blob(new_latest)),
                                                 'daily_70d.csv.gz':digest(gzip_blob(new_history))})
                  if write:
                      # Three inputs are staged and only added to Git after every validation passes.
                      # No Stage27 or financial cache paths are ever modified.
                      (root/'data/latest.csv').write_bytes(csv_blob(new_latest))
                      (root/'data/daily_70d.csv.gz').write_bytes(gzip_blob(new_history))
                      write_json(root/'data/summary.json',newmeta)
                      write_json(report_path,report)
                  return report
              except Exception as e:
                  # Network/API responses and KRX publication lags are non-destructive.
                  # Source corruption is a hard error (never silently 'repair' a bad archive).
                  report.update(state='WAITING_KRX_SOURCE_OR_VALIDATION_ERROR',
                                reason=type(e).__name__+':'+str(e)[:220],
                                market_data_verified_and_promoted=False,market_data_was_promoted=False)
                  if write:write_json(report_path,report)
                  if 'BASELINE_' in str(e) or 'PRODUCTION_SOURCE_MISSING' in str(e):
                      raise
                  return report


          def selftest():
              import tempfile
              checks=0
              def chk(cond):
                  nonlocal checks
                  if not cond:raise AssertionError('STAGE38_SELF_TEST_FAILED_'+str(checks))
                  checks+=1
              cal=krx_calendar()
              chk(same_market_schema_in_any_order(CANON))
              chk(same_market_schema_in_any_order(('BAS_DD','ISU_CD','ISU_NM','TDD_CLSPRC','ACC_TRDVOL','MKTCAP','MARKET')))
              chk(not same_market_schema_in_any_order(CANON+('UNEXPECTED_EXTRA',)))
              chk(not same_market_schema_in_any_order(('BAS_DD',)*len(CANON)))
              chk(completed_session(dt.datetime(2026,11,21,15,tzinfo=ZoneInfo('Asia/Seoul')),cal)=='20261120')
              chk(completed_session(dt.datetime(2026,11,23,18,29,tzinfo=ZoneInfo('Asia/Seoul')),cal)=='20261120')
              chk(completed_session(dt.datetime(2026,11,23,18,30,tzinfo=ZoneInfo('Asia/Seoul')),cal)=='20261123')
              chk(date8('20261120')=='20261120')
              try:date8('20261133');raise AssertionError('BAD_DATE_ACCEPTED')
              except ValueError:checks+=1
              sample={'ISU_CD':'000270','ISU_NM':'기아','TDD_CLSPRC':'90,000','ACC_TRDVOL':'0','MKTCAP':'123456789012'}
              good=normalize_market_row(sample,'20261120','KOSPI')
              chk(good['TDD_CLSPRC']=='90000')
              chk(good['ACC_TRDVOL']=='0')
              chk(good['BAS_DD']=='20261120')
              bads=[{**sample,'BAS_DD':'20261119'},{**sample,'TDD_CLSPRC':'0'},
                    {**sample,'MKTCAP':'-'},{**sample,'ISU_CD':'A/../../'},
                    {**sample,'MARKET':'KOSDAQ'},{**sample,'ACC_TRDVOL':'-3'}]
              for item in bads:
                  try:normalize_market_row(item,'20261120','KOSPI');raise AssertionError('BAD_ROW_ACCEPTED')
                  except ValueError:checks+=1
              chk(csv_blob([{'BAS_DD':'20261120','MARKET':'KOSPI','ISU_CD':'000270','ISU_NM':'기아','TDD_CLSPRC':'90000','ACC_TRDVOL':'0','MKTCAP':'1'}]).startswith(b'\xef\xbb\xbf'))
              chk(gzip_blob([{'BAS_DD':'20261120','MARKET':'KOSPI','ISU_CD':'000270','ISU_NM':'기아','TDD_CLSPRC':'90000','ACC_TRDVOL':'0','MKTCAP':'1'}])==gzip_blob([{'BAS_DD':'20261120','MARKET':'KOSPI','ISU_CD':'000270','ISU_NM':'기아','TDD_CLSPRC':'90000','ACC_TRDVOL':'0','MKTCAP':'1'}]))
              chk(len([x for x in cal.sessions_in_range('2026-11-19','2026-11-23')])==3)
              print(json.dumps({'result':'STAGE38_SELF_TEST_PASS','checks':checks},ensure_ascii=False))
              return checks


          if __name__=='__main__':
              if '--self-test' in sys.argv:selftest()
              else:
                  root=Path(os.getenv('GITHUB_WORKSPACE','.')).resolve()
                  result=run(root,key=os.getenv('KRX_API_KEY','').strip())
                  print(json.dumps({'result':result['state'],'market_date':result.get('current_market_date'),
                                    'source_market_date':result.get('baseline_latest'),
                                    'completed_session':result['last_completed_krx_session'],
                                    'api_calls':result['api_calls'],'published':result['market_data_was_promoted'],
                                    'remaining':result.get('remaining_sessions',0),
                                    'reason':result.get('reason')},ensure_ascii=False))
          PYCODE
          python /tmp/stage38_verified_market_publisher.py --self-test
          python /tmp/stage38_verified_market_publisher.py
      - name: Gate completed KRX session, upstream publication, and duplicate daily outcomes
        id: stage37_preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/stage37_daily_controller.py <<'PYCODE'
          #!/usr/bin/env python3
          """Stage28 #37: KRX-session-aware, duplicate-safe Stage36 follow-up.
          
          Read-only against production data and Stage27. Mutates only Stage28 controller
          and continuity report. An upstream collector must *publish* verified prices;
          this does NOT pretend a GitHub artifact alone refreshes data/latest.csv.
          """
          from __future__ import annotations
          import collections
          import csv
          import datetime as dt
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys
          from zoneinfo import ZoneInfo
          
          ROOT=Path('v5_reports/stage28')
          CONTROL=ROOT/'r14_daily_refresh_controller.json'
          AUDIT=ROOT/'r14_daily_continuity_audit.json'
          SUMMARY=ROOT/'r14_reference_5_10_20_summary.json'
          OBS=ROOT/'r14_reference_5_10_20_observations.json'
          LEDGER=ROOT/'r14_reference_price_cohort_ledger.json'
          EXCLUDED=ROOT/'r14_candidate_exclusion_gate.json'
          DATA=Path('data')
          MARKET=DATA/'latest.csv'
          MARKET_SUMMARY=DATA/'summary.json'
          ARCHIVE=DATA/'daily_70d.csv.gz'
          STAGE27=Path('v5_reports/stage27/status.json')
          STAGE27_LEDGER=Path('v5_reports/stage27/signal_ledger.csv')
          PRIOR=Path('/tmp/stage37_prior_observations.json')
          PRIOR_COHORT=Path('/tmp/stage37_prior_cohorts.json')
          FINGERPRINTS=Path('/tmp/stage37_readonly_sha256.json')
          BASIS='RESEARCH_REFERENCE_CLOSE_NOT_TRADING_RETURN'
          VER='R14_DAILY_SOURCE_AWARE_CONTINUITY_V1'
          DAY=re.compile(r'^20\d{6}$')
          HORIZONS=('5','10','20')
          
          
          def load(p):
              return json.loads(p.read_text(encoding='utf-8-sig'))
          
          
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          
          
          def save(p,obj):
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps(obj,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          
          
          def check_date(s):
              if not isinstance(s,str) or not DAY.fullmatch(s):
                  raise ValueError('BAD_MARKET_DATE')
              dt.datetime.strptime(s,'%Y%m%d')
              return s
          
          
          def exchange_session_info(now):
              import exchange_calendars as xcals
              cal=xcals.get_calendar('XKRX')
              day=now.date()
              # Date is evaluated in Korea; 16:30 includes a margin after close.
              is_session=bool(cal.is_session(day.isoformat()))
              if is_session and (now.hour,now.minute)>=(16,30):
                  expected=day
              elif is_session:
                  expected=cal.previous_session(day.isoformat()).date()
              else:
                  expected=cal.date_to_session(day.isoformat(),direction='previous').date()
              return is_session,expected.strftime('%Y%m%d')
          
          
          def verified_market_source():
              """Fail closed on mixed market dates or a corrupt archive; no API calls."""
              if not all(p.is_file() for p in (MARKET,MARKET_SUMMARY,ARCHIVE)):
                  raise ValueError('REQUIRED_MARKET_SOURCE_MISSING')
              summ=load(MARKET_SUMMARY)
              date=check_date(summ.get('latest_trading_date'))
              if summ.get('sessions_stored')!=70:
                  raise ValueError('MARKET_SUMMARY_NOT_70_SESSIONS')
              with MARKET.open(encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.DictReader(f))
              if len(rows)<2000 or len({x.get('BAS_DD') for x in rows})!=1 or rows[0].get('BAS_DD')!=date:
                  raise ValueError('LATEST_MARKET_NOT_DATE_CONSISTENT')
              if len({(x.get('MARKET'),x.get('ISU_CD')) for x in rows})!=len(rows):
                  raise ValueError('LATEST_MARKET_DUPLICATE_SECURITY')
              if len(rows)!=summ.get('kospi_rows_latest',0)+summ.get('kosdaq_rows_latest',0):
                  raise ValueError('LATEST_MARKET_COUNTS_DIFFER')
              for r in rows:
                  try:
                      if int(str(r.get('TDD_CLSPRC','')).replace(',',''))<=0 or int(str(r.get('MKTCAP','')).replace(',',''))<=0:
                          raise ValueError('NONPOSITIVE_LATEST_PRICE_OR_CAP')
                  except (TypeError,ValueError) as e:
                      raise ValueError('INVALID_LATEST_PRICE_OR_CAP') from e
              archive_dates=collections.Counter()
              latest_archive={}
              with gzip.open(ARCHIVE,'rt',encoding='utf-8-sig',newline='') as f:
                  for r in csv.DictReader(f):
                      d=check_date(r.get('BAS_DD'))
                      archive_dates[d]+=1
                      if d==date:
                          key=(r.get('MARKET'),r.get('ISU_CD'))
                          if key in latest_archive:
                              raise ValueError('ARCHIVE_LATEST_DUPLICATE_SECURITY')
                          latest_archive[key]=r.get('TDD_CLSPRC')
              if len(archive_dates)!=70 or max(archive_dates)!=date or sum(archive_dates.values())!=summ.get('total_rows_stored'):
                  raise ValueError('ARCHIVE_DATES_NOT_CONSISTENT_WITH_SUMMARY')
              # A verified 70-row count alone does NOT prove 70 consecutive KRX sessions.
              # Missing one real trading session would shift every 5/10/20-session horizon.
              # Check the whole rolling window against the exchange calendar, fail closed.
              import exchange_calendars as xcals
              cal=xcals.get_calendar('XKRX')
              actual_dates=sorted(archive_dates)
              expected_dates=[x.strftime('%Y%m%d') for x in cal.sessions_in_range(actual_dates[0],actual_dates[-1])]
              if expected_dates!=actual_dates:
                  missing=sorted(set(expected_dates)-set(actual_dates))
                  extra=sorted(set(actual_dates)-set(expected_dates))
                  raise ValueError('ARCHIVE_KRX_SESSION_GAPS_OR_NONTRADING_DATES:missing='+','.join(missing[:5])+':extra='+','.join(extra[:5]))
              if len(latest_archive)!=len(rows) or any(latest_archive.get((r['MARKET'],r['ISU_CD']))!=r.get('TDD_CLSPRC') for r in rows):
                  raise ValueError('ARCHIVE_LATEST_CLOSE_NOT_MATCHING_MARKET')
              return date,{'market_day':date,'archive_sessions':len(archive_dates),'market_rows':len(rows),
                           'source_sha256':{str(p):sha(p) for p in (MARKET,MARKET_SUMMARY,ARCHIVE)}}
          
          
          def policy(event,session_today,latest,expected,previous,source_ok):
              """Pure operation policy; manual/push may inspect an old verified session."""
              if event in ('schedule','workflow_run') and not session_today:
                  return 'SKIP_KRX_CLOSED','NO_HOLIDAY_REPORT',False
              if not source_ok:
                  return 'WAITING_VERIFIED_MARKET_SOURCE','SOURCE_NOT_VALID',False
              if latest>expected:
                  return 'WAITING_VERIFIED_MARKET_SOURCE','FUTURE_MARKET_DATE_REJECTED',False
              if event in ('schedule','workflow_run'):
                  if latest<expected:
                      return 'WAITING_VERIFIED_MARKET_SOURCE','LATEST_SOURCE_NOT_PUBLISHED_FOR_EXPECTED_SESSION',False
                  if previous==latest:
                      return 'NO_NEW_MARKET_SOURCE','ALREADY_TRACKED_THIS_SESSION',False
              return 'RECHECK_APPROVED','FRESH_ARCHIVE_OR_EXPLICIT_MANUAL_RUN',True
          
          
          def frozen_items(doc):
              if not doc:return {}
              if doc.get('version')!='R14_RESEARCH_REFERENCE_PRICE_OUTCOMES_V1' or doc.get('investment_decisions_authorized') is not False:
                  raise ValueError('PRIOR_OBSERVATIONS_NOT_SAFE')
              out={}
              for r in doc.get('cohort_research_rows',[]):
                  key=(check_date(r.get('research_market_date')),r.get('code'))
                  if key in out:raise ValueError('DUPLICATE_PRIOR_COHORT_ROW')
                  out[key]=r
              return out
          
          
          def validate_continuity(old,now):
              previous=frozen_items(old)
              current=frozen_items(now)
              if not set(previous).issubset(current):
                  raise ValueError('FROZEN_RESEARCH_ROW_REMOVED')
              newly_matured=0;preserved=0
              for key,prior in previous.items():
                  new=current[key]
                  if str(prior.get('research_reference_close_krw'))!=str(new.get('research_reference_close_krw')):
                      raise ValueError('FROZEN_REFERENCE_PRICE_CHANGED_'+str(key))
                  if new.get('research_evidence_tier')!=prior.get('research_evidence_tier') or new.get('grade_research_only')!=prior.get('grade_research_only'):
                      raise ValueError('FROZEN_GRADE_OR_EVIDENCE_CHANGED_'+str(key))
                  for h in HORIZONS:
                      a=prior.get('horizons',{}).get(h,{})
                      b=new.get('horizons',{}).get(h,{})
                      if a.get('status')=='MATURED_RESEARCH_REFERENCE_ONLY':
                          if b!=a:raise ValueError('FROZEN_MATURED_HORIZON_CHANGED_'+str(key)+'_'+h)
                          preserved+=1
                      elif b.get('status')=='MATURED_RESEARCH_REFERENCE_ONLY':
                          newly_matured+=1
              return {'prior_observation_rows':len(previous),'new_observation_rows':len(current),
                      'prior_matured_horizons_preserved':preserved,'newly_matured_horizons':newly_matured}
          
          
          def prior_market_day():
              if not SUMMARY.is_file():return None
              try:
                  old=load(SUMMARY)
                  if old.get('version')!='R14_RESEARCH_5_10_20_SESSION_SUMMARY_V1':return None
                  return check_date(old.get('latest_verified_market_snapshot'))
              except (ValueError,KeyError,TypeError):return None
          
          
          def fingerprint_sources():
              return {str(p):sha(p) for p in (MARKET,MARKET_SUMMARY,ARCHIVE,STAGE27,STAGE27_LEDGER)}
          
          
          def before():
              now=dt.datetime.now(ZoneInfo('Asia/Seoul'))
              event=os.getenv('GITHUB_EVENT_NAME','workflow_dispatch')
              session_today,expected=exchange_session_info(now)
              if event in ('schedule','workflow_run') and not session_today:
                  # Do not write reports for exchange closed days.
                  output(False)
                  print('KRX CLOSED: no daily report')
                  return
              date,source,problem=None,{},None
              try:
                  date,source=verified_market_source()
              except (OSError,ValueError,EOFError,KeyError,TypeError) as e:
                  problem=type(e).__name__+':'+str(e)[:180]
              previous=prior_market_day()
              state,reason,run=policy(event,session_today,date,expected,previous,problem is None)
              control={'version':VER,'checked_kst':now.isoformat(),'event':event,
                       'market_session_today':session_today,'expected_completed_session':expected,
                       'published_market_date':date,'last_completed_outcome_market_date':previous,
                       'pipeline_state':state,'decision_reason':reason,'run_pipeline':run,
                       'source_validation_error':problem,'market_source_evidence':source,
                       'market_data_promoted_by_this_stage':False,
                       'requires_upstream_market_publication':True,
                       'stage27_modified':False,'official_ratio_authentication':False,
                       'research_only':True,'investment_decisions_authorized':False,'final_buy_signals':0,
                       'unverified_filing_retry_attempted':False}
              if run:
                  if OBS.is_file():PRIOR.write_text(OBS.read_text(encoding='utf-8-sig'),encoding='utf-8')
                  elif PRIOR.exists():PRIOR.unlink()
                  if LEDGER.is_file():PRIOR_COHORT.write_text(LEDGER.read_text(encoding='utf-8-sig'),encoding='utf-8')
                  elif PRIOR_COHORT.exists():PRIOR_COHORT.unlink()
                  save(FINGERPRINTS,fingerprint_sources())
              save(CONTROL,control)
              output(run)
              print(json.dumps({'stage':37,'state':state,'latest':date,'expected':expected,'pipeline_run':run,
                                'reason':reason},ensure_ascii=False))
          
          
          def output(run):
              path=os.environ.get('GITHUB_OUTPUT','')
              if path:
                  with open(path,'a',encoding='utf-8') as f:f.write('run_pipeline='+str(run).lower()+'\n')
          
          
          def after():
              ctrl=load(CONTROL)
              if ctrl.get('run_pipeline') is not True or ctrl.get('version')!=VER:
                  raise ValueError('PREFLIGHT_DID_NOT_APPROVE_RUN')
              prior=load(PRIOR) if PRIOR.is_file() else None
              current=load(OBS)
              s=load(SUMMARY)
              led=load(LEDGER)
              ex=load(EXCLUDED)
              stamps=load(FINGERPRINTS)
              now=dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat()
              if fingerprint_sources()!=stamps:
                  raise ValueError('READ_ONLY_MARKET_OR_STAGE27_SOURCE_CHANGED_DURING_PIPELINE')
              if s.get('version')!='R14_RESEARCH_5_10_20_SESSION_SUMMARY_V1' or s.get('latest_verified_market_snapshot')!=ctrl.get('published_market_date'):
                  raise ValueError('STAGE36_OUTPUT_SOURCE_DATE_MISMATCH')
              if s.get('investment_decisions_authorized') is not False or s.get('final_buy_signals')!=0:
                  raise ValueError('UNAUTHORIZED_STAGE36_SIGNALS')
              if current.get('research_only') is not True or current.get('final_buy_signals')!=0 or current.get('reference_method')!='FROZEN_RESEARCH_DATE_CLOSE_NOT_A_TRADE_ENTRY':
                  raise ValueError('STAGE36_NOT_RESEARCH_ONLY')
              if not isinstance(led.get('cohorts'),list) or not isinstance(ex.get('excluded_codes'),list):
                  raise ValueError('COHORT_OR_EXCLUSION_MISSING')
              rows=current.get('cohort_research_rows',[])
              if len(rows)!=sum(len(c['candidates']) for c in led['cohorts']):
                  raise ValueError('COHORT_COUNT_NOT_PRESERVED')
              excluded=set(ex['excluded_codes'])
              if any(row['code'] in excluded for row in rows):
                  raise ValueError('EXCLUDED_STOCK_IN_OUTCOME_HISTORY')
              counts=collections.Counter()
              for row in rows:
                  if row.get('reference_is_not_trade_entry') is not True or row.get('final_buy_signal') is not False:
                      raise ValueError('UNAUTHORIZED_TRADE_REFERENCE')
                  for h in HORIZONS:
                      state=row.get('horizons',{}).get(h,{}).get('status')
                      if not state:raise ValueError('HORIZON_STATUS_MISSING')
                      counts[state]+=1
              if dict(counts)!=s.get('horizon_observation_status_counts') or sum(counts.values())!=s.get('expected_horizon_observations'):
                  raise ValueError('OBSERVATION_SUMMARY_COUNTS_DIVERGED')
              continuity=validate_continuity(prior,current)
              if PRIOR_COHORT.is_file():
                  before_coh=load(PRIOR_COHORT)['cohorts']
                  bydate={a['research_market_date']:a for a in led['cohorts']}
                  for old in before_coh:
                      if bydate.get(old['research_market_date'])!=old:
                          raise ValueError('FROZEN_COHORT_BASELINE_CHANGED')
              report={'version':VER,'generated_kst':now,'pipeline_state':'OUTCOMES_RECHECKED_AND_FROZEN_EVIDENCE_PRESERVED',
                      'research_market_date':s.get('current_research_market_date'),
                      'latest_verified_market_date':s.get('latest_verified_market_snapshot'),
                      'tracked_research_reference_rows':len(rows),
                      'research_cohort_count':len(led['cohorts']),
                      'horizon_status_counts':dict(counts),
                      'horizon_observations':sum(counts.values()),
                      'source_market_sha256':stamps[str(MARKET)],
                      'source_archive_sha256':stamps[str(ARCHIVE)],
                      'prior_evidence_continuity':continuity,
                      'rejected_missing_correction_codes':sorted(excluded),
                      'stage27_status_sha256':stamps[str(STAGE27)],
                      'stage27_signal_ledger_sha256':stamps[str(STAGE27_LEDGER)],
                      'stage27_modified':False,'market_data_promoted_by_this_stage':False,
                      'research_only':True,'official_per_pbr_verified':False,
                      'investment_decisions_authorized':False,'final_buy_signals':0,
                      'no_missing_future_price_imputation':True,
                      'returns_not_adjusted_for_dividends_splits_fees':True,
                      'upstream_publisher_required_for_next_market_date':True}
              save(AUDIT,report)
              ctrl['pipeline_state']='OUTCOMES_RECHECKED_AND_FROZEN_EVIDENCE_PRESERVED'
              ctrl['last_successful_outcome_market_date']=s.get('latest_verified_market_snapshot')
              ctrl['horizon_status_counts']=dict(counts)
              ctrl['newly_matured_horizons']=continuity['newly_matured_horizons']
              ctrl['completed_kst']=now
              save(CONTROL,ctrl)
              print(json.dumps({'stage':37,'status':'PASS','tracked':len(rows),'horizons':dict(counts),
                                'matured_new':continuity['newly_matured_horizons']},ensure_ascii=False))
          
          
          def tests():
              checks=0
              def yes(cond):
                  nonlocal checks
                  assert cond,checks
                  checks+=1
              def fails(fn,msg):
                  nonlocal checks
                  try:fn()
                  except ValueError as e:
                      assert msg in str(e),(msg,e)
                      checks+=1
                      return
                  raise AssertionError('Expected '+msg)
              for event in ('schedule','workflow_run'):
                  yes(policy(event,False,'20261120','20261120','20261119',True)[0]=='SKIP_KRX_CLOSED')
                  yes(policy(event,True,'20261119','20261120','20261119',True)[0]=='WAITING_VERIFIED_MARKET_SOURCE')
                  yes(policy(event,True,'20261120','20261120','20261120',True)[0]=='NO_NEW_MARKET_SOURCE')
                  yes(policy(event,True,'20261120','20261120','20261119',True)[2] is True)
                  yes(policy(event,True,'20261121','20261120','20261119',True)[2] is False)
                  yes(policy(event,True,None,'20261120',None,False)[2] is False)
              yes(policy('push',False,'20261119','20261120','20261119',True)[2] is True)
              yes(policy('workflow_dispatch',False,'20261119','20261120','20261119',True)[2] is True)
              yes(policy('push',False,'20261119','20261120','20261119',False)[2] is False)
              yes(check_date('20261119')=='20261119')
              fails(lambda:check_date('20261140'),'unconverted data remains')
              old={'version':'R14_RESEARCH_REFERENCE_PRICE_OUTCOMES_V1','investment_decisions_authorized':False,
                   'cohort_research_rows':[{'research_market_date':'20261119','code':'000050','research_reference_close_krw':'100',
                   'research_evidence_tier':'T','grade_research_only':'A','horizons':{
                   '5':{'status':'MATURED_RESEARCH_REFERENCE_ONLY','target_session':'20261120','target_close_krw':'110','research_reference_return_pct':10},
                   '10':{'status':'PENDING_ARCHIVED_SESSIONS'},'20':{'status':'PENDING_ARCHIVED_SESSIONS'}}}]}
              import copy
              same=copy.deepcopy(old)
              same['cohort_research_rows'][0]['horizons']['10']={'status':'MATURED_RESEARCH_REFERENCE_ONLY','target_session':'20261127','target_close_krw':'120','research_reference_return_pct':20}
              c=validate_continuity(old,same)
              yes(c['prior_matured_horizons_preserved']==1)
              yes(c['newly_matured_horizons']==1)
              yes(c['prior_observation_rows']==1)
              yes(validate_continuity(None,same)['new_observation_rows']==1)
              changed=copy.deepcopy(same);changed['cohort_research_rows'][0]['horizons']['5']['target_close_krw']='111'
              fails(lambda:validate_continuity(old,changed),'FROZEN_MATURED_HORIZON_CHANGED')
              changed=copy.deepcopy(same);changed['cohort_research_rows'][0]['research_reference_close_krw']='101'
              fails(lambda:validate_continuity(old,changed),'FROZEN_REFERENCE_PRICE_CHANGED')
              changed=copy.deepcopy(same);changed['cohort_research_rows'][0]['grade_research_only']='B'
              fails(lambda:validate_continuity(old,changed),'FROZEN_GRADE_OR_EVIDENCE_CHANGED')
              changed=copy.deepcopy(same);changed['cohort_research_rows']=[]
              fails(lambda:validate_continuity(old,changed),'FROZEN_RESEARCH_ROW_REMOVED')
              changed=copy.deepcopy(old);changed['version']='BAD'
              fails(lambda:validate_continuity(changed,same),'PRIOR_OBSERVATIONS_NOT_SAFE')
              yes(len(frozen_items(old))==1)
              print(json.dumps({'stage':37,'self_tests_passed':checks,'status':'PASS'}))
          
          if __name__=='__main__':
              mode=sys.argv[1] if len(sys.argv)>1 else '--self-test'
              if mode=='--self-test':tests()
              elif mode=='--preflight':before()
              elif mode=='--postflight':after()
              else:raise SystemExit('Unknown mode')
          PYCODE
          python -m py_compile /tmp/stage37_daily_controller.py
          python /tmp/stage37_daily_controller.py --self-test
          python /tmp/stage37_daily_controller.py --preflight
      - name: Restore original Stage25-26 development modules only
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        shell: bash
        run: |
          mkdir -p stage28 v5_reports/stage28
          cat > stage28/restore.py <<'PY'
          import base64, pathlib, re
          W=pathlib.Path('.github/workflows')
          def source(n):
              p=W/n
              if not p.exists():raise FileNotFoundError(f'Required existing workflow: {p}')
              return p.read_text(encoding='utf-8')
          def embedded(n,output):
              s=source(n)
              m=re.search(r"write_bytes\(base64\.b64decode\('([A-Za-z0-9+/=]+)'\)\)",s)
              if not m:raise ValueError('Embedded Python missing: '+n)
              pathlib.Path(output).write_bytes(base64.b64decode(m.group(1),validate=True))
          embedded('v5-stage26-decision-engine.yml','stage28/stage26.py')
          s=source('v5-stage25-fundamental-engine.yml')
          m=re.search(r"cat > /tmp/stage25\.py <<'PY'\n(.*?)\n\s*PY\n",s,re.S)
          if not m:raise ValueError('Stage25 source missing')
          lines=m.group(1).splitlines()
          indent=min(len(x)-len(x.lstrip()) for x in lines if x.strip())
          pathlib.Path('stage28/stage25.py').write_text('\n'.join(x[indent:] for x in lines)+'\n',encoding='utf-8')
          for n in (25,26):
              compile(pathlib.Path(f'stage28/stage{n}.py').read_text(encoding='utf-8'),f'stage{n}.py','exec')
          print('Stage25-26 restored; official KRX production data checked separately; Stage27 untouched')
          PY
          python stage28/restore.py
      - name: Verify official KRX operating market and 70-session archive (no collection)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: collect
        shell: bash
        run: |
          python - <<'PY'
          import csv,gzip,json,datetime,pathlib,collections
          d=pathlib.Path('data'); out=pathlib.Path('v5_reports/stage28');out.mkdir(parents=True,exist_ok=True)
          meta=json.loads((d/'summary.json').read_text(encoding='utf-8-sig'))
          with (d/'latest.csv').open(encoding='utf-8-sig',newline='') as f: latest=list(csv.DictReader(f))
          dates={r.get('BAS_DD','') for r in latest}
          if len(dates)!=1 or dates!={str(meta.get('latest_trading_date',''))}:raise ValueError('LATEST_DATE_MISMATCH')
          if len(latest)<2000:raise ValueError('LATEST_MARKET_UNIVERSE_TOO_SMALL')
          latest_keys={(r.get('MARKET'),r.get('ISU_CD')) for r in latest}
          if len(latest_keys)!=len(latest):raise ValueError('LATEST_DUPLICATE_SECURITY')
          counts=collections.Counter(r.get('MARKET') for r in latest)
          if counts.get('KOSPI')!=meta.get('kospi_rows_latest') or counts.get('KOSDAQ')!=meta.get('kosdaq_rows_latest'):
              raise ValueError('LATEST_MARKET_COUNTS_MISMATCH')
          sessions=set(); nrows=0; tail={}; seen=set()
          with gzip.open(d/'daily_70d.csv.gz','rt',encoding='utf-8-sig',newline='') as f:
              for r in csv.DictReader(f):
                  day=r.get('BAS_DD','');sessions.add(day);nrows+=1
                  if day==next(iter(dates)):
                      key=(r.get('MARKET'),r.get('ISU_CD'))
                      if key in tail:raise ValueError('HISTORY_DUPLICATE_LATEST')
                      tail[key]=r
          if len(sessions)!=70 or max(sessions)!=next(iter(dates)) or nrows!=meta.get('total_rows_stored'):
              raise ValueError('HISTORY_70_SESSIONS_MISMATCH')
          cols=('BAS_DD','MARKET','ISU_CD','ISU_NM','TDD_CLSPRC','ACC_TRDVOL','MKTCAP')
          if len(tail)!=len(latest) or any(tuple(tail.get((r['MARKET'],r['ISU_CD']),{}).get(k) for k in cols)!=tuple(r.get(k) for k in cols) for r in latest):
              raise ValueError('HISTORY_LATEST_CLOSE_MISMATCH')
          result={'state':'VERIFIED_OPERATING_MARKET_DATA','market_date':next(iter(dates)),'market_rows':len(latest),
                  'history_sessions':len(sessions),'history_rows':nrows,'source':'data/latest.csv + data/daily_70d.csv.gz',
                  'read_only':True,'investment_decisions_authorized':False,'final_buy_signals':0}
          (out/'official_market_check.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Evaluate R14 read-only FULL MARKET with existing grading engine
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: full_market_grade
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/krx_v5_r14_grade_engine.py
          python scripts/krx_v5_r14_grade_engine.py --self-test
          python scripts/krx_v5_r14_grade_engine.py \
            --financial data/v5_financial_m/annual_financial_index_m.csv \
            --market data/latest.csv \
            --cache data/v5_financial_m/dart_financial_cache.json \
            --output v5_reports/stage28/r14_full_market_grade_research.json
          python - <<'PY'
          import csv,json,pathlib,re
          p=pathlib.Path('v5_reports/stage28/r14_full_market_grade_research.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          market=json.loads(pathlib.Path('v5_reports/stage28/official_market_check.json').read_text(encoding='utf-8'))
          # R14 only accepts strictly numeric six-digit codes. KRX's 2771
          # rows also contain nonnumeric security codes, so the two universe
          # counts must NOT be asserted equal. Check the exact numeric-code
          # universe instead; never silently treat exclusions as verified shares.
          with pathlib.Path('data/latest.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          numeric_codes={str(x.get('ISU_CD','')).strip() for x in rows
                         if re.fullmatch(r'[0-9]{6}',str(x.get('ISU_CD','')).strip())}
          assert r['market_date']==market['market_date'], 'MARKET_DATE_MISMATCH'
          assert len(rows)==market['market_rows'], 'OFFICIAL_MARKET_ROWS_MISMATCH'
          assert r['market_rows']==len(numeric_codes), 'R14_NUMERIC_MARKET_UNIVERSE_MISMATCH'
          assert r['financial_rows']>0 and r['candidate_count']==len(r['candidates']), 'R14_COUNTS_INVALID'
          assert r['result']=='PRELIMINARY_RESEARCH_ONLY', 'R14_RESEARCH_SAFETY_FAILED'
          assert r['investment_decisions_authorized'] is False and r['final_buy_signals']==0, 'BUY_GATE_FAILED'
          coverage={'official_market_rows':len(rows),'r14_numeric_code_rows':len(numeric_codes),
                    'excluded_non_numeric_codes':len(rows)-len(numeric_codes),
                    'r14_financial_rows':r['financial_rows'],
                    'r14_research_candidates':r['candidate_count'],
                    'ordinary_share_class_verified':False,'investment_decisions_authorized':False}
          pathlib.Path('v5_reports/stage28/r14_universe_coverage.json').write_text(
              json.dumps(coverage,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('R14_NUMERIC_UNIVERSE_RECONCILED',json.dumps(coverage,ensure_ascii=False))
          PY
      - name: Audit official PER PBR provenance and research filing-date safety (read-only)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
