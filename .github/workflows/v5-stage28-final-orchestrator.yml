      - name: Write isolated Stage28 run summary
        if: always()
        env:
          COLLECT_RESULT: ${{ steps.collect.outcome }}
          FUNDAMENTAL_RESULT: ${{ steps.fundamental.outcome }}
          DECISION_RESULT: ${{ steps.decision.outcome }}
          PERFORMANCE_RESULT: ${{ steps.performance.outcome }}
          FULL_MARKET_GRADE_RESULT: ${{ steps.full_market_grade.outcome }}
          RATIO_PROVENANCE_RESULT: ${{ steps.ratio_provenance.outcome }}
          DART_RECEIPTS_RESULT: ${{ steps.dart_receipts.outcome }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib,csv
          root=pathlib.Path('v5_reports/stage28');root.mkdir(parents=True,exist_ok=True)
          statuses={n:os.environ.get(n+'_RESULT','unknown') for n in ('COLLECT','FUNDAMENTAL','DECISION','PERFORMANCE','FULL_MARKET_GRADE','RATIO_PROVENANCE','DART_RECEIPTS')}
          status_files={
            'official_operating_market':'v5_reports/stage28/official_market_check.json',
            'stage25':'v5_reports/stage25/status.json',
            'stage26':'v5_reports/stage26/status.json',
            'stage27':'v5_reports/stage27/status.json',
            'r14_full_market_research':'v5_reports/stage28/r14_full_market_grade_research.json',
            'r14_universe_coverage':'v5_reports/stage28/r14_universe_coverage.json',
            'r14_valuation_disclosure_gate':'v5_reports/stage28/r14_valuation_disclosure_gate.json',
            'r14_filing_receipt_audit':'v5_reports/stage28/r14_filing_receipt_audit.json'
          }
          details={}
          for name,p in status_files.items():
              f=pathlib.Path(p)
              if f.exists():
                  try:
                      data=json.loads(f.read_text(encoding='utf-8'))
                      # Keep summary small: full 114-candidate evidence stays in its own JSON.
                      if name in ('r14_full_market_research','r14_filing_receipt_audit'):
                          data={k:v for k,v in data.items() if k!='candidates'}
                      details[name]=data
                  except Exception as e:details[name]={'parse_error':str(e)}
              else:details[name]={'status_file':'not_present'}
          def market_date(path):
              p=pathlib.Path(path)
              if not p.exists():return None
              with p.open(encoding='utf-8-sig',newline='') as f:
                  r=csv.DictReader(f)
                  return next((x.get('BAS_DD') for x in r if x.get('BAS_DD')),None)
          source_date=market_date('data/latest.csv')
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          report={
            'development_phase':'STAGE28_INTEGRATED',
            'generated_kst':now.isoformat(),
            'component_results':statuses,
            'stage27_mode':'READ_ONLY_SEPARATE_WORKFLOW',
            'market_source_mode':'VERIFIED_EXISTING_OFFICIAL_OPERATING_DATA',
            'legacy_stage25_scope':'ORIGINAL_LIMITED_FUNDAMENTALS_CSV; NOT_FULL_MARKET',
            'r14_scope':'READ_ONLY_FULL_MARKET',
            'r14_official_ratio_verification':'NOT_VERIFIED_NO_AUTHENTICATED_SOURCE',
            'financial_filing_point_in_time':'NOT_VERIFIED',
            'filing_receipt_version_audit':'EVIDENCE_COLLECTION_NO_FINANCIAL_VALUE_AUTHORIZATION',
            'source_date_in_existing_data':source_date,
            'existing_data_fresh_for_today':source_date==now.strftime('%Y%m%d'),
            'component_status':details,
            'verified_investment_recommendations':0,
            'investment_decisions_authorized':False,
            'notice':'Uses official KRX 70-session data; DART receipt/correction evidence is collected incrementally and NEVER promoted to financial-value PIT proof. KRX official PER/PBR still unverified. Stage27 untouched; no trading signals.'
          }
          (root/'status.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'component_results':statuses,'source_date':source_date,'stage27_mode':report['stage27_mode']},ensure_ascii=False))
          PY
      - name: Commit official-source checks and research ONLY (never Stage27)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for p in v5_reports/stage25 v5_reports/stage26 v5_reports/stage28; do
            if [ -d "$p" ]; then git add "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'v5 stage28: preserve isolated research without touching stage27'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
