            'filing_receipt_version_audit':'EVIDENCE_COLLECTION_NO_FINANCIAL_VALUE_AUTHORIZATION',
            'financial_value_reconciliation':'CURRENT_DART_RECEIPT_AND_ACCOUNT_MATCH_ONLY_NO_HISTORICAL_POINT_IN_TIME_AUTHORIZATION',
            'filing_document_original_correction':'ARCHIVE_HASH_ONLY_NO_HISTORICAL_FINANCIAL_PROOF',
            'official_ratio_source_gate':'DATE_MATCHED_EXPORT_CAN_BE_COMPARED_BUT_NOT_AUTHENTICATED',
            'source_date_in_existing_data':source_date,
            'existing_data_fresh_for_today':source_date==now.strftime('%Y%m%d'),
            'component_status':details,
            'verified_investment_recommendations':0,
