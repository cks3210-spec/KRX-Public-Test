          class OfficialPageParser(HTMLParser):
              """Extract text and service-list table rows, not nav-menu keyword coincidences."""
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.rows = []
                  self.row = []
                  self.in_row = False
                  self.in_discard = 0
                  self.text = []
          
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style', 'noscript'):
                      self.in_discard += 1
                  elif tag == 'tr' and self.in_discard == 0:
                      self.in_row = True
                      self.row = []
          
              def handle_endtag(self, tag):
                  if tag in ('script', 'style', 'noscript'):
                      self.in_discard = max(self.in_discard - 1, 0)
                  elif tag == 'tr' and self.in_row and self.in_discard == 0:
                      line = ' '.join(' '.join(self.row).split())
                      if line:
                          self.rows.append(line)
                      self.row = []
                      self.in_row = False
          
              def handle_data(self, data):
                  if self.in_discard:
                      return
                  cleaned = ' '.join(data.split())
                  if cleaned:
                      self.text.append(cleaned)
                      if self.in_row:
                          self.row.append(cleaned)
          
          
          def parse_public_html(page_bytes, label):
              parser = OfficialPageParser()
              page = page_bytes.decode('utf-8', 'replace')
              parser.feed(page)
              all_text = ' '.join(parser.text)
              if label == 'krx_openapi_documented_service_catalog':
                  candidate_rows = [r for r in parser.rows if ('PER' in r.upper() or 'PBR' in r.upper())]
                  stock_per_pbr_service = [r for r in candidate_rows if
                      re.search(r'PER\s*[/·,]?\s*PBR|주가수익비율|주가순자산비율', r, re.I)
                      and re.search(r'종목|주식', r)]
