                      state = 'POTENTIAL_STOCK_RATIO_SERVICE_REVIEW_REQUIRED'
                  elif parser.rows and ('서비스 목록' in all_text or 'API' in all_text):
                      state = 'NO_MATCH_IN_CURRENTLY_VISIBLE_CATALOG_TABLE_ROWS'
                  else:
                      state = 'CATALOG_TABLE_NOT_VERIFIABLE'
                  return {'interpretation': state, 'table_row_count': len(parser.rows),
                          'candidate_api_rows': stock_per_pbr_service[:3],
                          'api_service_documented_and_authorized': False}
              if label == 'krx_data_marketplace_public_landing':
                  found = 'PER/PBR' in all_text or ('PER' in all_text and 'PBR' in all_text)
                  return {'interpretation': 'RATIO_PORTAL_MENU_VISIBLE_NO_API_CONTRACT' if found
