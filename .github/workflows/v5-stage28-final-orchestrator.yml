                      raise ValueError('PREVIOUS_RESEARCH_COHORT_BASELINE_FROZEN_MISMATCH')
                  added=False
              return ledger,added
          
          
          def load_previous_results(doc):
              if doc is None:return {}
              if doc.get('version')!=RESULT_VERSION or doc.get('research_only') is not True or doc.get('final_buy_signals')!=0:
                  raise ValueError('PREVIOUS_PERFORMANCE_REPORT_NOT_VALID')
              out={}
              for row in doc.get('cohort_research_rows',[]):
                  date=valid_date(row.get('research_market_date'))
                  code=row.get('code')
                  if not isinstance(code,str) or not CODE.fullmatch(code):raise ValueError('BAD_PREVIOUS_OUTCOME_CODE')
                  key=(date,code)
                  if key in out:raise ValueError('DUPLICATE_PREVIOUS_OUTCOME')
                  out[key]=row
              return out
          
          
          def observed_return(reference,target):
              return float(((target/reference-1)*Decimal(100)).quantize(Decimal('0.0001'),rounding=ROUND_HALF_UP))
          
          
          def evaluate(ledger,sessions,prices,old_results,excluded):
              prev=load_previous_results(old_results)
              index_by_day={d:i for i,d in enumerate(sessions)}
              rows=[]; counts=collections.Counter(); outcomes=collections.Counter(); per_tier=collections.defaultdict(collections.Counter)
              for cohort in ledger['cohorts']:
                  date=cohort['research_market_date']
                  i=index_by_day.get(date)
                  for c in cohort['candidates']:
                      code=c['code'];key=(date,code)
                      if code in excluded:raise ValueError('CORRECTION_EXCLUDED_REINTRODUCED')
                      previous=prev.get(key)
                      if previous and str(value(previous.get('research_reference_close_krw')))!=str(value(c['reference_close_krw'])):
                          raise ValueError('PREVIOUS_REFERENCE_CLOSE_CHANGED_'+code)
                      ref=value(c['reference_close_krw'])
                      row={'research_market_date':date,'code':code,'name':c['name'],
                           'grade_research_only':c['grade_research_only'],'research_evidence_tier':c['research_evidence_tier'],
                           'research_reference_close_krw':str(ref),
                           'reference_is_not_trade_entry':True,'investment_decisions_authorized':False,'final_buy_signal':False,
                           'research_reference_returns_not_adjusted_for_dividends_splits_fees':True,'horizons':{}}
                      for h in HORIZONS:
                          label=str(h)
                          old=previous.get('horizons',{}).get(label) if previous else None
                          if i is None or i+h>=len(sessions):
                              fresh={'status':'PENDING_ARCHIVED_SESSIONS' if i is not None else 'BASELINE_SESSION_NOT_IN_ROLLING_ARCHIVE',
                                     'target_session':None,'target_close_krw':None,'research_reference_return_pct':None,'direction':None}
                          else:
                              target_day=sessions[i+h]
                              target_close=prices.get((target_day,code))
                              if target_close is None:
                                  fresh={'status':'TARGET_SESSION_PRICE_MISSING','target_session':target_day,'target_close_krw':None,
                                         'research_reference_return_pct':None,'direction':None}
                              else:
                                  change=observed_return(ref,target_close)
                                  fresh={'status':'MATURED_RESEARCH_REFERENCE_ONLY','target_session':target_day,
                                         'target_close_krw':str(target_close),'research_reference_return_pct':change,
                                         'direction':'UP' if change>0 else 'DOWN' if change<0 else 'FLAT'}
                          if old and old.get('status')=='MATURED_RESEARCH_REFERENCE_ONLY':
                              if fresh['status']=='MATURED_RESEARCH_REFERENCE_ONLY' and any(old.get(k)!=fresh.get(k) for k in ('target_session','target_close_krw','research_reference_return_pct','direction')):
                                  raise ValueError('HISTORICAL_MATURED_OUTCOME_CHANGED_'+date+'_'+code+'_'+label)
                              # Matured horizons are frozen even after the 70-session rolling window expires.
                              final=old
                          else:final=fresh
                          row['horizons'][label]=final
                          counts[final['status']]+=1
                          per_tier[c['research_evidence_tier']][str(h)+'_'+final['status']]+=1
                          if final['status']=='MATURED_RESEARCH_REFERENCE_ONLY':outcomes[(label,final['direction'])]+=1
                      rows.append(row)
              if len(rows)!=sum(len(c['candidates']) for c in ledger['cohorts']):raise ValueError('OUTCOME_ROW_COUNT_MISMATCH')
              return rows,dict(counts),{f'{k[0]}_SESSION_{k[1]}':v for k,v in outcomes.items()}, {k:dict(v) for k,v in per_tier.items()}
          
          
          def stage27_crosswalk(path,st,curr_date,curr_codes):
              if st.get('research_only') is not True or st.get('investment_decisions_authorized') is not False or st.get('final_buy_signals')!=0:
                  raise ValueError('STAGE27_UNSAFE_STATUS')
              with path.open(encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.DictReader(f))
              stage_rows=[];seen=set()
              for r in rows:
                  if r.get('source_market_date')!=curr_date or r.get('ISU_CD') not in curr_codes:continue
                  if r.get('signal_date') and r.get('source_market_date')>r['signal_date']:
                      raise ValueError('STAGE27_FUTURE_REFERENCE_DATE')
                  code=r['ISU_CD']
                  if code in seen:raise ValueError('STAGE27_DUPLICATE_COHORT_CODE_'+code)
                  seen.add(code)
                  stage_rows.append(r)
              frozen=[r for r in stage_rows if value(r.get('entry_close_krw')) is not None]
              return {'stage27_overlap_research_codes':len(seen),'stage27_rows_read_only':len(rows),
                      'stage27_trade_like_entry_price_frozen_count':len(frozen),
                      'stage27_first_future_entry_still_pending_count':len(stage_rows)-len(frozen),
                      'stage27_research_groups_not_merged_with_reference_returns':True,
                      'research_cohort_codes_missing_from_stage27':len(curr_codes-seen)}
          
          
          def run(root=ROOT):
