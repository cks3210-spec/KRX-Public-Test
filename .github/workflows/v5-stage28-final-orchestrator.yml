      - name: Calculate owner-attributable research PER/PBR from cached market and financial sources
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: calculated_ratio
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r14_owner_ratio_calculated_research.py <<'PYCODE'
          #!/usr/bin/env python3
          """Stage28 #34: strictly research-only owner-attributable PER/PBR calculation.

          Read existing filtered research stock codes, dated KRX-shaped market snapshot and
          OpenDART cached owner-attributable earnings/equity. No network requests, no
          legacy cache modifications, and no promotion to provider-authenticated figures,
          historical point-in-time validity, actionable valuation, or trading decisions.
          """
          from __future__ import annotations
          import collections
          import csv
          import datetime as dt
          from decimal import Decimal, InvalidOperation, ROUND_HALF_UP
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys
          from zoneinfo import ZoneInfo

          ROOT = Path('v5_reports/stage28')
          DATA = Path('data')
          FILTERED = ROOT / 'r14_eligible_research_candidates.json'
          EXCLUSION = ROOT / 'r14_candidate_exclusion_gate.json'
          OPERATING_MARKET = ROOT / 'official_market_check.json'
          MARKET = DATA / 'latest.csv'
          FINANCIAL = DATA / 'v5_financial_m/annual_financial_index_m.csv'
          FIN_STATUS = DATA / 'v5_financial_m/status.json'
          FIN_CACHE = DATA / 'v5_financial_m/dart_financial_cache.json'
          DISCLOSURE = DATA / 'v5_financial_m/dart_disclosure_evidence.json'
          GROWTH = DATA / 'v5_investment_r14_fundamental/dart_annual_comparatives.json'
          PROVENANCE = ROOT / 'r14_krx_official_ratio_source_gate.json'
          READINESS = ROOT / 'r14_valuation_readiness_gate.json'
          STAGE27 = Path('v5_reports/stage27/status.json')
          REPORT = ROOT / 'r14_calculated_per_pbr_research.json'
          SUMMARY = ROOT / 'r14_calculated_ratio_quality_gate.json'
          CSV_FILE = ROOT / 'r14_calculated_ratio_research.csv'
          VERSION = 'R14_OWNER_ATTRIBUTABLE_MARKETCAP_RATIOS_RESEARCH_V1'
          CODE = re.compile(r'^\d{6}$')
          DATE = re.compile(r'^20\d{6}$')
          PROFIT_SOURCE = 'OpenDART fnlttSinglAcntAll'


          def load_json(p):
              return json.loads(Path(p).read_text(encoding='utf-8-sig'))


          def load_csv(p):
              with Path(p).open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))


          def sha256(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()


          def dec(x):
              try:
                  if isinstance(x, bool) or x is None or str(x).strip() == '':
                      return None
                  d = Decimal(str(x).replace(',', '').strip())
                  return d if d.is_finite() else None
              except (InvalidOperation, ValueError, TypeError):
                  return None


          def money(x):
              v = dec(x)
              return v if v is not None and v == v.to_integral_value() else None


          def date_value(s):
              if not isinstance(s, str) or not DATE.fullmatch(s):
                  raise ValueError('INVALID_DATE_'+str(s))
              return dt.datetime.strptime(s, '%Y%m%d').date()


          def period_kind(day):
              # Mirrors R14 N report availability policy. For research only; not PIT proof.
              m, d = day.month, day.day
              if (m, d) >= (11, 15): return 'q3'
              if (m, d) >= (8, 14): return 'half'
              if (m, d) >= (5, 15): return 'q1'
              return None


          def index_unique(rows, key, label):
              idx = {}
              for item in rows:
                  name = str(item.get(key, '')).strip()
                  if not CODE.fullmatch(name):
                      continue
                  if name in idx:
                      raise ValueError('DUPLICATE_'+label+'_'+name)
                  idx[name] = item
              return idx


          def receipt_asof(disclosure, code, year, market_date):
              v = disclosure.get(f'{code}:{year}:annual', {})
              items = v.get('candidates') if isinstance(v, dict) else None
              if not isinstance(items, list):
                  return {'asof_receipt_listed': False, 'cached_values_matched_to_receipt': False}
              receipts = [str(r.get('rcept_no', '')) for r in items
                          if isinstance(r, dict) and DATE.fullmatch(str(r.get('rcept_dt', '')))
                          and str(r.get('rcept_dt', '')) <= market_date
                          and re.fullmatch(r'\d{14}', str(r.get('rcept_no', '')))]
              return {'asof_receipt_listed': bool(receipts),
                      'receipt_numbers_for_research': sorted(set(receipts)),
                      'cached_values_matched_to_receipt': v.get('cached_values_matched_to_filing') is True and v.get('point_in_time_verified') is True}


          def match_owner_cache(fin, cache, code, year, market_day):
              """Checks cached IFRS owner fields and cumulative-quarter arithmetic only.

              Does not authenticate the original filing's as-of revision/version or shares.
              """
              basis = fin.get('fs_div')
              annual = cache.get(f'{code}:{year}:annual')
              if not isinstance(annual, dict) or annual.get('status') != '000' or annual.get('fs_div') != basis:
                  return {'annual_reconciled': False, 'ttm_reconciled': False, 'reason': 'ANNUAL_SOURCE_OR_BASIS_MISMATCH'}
              fields = annual.get('accounts') if isinstance(annual.get('accounts'), dict) else {}
              owner_profit = money(fields.get('profit'))
              owner_equity = money(fields.get('equity'))
              annual_match = (owner_profit is not None and owner_equity is not None
                              and owner_profit == money(fin.get('annual_profit'))
                              and owner_equity == money(fin.get('equity')))
              if not annual_match:
                  return {'annual_reconciled': False, 'ttm_reconciled': False, 'reason': 'ANNUAL_OWNER_ACCOUNTS_NOT_EQUAL_INDEX'}
              kind = period_kind(market_day)
              if not kind:
                  return {'annual_reconciled': True, 'ttm_reconciled': False, 'reason': 'NO_REPORTED_CUMULATIVE_QUARTER'}
              source_year = market_day.year
              current = cache.get(f'{code}:{source_year}:{kind}')
              previous = cache.get(f'{code}:{year}:{kind}')
              values = []
              for rec in (current, previous):
                  if not isinstance(rec, dict) or rec.get('status') != '000' or rec.get('fs_div') != basis:
                      return {'annual_reconciled': True, 'ttm_reconciled': False, 'reason': 'QUARTER_SOURCE_OR_BASIS_MISMATCH'}
                  val = money((rec.get('accounts') or {}).get('profit'))
                  if val is None:
                      return {'annual_reconciled': True, 'ttm_reconciled': False, 'reason': 'QUARTER_OWNER_PROFIT_MISSING'}
                  values.append(val)
              ttmsum = owner_profit + values[0] - values[1]
              expected = money(fin.get('ttm_profit'))
              okay = expected is not None and expected == ttmsum and fin.get('ttm_status') == 'VERIFIED_CUMULATIVE'
              return {'annual_reconciled': True, 'ttm_reconciled': okay,
                      'ttm_formula': 'annual_parent_owner_profit + current_ytd_owner_profit - prior_ytd_owner_profit',
                      'reason': 'CUMULATIVE_OWNER_TTM_MATCH' if okay else 'TTM_NOT_RECONCILED'}


          def calculate_one(c, market, finance, fin_cache, comparative, disclosure, financial_day):
              code = c['code']; market_day = date_value(c['market_date'])
              flags = []
              res = {'code': code, 'name': c['name'], 'research_grade': c['grade'],
                     'market_date': c['market_date'], 'source_data_type': 'EXISTING_KRX_MARKET_AND_OPENDART_PARENT_OWNER_RESEARCH',
                     'official_krx_per_pbr': False, 'share_class_independently_verified': False,
                     'historical_point_in_time_verified': False, 'actionable_entry_price': False,
                     'investment_decisions_authorized': False, 'buy_signal': False,
                     'per_calculated_research': None, 'pbr_calculated_research': None,
                     'per_status': 'BLOCKED', 'pbr_status': 'BLOCKED', 'calculated_ratio_status': 'BLOCKED'}
              if not market or market.get('BAS_DD') != c['market_date']:
                  res['block_reasons'] = ['EXACT_DATE_MARKET_ROW_UNAVAILABLE']; return res
              close, cap = money(market.get('TDD_CLSPRC')), money(market.get('MKTCAP'))
              if not close or not cap or close <= 0 or cap <= 0:
                  res['block_reasons'] = ['MARKET_PRICE_OR_CAP_INVALID']; return res
              if cap % close:
                  res['block_reasons'] = ['KRX_MARKET_CAP_NOT_DIVISIBLE_BY_CLOSE']; return res
              res.update(close_krw=int(close), listed_market_cap_krw=int(cap),
                         implied_shares_from_marketcap=int(cap / close),
                         market_cap_ordinary_share_class_not_authenticated=True,
                         valuation_market_basis='KRX_SNAPSHOT_MKTCAP_ISU_CD_NO_SHARE_CLASS_CONFIRMATION')
              if not finance:
                  res['block_reasons'] = ['FINANCIAL_ROW_UNAVAILABLE']; return res
              if finance.get('source') != PROFIT_SOURCE or finance.get('fs_div') not in ('CFS','OFS'):
                  res['block_reasons'] = ['OWNER_FINANCIAL_SOURCE_OR_BASIS_INVALID']; return res
              annual_year = str(finance.get('year', '')).strip()
              if not re.fullmatch(r'20\d{2}', annual_year) or int(annual_year) >= market_day.year:
                  res['block_reasons'] = ['ANNUAL_FINANCIAL_YEAR_NOT_PRIOR_TO_EVALUATION']; return res
              if financial_day > market_day:
                  res['block_reasons'] = ['FINANCIAL_SNAPSHOT_FROM_FUTURE']; return res
              if (market_day-financial_day).days > 45:
                  res['block_reasons'] = ['FINANCIAL_SNAPSHOT_TOO_OLD']; return res
              cache_checks = match_owner_cache(finance, fin_cache, code, annual_year, market_day)
              res['cache_source_checks'] = cache_checks
              res['financial_basis'] = finance['fs_div']
              res['annual_financial_year'] = annual_year
              res['financial_cache_snapshot_date'] = financial_day.strftime('%Y%m%d')
              if not cache_checks['annual_reconciled']:
                  res['block_reasons'] = [cache_checks['reason']]; return res
              owner_equity = money(finance.get('equity'))
              ttm = money(finance.get('ttm_profit'))
              annual_profit = money(finance.get('annual_profit'))
              res['owner_attributable_annual_profit_krw'] = int(annual_profit) if annual_profit is not None else None
              res['owner_attributable_equity_krw'] = int(owner_equity) if owner_equity is not None else None
              res['owner_attributable_ttm_profit_krw'] = int(ttm) if ttm is not None else None
              res['filing_evidence'] = receipt_asof(disclosure, code, annual_year, c['market_date'])
              cmp = comparative.get(f'{code}:{annual_year}', {})
              cmp_ok = (isinstance(cmp, dict) and cmp.get('state') == 'OK'
                        and cmp.get('fs_div') == finance['fs_div']
                        and money(cmp.get('owner_profit_current')) == annual_profit)
              res['independent_annual_comparative_cache_matches_owner_profit'] = bool(cmp_ok)
              if not cmp_ok:
                  flags.append('OWNER_PROFIT_COMPARATIVE_NOT_CONFIRMED')
              if finance['fs_div'] == 'OFS':
                  flags.append('OFS_NOT_CONSOLIDATED_GROUP_BASIS')
              if owner_equity and owner_equity > 0:
                  res['pbr_calculated_research'] = float((cap / owner_equity).quantize(Decimal('0.0001'), rounding=ROUND_HALF_UP))
                  res['pbr_status'] = 'PROVISIONAL_MARKETCAP_TO_OWNER_EQUITY_RESEARCH'
              else:
                  flags.append('OWNER_EQUITY_NONPOSITIVE_OR_UNAVAILABLE')
              if cache_checks['ttm_reconciled'] and ttm and ttm > 0:
                  res['per_calculated_research'] = float((cap / ttm).quantize(Decimal('0.0001'), rounding=ROUND_HALF_UP))
                  res['per_status'] = 'PROVISIONAL_MARKETCAP_TO_OWNER_TTM_PROFIT_RESEARCH'
              else:
                  flags.append('OWNER_TTM_PROFIT_UNVERIFIED_OR_NONPOSITIVE')
              res['research_source_quality_flags'] = flags
              res['research_calculation_only'] = True
              res['calculated_ratio_status'] = ('RESEARCH_ESTIMATE_BOTH_METRICS' if res['per_calculated_research'] is not None and res['pbr_calculated_research'] is not None
                                                else 'RESEARCH_ESTIMATE_PARTIAL' if res['per_calculated_research'] is not None or res['pbr_calculated_research'] is not None
                                                else 'BLOCKED')
              return res


          def audit(shortlist, exclusions, market_check, market_rows, fin_rows, fin_status,
                    cache, disclosure, comparative, ratio_gate, readiness):
              if shortlist.get('result') != 'R14_FILTERED_RESEARCH_ONLY_CANDIDATES_V1':
                  raise ValueError('NOT_FILTERED_R14_SOURCE')
              if exclusions.get('result') != 'R14_MISSING_CORRECTION_EXCLUSION_GATE_V1':
                  raise ValueError('MISSING_CORRECTED_FILING_GATE_UNVERIFIED')
              codes = [x.get('code') for x in shortlist.get('candidates', [])]
              banned = set(exclusions.get('excluded_codes') or [])
              if (shortlist.get('candidate_count') != len(codes)
                  or shortlist.get('candidate_count') != exclusions.get('eligible_research_candidate_count')
                  or set(shortlist.get('excluded_codes') or []) != banned or len(set(codes)) != len(codes)
                  or any(not isinstance(c,str) or not CODE.fullmatch(c) or c in banned for c in codes)):
                  raise ValueError('FILTERED_UNIVERSE_COUNT_OR_EXCLUSION_FAILED')
              date = shortlist.get('research_market_date')
              market_day = date_value(date)
              if (market_check.get('state') != 'VERIFIED_OPERATING_MARKET_DATA'
                      or market_check.get('market_date') != date or market_check.get('history_sessions') != 70
                      or market_check.get('market_rows') != len(market_rows)):
                  raise ValueError('EXISTING_KRX_OPERATING_MARKET_UNVERIFIED')
              if any(x.get('BAS_DD') != date for x in market_rows):
                  raise ValueError('LATEST_MARKET_DATE_MIXED')
              if fin_status.get('version') != 'R14_N_ANNUAL_QUARTER_TTM':
                  raise ValueError('R14_OWNER_FINANCIAL_SCHEMA_UNVERIFIED')
              financial_day = date_value(fin_status.get('market_date'))
              if financial_day > market_day or (market_day - financial_day).days > 45:
                  raise ValueError('FINANCIAL_SNAPSHOT_DATE_INVALID_OR_STALE')
              if ratio_gate.get('market_date') != date or readiness.get('research_market_date') != date:
                  raise ValueError('UPSTREAM_RATIO_DATE_MISMATCH')
              if (readiness.get('filtered_input_candidate_count') != len(codes)
                  or readiness.get('excluded_for_missing_corrected_filing') != sorted(banned)
                  or not isinstance(ratio_gate.get('source_independently_authenticated'), bool)):
                  raise ValueError('RESEARCH_RATIO_PROVENANCE_OR_UNIVERSE_UNVERIFIED')
              market_by_code = index_unique(market_rows, 'ISU_CD', 'KRX_MARKET')
              fin_by_code = index_unique(fin_rows, 'code', 'DART_FINANCIAL')
              results = []
              for c in shortlist['candidates']:
                  if c.get('market_date') != date or c.get('grade') not in ('A', 'B', 'B+') or c.get('buy_signal') is not False:
                      raise ValueError('INVALID_CANDIDATE_RESEARCH_STATE_'+str(c.get('code')))
                  results.append(calculate_one(c, market_by_code.get(c['code']), fin_by_code.get(c['code']), cache, comparative, disclosure, financial_day))
              per_count = sum(x.get('per_calculated_research') is not None for x in results)
              pbr_count = sum(x.get('pbr_calculated_research') is not None for x in results)
              both_count = sum(x.get('calculated_ratio_status') == 'RESEARCH_ESTIMATE_BOTH_METRICS' for x in results)
              disabled = sum(x.get('calculated_ratio_status') == 'BLOCKED' for x in results)
              now = dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat()
              counts = collections.Counter(x['calculated_ratio_status'] for x in results)
              checked = collections.Counter()
              for row in results:
                  for flag in row.get('research_source_quality_flags', []):checked[flag] += 1
              summary = {
                  'result': 'R14_OWNER_ATTRIBUTABLE_CALCULATED_RATIO_EVIDENCE_GATE_RESEARCH_V1',
                  'generated_kst': now, 'research_market_date': date,
                  'filtered_input_candidate_count': len(codes),
                  'excluded_missing_corrected_filing_codes': sorted(banned),
                  'calculated_per_research_count': per_count, 'calculated_pbr_research_count': pbr_count,
                  'calculated_both_research_count': both_count, 'calculation_blocked_count': disabled,
                  'candidate_calculation_states': dict(counts),
                  'source_quality_warning_counts': dict(checked),
                  'annual_owner_source_reconciled_count': sum(x.get('cache_source_checks', {}).get('annual_reconciled') is True for x in results),
                  'ttm_owner_source_reconciled_count': sum(x.get('cache_source_checks', {}).get('ttm_reconciled') is True for x in results),
                  'annual_parent_owner_comparative_match_count': sum(x.get('independent_annual_comparative_cache_matches_owner_profit') is True for x in results),
                  'annual_filing_receipt_listed_asof_count': sum(x.get('filing_evidence', {}).get('asof_receipt_listed') is True for x in results),
                  'metric_formulas': {'calculated_per_research': 'listed_krx_market_cap_krw / 4q_parent_owner_profit_krw',
                                      'calculated_pbr_research': 'listed_krx_market_cap_krw / parent_owner_equity_krw'},
                  'krx_market_cap_scope_verified_against_ordinary_shares_and_preferred_shares': False,
                  'parent_owner_earnings_source': 'OpenDART ifrs-full_ProfitLossAttributableToOwnersOfParent account family from existing cache',
                  'parent_owner_equity_source': 'OpenDART ifrs-full_EquityAttributableToOwnersOfParent account family from existing cache',
                  'official_per_pbr_independently_verified_count': 0,
                  'historical_point_in_time_financials_verified': False,
                  'actionable_valuation_ready_count': 0,
                  'price_target_generation_executed': False,
                  'research_only': True, 'investment_decisions_authorized': False, 'final_buy_signals': 0,
                  'source_retrieval_requests_this_run': 0,
                  'existing_stage27_modified': False, 'existing_financial_cache_modified': False,
                  'input_file_paths': {'shortlist': str(FILTERED), 'exclusion': str(EXCLUSION),
                                       'market': str(MARKET), 'financial_index': str(FINANCIAL), 'financial_cache': str(FIN_CACHE)},
                  'limitations': [
                      'Estimates are NOT KRX-published official PER/PBR and are not independent source authentication',
                      'KRX market capitalization divided by price implies shares but does NOT validate ordinary/preferred share class or share denominator',
                      'Year/period calculations do not prove cached figures were the latest corrected filing available at the historic evaluation time',
                      'Some annual owner attributable profit checks may lack a separately cached comparative source',
                      'No fair value, actual buy price, risk rating or investment decision is authorized'],
              }
              report = {
                  'result': VERSION, 'generated_kst': now, 'research_market_date': date,
                  'candidate_count': len(codes), 'excluded_codes': sorted(banned),
                  'calculated_per_research_count': per_count, 'calculated_pbr_research_count': pbr_count,
                  'calculated_both_research_count': both_count,
                  'calculated_ratios': results,
                  'source_type': 'SELF_CALCULATED_FROM_KRX_SHAPED_MARKET_SNAPSHOT_AND_OPENDART_OWNER_ATTRIBUTES_RESEARCH',
                  'official_krx_ratios_verified': 0, 'shares_and_pit_verified': False,
                  'actionable_price_target_count': 0, 'investment_decisions_authorized': False, 'final_buy_signals': 0,
                  'research_only': True,
              }
              return report, summary


          def main():
              if '--self-test' in sys.argv:
                  print(json.dumps({'self_test': 'PASS', 'tests': selftest()}, ensure_ascii=False));return
              inputs = [FILTERED, EXCLUSION, OPERATING_MARKET, MARKET, FINANCIAL, FIN_STATUS, FIN_CACHE, DISCLOSURE, GROWTH, PROVENANCE, READINESS, STAGE27]
              hashes = {str(p):sha256(p) for p in inputs}
              report, summary = audit(load_json(FILTERED),load_json(EXCLUSION),load_json(OPERATING_MARKET),
                                      load_csv(MARKET),load_csv(FINANCIAL),load_json(FIN_STATUS),
                                      load_json(FIN_CACHE),load_json(DISCLOSURE),load_json(GROWTH),
                                      load_json(PROVENANCE),load_json(READINESS))
              if report['candidate_count'] != summary['filtered_input_candidate_count'] or summary['final_buy_signals'] != 0:
                  raise ValueError('RESEARCH_GATE_COUNT_OR_SAFETY_FAILED')
