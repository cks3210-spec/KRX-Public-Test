          assert fin.get('final_buy_signals')==0
          counts=collections.Counter(c.get('grade') for c in research['candidates'])
          assert set(counts).issubset({'A','B'})
          report={
            'result':'R14_VALUATION_AND_DISCLOSURE_SAFETY_AUDIT',
            'market_date':research['market_date'],
            'financial_status_source_date':fin.get('market_date'),
            'candidate_count':research['candidate_count'],
            'research_grade_counts':dict(counts),
            'official_per_independently_verified':0,
            'official_pbr_independently_verified':0,
            'point_in_time_filing_verified':False,
            'open_dart_cache_records':fin.get('cache_records'),
            'data_fetched_by_this_audit':False,
            'next_requirement':'Independent dated PER/PBR evidence and filing-version reconciliation',
            'investment_decisions_authorized':False,
            'final_buy_signals':0
          }
          (root/'r14_valuation_disclosure_gate.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Incremental OpenDART original filing and correction receipts (read-only)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: dart_receipts
        shell: bash
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          R14_FILING_RECEIPT_BATCH_LIMIT: '128'
        run: |
          set -euo pipefail
          cat > /tmp/r14_filing_receipt_audit.py <<'PYCODE'
          #!/usr/bin/env python3
          """Bounded, incremental DART filing receipt audit for R14 research candidates.

          Receipt evidence is NOT financial-value/point-in-time verification. Never change buy signals.
          """
          import csv
          import datetime as dt
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import time
          from collections import Counter
          from urllib import parse, request, error
          from zoneinfo import ZoneInfo

          ROOT = Path('v5_reports/stage28')
          OUT = ROOT / 'r14_filing_receipt_audit.json'
          CACHE_OUT = ROOT / 'r14_filing_receipt_cache.json'
          RESEARCH = ROOT / 'r14_full_market_grade_research.json'
          EVIDENCE = Path('data/v5_financial_m/dart_disclosure_evidence.json')
          CORP_MAP = Path('data/v5_financial_m/corp_map.json')
          SNAPSHOTS = Path('v5_reports/stage27/r14_research_snapshots.csv')
          REPORTS = {'annual': ('사업보고서', '12'), 'q1': ('분기보고서', '03'),
                     'half': ('반기보고서', '06'), 'q3': ('분기보고서', '09')}

          def required_periods(market_date):
              year = int(market_date[:4]); month_day = market_date[4:]
              kind = ('q3' if month_day >= '1115' else 'half' if month_day >= '0814'
                      else 'q1' if month_day >= '0515' else None)
              plan = {f'{year-1}_annual': ('사업보고서', f'{year-1}.12')}
              if kind:
                  title, mm = REPORTS[kind]
                  plan[f'{year-1}_{kind}'] = (title, f'{year-1}.{mm}')
                  plan[f'{year}_{kind}'] = (title, f'{year}.{mm}')
              return plan

          CORRECTION_WORDS = ('정정', '첨부추가', '재제출')
          DART_URL = 'https://opendart.fss.or.kr/api/list.json'


          def load(path, default):
              try:
                  return json.loads(path.read_text(encoding='utf-8-sig'))
              except (OSError, ValueError):
                  return default


          def date8(s):
              s = str(s or '').strip().replace('-', '')
              return s if re.fullmatch(r'20\d{6}', s) else ''


          def report_type(name, periods):
              name = str(name or '')
              normalized = re.sub(r'\s+', '', name)
              for kind, (title, period) in periods.items():
                  if title in normalized and '(' + period + ')' in normalized:
                      return kind
              return None


          def normalize_filings(raw, periods):
              results = {}
              for row in raw:
                  if not isinstance(row, dict):
                      continue
                  name = str(row.get('report_nm', '')).strip()
                  kind = report_type(name, periods)
                  no = str(row.get('rcept_no', '')).strip()
                  day = date8(row.get('rcept_dt'))
                  if not kind or not re.fullmatch(r'\d{14}', no) or not day or no[:8] != day:
                      continue
                  results[no] = {'rcept_no': no, 'rcept_dt': day, 'report_nm': name, 'period_key': kind,
                                 'possible_correction': any(x in name for x in CORRECTION_WORDS)}
              return sorted(results.values(), key=lambda r: (r['rcept_dt'], r['rcept_no']))


          def analyze(rows, cutoff, periods):
              by_kind = {k: [] for k in periods}
              for item in rows:
                  if item['period_key'] in by_kind:
                      by_kind[item['period_key']].append(item)
              period_analysis = {}
              any_late = any_correction = False
              for period, items in by_kind.items():
                  before = [x for x in items if x['rcept_dt'] <= cutoff]
                  after = [x for x in items if x['rcept_dt'] > cutoff]
                  revision = len(items) > 1 or any(x['possible_correction'] for x in items)
                  any_late |= bool(after)
                  any_correction |= revision
                  period_analysis[period] = {
                      'pre_evaluation_receipts': before,
                      'post_evaluation_receipts': after,
                      'latest_available_asof_evaluation': before[-1]['rcept_no'] if before else None,
                      'multiple_or_corrected_receipts': revision,
                  }
              before_all = all(period_analysis[p]['pre_evaluation_receipts'] for p in by_kind)
              return {'filing_periods': period_analysis,
                      'all_required_period_receipts_found_before_evaluation': bool(before_all),
                      'post_evaluation_filing_exists': bool(any_late),
                      'correction_or_multiple_receipts_present': bool(any_correction),
                      'financial_values_matched_to_receipts': False,
                      'point_in_time_financials_verified': False}


          def get_list(corp, token, now_day, periods):
              if not re.fullmatch(r'\d{8}', str(corp or '')):
                  return {'state': 'INVALID_CORP_CODE', 'filings': [], 'pages_checked': 0}
              raw = []
              pages_seen = 0
              page_count = None
              for page in range(1, 11):
                  params = {'crtfc_key': token, 'corp_code': corp, 'bgn_de': f"{min(int(p[:4]) for p in periods):04d}0101",
                            'end_de': now_day, 'last_reprt_at': 'N', 'pblntf_ty': 'A',
                            'page_count': '100', 'page_no': str(page)}
                  try:
                      url = DART_URL + '?' + parse.urlencode(params)
                      with request.urlopen(request.Request(url, headers={'User-Agent': 'KRX-v5-Receipt-Audit/1.0'}), timeout=20) as resp:
                          data = json.load(resp)
                  except (error.URLError, TimeoutError, ValueError, OSError):
                      return {'state': 'API_NETWORK_OR_JSON_ERROR', 'filings': [], 'pages_checked': pages_seen}
                  status = data.get('status') if isinstance(data, dict) else None
                  if status == '013':
                      return {'state': 'API_NO_DISCLOSURES', 'filings': [], 'pages_checked': pages_seen + 1}
                  if status != '000':
                      return {'state': 'API_REJECTED_' + str(status)[:8], 'filings': [], 'pages_checked': pages_seen}
                  try:
                      count = int(data['total_page'])
                      items = data['list']
                      if count < 1 or count > 100000 or not isinstance(items, list):
                          raise ValueError('API_BAD_PAGINATION')
                  except (KeyError, ValueError, TypeError):
                      return {'state': 'API_INVALID_PAGE_METADATA', 'filings': [], 'pages_checked': pages_seen}
                  if page_count is not None and page_count != count:
                      return {'state': 'API_PAGINATION_CHANGED', 'filings': [], 'pages_checked': pages_seen}
                  page_count = count
                  raw.extend(items)
                  pages_seen += 1
                  if page >= count:
                      return {'state': 'COMPLETE_DART_API', 'filings': normalize_filings(raw, periods),
                              'pages_checked': pages_seen, 'total_pages': count}
                  time.sleep(.12)
              return {'state': 'API_PAGINATION_EXCEEDED', 'filings': [], 'pages_checked': pages_seen,
                      'total_pages': page_count}


          def previous_evidence(code, periods, evidence):
              raw = []
              for period in periods:
                  year, kind = period.split('_', 1)
                  entry = evidence.get(f'{code}:{year}:{kind}', {})
                  if entry.get('state') == 'FILING_CANDIDATES_FOUND':
                      raw.extend(entry.get('candidates', []))
              return normalize_filings(raw, periods)


          def historical_eval_dates(market_date):
              if not SNAPSHOTS.exists():
                  return {}
              by_code = {}
              with SNAPSHOTS.open(encoding='utf-8-sig', newline='') as f:
                  for row in csv.DictReader(f):
                      if row.get('source_market_date') == market_date:
                          date = date8(row.get('evaluation_date_kst'))
                          if date and row.get('ISU_CD') not in by_code:
                              by_code[row['ISU_CD']] = date
              return by_code


          def run():
              research = load(RESEARCH, {})
              if research.get('result') != 'PRELIMINARY_RESEARCH_ONLY' or research.get('final_buy_signals') != 0 or research.get('investment_decisions_authorized') is not False:
                  raise ValueError('UNSAFE_OR_MISSING_R14_RESEARCH')
              market_date = date8(research.get('market_date'))
              periods = required_periods(market_date) if market_date else {}
              candidates = research.get('candidates', [])
              if not market_date or not isinstance(candidates, list) or research.get('candidate_count') != len(candidates):
                  raise ValueError('INVALID_RESEARCH_CANDIDATE_LIST')
              corp_map = load(CORP_MAP, {})
              prior_evidence = load(EVIDENCE, {})
              old = load(OUT, {})
              persistent = load(CACHE_OUT, {})
              # Preserve API-fetched evidence across changing daily market dates; otherwise
              # a 24-company batch would restart each day and never cover the universe.
              rows = dict(persistent.get('rows', {}))
              if not rows and isinstance(old.get('rows'), dict):
                  rows.update(old['rows'])
              dates = historical_eval_dates(market_date)
              now = dt.datetime.now(ZoneInfo('Asia/Seoul'))
              now_day = now.strftime('%Y%m%d')
              key = os.getenv('DART_API_KEY', '').strip()
              limit = max(0, min(128, int(os.getenv('R14_FILING_RECEIPT_BATCH_LIMIT', '128'))))
              # Prioritize A candidates and new missing records; all receipts are audit evidence only.
              codes = sorted((c for c in candidates if c.get('grade') in ('A', 'B') and re.fullmatch(r'\d{6}', str(c.get('code', '')))),
                             key=lambda x: (x['grade'] != 'A', -int(x.get('score', 0)), x['code']))
              scanned = 0
              issues = Counter()
              for c in codes:
                  code = c['code']
                  cutoff = dates.get(code, now_day)
                  prev = rows.get(code, {})
                  last_checked = date8(prev.get('last_live_check_kst'))
                  recently_checked = bool(last_checked and (now.date() - dt.datetime.strptime(last_checked, '%Y%m%d').date()).days < 7)
                  previously_complete = prev.get('api_state') in ('COMPLETE_DART_API', 'API_NO_DISCLOSURES')
                  if previously_complete:
                      # Preserve the stronger old live evidence until a successful refresh.
                      filing_rows = prev.get('filings', [])
                      provenance = 'SAVED_DART_API_RESULT'
                      state = prev['api_state']
                  else:
                      filing_rows = previous_evidence(code, periods, prior_evidence)
                      provenance = 'PREVIOUS_R14_FILING_EVIDENCE_PARTIAL'
                      state = 'PENDING_LIVE_DART_API'
                  refresh_error = None
                  if not (previously_complete and recently_checked):
                      if scanned < limit and key and re.fullmatch(r'\d{8}', str(corp_map.get(code, ''))):
                          fresh = get_list(corp_map[code], key, now_day, periods)
                          scanned += 1
                          time.sleep(.25)  # Rate pacing; persisted results are reused on later runs.
                          if fresh['state'] in ('COMPLETE_DART_API', 'API_NO_DISCLOSURES'):
                              filing_rows = fresh['filings']
                              provenance = 'LIVE_DART_LIST_COMPLETE'
                              state = fresh['state']
                          else:
                              refresh_error = fresh['state']
                              if not previously_complete:
                                  state = fresh['state']
                      elif not key and not previously_complete:
                          state = 'BLOCKED_MISSING_DART_KEY'
                      elif not re.fullmatch(r'\d{8}', str(corp_map.get(code, ''))) and not previously_complete:
                          state = 'CORP_MAPPING_UNAVAILABLE'
                  assessed = analyze(filing_rows, cutoff, periods)
                  rows[code] = {'code': code, 'grade_research_only': c['grade'],
                                'financial_reference_market_date': market_date,
                                'evaluation_date': cutoff,
                                'evaluation_date_source': 'FROZEN_STAGE27_RESEARCH_SNAPSHOT' if code in dates else 'AUDIT_TIME_NOT_HISTORICAL_SIGNAL',
                                'corp_code': str(corp_map.get(code, '')),
                                'api_state': state, 'source_evidence_level': provenance,
                                'last_refresh_failure': refresh_error,
                                'last_live_check_kst': now_day if state in ('COMPLETE_DART_API', 'API_NO_DISCLOSURES') and provenance == 'LIVE_DART_LIST_COMPLETE' else prev.get('last_live_check_kst',''),
                                'filings': filing_rows, **assessed}
                  issues[state] += 1
              selected_codes = {c['code'] for c in codes}
              saved = {k: v for k, v in rows.items() if k in selected_codes}
              counts = Counter(v['api_state'] for v in saved.values())
              report = {'result': 'R14_FILING_RECEIPT_VERSION_AUDIT',
                        'generated_kst': now.isoformat(),
                        'market_date': market_date,
                        'candidate_count': len(codes),
                        'required_financial_periods': sorted(periods),
                        'live_company_queries_this_run': scanned,
                        'remaining_not_live_verified': sum(v['api_state'] not in ('COMPLETE_DART_API', 'API_NO_DISCLOSURES') for v in saved.values()),
                        'live_dart_filing_metadata_complete_count': counts['COMPLETE_DART_API'],
                        'all_required_periods_pre_evaluation_count': sum(v['all_required_period_receipts_found_before_evaluation'] for v in saved.values()),
                        'correction_or_multiple_receipt_companies': sum(v['correction_or_multiple_receipts_present'] for v in saved.values()),
                        'post_evaluation_revision_or_filing_companies': sum(v['post_evaluation_filing_exists'] for v in saved.values()),
                        'api_state_counts': dict(counts),
                        'cached_financial_values_to_receipts_verified': 0,
                        'point_in_time_financials_verified': False,
                        'official_per_independently_verified': 0,
                        'official_pbr_independently_verified': 0,
                        'investment_decisions_authorized': False,
                        'final_buy_signals': 0,
                        'notes': ['Financial receipt metadata is not an account-by-account financial version match',
                                  'Before-evaluation filings are only availability evidence; numbers and corrections still require independent reconciliation',
                                  'No orders, no new research recommendations, no edits to Stage27 or financial caches'],
                        'rows': saved}
              ROOT.mkdir(parents=True, exist_ok=True)
              cache_doc = {'format': 'R14_RECEIPT_EVIDENCE_CACHE_V1',
                           'updated_kst': now.isoformat(), 'rows': rows,
                           'investment_decisions_authorized': False, 'final_buy_signals': 0}
              tmp_cache = CACHE_OUT.with_suffix('.tmp')
              tmp_cache.write_text(json.dumps(cache_doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              tmp_cache.replace(CACHE_OUT)
              tmp = OUT.with_suffix('.tmp')
              tmp.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              tmp.replace(OUT)
              print(json.dumps({k: v for k, v in report.items() if k != 'rows'}, ensure_ascii=False))


          def self_test():
              r = [{'rcept_no': '20260318000001', 'rcept_dt': '20260318', 'report_nm': '사업보고서 (2025.12)'},
                   {'rcept_no': '20261114000001', 'rcept_dt': '20261114', 'report_nm': '분기보고서 (2026.09)'},
                   {'rcept_no': '20261122000001', 'rcept_dt': '20261122', 'report_nm': '[기재정정] 분기보고서 (2026.09)'},
                   {'rcept_no': '20251114000001', 'rcept_dt': '20251114', 'report_nm': '분기보고서 (2025.09)'}]
              periods = required_periods('20261119')
              normalized = normalize_filings(r, periods)
              assert len(normalized) == 4
              a = analyze(normalized, '20261120', periods)
              assert a['all_required_period_receipts_found_before_evaluation'] is True
              assert a['post_evaluation_filing_exists'] is True
              assert a['correction_or_multiple_receipts_present'] is True
              assert a['filing_periods']['2026_q3']['latest_available_asof_evaluation'] == '20261114000001'
              assert analyze(normalized[:1], '20261120', periods)['all_required_period_receipts_found_before_evaluation'] is False
              assert report_type('［기재정정］사업보고서 (2025.12)', periods) == '2025_annual'
              assert not normalize_filings([{'rcept_no': '20260318000001', 'rcept_dt': '20260319', 'report_nm': '사업보고서 (2025.12)'}], periods)
              assert not normalize_filings([{'rcept_no': 'not-a-receipt', 'rcept_dt': '20260318', 'report_nm': '사업보고서 (2025.12)'}], periods)
              assert date8('2026-11-20') == '20261120'
              assert sorted(required_periods('20270312')) == ['2026_annual']
              assert sorted(required_periods('20260520')) == ['2025_annual', '2025_q1', '2026_q1']
              print(json.dumps({'self_test': 'PASS', 'tests': 11}))


          if __name__ == '__main__':
              if '--self-test' in sys.argv:
                  self_test()
              else:
                  run()
          PYCODE
          python -m py_compile /tmp/r14_filing_receipt_audit.py
          python /tmp/r14_filing_receipt_audit.py --self-test
          python /tmp/r14_filing_receipt_audit.py
      - name: Reconcile current DART financial account values against frozen receipt IDs (read-only)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: financial_values
        shell: bash
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          R14_VALUE_COMPARE_BATCH_LIMIT: '128'
        run: |
          set -euo pipefail
          cat > /tmp/r14_financial_values.py <<'PYCODE'
          #!/usr/bin/env python3
          """R14 financial cache vs live OpenDART account figures, receipt-bound research audit.
          
          Live fnlttSinglAcntAll is not a historical revision API. Never claim
          point-in-time equivalence, official PER/PBR, or actionable investment grades.
          The original financial/disclosure caches and Stage27 are read-only.
          """
          import argparse
          import collections
          import datetime as dt
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import time
          from urllib import parse, request, error
          from zoneinfo import ZoneInfo
          
          ROOT = Path('v5_reports/stage28')
          FILINGS = ROOT / 'r14_filing_receipt_cache.json'
          FINANCE = Path('data/v5_financial_m/dart_financial_cache.json')
          OUT = ROOT / 'r14_financial_value_reconciliation.json'
          PERSIST = ROOT / 'r14_financial_value_reconciliation_cache.json'
          REPORT_CODES = {'annual':'11011', 'q3':'11014', 'half':'11012','q1':'11013'}
          FIELDNAMES = ('profit','equity','previous_equity','assets','liabilities','revenue')
          
          
          def load(path, default):
              try:
                  return json.loads(path.read_text(encoding='utf-8-sig'))
              except (OSError, ValueError):
                  return default
          
          
          def valid_receipt(value):
              return bool(re.fullmatch(r'20\d{12}', str(value or '')))
          
          
          def expected_receipt(row, period_key):
              p = (row.get('filing_periods') or {}).get(period_key, {})
              receipt = str(p.get('latest_available_asof_evaluation') or '')
              filings = p.get('pre_evaluation_receipts') or []
              if not valid_receipt(receipt) or not any(x.get('rcept_no') == receipt for x in filings):
                  return ''
              cutoff = str(row.get('evaluation_date') or '')
              match = next((x for x in filings if x.get('rcept_no') == receipt), {})
              filing_date = str(match.get('rcept_dt') or '')
              if not re.fullmatch(r'20\d{6}', cutoff) or not re.fullmatch(r'20\d{6}', filing_date) or filing_date > cutoff:
                  return ''
              return receipt
          
          
          def compare(cache_entry, response, expected, kind, basis, original_parser):
              if response.get('status') != '000' or not isinstance(response.get('list'), list):
                  return {'status':'DART_API_NO_VERIFIED_FINANCIAL_LIST',
                          'api_status':str(response.get('status',''))[:12]}
              data = response['list']
              accounted = set().union(*original_parser.ACCOUNTS.values())
              relevant = [x for x in data if isinstance(x, dict) and x.get('account_id') in accounted]
              receipt_set = {str(x.get('rcept_no','')) for x in relevant}
              if not relevant or any(not valid_receipt(x) for x in receipt_set):
                  return {'status':'DART_FINANCIAL_ROWS_RECEIPT_UNATTESTED',
                          'receipt_ids': sorted(receipt_set)[:12]}
              if receipt_set != {expected}:
                  return {'status':'DART_RECEIPT_MISMATCH',
                          'expected_receipt':expected,'returned_receipts':sorted(receipt_set)[:12]}
              parsed = original_parser.parse(response, kind, basis)
              if parsed.get('status') != '000':
                  return {'status':'DART_FINANCIAL_FIELDS_UNUSABLE',
                          'parse_status': parsed.get('status')}
              original = cache_entry.get('accounts', {})
              live = parsed.get('accounts', {})
              if not isinstance(original, dict) or not original or not isinstance(live, dict):
                  return {'status':'FINANCIAL_ACCOUNT_DATA_MISSING'}
              fields = [k for k in FIELDNAMES if k in original]
              missing = [k for k in fields if k not in live]
              if missing or len(fields) < 2:
                  return {'status':'FINANCIAL_FIELDS_INCOMPLETE', 'missing_fields':missing,
                          'comparable_fields':len(fields)}
              delta = {k:{'cached':original[k],'live':live[k]} for k in fields
                       if type(original[k]) not in (int,float) or type(live[k]) not in (int,float)
                       or original[k] != live[k]}
              if delta:
                  return {'status':'FINANCIAL_VALUE_MISMATCH', 'mismatched_fields':delta,
                          'compared_fields':fields}
              return {'status':'CURRENT_DART_VALUES_MATCH_RECEIPT_AND_CACHE',
                      'compared_fields':fields,'compared_count':len(fields),
                      'receipt_no':expected,'fs_div':basis,
                      'point_in_time_verified':False}
          
          
          def live_request(corp, year, kind, basis, token):
              url='https://opendart.fss.or.kr/api/fnlttSinglAcntAll.json?'+parse.urlencode({
                  'crtfc_key':token,'corp_code':corp,'bsns_year':year,
                  'reprt_code':REPORT_CODES[kind],'fs_div':basis})
              try:
                  with request.urlopen(request.Request(url,headers={'User-Agent':'KRX-v5-Cached-Receipt-Compare/1.0'}),timeout=25) as f:
                      if int(f.headers.get('Content-Length','0') or 0)>8_000_000:
                          return {'status':'BLOCKED_RESPONSE_TOO_LARGE'}
                      b=f.read(8_000_001)
                  if len(b)>8_000_000: return {'status':'BLOCKED_RESPONSE_TOO_LARGE'}
                  obj=json.loads(b)
                  return obj if isinstance(obj,dict) else {'status':'INVALID_RESPONSE_SCHEMA'}
              except (error.URLError,TimeoutError,OSError,ValueError) as exc:
                  return {'status':'API_NETWORK_OR_JSON_FAILURE','reason':type(exc).__name__}
          
          
          def current_cache_key(r, p):
              cutoff = str(r.get('evaluation_date',''))
              receipts = (r.get('filing_periods') or {})
              return {'evaluation_date':cutoff,
                      'receipts':{period:expected_receipt(r,period) for period in sorted(receipts)}}
          
          
          def main():
              p=argparse.ArgumentParser()
              p.add_argument('--self-test',action='store_true')
              args=p.parse_args()
              if args.self_test:
                  class Parser:
                      ACCOUNTS={'profit':{'ifrs-full_ProfitLossAttributableToOwnersOfParent'},'equity':{'ifrs-full_EquityAttributableToOwnersOfParent'}}
                      @staticmethod
                      def parse(response,kind,basis):
                          return {'status':'000','accounts':{'profit':10,'equity':30}}
                  receipt='20260318001027'
                  data={'status':'000','list':[{'rcept_no':receipt,'account_id':'ifrs-full_ProfitLossAttributableToOwnersOfParent'},
                                                {'rcept_no':receipt,'account_id':'ifrs-full_EquityAttributableToOwnersOfParent'}]}
                  cached={'accounts':{'profit':10,'equity':30}}
                  assert compare(cached,data,receipt,'annual','CFS',Parser)['status']=='CURRENT_DART_VALUES_MATCH_RECEIPT_AND_CACHE'
                  assert compare(cached,data,'20260318001234','annual','CFS',Parser)['status']=='DART_RECEIPT_MISMATCH'
                  assert compare({'accounts':{'profit':11,'equity':30}},data,receipt,'annual','CFS',Parser)['status']=='FINANCIAL_VALUE_MISMATCH'
                  assert compare(cached,{'status':'013'},receipt,'annual','CFS',Parser)['status']=='DART_API_NO_VERIFIED_FINANCIAL_LIST'
                  assert compare(cached,{'status':'000','list':[{'account_id':'ifrs-full_EquityAttributableToOwnersOfParent'}]},receipt,'annual','CFS',Parser)['status']=='DART_FINANCIAL_ROWS_RECEIPT_UNATTESTED'
                  row={'evaluation_date':'20261120','filing_periods':{'2025_annual':{'latest_available_asof_evaluation':receipt,
                       'pre_evaluation_receipts':[{'rcept_no':receipt,'rcept_dt':'20260318'}]}}}
                  assert expected_receipt(row,'2025_annual') == receipt
                  row['evaluation_date']='20260317'
                  assert expected_receipt(row,'2025_annual') == ''
                  print(json.dumps({'result':'SELF_TEST_PASS','tests':7}))
                  return
              ROOT.mkdir(parents=True,exist_ok=True)
              filings=load(FILINGS,{})
              cache=load(FINANCE,{})
              persistent=load(PERSIST,{})
              rows=dict(persistent.get('rows',{}))
              if not isinstance(cache,dict) or not cache:
                  raise SystemExit('MISSING_OR_INVALID_FINANCIAL_CACHE')
              if filings.get('format')!='R14_RECEIPT_EVIDENCE_CACHE_V1' or not isinstance(filings.get('rows'),dict):
                  raise SystemExit('MISSING_OR_INVALID_RECEIPT_CACHE')
              # Re-use the original R14 parser, preserving exact financial account rules.
              from importlib import util
              spec=util.spec_from_file_location('existing_r14_parser','scripts/krx_v5_r14_dart_incremental_m.py')
              original_parser=util.module_from_spec(spec)
              spec.loader.exec_module(original_parser)
              now=dt.datetime.now(ZoneInfo('Asia/Seoul'))
              now_day=now.strftime('%Y%m%d')
              token=os.getenv('DART_API_KEY','').strip()
              limit=max(0,min(128,int(os.getenv('R14_VALUE_COMPARE_BATCH_LIMIT','128'))))
              company_queries=0
              api_requests=0
              counts=collections.Counter()
              candidates=filings['rows']
              ordering=sorted(candidates.items(),key=lambda kv:(kv[1].get('grade_research_only')!='A',kv[0]))
              for code, record in ordering:
                  if record.get('api_state')!='COMPLETE_DART_API':
                      counts['WAITING_COMPLETE_FILING_RECEIPT_EVIDENCE']+=1
                      continue
                  if not re.fullmatch(r'\d{6}',code) or not re.fullmatch(r'\d{8}',str(record.get('corp_code',''))):
                      counts['INVALID_COMPANY_IDENTIFIERS']+=1
                      continue
                  periods=record.get('filing_periods') or {}
                  needed=[x for x in sorted(periods) if re.fullmatch(r'20\d{2}_(annual|q1|half|q3)',x)]
                  desired=current_cache_key(record,periods)
                  prev=rows.get(code,{})
                  if prev.get('receipt_selection')==desired and prev.get('status') in (
                      'CURRENT_ACCOUNT_VALUES_MATCHED','FINANCIAL_ACCOUNT_MISMATCH','RECEIPT_VERSION_MISMATCH'):
                      counts['CACHED_FINISHED']+=1
                      continue
                  if not token:
                      counts['BLOCKED_MISSING_DART_KEY']+=1
                      continue
                  if company_queries>=limit:
                      counts['PENDING_BATCH_CAP']+=1
                      continue
                  company_queries+=1
                  per={}
                  for period in needed:
                      year,kind=period.split('_',1)
                      receipt=expected_receipt(record,period)
                      financial=cache.get(f'{code}:{year}:{kind}',{})
                      basis=financial.get('fs_div','') if isinstance(financial,dict) else ''
                      if not receipt:
                          per[period]={'status':'MISSING_RECEIPT_BEFORE_EVALUATION'}
                      elif not isinstance(financial,dict) or financial.get('status')!='000' or not financial.get('accounts'):
                          per[period]={'status':'CACHE_FINANCIAL_UNVERIFIED'}
                      elif basis not in ('CFS','OFS'):
                          per[period]={'status':'CACHE_FINANCIAL_BASIS_UNVERIFIED'}
                      else:
                          res=live_request(record['corp_code'],year,kind,basis,token)
                          api_requests+=1
                          per[period]=compare(financial,res,receipt,kind,basis,original_parser)
                          time.sleep(.25)  # Pace API calls and preserve original cache safety rules.
                  kinds={x.get('status') for x in per.values()}
                  if len(per)>=3 and kinds=={'CURRENT_DART_VALUES_MATCH_RECEIPT_AND_CACHE'}:
                      state='CURRENT_ACCOUNT_VALUES_MATCHED'
                  elif 'FINANCIAL_VALUE_MISMATCH' in kinds:
                      state='FINANCIAL_ACCOUNT_MISMATCH'
                  elif 'DART_RECEIPT_MISMATCH' in kinds:
                      state='RECEIPT_VERSION_MISMATCH'
                  else:
                      state='INCOMPLETE_OR_UNVERIFIED_COMPARISON'
                  rows[code]={'code':code,'status':state,'receipt_selection':desired,
                              'checked_kst':now.isoformat(),'periods':per,
                              'source':'OPEN_DART_CURRENT_FINANCIAL_API_RECEIPT_AUDIT',
                              'historical_point_in_time_verified':False,
                              'investment_decisions_authorized':False}
                  counts[state]+=1
              # Cache must retain earlier companies even when new market grades change.
              persistent={'format':'R14_FINANCIAL_COMPARISON_CACHE_V1','updated_kst':now.isoformat(),
                          'rows':rows,'investment_decisions_authorized':False,'final_buy_signals':0}
              report={'result':'R14_FINANCIAL_VALUES_VS_DART_RECEIPT_AUDIT',
                      'generated_kst':now.isoformat(), 'company_queries_this_run':company_queries,
                      'dart_financial_api_requests_this_run':api_requests,
                      'candidate_count':len(candidates),'cached_company_count':len(rows),
                      'current_api_matched_company_count':sum(v.get('status')=='CURRENT_ACCOUNT_VALUES_MATCHED' for v in rows.values()),
                      'historical_point_in_time_verified_company_count':0,
                      'official_per_pbr_verified_count':0,
                      'status_counts_this_run':dict(counts),
                      'data_fetched_by_this_audit':bool(api_requests and token),
                      'financial_cache_modified':False,'filing_receipt_cache_modified':False,'stage27_modified':False,
                      'investment_decisions_authorized':False,'final_buy_signals':0,
                      'limitations':['fnlttSinglAcntAll is a current structured API, not an as-of historical source',
                                     'Receipt IDs and account values must both match; mismatches block verification',
                                     'Even matched present-day API data cannot certify old investment decision-time availability']}
              def atomic(p,value):
                  tmp=p.with_suffix('.json.tmp')
                  tmp.write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  tmp.replace(p)
              atomic(PERSIST,persistent)
              atomic(OUT,report)
              print(json.dumps({k:v for k,v in report.items() if k!='limitations'},ensure_ascii=False))
          
          if __name__=='__main__':
              main()
          PYCODE
          python -m py_compile /tmp/r14_financial_values.py
          python /tmp/r14_financial_values.py --self-test
          python /tmp/r14_financial_values.py
      - name: Preserve OpenDART original and amended filing ZIP checksums (research-only)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: original_versions
        shell: bash
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          R14_DOCUMENT_BATCH_LIMIT: '0' # Freeze missing corrected-document retries; cached evidence reused
        run: |
          set -euo pipefail
          cat > /tmp/r14_document_version_probe.py <<'PYCODE'
          #!/usr/bin/env python3
          """Stage28 R14 historical filing-version documentary evidence (research-only).

          Original filing ZIP retrieval creates CURRENT retrieval evidence of a registered
          DART receipt, not proof that the current API's financial rows represent values
          accessible at the past decision timestamp. Never unfreeze buy authorization.
          """
          import collections
          import datetime as dt
          import hashlib
          import io
          import json
          import os
          import re
          import time
          import zipfile
          from pathlib import Path
          from urllib import parse, request, error
          from zoneinfo import ZoneInfo

          ROOT=Path('v5_reports/stage28')
          FILING=ROOT/'r14_filing_receipt_cache.json'
          FINANCIAL=ROOT/'r14_financial_value_reconciliation_cache.json'
          PERSIST=ROOT/'r14_filing_document_version_cache.json'
          OUT=ROOT/'r14_correction_original_document_audit.json'
          ENDPOINT='https://opendart.fss.or.kr/api/document.xml'
          MAX_DOWNLOAD_BYTES=16_000_000
          MAX_UNCOMPRESSED=64_000_000
          MAX_MEMBERS=80


          def read(p, fallback):
              try:
                  return json.loads(p.read_text(encoding='utf-8-sig'))
              except (OSError, ValueError):
                  return fallback


          def stamp():
              return dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat()


          def valid_receipt(r):
              return bool(re.fullmatch(r'20\d{12}', str(r or '')))


          def safe_zip_bytes(data, receipt):
              """Inspect ZIP contents without extracting to disk, executing XML or logging keys."""
              if not data.startswith(b'PK'):
                  # DART sometimes returns an XML API status instead of ZIP.
                  # Classify it without retaining response text or credentials.
                  found=re.search(rb'<status>\s*([0-9A-Za-z_-]{2,12})\s*</status>',data[:8192],re.I)
                  if found:
                      return {'state':'DART_API_STATUS_'+found.group(1).decode('ascii').upper()}
                  return {'state':'NOT_ZIP_RESPONSE'}
              if len(data) > MAX_DOWNLOAD_BYTES:
                  return {'state':'ARCHIVE_TOO_LARGE'}
              try:
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      entries=archive.infolist()
                      if len(entries)>MAX_MEMBERS:
                          return {'state':'TOO_MANY_ARCHIVE_MEMBERS'}
                      total=sum(e.file_size for e in entries)
                      if total>MAX_UNCOMPRESSED:
                          return {'state':'EXCESSIVE_UNCOMPRESSED_SIZE'}
                      documents=[]
                      for ent in entries:
                          if ent.is_dir():
                              continue
                          name=ent.filename.replace('\\','/')
                          if name.startswith('/') or '..' in name.split('/'):
                              return {'state':'UNSAFE_ARCHIVE_PATH'}
                          if ent.file_size>MAX_UNCOMPRESSED:
                              return {'state':'EXCESSIVE_SINGLE_FILE_SIZE'}
                          if name.lower().endswith(('.xml','.xbrl','.html','.htm','.txt')):
                              # Keep 1-to-1 digest for each document; never ingest code content.
                              blob=archive.read(ent)
                              documents.append({'filename':name[:200], 'size_bytes':len(blob),
                                                'sha256':hashlib.sha256(blob).hexdigest()})
                      if not documents:
                          return {'state':'ARCHIVE_HAS_NO_INSPECTABLE_DOCUMENTS'}
                      return {'state':'DOCUMENT_ZIP_HASH_CAPTURED','receipt_no':receipt,
                              'zip_sha256':hashlib.sha256(data).hexdigest(),
                              'zip_bytes':len(data),'zip_member_count':len(entries),
                              'xml_and_text_files':documents[:MAX_MEMBERS],
                              'downloaded_kst':stamp(),
                              'source_endpoint':'OPENDART_DOCUMENT_XML',
                              'full_original_document_retained':False,
                              'historical_financial_values_verified':False}
              except (zipfile.BadZipFile, RuntimeError, OSError, ValueError, NotImplementedError):
                  return {'state':'INVALID_OR_UNREADABLE_ARCHIVE'}


          def query_document(receipt, token):
              if not valid_receipt(receipt):
                  return {'state':'INVALID_RECEIPT'}
              if not token:
                  return {'state':'MISSING_DART_KEY'}
              url=ENDPOINT+'?'+parse.urlencode({'crtfc_key':token,'rcept_no':receipt})
              try:
                  req=request.Request(url, headers={'User-Agent':'KRX-v5-Original-Receipt-Evidence/1.0'})
                  with request.urlopen(req, timeout=25) as resp:
                      content_length=int(resp.headers.get('Content-Length','0') or 0)
                      if content_length>MAX_DOWNLOAD_BYTES:
                          return {'state':'ARCHIVE_TOO_LARGE'}
                      data=resp.read(MAX_DOWNLOAD_BYTES+1)
                  if len(data)>MAX_DOWNLOAD_BYTES:
                      return {'state':'ARCHIVE_TOO_LARGE'}
                  return safe_zip_bytes(data,receipt)
              except error.HTTPError as e:
                  return {'state':'HTTP_ERROR','http_status':e.code}
              except (error.URLError, TimeoutError, OSError, ValueError):
                  return {'state':'NETWORK_OR_RESPONSE_ERROR'}


          def periods_for_candidate(row, money):
              """Only compare a receipt against its OWN dated list of filings."""
              requested=[]
              current=(money or {}).get('periods') or {}
              for key, record in sorted((row.get('filing_periods') or {}).items()):
                  filings=(record or {}).get('pre_evaluation_receipts') or []
                  valid=sorted({str(x.get('rcept_no','')) for x in filings
                                if isinstance(x,dict) and valid_receipt(x.get('rcept_no'))
                                and str(x.get('rcept_dt',''))<=str(row.get('evaluation_date',''))})
                  if not valid:
                      continue
                  latest=str(record.get('latest_available_asof_evaluation') or '')
                  if latest not in valid:
                      continue
                  outcome=current.get(key) or {}
                  if outcome.get('status')!='DART_RECEIPT_MISMATCH' and not record.get('multiple_or_corrected_receipts'):
                      continue
                  original=valid[0]
                  returned=sorted({str(v) for v in outcome.get('returned_receipts',[]) if valid_receipt(v)})
                  targets={original,latest}
                  # A returned receipt is evidence of API content ONLY if also present
                  # in the original filing list for the same report period.
                  targets.update(r for r in returned if r in valid)
                  requested.append({'period':key,'original_receipt':original,
                                    'selected_asof_receipt':latest,
                                    'returned_current_api_receipts':returned,
                                    'returned_receipts_in_period':all(r in valid for r in returned),
                                    'correction_or_multiple_receipts':bool(record.get('multiple_or_corrected_receipts')),
                                    'reported_receipt_mismatch':outcome.get('status')=='DART_RECEIPT_MISMATCH',
                                    'receipt_ids_to_archive':sorted(targets),
                                    'all_pre_evaluation_receipt_ids':valid})
              return requested


          def build_tasks(filing, comparison):
              candidates=[]
              for code,row in (filing.get('rows') or {}).items():
                  money=(comparison.get('rows') or {}).get(code,{})
                  periods=periods_for_candidate(row,money)
                  if periods:
                      candidates.append({'code':code,'grade_research_only':row.get('grade_research_only'),
                                         'evaluation_date':row.get('evaluation_date'),
                                         'evaluation_date_source':row.get('evaluation_date_source'),
                                         'comparison_status':money.get('status'),
                                         'periods':periods})
              candidates.sort(key=lambda x:(x['comparison_status']!='RECEIPT_VERSION_MISMATCH',x['code']))
              queue=[]
              for candidate in candidates:
                  for period in sorted(candidate['periods'],key=lambda p:(not p['reported_receipt_mismatch'],p['period'])):
                      for receipt in period['receipt_ids_to_archive']:
                          if receipt not in queue: queue.append(receipt)
              return candidates,queue


          def summary(candidates, cache):
              out=[]
              for company in candidates:
                  p=[]
                  for item in company['periods']:
                      documents={r:(cache.get(r) or {}).get('state','PENDING_DOCUMENT_QUERY')
                                 for r in item['receipt_ids_to_archive']}
                      available=all(x=='DOCUMENT_ZIP_HASH_CAPTURED' for x in documents.values())
                      p.append({k:v for k,v in item.items() if k!='all_pre_evaluation_receipt_ids'}|
                              {'document_states':documents,'document_source_evidence_ready':available,
                               'reported_receipts_match_asof':
                                    item['selected_asof_receipt'] in item['returned_current_api_receipts'],
                               'historical_financial_values_verified':False})
                  out.append({'code':company['code'],'evaluation_date':company['evaluation_date'],
                              'evaluation_date_source':company.get('evaluation_date_source'),
                              'comparison_status':company['comparison_status'],'periods':p})
              return out


          def save(path, obj):
              path.parent.mkdir(parents=True,exist_ok=True)
              tmp=path.with_name(path.name+'.tmp')
              tmp.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              tmp.replace(path)


          def selftest():
              buf=io.BytesIO()
              with zipfile.ZipFile(buf,'w') as z:
                  z.writestr('report.xml','<DOCUMENT><FINANCE /></DOCUMENT>')
              good=safe_zip_bytes(buf.getvalue(),'20260318000001')
              assert good['state']=='DOCUMENT_ZIP_HASH_CAPTURED'
              assert good['zip_sha256']==hashlib.sha256(buf.getvalue()).hexdigest()
              assert safe_zip_bytes(b'<xml>failure</xml>','20260318000001')['state']=='NOT_ZIP_RESPONSE'
              assert safe_zip_bytes(b'<result><status>014</status><message>missing</message></result>','20260318000001')['state']=='DART_API_STATUS_014'
              assert safe_zip_bytes(b'<result><status>020</status></result>','20260318000001')['state']=='DART_API_STATUS_020'
              row={'evaluation_date':'20261120','filing_periods':{'2025_annual':{
                  'pre_evaluation_receipts':[{'rcept_no':'20260318000001','rcept_dt':'20260318'},
                                             {'rcept_no':'20260605000001','rcept_dt':'20260605'}],
                  'latest_available_asof_evaluation':'20260605000001','multiple_or_corrected_receipts':True}}}
              mismatch={'periods':{'2025_annual':{'status':'DART_RECEIPT_MISMATCH','returned_receipts':['20260318000001']}}}
              result=periods_for_candidate(row,mismatch)
              assert len(result)==1 and result[0]['original_receipt']=='20260318000001'
              assert result[0]['selected_asof_receipt']=='20260605000001'
              assert result[0]['returned_receipts_in_period'] is True
              assert result[0]['receipt_ids_to_archive']==['20260318000001','20260605000001']
              assert periods_for_candidate(row,{'periods':{'2025_annual':{'status':'CURRENT_DART_VALUES_MATCH_RECEIPT_AND_CACHE'}}})
              assert not periods_for_candidate({'evaluation_date':'20260301','filing_periods':row['filing_periods']},mismatch)
              assert build_tasks({'rows':{'000001':row}}, {'rows':{'000001':{'status':'RECEIPT_VERSION_MISMATCH',**mismatch}}})[1]==['20260318000001','20260605000001']
              return 12


          def run():
              filing=read(FILING,{})
              comparison=read(FINANCIAL,{})
              if filing.get('format')!='R14_RECEIPT_EVIDENCE_CACHE_V1' or comparison.get('format')!='R14_FINANCIAL_COMPARISON_CACHE_V1':
                  raise SystemExit('MISSING_OR_UNSAFE_FILING_COMPARISON_CACHE')
              old=read(PERSIST,{})
              if old and old.get('format')!='R14_DOCUMENT_VERSION_HASH_CACHE_V1':
                  raise SystemExit('UNKNOWN_DOCUMENT_CACHE_FORMAT')
              archive=dict(old.get('rows',{}))
              companies, queue=build_tasks(filing,comparison)
              limit=max(0,min(96,int(os.getenv('R14_DOCUMENT_BATCH_LIMIT','64'))))
              token=os.getenv('DART_API_KEY','').strip()
              checked=0
              states=collections.Counter()
              for receipt in queue:
                  if (archive.get(receipt) or {}).get('state')=='DOCUMENT_ZIP_HASH_CAPTURED':
                      states['REUSED_ARCHIVE_HASH']+=1
                      continue
                  if checked>=limit:
                      states['PENDING_BATCH_LIMIT']+=1
                      continue
                  checked+=1
                  evidence=query_document(receipt,token)
                  states[evidence['state']]+=1
                  if evidence['state']=='DOCUMENT_ZIP_HASH_CAPTURED':
                      archive[receipt]=evidence
                  # On errors, never overwrite any previous valid digest.
                  time.sleep(.22)
                  if evidence['state']=='DART_API_STATUS_020':
                      # OpenDART request-rate exhaustion: preserve prior work
                      # and stop rather than spending further failed requests.
                      states['HALTED_DART_RATE_LIMIT']+=1
                      break
              report={'result':'STAGE28_DART_ORIGINAL_AND_CORRECTION_DOCUMENT_AUDIT',
                      'generated_kst':stamp(),'market_date':read(ROOT/'r14_full_market_grade_research.json',{}).get('market_date'),
                      'mismatch_company_count':sum(x['comparison_status']=='RECEIPT_VERSION_MISMATCH' for x in companies),
                      'companies_with_original_or_correction_receipts':len(companies),
                      'document_receipts_required':len(queue),
                      'archive_hashes_available':sum((archive.get(r) or {}).get('state')=='DOCUMENT_ZIP_HASH_CAPTURED' for r in queue),
                      'document_queries_this_run':checked,'this_run_states':dict(states),
                      'cached_original_document_hashes':len(archive),
                      'companies':summary(companies,archive),
                      'document_evidence_only':True,
                      'historical_point_in_time_financials_verified':False,
                      'official_per_pbr_verified':False,
                      'investment_decisions_authorized':False,'final_buy_signals':0,
                      'limitations':['Captured ZIP hashes prove only the retrieved bytes on audit date, not past as-of availability or financial values',
                                     'Original document financial account amounts are not yet parsed and matched line-by-line',
                                     'Receipt metadata alone does not validate the historical valuation source']}
              save(PERSIST,{'format':'R14_DOCUMENT_VERSION_HASH_CACHE_V1','updated_kst':stamp(),
                            'rows':archive,'investment_decisions_authorized':False,'final_buy_signals':0})
              save(OUT,report)
              print(json.dumps({k:v for k,v in report.items() if k not in ('companies','limitations')},ensure_ascii=False))


          if __name__=='__main__':
              import sys
              if '--self-test' in sys.argv:
                  print(json.dumps({'self_test':'PASS','tests':selftest()}))
              else:
                  run()
          PYCODE
          python -m py_compile /tmp/r14_document_version_probe.py
          python /tmp/r14_document_version_probe.py --self-test
          python /tmp/r14_document_version_probe.py
      - name: Reconcile version-bound original XBRL annual facts (read-only pilot)
        if: ${{ steps.stage37_preflight.outputs.run_pipeline == 'true' }}
        id: original_xbrl_reconciliation
        shell: bash
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          R14_XBRL_BATCH_LIMIT: '0' # Freeze missing corrected-XBRL retries; cached evidence reused
        run: |
          set -euo pipefail
          cat > /tmp/r14_receipt_xbrl_reconciliation.py <<'PYCODE'
          #!/usr/bin/env python3
          """Stage28 read-only, receipt-specific XBRL evidence research.

          Important: original XBRL facts are evidence of the contents fetched today, NOT
          an independently attested as-of financial revision, and NOT an authenticated
          KRX PER/PBR. Never change research grade or authorize an order.
          """
          import collections
          import datetime as dt
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import time
          from urllib import parse, request, error
          from zoneinfo import ZoneInfo
          import zipfile
          import xml.etree.ElementTree as ET

          ROOT = Path('v5_reports/stage28')
          FILING = ROOT / 'r14_filing_receipt_cache.json'
          COMPARE = ROOT / 'r14_financial_value_reconciliation_cache.json'
          DOCUMENTS = ROOT / 'r14_filing_document_version_cache.json'
          LEGACY_FINANCIAL = Path('data/v5_financial_m/dart_financial_cache.json')
          PERSIST = ROOT / 'r14_xbrl_receipt_financial_cache.json'
          OUT = ROOT / 'r14_xbrl_correction_financial_research.json'
          ENDPOINT = 'https://opendart.fss.or.kr/api/fnlttXbrl.xml'
          MAX_ZIP_BYTES = 16_000_000
          MAX_XML_BYTES = 24_000_000
          MAX_UNCOMPRESSED = 48_000_000
          MAX_MEMBERS = 60
          XBRLI = 'http://www.xbrl.org/2003/instance'
          YEAR_KIND_CODE = {'annual': '11011', 'q1': '11013', 'half': '11012', 'q3': '11014'}
          # The direct one-to-one IFRS concepts below exclude fallback aliases that
          # could silently change the economic definition of cache fields.
          DIRECT_ACCOUNTS = {
              'profit': 'ProfitLossAttributableToOwnersOfParent',
              'equity': 'EquityAttributableToOwnersOfParent',
              'revenue': 'Revenue',
              'assets': 'Assets',
              'liabilities': 'Liabilities',
          }


          def load(path, default):
              try:
                  return json.loads(path.read_text(encoding='utf-8-sig'))
              except (OSError, ValueError):
                  return default


          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_name(path.name + '.tmp')
              tmp.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              tmp.replace(path)


          def stamp():
              return dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat()


          def receipt_ok(value):
              return bool(re.fullmatch(r'20\d{12}', str(value or '')))


          def tag_local(element):
              return element.tag.rsplit('}', 1)[-1] if isinstance(element.tag, str) else ''


          def parse_money(raw):
              s = str(raw or '').strip()
              if not re.fullmatch(r'[+-]?\d{1,25}', s):
                  return None
              return int(s)


          def asof_targets(filings, comparisons):
              """Only priority receipt mismatches with an existing frozen evaluation date.

              Query original, corrected and API-returned receipts *from the same report
              period*; do not transfer another company's receipt or later disclosures.
              """
              tasks = []
              for code, row in sorted((filings.get('rows') or {}).items()):
                  m = (comparisons.get('rows') or {}).get(code) or {}
                  if m.get('status') != 'RECEIPT_VERSION_MISMATCH':
                      continue
                  cutoff = str(row.get('evaluation_date', ''))
                  if (row.get('evaluation_date_source') != 'FROZEN_STAGE27_RESEARCH_SNAPSHOT'
                          or not re.fullmatch(r'20\d{6}', cutoff)):
                      # Never turn an audit-time date into a historical decision timestamp.
                      continue
                  for key, facts in sorted((row.get('filing_periods') or {}).items()):
                      match = re.fullmatch(r'(20\d{2})_(annual|q1|half|q3)', key)
                      if not match or match.group(2) != 'annual':
                          # Pilot is strictly annual: quarter cumulative basis differs.
                          continue
                      report_year, kind = match.groups()
                      value_check = (m.get('periods') or {}).get(key, {})
                      if value_check.get('status') != 'DART_RECEIPT_MISMATCH':
                          continue
                      before = facts.get('pre_evaluation_receipts') or []
                      receipts = {str(x.get('rcept_no', '')) for x in before
                                  if isinstance(x, dict) and receipt_ok(x.get('rcept_no'))
                                  and re.fullmatch(r'20\d{6}', str(x.get('rcept_dt', '')))
                                  and str(x.get('rcept_dt')) <= cutoff
                                  and str(x.get('rcept_no'))[:8] == str(x.get('rcept_dt'))}
                      selected = str(facts.get('latest_available_asof_evaluation') or '')
                      if selected not in receipts:
                          continue
                      returned = [str(x) for x in value_check.get('returned_receipts', [])]
                      for receipt in sorted(receipts):
                          tasks.append({'code': code, 'period': key, 'year': report_year,
                                        'report_code': YEAR_KIND_CODE[kind], 'receipt': receipt,
                                        'selected_asof_receipt': selected,
                                        'is_current_api_receipt': receipt in returned,
                                        'is_asof_selected': receipt == selected,
                                        'evaluation_date': cutoff})
              return tasks


          def safe_facts_for_one_xbrl(xmlbytes, year):
              """Select only direct IFRS taxonomy concepts with undimensioned KRW contexts.

              CFS/OFS is intentionally not inferred from names or context; amounts may be
              compared as candidates but cannot be classified as verified matches.
              """
              if len(xmlbytes) > MAX_XML_BYTES or b'<!DOCTYPE' in xmlbytes.upper() or b'<!ENTITY' in xmlbytes.upper():
                  return {'state': 'XBRL_XML_UNSAFE_OR_TOO_LARGE'}
              try:
                  root = ET.fromstring(xmlbytes)
              except ET.ParseError:
                  return {'state': 'XBRL_XML_PARSE_ERROR'}
              if root.tag != '{' + XBRLI + '}xbrl':
                  return {'state': 'NOT_XBRL_INSTANCE'}
              report_year = str(year)
              if not re.fullmatch(r'20\d{2}', report_year):
                  return {'state': 'INVALID_FINANCIAL_YEAR'}
              annual_end = report_year + '-12-31'
              annual_start = report_year + '-01-01'
              contexts = {}
              units = set()
              for x in root:
                  k = tag_local(x)
                  if k == 'unit':
                      if any(tag_local(y) == 'divide' for y in x.iter()):
                          continue
                      measures = [str(y.text or '').strip() for y in x.iter() if tag_local(y) == 'measure']
                      if len(measures) == 1 and measures[0].split(':')[-1].upper() == 'KRW':
                          uid = str(x.attrib.get('id') or '')
                          if uid: units.add(uid)
                  if k == 'context':
                      cid = str(x.attrib.get('id') or '')
                      if not cid or any(tag_local(e) in ('segment', 'scenario') for e in x.iter()):
                          continue
                      times = {tag_local(e): str(e.text or '').strip() for e in x.iter()
                               if tag_local(e) in ('instant', 'startDate', 'endDate')}
                      if times.get('instant') == annual_end:
                          contexts[cid] = 'instant'
                      elif times.get('startDate') == annual_start and times.get('endDate') == annual_end:
                          contexts[cid] = 'duration'
              if not contexts or not units:
                  return {'state': 'NO_UNDIMENSIONED_KRW_ANNUAL_CONTEXT'}
              matched = {}
              for field, account in DIRECT_ACCOUNTS.items():
                  needed_kind = 'instant' if field in ('equity', 'assets', 'liabilities') else 'duration'
                  vals = set()
                  for element in root:
                      if not isinstance(element.tag, str):
                          continue
                      namespace, sep, local = element.tag[1:].partition('}') if element.tag.startswith('{') else ('', '', '')
                      if (not sep or local != account
                              or not (namespace.endswith('/ifrs-full') or namespace.endswith('/ifrs'))):
                          continue
                      cref = element.attrib.get('contextRef', '')
                      uref = element.attrib.get('unitRef', '')
                      if contexts.get(cref) != needed_kind or uref not in units:
                          continue
                      if any(tag_local(x) == 'nil' for x in element):
                          continue
                      amount = parse_money(element.text)
                      if amount is not None:
                          vals.add(amount)
                  if len(vals) == 1:
                      matched[field] = vals.pop()
              return {'state': 'EXTRACTED_PERIOD_FACTS_RESEARCH_ONLY' if matched else 'NO_DIRECT_STANDARD_FACTS',
                      'fields': matched, 'financial_basis_confirmed': False,
                      'historical_financial_values_verified': False}


          def safe_xbrl_zip(data, year, receipt):
              if not data.startswith(b'PK'):
                  x = re.search(rb'<status>\s*([A-Za-z0-9_-]{2,12})\s*</status>', data[:8192], re.I)
                  return {'state': 'DART_API_STATUS_' + x.group(1).decode('ascii').upper() if x else 'NOT_ZIP_RESPONSE'}
              if len(data) > MAX_ZIP_BYTES:
                  return {'state': 'XBRL_ARCHIVE_TOO_LARGE'}
              try:
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      entries = z.infolist()
                      if len(entries) > MAX_MEMBERS or sum(x.file_size for x in entries) > MAX_UNCOMPRESSED:
                          return {'state': 'XBRL_ARCHIVE_UNSAFE_LIMITS'}
                      candidate_files = []
                      for x in entries:
                          name = x.filename.replace('\\', '/')
                          if name.startswith('/') or '..' in name.split('/'):
                              return {'state': 'XBRL_ARCHIVE_UNSAFE_PATH'}
                          if x.is_dir() or not name.lower().endswith(('.xml', '.xbrl')):
                              continue
                          if x.file_size > MAX_XML_BYTES:
                              continue
                          content = z.read(x)
                          found = safe_facts_for_one_xbrl(content, year)
                          if found['state'] != 'NOT_XBRL_INSTANCE':
                              candidate_files.append({'name': name[:200], 'xml_sha256': hashlib.sha256(content).hexdigest(), **found})
                      if not candidate_files:
                          return {'state': 'NO_XBRL_INSTANCES_IN_ARCHIVE'}
                      return {'state': 'XBRL_RECEIPT_ZIP_RETRIEVED', 'receipt_no': receipt,
                              'zip_sha256': hashlib.sha256(data).hexdigest(),
                              'downloaded_kst': stamp(), 'source_endpoint': 'OPENDART_FNLTT_XBRL',
                              'files': candidate_files[:MAX_MEMBERS],
                              'historical_financial_values_verified': False,
                              'official_per_pbr_verified': False}
              except (zipfile.BadZipFile, RuntimeError, OSError, ValueError, NotImplementedError):
                  return {'state': 'XBRL_INVALID_ZIP'}


          def fetch_one(receipt, reprt_code, year, token):
              if not token:
                  return {'state': 'MISSING_DART_KEY'}
              url = ENDPOINT + '?' + parse.urlencode({'crtfc_key': token, 'rcept_no': receipt,
                                                        'reprt_code': reprt_code})
              try:
                  req = request.Request(url, headers={'User-Agent': 'KRX-v5-XBRL-Audit/1.0'})
                  with request.urlopen(req, timeout=35) as response:
                      if int(response.headers.get('Content-Length', '0') or '0') > MAX_ZIP_BYTES:
                          return {'state': 'XBRL_ARCHIVE_TOO_LARGE'}
                      b = response.read(MAX_ZIP_BYTES + 1)
                  if len(b) > MAX_ZIP_BYTES:
                      return {'state': 'XBRL_ARCHIVE_TOO_LARGE'}
                  return safe_xbrl_zip(b, year, receipt)
              except error.HTTPError as ex:
                  return {'state': 'HTTP_ERROR', 'http_status': ex.code}
              except (error.URLError, TimeoutError, ValueError, OSError):
                  return {'state': 'XBRL_API_NETWORK_OR_JSON_ERROR'}


          def comparison_for_task(task, xbrl, original_financial, docs):
              original = original_financial.get(task['code'] + ':' + task['period'].replace('_', ':')) or {}
              original_accounts = original.get('accounts') if original.get('status') == '000' else {}
              if not isinstance(original_accounts, dict):
                  original_accounts = {}
              raw = {}
              for f in xbrl.get('files', []):
                  if f.get('state') != 'EXTRACTED_PERIOD_FACTS_RESEARCH_ONLY':
                      continue
                  for k, value in f.get('fields', {}).items():
                      raw.setdefault(k, set()).add(value)
              unique = {k: next(iter(values)) for k, values in raw.items() if len(values) == 1}
              ambiguous = sorted(k for k, values in raw.items() if len(values) != 1)
              shared = sorted(k for k in unique if type(original_accounts.get(k)) is int)
              matched = [k for k in shared if unique[k] == original_accounts[k]]
              different = [k for k in shared if unique[k] != original_accounts[k]]
              documentary = (docs.get('rows') or {}).get(task['receipt'], {})
              return {'code': task['code'], 'period': task['period'],
                      'receipt_no': task['receipt'], 'selected_asof_receipt': task['selected_asof_receipt'],
                      'is_asof_selected': task['is_asof_selected'], 'is_current_api_receipt': task['is_current_api_receipt'],
                      'source_date_cutoff': task['evaluation_date'],
                      'original_document_zip_hash_preserved': documentary.get('state') == 'DOCUMENT_ZIP_HASH_CAPTURED',
                      'xbrl_state': xbrl.get('state'), 'annual_account_comparable_fields': shared,
                      'potentially_matching_fields': matched, 'potentially_differing_fields': different,
                      'ambiguous_across_xbrl_files': ambiguous,
                      'financial_basis_verified': False,
                      'historical_point_in_time_financials_verified': False,
                      'verified_as_investment_evidence': False}


          def selftest():
              ns = 'http://www.xbrl.org/2003/instance'
              xml = f'''<xbrli:xbrl xmlns:xbrli="{ns}" xmlns:iso4217="http://www.xbrl.org/2003/iso4217" xmlns:ifrs="http://xbrl.ifrs.org/taxonomy/2025-03-27/ifrs-full">
          <xbrli:context id="cBS"><xbrli:entity><xbrli:identifier scheme="example">CO</xbrli:identifier></xbrli:entity><xbrli:period><xbrli:instant>2025-12-31</xbrli:instant></xbrli:period></xbrli:context>
          <xbrli:context id="cIS"><xbrli:entity><xbrli:identifier scheme="example">CO</xbrli:identifier></xbrli:entity><xbrli:period><xbrli:startDate>2025-01-01</xbrli:startDate><xbrli:endDate>2025-12-31</xbrli:endDate></xbrli:period></xbrli:context>
          <xbrli:context id="cWRONG"><xbrli:entity><xbrli:identifier scheme="example">CO</xbrli:identifier></xbrli:entity><xbrli:period><xbrli:instant>2024-12-31</xbrli:instant></xbrli:period></xbrli:context>
          <xbrli:unit id="KRW"><xbrli:measure>iso4217:KRW</xbrli:measure></xbrli:unit>
          <ifrs:Assets unitRef="KRW" contextRef="cBS">130</ifrs:Assets><ifrs:EquityAttributableToOwnersOfParent unitRef="KRW" contextRef="cBS">80</ifrs:EquityAttributableToOwnersOfParent>
          <ifrs:ProfitLossAttributableToOwnersOfParent unitRef="KRW" contextRef="cIS">20</ifrs:ProfitLossAttributableToOwnersOfParent><ifrs:Revenue unitRef="KRW" contextRef="cIS">200</ifrs:Revenue>
          <ifrs:Assets unitRef="KRW" contextRef="cWRONG">999</ifrs:Assets>
          </xbrli:xbrl>'''.encode()
              a = safe_facts_for_one_xbrl(xml, '2025')
              assert a['state'] == 'EXTRACTED_PERIOD_FACTS_RESEARCH_ONLY'
              assert a['fields'] == {'profit': 20, 'equity': 80, 'revenue': 200, 'assets': 130}
              assert a['financial_basis_confirmed'] is False
              assert safe_facts_for_one_xbrl(xml, '2024')['fields'] == {'assets': 999}
              assert safe_facts_for_one_xbrl(b'<!DOCTYPE x><xbrl/>', '2025')['state'] == 'XBRL_XML_UNSAFE_OR_TOO_LARGE'
              b = io.BytesIO()
              with zipfile.ZipFile(b, 'w') as z:
                  z.writestr('financial.xbrl', xml)
              zres = safe_xbrl_zip(b.getvalue(), '2025', '20260318000001')
              assert zres['state'] == 'XBRL_RECEIPT_ZIP_RETRIEVED'
              assert zres['files'][0]['fields']['assets'] == 130
              assert safe_xbrl_zip(b'<result><status>020</status></result>', '2025', '20260318000001')['state'] == 'DART_API_STATUS_020'
              assert receipt_ok('20260318000001') and not receipt_ok('202603180001')
              row = {'evaluation_date': '20261120', 'evaluation_date_source': 'FROZEN_STAGE27_RESEARCH_SNAPSHOT',
                     'filing_periods': {'2025_annual': {'pre_evaluation_receipts': [
                         {'rcept_no': '20260318000001', 'rcept_dt': '20260318'},
                         {'rcept_no': '20260605000001', 'rcept_dt': '20260605'}],
                         'latest_available_asof_evaluation': '20260605000001'}}}
              v = {'rows': {'000001': row}}
              m = {'rows': {'000001': {'status': 'RECEIPT_VERSION_MISMATCH', 'periods': {'2025_annual': {
                  'status': 'DART_RECEIPT_MISMATCH', 'returned_receipts': ['20260318000001']}}}}}
              assert len(asof_targets(v,m)) == 2
              assert asof_targets(v,m)[1]['is_asof_selected'] is True
              row['evaluation_date_source'] = 'AUDIT_TIME_NOT_HISTORICAL_SIGNAL'
              assert not asof_targets(v,m)
              return 12


          def run():
              filing, comparisons, docs = load(FILING, {}), load(COMPARE, {}), load(DOCUMENTS, {})
              original = load(LEGACY_FINANCIAL, {})
              if (filing.get('format') != 'R14_RECEIPT_EVIDENCE_CACHE_V1'
                      or comparisons.get('format') != 'R14_FINANCIAL_COMPARISON_CACHE_V1'
                      or not isinstance(original, dict)):
                  raise SystemExit('UNSAFE_OR_MISSING_STAGE28_RECONCILIATION_INPUTS')
              previous = load(PERSIST, {})
              if previous and previous.get('format') != 'R14_RECEIPT_XBRL_RESEARCH_CACHE_V1':
                  raise SystemExit('UNKNOWN_XBRL_RESEARCH_CACHE_FORMAT')
              result_cache = dict(previous.get('rows', {}))
              tasks = asof_targets(filing, comparisons)
              limit = max(0, min(24, int(os.getenv('R14_XBRL_BATCH_LIMIT', '12'))))
              token = os.getenv('DART_API_KEY', '').strip()
              queried = 0
              stats = collections.Counter()
              for task in tasks:
                  receipt = task['receipt']
                  if (result_cache.get(receipt) or {}).get('state') == 'XBRL_RECEIPT_ZIP_RETRIEVED':
                      stats['REUSED_XBRL_RECEIPT_CACHE'] += 1
                      continue
                  if queried >= limit:
                      stats['PENDING_XBRL_BATCH_CAP'] += 1
                      continue
                  if not token:
                      stats['MISSING_DART_KEY'] += 1
                      break
                  xbrl = fetch_one(receipt, task['report_code'], task['year'], token)
                  queried += 1
                  stats[xbrl['state']] += 1
                  if xbrl['state'] == 'XBRL_RECEIPT_ZIP_RETRIEVED':
                      result_cache[receipt] = xbrl
                  time.sleep(.3)
                  if xbrl['state'] == 'DART_API_STATUS_020':
                      stats['HALTED_DART_RATE_LIMIT'] += 1
                      break
              comparisons_by_receipt = [comparison_for_task(t, result_cache.get(t['receipt'], {}), original, docs)
                                        for t in tasks]
              selected = [t for t in comparisons_by_receipt if t['is_asof_selected']]
              summary = {'result': 'STAGE28_RECEIPT_XBRL_RESEARCH_ONLY',
                         'generated_kst': stamp(),
                         'market_date': load(ROOT / 'r14_full_market_grade_research.json', {}).get('market_date'),
                         'mismatch_company_count': len(set(t['code'] for t in tasks)),
                         'annual_receipts_expected': len(tasks),
                         'xbrl_receipts_available': sum(result_cache.get(t['receipt'], {}).get('state') == 'XBRL_RECEIPT_ZIP_RETRIEVED' for t in tasks),
                         'queries_this_run': queried, 'query_states': dict(stats),
                         'selected_asof_receipts_extracted': sum(t['xbrl_state'] == 'XBRL_RECEIPT_ZIP_RETRIEVED' for t in selected),
                         'receipt_comparison_research': comparisons_by_receipt,
                         'point_in_time_financial_values_verified': 0,
                         'official_per_verified': 0, 'official_pbr_verified': 0,
                         'financial_basis_verified': False,
                         'investment_decisions_authorized': False, 'final_buy_signals': 0,
                         'limitations': ['XBRL facts may use multiple contexts/financial bases; same account value does not identify CFS/OFS',
                                         'Document ZIP hashes and XBRL facts are fetched at audit-time, not a signed historical availability snapshot',
                                         'Historical XBRL financial reconciliation and official KRX PER/PBR authentication are not yet complete']}
              save(PERSIST, {'format': 'R14_RECEIPT_XBRL_RESEARCH_CACHE_V1', 'updated_kst': stamp(),
                             'rows': result_cache, 'investment_decisions_authorized': False, 'final_buy_signals': 0})
              save(OUT, summary)
              print(json.dumps({k:v for k,v in summary.items() if k not in ('receipt_comparison_research','limitations')}, ensure_ascii=False))


          if __name__ == '__main__':
              import sys
              if '--self-test' in sys.argv:
                  print(json.dumps({'self_test': 'PASS', 'tests': selftest()}))
              else:
                  run()
          PYCODE
          python -m py_compile /tmp/r14_receipt_xbrl_reconciliation.py
          python /tmp/r14_receipt_xbrl_reconciliation.py --self-test
