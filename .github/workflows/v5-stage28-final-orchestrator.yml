                  return False
              # The documented official channel is independent of daily market dates.
              # Cache page-route observations for seven days across adjacent trading dates.
              if set(existing.get('sources', {})) != set(LIVE_URLS):
                  return False
              t = existing.get('last_live_check_kst')
              try:
                  old = dt.datetime.fromisoformat(t)
              except (TypeError, ValueError):
                  return False
              if old.tzinfo is None or old > now:
                  return False
              return (now - old).total_seconds() < CACHE_SECONDS
          
          
