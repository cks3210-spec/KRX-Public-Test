      - name: Commit official-source checks and research ONLY (never Stage27)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage38 promotes these three market inputs together after API/date/70-session checks.
          for p in data/latest.csv data/daily_70d.csv.gz data/summary.json; do
            if [ -f "$p" ]; then git add "$p"; fi
          done
          for p in v5_reports/stage25 v5_reports/stage26 v5_reports/stage28; do
            if [ -d "$p" ]; then git add "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'v5 stage28: validate and publish KRX market with isolated research; stage27 untouched'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload Stage28 official-source integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-stage28-integration
          path: |
            v5_reports/stage28/
            v5_reports/stage25/
            v5_reports/stage26/
          if-no-files-found: warn
