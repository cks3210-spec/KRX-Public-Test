name: KRX v5 Recovery Resilience Pilot (Read Only)
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Historical market date YYYYMMDD'
        required: true
        default: '20261104'
permissions:
  contents: read
jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover, checkpoint, and inject recoverable failure
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        shell: bash
        run: |
          python - <<'PY'
          import csv,io,json,os,pathlib,subprocess,time,hashlib,datetime,re
          target=os.environ['TARGET_DATE']
          if not re.fullmatch(r'20\d{6}',target): raise ValueError('Invalid date')
          datetime.datetime.strptime(target,'%Y%m%d')
          root=pathlib.Path('v5_resilience_pilot')/target
          root.mkdir(parents=True,exist_ok=True)
          statefile=root/'checkpoint.json'
          report={'target_date':target,'production_data_modified':False,'official_source_independently_verified':False,'valuation_allowed':False,'tests':{},'attempts':[]}
          def save():
            statefile.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          def retry(op,fail_first=False):
            for attempt in range(1,4):
              try:
                if fail_first and attempt==1:raise OSError('INJECTED_TRANSIENT_FAILURE')
                result=op()
                report['attempts'].append({'attempt':attempt,'success':True})
                save()
                return result
              except Exception as e:
                report['attempts'].append({'attempt':attempt,'success':False,'reason':str(e)[:120]})
                save()
                if attempt<3:time.sleep(1)
            raise RuntimeError('Retries exhausted')
          try:
            source='data/latest.csv'
            commits=subprocess.run(['git','log','--format=%H','--',source],capture_output=True,text=True,check=True).stdout.splitlines()
            found=None
            for commit in commits:
              proc=subprocess.run(['git','show',f'{commit}:{source}'],capture_output=True)
              if proc.returncode:continue
              table=csv.DictReader(io.StringIO(proc.stdout.decode('utf-8-sig')))
              if not {'BAS_DD','ISU_CD','TDD_CLSPRC','MKTCAP'}.issubset(table.fieldnames or []):continue
              rows=[r for r in table if r.get('BAS_DD')==target]
              if rows:
                found=(commit,table.fieldnames,rows,proc.stdout)
                break
            if not found:
              report['status']='BLOCKED_SNAPSHOT_NOT_FOUND';save();raise RuntimeError('Snapshot not found')
            commit,columns,rows,raw=found
            codes=set()
            for r in rows:
              code=r['ISU_CD'].strip()
              if not code or code in codes:raise ValueError('Duplicate or missing code')
              codes.add(code)
              if float(r['TDD_CLSPRC'].replace(',',''))<=0 or float(r['MKTCAP'].replace(',',''))<=0:raise ValueError('Invalid price or cap')
            report['tests']['snapshot_internal_validation']='PASS'
            report['source_commit']=commit
            report['source_sha256']=hashlib.sha256(raw).hexdigest()
            report['row_count']=len(rows)
            save()
            def create_archive():
              buf=io.StringIO()
              w=csv.DictWriter(buf,fieldnames=columns,lineterminator='\n')
              w.writeheader();w.writerows(sorted(rows,key=lambda r:r['ISU_CD']))
              data=buf.getvalue().encode('utf-8-sig')
              (root/'market_snapshot.csv').write_bytes(data)
              return hashlib.sha256(data).hexdigest()
            digest=retry(create_archive,fail_first=True)
            report['tests']['transient_failure_retry']='PASS'
            report['snapshot_sha256']=digest
            save()
            # Simulate restart: read checkpoint from disk, verify the stored snapshot,
            # and skip completed work. No remote persistence is claimed.
            resumed=json.loads(statefile.read_text(encoding='utf-8'))
            archived=(root/'market_snapshot.csv').read_bytes()
            if resumed['snapshot_sha256']!=hashlib.sha256(archived).hexdigest():raise ValueError('Checkpoint hash mismatch')
            report['tests']['same_run_checkpoint_resume']='PASS'
            report['tests']['persistent_cross_run_resume']='NOT_IMPLEMENTED'
            report['tests']['independent_krx_provenance']='NOT_VERIFIED'
            report['status']='RESILIENCE_PILOT_PASSED_PROVENANCE_AND_PERSISTENCE_PENDING'
          except Exception as e:
            report['status']='BLOCKED';report['error']=repr(e)
          save()
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report['status']=='BLOCKED':raise SystemExit(1)
          PY
      - name: Upload results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-recovery-resilience-${{ inputs.target_date }}
          path: v5_resilience_pilot/
          retention-days: 90
          if-no-files-found: warn
