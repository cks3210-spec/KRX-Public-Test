name: KRX v5 Official API Validation Diagnostics
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v5-krx-validation-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Classify KRX validation failures without exposing licensed rows
        shell: bash
        run: |
          mkdir -p v5_reports/official_api
          cat > /tmp/diagnose_validation.py <<'PY'
          import collections, datetime as dt, json, os, pathlib, re
          from zoneinfo import ZoneInfo
          import requests

          now=dt.datetime.now(ZoneInfo('Asia/Seoul'))
          key=os.getenv('KRX_API_KEY','').strip()
          report={'checked_kst':now.isoformat(),'source':'KRX_OFFICIAL_OPEN_API',
                  'status':'NOT_RUN','production_data_modified':False,
                  'raw_market_data_published':False,'markets':{}}
          def number(value):
              try:return int(str(value).replace(',','').strip())
              except (TypeError,ValueError):return None
          def probe(market,endpoint,day):
              url='https://data-dbg.krx.co.kr/svc/apis/sto/'+endpoint
              try:
                  response=requests.get(url,params={'basDd':day},headers={'AUTH_KEY':key,'Accept':'application/json'},timeout=30)
                  state={'date':day,'http_status':response.status_code}
                  if response.status_code!=200:
                      state['status']='HTTP_ERROR';return state
                  payload=response.json()
                  if not isinstance(payload,dict) or not isinstance(payload.get('OutBlock_1'),list):
                      state['status']='SCHEMA_ERROR';state['response_keys']=list(payload)[:10] if isinstance(payload,dict) else [];return state
                  rows=payload['OutBlock_1']
                  if not rows:state['status']='EMPTY_DATE';return state
                  required={'BAS_DD','ISU_CD','TDD_CLSPRC','ACC_TRDVOL','MKTCAP'}
                  counts=collections.Counter(); samples={}; seen=set(); accepted=0
                  for row in rows:
                      reasons=[]
                      if not isinstance(row,dict):reasons=['non_object']
                      else:
                          missing=required-set(row)
                          if missing:reasons.append('missing_required_field')
                          code=str(row.get('ISU_CD','')).strip()
                          if not re.fullmatch(r'\d{6}',code):reasons.append('non_six_digit_code')
                          if code in seen:reasons.append('duplicate_code')
                          seen.add(code)
                          if str(row.get('BAS_DD','')).strip()!=day:reasons.append('date_mismatch')
                          close=number(row.get('TDD_CLSPRC'))
                          cap=number(row.get('MKTCAP'))
                          vol=number(row.get('ACC_TRDVOL'))
                          if close is None:reasons.append('close_non_numeric')
                          elif close<=0:reasons.append('close_non_positive')
                          if cap is None:reasons.append('cap_non_numeric')
                          elif cap<=0:reasons.append('cap_non_positive')
                          if vol is None:reasons.append('volume_non_numeric')
                          elif vol<0:reasons.append('volume_negative')
                      if reasons:
                          for reason in set(reasons):
                              counts[reason]+=1
                              if reason not in samples:
                                  samples[reason]={'field_names':sorted(row.keys())[:24] if isinstance(row,dict) else [],
                                                   'code_length':len(str(row.get('ISU_CD','')).strip()) if isinstance(row,dict) else None,
                                                   'close':str(row.get('TDD_CLSPRC',''))[:30] if isinstance(row,dict) else None,
                                                   'volume':str(row.get('ACC_TRDVOL',''))[:30] if isinstance(row,dict) else None,
                                                   'cap':str(row.get('MKTCAP',''))[:30] if isinstance(row,dict) else None}
                      else:accepted+=1
                  state.update(status='CLASSIFIED',total_rows=len(rows),strict_valid_rows=accepted,
                               rows_with_issues=len(rows)-accepted,issue_counts=dict(counts),
                               example_field_shapes=samples)
                  return state
              except (requests.RequestException,ValueError) as exc:
                  return {'date':day,'status':'REQUEST_OR_JSON_ERROR','error_type':type(exc).__name__}
          if not key:report['status']='MISSING_SECRET'
          else:
              days=[(now.date()-dt.timedelta(days=i)).strftime('%Y%m%d') for i in range(1,10)
                    if (now.date()-dt.timedelta(days=i)).weekday()<5]
              for market,endpoint in [('KOSPI','stk_bydd_trd'),('KOSDAQ','ksq_bydd_trd')]:
                  attempts=[]
                  for day in days:
                      state=probe(market,endpoint,day);attempts.append(state)
                      if state['status']=='CLASSIFIED':break
                      if state['status']!='EMPTY_DATE':break
                  report['markets'][market]={'attempts':attempts}
              report['status']='DIAGNOSTIC_COMPLETE' if all(any(x['status']=='CLASSIFIED' for x in v['attempts']) for v in report['markets'].values()) else 'PARTIAL_OR_FAILED'
          path=pathlib.Path('v5_reports/official_api/validation_diagnostic.json')
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/diagnose_validation.py
      - name: Commit diagnostic summary only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_reports/official_api/validation_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m 'v5: classify official KRX API validation failures'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
