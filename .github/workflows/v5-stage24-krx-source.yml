name: KRX v5 Stage24 Independent Source Collector
on:
  workflow_dispatch:
  schedule:
    - cron: '45 9 * * 1-5' # 18:45 KST, independent of existing pipelines
permissions:
  contents: write
concurrency:
  group: v5-stage24-source
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KRX source client
        run: python -m pip install --disable-pip-version-check 'pykrx>=1.0.48,<2' pandas requests
      - name: Restore Stage24 source collector
        run: |
          mkdir -p stage24
          python - <<'PYCODE'
          import base64,pathlib
          pathlib.Path('stage24/collect_krx.py').write_bytes(base64.b64decode(''))
          PYCODE
      - name: Collect verified market snapshot
        run: python stage24/collect_krx.py
      - name: Commit isolated v5 source snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_sources/krx/
          if ! git diff --cached --quiet; then
            git commit -m 'v5 stage24: save isolated KRX source snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload source collection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-stage24-source
          path: v5_sources/krx/
          if-no-files-found: warn
