name: KRX v5 Official API v4 Shadow Validation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Validate v4 baseline and official API extension in memory
        shell: bash
        run: |
          cat > /tmp/v4_shadow.py <<'PY'
          import csv,gzip,json,os,re,datetime as dt,time
          from pathlib import Path
          from collections import defaultdict,Counter
          from zoneinfo import ZoneInfo
          import requests
          root=Path('data'); out=Path('v5_reports/official_api/v4_shadow_validation.json');out.parent.mkdir(parents=True,exist_ok=True)
          report={'checked_kst':dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat(),'status':'NOT_RUN','production_data_modified':False,'raw_market_data_published':False,'comparison':{},'extension':{}}
          def num(x):
              try:return float(str(x).replace(',','').strip())
              except:return None
          def load(p,compressed=False):
              opener=gzip.open if compressed else open
              with opener(p,'rt',encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def build(rows):
              by=defaultdict(list); seen=set()
              for r in rows:
                  date=r.get('BAS_DD','').strip();market=r.get('MARKET','').strip();code=r.get('ISU_CD','').strip()
                  if not re.fullmatch(r'\d{8}',date) or market not in ('KOSPI','KOSDAQ') or not re.fullmatch(r'[A-Za-z0-9]{6}',code):raise ValueError('INVALID_HISTORY_KEY')
                  key=(date,market,code)
                  if key in seen:raise ValueError('DUPLICATE_HISTORY_KEY')
                  seen.add(key)
                  if any(num(r.get(f)) is None for f in ('TDD_CLSPRC','ACC_TRDVOL','MKTCAP')):raise ValueError('INVALID_NUMERIC_FIELD')
                  by[(market,code)].append(r)
              return by
          def calc(by,day):
              result={}
              for k,rows in by.items():
                  rows=sorted((r for r in rows if r['BAS_DD']<=day),key=lambda x:x['BAS_DD'])
                  if not rows or rows[-1]['BAS_DD']!=day or len(rows)<41:continue
                  now=rows[-1]; vol=[num(r['ACC_TRDVOL']) for r in rows];close=[num(r['TDD_CLSPRC']) for r in rows]
                  if close[-21]<=0:continue
                  recent=sum(vol[-20:])/20;earlier=sum(vol[-40:-20])/20
                  ratio=recent/earlier if earlier>0 else None
                  ret=(close[-1]/close[-21]-1)*100
                  if ratio is None:continue
                  result[k]={'ratio':ratio,'return':ret,'marketcap':num(now['MKTCAP']),'recent':recent,'earlier':earlier}
              return result
          try:
              history=load(root/'daily_70d.csv.gz',True)
              dates=sorted(set(r['BAS_DD'] for r in history))
              if len(dates)<60:raise ValueError('HISTORY_UNDER_60_SESSIONS')
              latest=dates[-1]
              by=build(history); baseline=calc(by,latest)
              saved=load(root/'v4_indicators.csv')
              fields=('VOLUME_RATIO_20V20','RETURN_20D_PCT')
              mismatches=Counter();examples=[];compared=0;not_calculable=0
              for r in saved:
                  k=(r.get('MARKET','').strip(),r.get('ISU_CD','').strip())
                  if r.get('BAS_DD','').strip()!=latest:raise ValueError('V4_SNAPSHOT_DATE_MISMATCH')
                  v=baseline.get(k)
                  if not v:not_calculable+=1;continue
                  compared+=1
                  diffs=[]
                  for field,actual in [('VOLUME_RATIO_20V20',v['ratio']),('RETURN_20D_PCT',v['return'])]:
                      recorded=num(r.get(field))
                      if recorded is None or abs(recorded-actual)>0.0001:
                          mismatches[field]+=1;diffs.append(field)
                  if diffs and len(examples)<8:examples.append({'code':k[1],'market':k[0],'fields':diffs})
              report['comparison']={'source_date':latest,'history_sessions':len(dates),'history_rows':len(history),'existing_v4_rows':len(saved),'compared_rows':compared,'not_calculable':not_calculable,'mismatch_counts':dict(mismatches),'mismatch_examples':examples,'tolerance':0.0001}
              if mismatches or not_calculable:report['status']='BASELINE_DIFFERENCES_FOUND'
              else:report['status']='BASELINE_REPRODUCED'
              key=os.environ.get('KRX_API_KEY','').strip()
              if not key:raise ValueError('MISSING_KRX_API_KEY')
              target='20261104';new=[]
              for market,endpoint in [('KOSPI','stk_bydd_trd'),('KOSDAQ','ksq_bydd_trd')]:
                  response=None
                  for attempt in range(3):
                      try:
                          response=requests.get('https://data-dbg.krx.co.kr/svc/apis/sto/'+endpoint,params={'basDd':target},headers={'AUTH_KEY':key,'Accept':'application/json'},timeout=35)
                          response.raise_for_status();break
                      except requests.RequestException:
                          if attempt==2:raise
                          time.sleep(3*(attempt+1))
                  payload=response.json();items=payload.get('OutBlock_1') if isinstance(payload,dict) else None
                  if not isinstance(items,list) or len(items)<400:raise ValueError('API_EMPTY_OR_BAD_SCHEMA_'+market)
                  for row in items:
                      r={k:str(row.get(k,'')).strip() for k in ('BAS_DD','ISU_CD','ISU_NM','TDD_CLSPRC','ACC_TRDVOL','MKTCAP')};r['MARKET']=market
                      if r['BAS_DD']!=target:raise ValueError('API_DATE_MISMATCH')
                      new.append(r)
              extended=build(history+new);result=calc(extended,target)
              cap={k:v for k,v in result.items() if v['marketcap']>=100_000_000_000}
              eligible={k:v for k,v in cap.items() if -5<=v['return']<=3}
              report['extension']={'source_date':target,'official_rows':len(new),'calculated_with_40_day_volume_history':len(result),'marketcap_1000uk':len(cap),'return_minus5_to_plus3':len(eligible),'v4_volume_threshold_applied':False,'note':'Counts only; volume threshold and other production v4 conditions not asserted. No individual ticker data published.'}
              if report['status']=='BASELINE_REPRODUCED':report['status']='V4_SHADOW_PASSED'
          except Exception as e:
              report['error_type']=type(e).__name__
              report['error_code']=str(e)[:120] if isinstance(e,ValueError) else 'REQUEST_OR_RUNTIME_ERROR'
              if report['status']=='NOT_RUN':report['status']='CHECK_FAILED'
              else:report['status']='EXTENSION_FAILED_BASELINE_'+report['status']
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY
          python /tmp/v4_shadow.py
      - name: Commit aggregate diagnostics only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_reports/official_api/v4_shadow_validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'v5: validate v4 shadow calculations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
