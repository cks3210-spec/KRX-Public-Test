name: KRX v5 Stage27 Performance Tracking
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore performance tracker
        run: |
          python - <<'PYCODE'
          import pathlib,base64
          pathlib.Path('/tmp/v5_stage27.py').write_bytes(base64.b64decode(''))
          PYCODE
      - name: Update signal ledger and forward performance
        run: python /tmp/v5_stage27.py
      - name: Commit tracking results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_reports/stage27/
          if ! git diff --cached --quiet; then
            git commit -m 'v5 stage27: update performance ledger'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v5-stage27-performance
          path: v5_reports/stage27/
