name: KRX v5 One Click DART Quality and Official Market 50
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Refresh latest public financial reports and calculate provisional valuations
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        shell: bash
        run: |
          python - <<'PYCODE'
          import os,json,csv,io,zipfile,urllib.request,urllib.parse,datetime,time,base64,gzip,pathlib,re,collections,decimal,sys
          OUT=pathlib.Path('v5_dart_result');OUT.mkdir(exist_ok=True)
          KST=datetime.timezone(datetime.timedelta(hours=9));today=datetime.datetime.now(KST).date()
          KEY=(os.getenv('DART_API_KEY') or os.getenv('OPENDART_API_KEY') or os.getenv('OPEN_DART_API_KEY') or '').strip()
          CAND=json.loads(gzip.decompress(base64.b64decode('')).decode())
          status={'run_date_kst':str(today),'candidates':len(CAND),'production_data_modified':False,'investment_grades_created':0,'valuation_verified':False,'official_market_verified':False,'dart_secret_present':bool(KEY),'warnings':[],'status':'STARTED'}
          def get(url,params=None,binary=False):
              if params:url+='?'+urllib.parse.urlencode(params)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 v5-research'}),timeout=28) as response:data=response.read()
                      return data if binary else json.loads(data.decode('utf-8'))
                  except Exception:
                      if attempt==2:raise
                      time.sleep(1.5*(attempt+1))
          def dart(endpoint,**kw):
              j=get('https://opendart.fss.or.kr/api/'+endpoint+'.json',dict(crtfc_key=KEY,**kw))
              if j.get('status') not in ('000','013'):raise RuntimeError('DART '+endpoint+' status='+str(j.get('status'))+' '+str(j.get('message')))
              return j
          def number(s):
              try:return decimal.Decimal(str(s).replace(',','').strip())
              except:return None
          def choose(items,accounts,section):
              for aid in accounts:
                  matches=[r for r in items if r.get('sj_div') in section and r.get('account_id')==aid and r.get('account_detail','-') in ('-','')]
                  if len(matches)==1:return matches[0]
              return None
          NI=['ifrs-full_ProfitLossAttributableToOwnersOfParent','ifrs_ProfitLossAttributableToOwnersOfParent','ifrs-full_ProfitLoss','ifrs_ProfitLoss']
          EQ=['ifrs-full_EquityAttributableToOwnersOfParent','ifrs_EquityAttributableToOwnersOfParent','ifrs-full_Equity','ifrs_Equity']
          def extract(j):
              items=j.get('list',[]);n=choose(items,NI,['IS','CIS']);e=choose(items,EQ,['BS'])
              return {'net':number((n or {}).get('thstrm_add_amount') or (n or {}).get('thstrm_amount')),'net_prev':number((n or {}).get('frmtrm_add_amount')),'equity':number((e or {}).get('thstrm_amount')),'equity_prev':number((e or {}).get('frmtrm_amount')),'net_account':(n or {}).get('account_id',''),'equity_account':(e or {}).get('account_id',''),'receipt':(items[0].get('rcept_no') if items else '')}
          def safe(v):return '' if v is None else str(round(v,5))
          market={};marketdate=''
          try:
              with open('data/latest.csv',encoding='utf-8-sig',newline='') as f:rs=list(csv.DictReader(f))
              marketdate=max(r['BAS_DD'] for r in rs if re.fullmatch(r'\d{8}',r.get('BAS_DD','')))
              market={r['ISU_CD'].strip().zfill(6):r for r in rs if r.get('BAS_DD')==marketdate}
              status['market_date']=marketdate;status['market_rows']=len(market)
          except Exception as exc:status['warnings'].append('MARKET_FILE_ERROR:'+str(exc)[:150])
          # Independently verify the selected market date against official KRX daily API.
          official={};official_ok=False
          krxkey=os.getenv('KRX_API_KEY','').strip()
          if marketdate and krxkey:
              try:
                  for endpoint in ('sto/stk_bydd_trd','sto/ksq_bydd_trd'):
                      url='https://data-dbg.krx.co.kr/svc/apis/'+endpoint+'?'+urllib.parse.urlencode({'basDd':marketdate})
                      req=urllib.request.Request(url,headers={'AUTH_KEY':krxkey,'User-Agent':'v5-research/1.0'})
                      with urllib.request.urlopen(req,timeout=35) as response:obj=json.load(response)
                      for item in obj.get('OutBlock_1',[]):
                          code=str(item.get('ISU_CD','')).strip().zfill(6)
                          if code in official:raise ValueError('DUPLICATE_OFFICIAL_CODE:'+code)
                          official[code]=item
                  mismatched=[]
                  for code,m in market.items():
                      o=official.get(code)
                      if not o or number(o.get('TDD_CLSPRC'))!=number(m.get('TDD_CLSPRC')) or number(o.get('MKTCAP'))!=number(m.get('MKTCAP')):mismatched.append(code)
                  extra=set(official)-set(market)
                  official_ok=bool(official) and not mismatched and not extra
                  status.update(official_rows=len(official),official_mismatch_count=len(mismatched),official_extra_count=len(extra),official_market_verified=official_ok)
                  if not official_ok:status['warnings'].append('OFFICIAL_MARKET_MISMATCH')
              except Exception as exc:status['warnings'].append('OFFICIAL_MARKET_API_ERROR:'+str(exc)[:160])
          else:status['warnings'].append('KRX_KEY_OR_MARKET_DATE_MISSING')
          corp={}
          if KEY:
              try:
                  data=get('https://opendart.fss.or.kr/api/corpCode.xml',{'crtfc_key':KEY},True)
                  import xml.etree.ElementTree as ET
                  with zipfile.ZipFile(io.BytesIO(data)) as zz:
                      root=ET.fromstring(zz.read(zz.namelist()[0]))
                  corp={e.findtext('stock_code'):e.findtext('corp_code') for e in root.findall('list') if e.findtext('stock_code')}
                  status['corp_mapping_count']=len(corp)
              except Exception as exc:status['warnings'].append('CORP_CODE_ERROR:'+str(exc)[:160])
          else:status['warnings'].append('DART_SECRET_MISSING: DART_API_KEY / OPENDART_API_KEY / OPEN_DART_API_KEY')
          rows=[]
          for i,c in enumerate(CAND):
              code=c['code'].zfill(6);r={'code':code,'name':c['name'],'market_date':marketdate,'marketcap_krw':'','corp_code':corp.get(code,''),'report_year':'','report_code':'','report_receipt':'','report_filing_date':'','fs_div':'','net_income_ttm_krw':'','equity_current_krw':'','equity_previous_krw':'','per_ttm_provisional':'','pbr_provisional':'','roe_avg_equity_provisional_pct':'','flags':''}
              flags=[];cap=None;m=market.get(code)
              if m:
                  cap=number(m.get('MKTCAP'));r['marketcap_krw']=safe(cap)
                  if cap is None or cap<=0:flags.append('INVALID_MARKETCAP')
              else:flags.append('MARKET_NOT_FOUND')
              if not r['corp_code']:flags.append('CORP_CODE_NOT_FOUND')
              if KEY and r['corp_code']:
                  try:
                      # Choose newest publicly filed periodic report, not merely newest accounting period.
                      filings=dart('list',corp_code=r['corp_code'],bgn_de=str(today.year-2)+'0101',end_de=today.strftime('%Y%m%d'),pblntf_ty='A',page_count='100',last_reprt_at='Y').get('list',[])
                      reports=[]
                      for f in filings:
                          nm=f.get('report_nm','');mm=re.search(r'(사업보고서|반기보고서|분기보고서).*?\((\d{4})\.(\d{2})\)',nm)
                          if not mm:continue
                          typ,year,month=mm.groups();rc='11011' if typ=='사업보고서' else '11012' if typ=='반기보고서' else ('11013' if month=='03' else '11014' if month=='09' else None)
                          if rc and f.get('rcept_dt','')<=today.strftime('%Y%m%d'):reports.append((int(year),int(month),rc,f))
                      reports.sort(key=lambda x:(x[0],x[1],x[3].get('rcept_dt','')),reverse=True)
                      if not reports:flags.append('NO_ELIGIBLE_PERIODIC_REPORT')
                      else:
                          year,month,rc,f=reports[0];r.update(report_year=str(year),report_code=rc,report_receipt=f.get('rcept_no',''),report_filing_date=f.get('rcept_dt',''))
                          for basis in ('CFS','OFS'):
                              current=dart('fnlttSinglAcntAll',corp_code=r['corp_code'],bsns_year=str(year),reprt_code=rc,fs_div=basis)
                              if current.get('status')!='000':continue
                              cur=extract(current)
                              if cur['equity'] is None or cur['net'] is None:continue
                              r['fs_div']=basis;r['equity_current_krw']=safe(cur['equity'])
                              # For annual: annual income; for interim: prior annual + current YTD - prior YTD.
                              if rc=='11011':
                                  net=cur['net'];prev_equity=cur['equity_prev']
                              else:
                                  prev=dart('fnlttSinglAcntAll',corp_code=r['corp_code'],bsns_year=str(year-1),reprt_code='11011',fs_div=basis)
                                  pv=extract(prev);net=(pv['net']+cur['net']-cur['net_prev']) if pv['net'] is not None and cur['net_prev'] is not None else None
                                  prev_equity=pv['equity']
                              r['equity_previous_krw']=safe(prev_equity);r['net_income_ttm_krw']=safe(net)
                              if basis=='OFS':flags.append('OFS_BASIS')
                              if 'AttributableToOwnersOfParent' not in cur['net_account'] and basis=='CFS':flags.append('NET_INCOME_NOT_PARENT_ATTRIBUTED')
                              if 'AttributableToOwnersOfParent' not in cur['equity_account'] and basis=='CFS':flags.append('EQUITY_NOT_PARENT_ATTRIBUTED')
                              if net is None:flags.append('TTM_INCOMPLETE')
                              if prev_equity is None:flags.append('PRIOR_EQUITY_MISSING')
                              if cap is not None and cap>0 and cur['equity']>0 and (basis=='OFS' or 'AttributableToOwnersOfParent' in cur['equity_account']):r['pbr_provisional']=safe(cap/cur['equity'])
                              if cap is not None and cap>0 and net is not None and net>0 and (basis=='OFS' or 'AttributableToOwnersOfParent' in cur['net_account']):r['per_ttm_provisional']=safe(cap/net)
                              elif net is not None and net<=0:flags.append('PER_NM_NONPOSITIVE_EARNINGS')
                              if net is not None and prev_equity is not None and cur['equity']+prev_equity>0 and (basis=='OFS' or ('AttributableToOwnersOfParent' in cur['net_account'] and 'AttributableToOwnersOfParent' in cur['equity_account'])):r['roe_avg_equity_provisional_pct']=safe(net/((cur['equity']+prev_equity)/2)*100)
                              break
                          if not r['fs_div']:flags.append('FINANCIAL_ACCOUNT_MISSING')
                  except Exception as exc:flags.append('DART_ERROR:'+str(exc)[:110])
              flags.append('FINANCIAL_DISCLOSURE_AND_AMENDMENT_REVIEW_REQUIRED')
              
              if not official_ok:flags.append('MARKET_OFFICIAL_INDEPENDENT_VERIFICATION_REQUIRED')
              r['flags']=';'.join(flags);rows.append(r)
              if (i+1)%10==0:print('Processed',i+1,'of',len(CAND),flush=True)
          with (OUT/'financial_50_latest_provisional.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          status.update(status='FINANCIAL_REFRESH_PROVISIONAL_COMPLETE' if any(r['fs_div'] for r in rows) else 'FINANCIAL_REFRESH_BLOCKED',financial_rows_with_statements=sum(bool(r['fs_div']) for r in rows),per_provisional_count=sum(bool(r['per_ttm_provisional']) for r in rows),pbr_provisional_count=sum(bool(r['pbr_provisional']) for r in rows),roe_provisional_count=sum(bool(r['roe_avg_equity_provisional_pct']) for r in rows),flag_counts=dict(collections.Counter(x for r in rows for x in r['flags'].split(';') if x)))
          (OUT/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8');print(json.dumps(status,ensure_ascii=False,indent=2))
          PYCODE
      - name: Upload one result archive
        uses: actions/upload-artifact@v4
        with:
          name: v5-dart-quality-official-50-result
          path: v5_dart_result/
          if-no-files-found: error
