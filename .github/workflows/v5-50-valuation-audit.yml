name: KRX v5 50 Valuation Audit Read Only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Calculate preliminary TTM PER PBR and ROE proxy
        shell: bash
        run: |
          cat > /tmp/v5_valuation_audit.py <<'PY'
          import base64,csv,io,zipfile,json,math,pathlib,datetime
          from collections import Counter
          out=pathlib.Path('v5_valuation_audit');out.mkdir(exist_ok=True)
          raw=base64.b64decode('')
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              candidates=list(csv.DictReader(io.StringIO(z.read('candidate_financial_extract.csv').decode('utf-8-sig'))))
          def num(x):
              try:
                  v=float(x)
                  return v if math.isfinite(v) else None
              except (ValueError,TypeError):return None
          market_path=pathlib.Path('data/latest.csv')
          with market_path.open(encoding='utf-8-sig',newline='') as f: market=list(csv.DictReader(f))
          px={r['ISU_CD'].zfill(6):r for r in market if r.get('ISU_CD')}
          results=[];counts=Counter()
          for c in candidates:
              code=c['ISU_CD'].zfill(6);p=px.get(code,{})
              basis=c['statement_basis'];date=c['BAS_DD'];market_date=p.get('BAS_DD','')
              annual=num(c['annual_2025_net_income_krw']);h26=num(c['net_income_2026_H1_krw']);h25=num(c['net_income_2025_H1_krw'])
              equity=num(c['equity_2026_H1_krw']);cap=num(p.get('MKTCAP'))
              ttm=annual+h26-h25 if None not in (annual,h26,h25) else None
              date_match=market_date==date
              # TTM profit and balance sheet equity are accounting-basis dependent.
              # PER and PBR are snapshot estimates, not verified investment-grade valuations.
              per=cap/ttm if date_match and cap is not None and ttm is not None and ttm>0 else None
              pbr=cap/equity if date_match and cap is not None and equity is not None and equity>0 else None
              roe_proxy=ttm/equity*100 if ttm is not None and equity is not None and equity>0 else None
              flags=[]
              if not p:flags.append('PRICE_NOT_FOUND')
              elif not date_match:flags.append('MARKET_DATE_MISMATCH')
              if ttm is None:flags.append('TTM_INCOMPLETE')
              elif ttm<=0:flags.append('NONPOSITIVE_TTM_EARNINGS')
              if equity is None or equity<=0:flags.append('NONPOSITIVE_OR_MISSING_EQUITY')
              if basis=='OFS':flags.append('OFS_BASIS')
              if c.get('revenue_metric')=='INSURANCE_REVENUE':flags.append('INSURANCE_SECTOR')
              # ROE proxy intentionally not scored; true ROE requires beginning and ending equity.
              results.append(dict(ISU_CD=code,ISU_NM=c['ISU_NM'],statement_basis=basis,financial_period='2026_H1',market_date=market_date,financial_reference_date=date,
                  marketcap_krw=cap if date_match else '',ttm_net_income_krw=ttm if ttm is not None else '',equity_2026_h1_krw=equity if equity is not None else '',
                  per_ttm_snapshot=round(per,3) if per is not None else '',pbr_snapshot=round(pbr,3) if pbr is not None else '',roe_ttm_end_equity_proxy_pct=round(roe_proxy,3) if roe_proxy is not None else '',
                  roe_verified='NO',valuation_verified='NO',investment_grade='NOT_VERIFIED',trade_signal='NONE',flags=';'.join(flags)))
              counts.update(flags)
          fields=list(results[0]);
          with (out/'valuation_audit.csv').open('w',encoding='utf-8-sig',newline='') as f:
           w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(results)
          status=dict(status='PRELIMINARY_VALUATION_ONLY',source_candidates=len(candidates),rows=len(results),per_calculated=sum(x['per_ttm_snapshot']!='' for x in results),pbr_calculated=sum(x['pbr_snapshot']!='' for x in results),roe_verified=0,investment_grades_created=0,market_dates=sorted(set(x['market_date'] for x in results)),flags=dict(counts),production_data_modified=False,
           note='Point-in-time 20261104 snapshot; TTM based on annual 2025 and 2026/2025 H1; ROE proxy uses end equity only. Amended filings and controlling-interest attribution NOT reconciled; no verified ratings or trade advice.')
          (out/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status,ensure_ascii=False,indent=2))
          PY
          python /tmp/v5_valuation_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v5-50-valuation-audit
          path: v5_valuation_audit/
