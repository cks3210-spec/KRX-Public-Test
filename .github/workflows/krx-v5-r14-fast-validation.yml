name: KRX v5 R14 Fast Validation
on:
  workflow_dispatch:
    inputs:
      publish_snapshot:
        description: Publish verified cache-only financial snapshot
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'scripts/krx_v5_r14_dart_incremental_m.py'
      - 'scripts/krx_v5_r14_financial_pipeline_n.py'
      - '.github/workflows/krx-v5-r14-fast-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and rebuild actual financial snapshot in isolation
        run: |
          set -euo pipefail
          python -m py_compile scripts/krx_v5_r14_dart_incremental_m.py scripts/krx_v5_r14_financial_pipeline_n.py
          python - <<'PY'
          import importlib.util, json, pathlib, csv, tempfile, shutil, hashlib, os, subprocess, sys
          root=pathlib.Path('.').resolve()
          spec=importlib.util.spec_from_file_location('r14_n',root/'scripts/krx_v5_r14_financial_pipeline_n.py')
          n=importlib.util.module_from_spec(spec);spec.loader.exec_module(n)
          def rec(profit,basis='CFS'):
              return {'status':'000','fs_div':basis,'accounts':{'profit':profit}}
          cache={'000020:2025:annual':rec(100),'000020:2026:q3':rec(90),'000020:2025:q3':rec(60)}
          assert n.ttm(cache,'000020',2025,2026,'q3')==(130,'VERIFIED_CUMULATIVE')
          assert n.ttm(cache,'000020',2025,2026,'half')[1]=='MISSING_QUARTER'
          cache['000020:2026:q3']=rec(90,'OFS')
          assert n.ttm(cache,'000020',2025,2026,'q3')[1]=='BASIS_MISMATCH'
          assert n.qkind('20261117')=='q3'
          assert n.qkind('20260820')=='half'
          assert n.qkind('20260520')=='q1'
          assert n.qkind('20260320') is None
          date,count=n.official_market_snapshot()
          paths=['scripts/krx_v5_r14_dart_incremental_m.py','scripts/krx_v5_r14_financial_pipeline_n.py','data/summary.json','data/latest.csv','data/v5_financial_foundation_l/unified_financial_index.csv','data/v5_financial_m/dart_financial_cache.json','data/v5_financial_m/dart_disclosure_evidence.json','data/v5_financial_m/status.json','data/v5_financial_m/annual_financial_index_m.csv']
          optional='data/v5_investment_r14_research_k/full_market_ratios_k.csv'
          if (root/optional).exists(): paths.append(optional)
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          before={p:digest(root/p) for p in paths}
          with tempfile.TemporaryDirectory() as tmp:
              work=pathlib.Path(tmp)
              for p in paths:
                  dst=work/p;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(root/p,dst)
              env=dict(os.environ,GITHUB_WORKSPACE=str(work),R14_REBUILD_ONLY='1',DART_API_KEY='',OPENDART_API_KEY='')
              subprocess.run([sys.executable,str(work/'scripts/krx_v5_r14_financial_pipeline_n.py')],env=env,cwd=work,check=True)
              out=work/'data/v5_financial_m'
              s=json.loads((out/'status.json').read_text())
              old=json.loads((root/'data/v5_financial_m/status.json').read_text())
              assert s['market_date']==s['official_market_date']==date
              assert s['official_market_source_rows']==count
              assert s['cache_records']==len(json.loads((out/'dart_financial_cache.json').read_text()))
              assert s['financial_rebuild_only'] is True
              assert not s['investment_decisions_authorized'] and s['final_buy_signals']==0
              for p in ('dart_financial_cache.json','dart_disclosure_evidence.json'):
                  assert digest(out/p)==before['data/v5_financial_m/'+p]
              with (out/'annual_financial_index_m.csv').open(encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.DictReader(f))
              assert rows and len(rows)==s['base_rows']
              assert {'code','annual_profit','ttm_profit','ttm_status'}.issubset(rows[0])
              assert len({r['code'] for r in rows})==len(rows)
              print('REBUILD_AUDIT',json.dumps({'prior_market_date':old['market_date'],'rebuilt_market_date':date,'market_rows':count,'financial_index_rows':len(rows),'cache_records':s['cache_records'],'annual_verified_rows':s['annual_verified_rows'],'persistent_status_changed':False}))
          assert before=={p:digest(root/p) for p in paths}
          print('KRX_V5_STEP_1_1_ACTUAL_READ_ONLY_PASS')
          PY
          git diff --exit-code -- data scripts

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_snapshot && github.ref == 'refs/heads/main' }}
    needs: validate
    permissions:
      contents: write
    concurrency:
      group: krx-v5-r14-dart-m
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and publish without API or cache changes
        env:
          R14_REBUILD_ONLY: '1'
          DART_API_KEY: ''
          OPENDART_API_KEY: ''
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PYCODE'
          import json, pathlib, hashlib, subprocess, sys, csv
          p=pathlib.Path('data/v5_financial_m')
          protected=[x for x in p.glob('*.json') if x.name!='status.json']
          def hashes(): return {str(x):hashlib.sha256(x.read_bytes()).hexdigest() for x in protected}
          before=hashes()
          old=json.loads((p/'status.json').read_text())
          subprocess.run([sys.executable,'scripts/krx_v5_r14_financial_pipeline_n.py'],check=True)
          s=json.loads((p/'status.json').read_text())
          market=json.loads(pathlib.Path('data/summary.json').read_text())
          assert s['market_date']==s['official_market_date']==market['latest_trading_date']
          assert s['official_market_source_rows']==market['kospi_rows_latest']+market['kosdaq_rows_latest']
          assert s['financial_rebuild_only'] is True and s['final_buy_signals']==0
          assert s['investment_decisions_authorized'] is False
          assert before==hashes() and s['cache_records']==old['cache_records']
          assert s['annual_verified_rows']>=old['annual_verified_rows']
          with (p/'annual_financial_index_m.csv').open(encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          assert len(rows)==s['base_rows']==len({r['code'] for r in rows})
          print('LIVE_REBUILD_VERIFIED',s['market_date'],s['cache_records'],len(rows))
          PYCODE
            git add data/v5_financial_m/status.json data/v5_financial_m/annual_financial_index_m.csv
            git diff --exit-code
            if git diff --cached --quiet; then echo 'LIVE_SNAPSHOT_ALREADY_CURRENT'; exit 0; fi
            git commit -m 'R14: publish cache-only synchronized financial snapshot'
            if git push origin HEAD:main; then echo 'KRX_V5_STEP_1_1_LIVE_PUBLISHED'; exit 0; fi
            sleep 2
          done
          exit 1
