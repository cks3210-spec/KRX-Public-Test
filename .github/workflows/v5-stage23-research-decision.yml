name: KRX v5 Stage23 Research Decision Integration
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v5-stage23-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore Stage22 engine and Stage23 decision module
        shell: bash
        run: |
          mkdir -p stage22 stage23
          python - <<'PYCODE'
          import base64,pathlib,re
          src=pathlib.Path('.github/workflows/v5-stage22-unified-pipeline.yml').read_text()
          for name in ('prepare_stage22.py','run_stage22.py'):
              pattern=r"pathlib\.Path\('stage22/"+name+r"'\)\.write_bytes\(base64\.b64decode\('([A-Za-z0-9+/=]+)'\)\)"
              match=re.search(pattern,src)
              if not match: raise RuntimeError('Missing Stage22 engine: '+name)
              pathlib.Path('stage22',name).write_bytes(base64.b64decode(match.group(1)))
          pathlib.Path('stage23/build_stage23.py').write_bytes(base64.b64decode(''))
          PYCODE
      - name: Run Stage22 integrated research
        run: |
          python stage22/prepare_stage22.py
          python stage22/run_stage22.py
      - name: Build Stage23 research decisions or explicit waiting status
        if: success()
        run: python stage23/build_stage23.py
      - name: Commit v5 research records only
        if: success()
        run: |
          if [ -d v5_reports ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add v5_reports/
            if ! git diff --cached --quiet; then
              git commit -m "v5 stage23: record research decision state"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Upload Stage23 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-stage23-research-decisions
          path: |
            v5_reports/stage23/
            v5_reports/pipeline_status.json
          if-no-files-found: warn
