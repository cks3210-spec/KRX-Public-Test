name: KRX v5 Stage19 Investment Research Engine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage19:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install stage19 research engine
        shell: bash
        run: |
          mkdir -p stage19
          python - <<'PYCODE'
          import base64, pathlib
          pathlib.Path('stage19/build_stage19.py').write_bytes(base64.b64decode(''))
          pathlib.Path('stage19/test_stage19.py').write_bytes(base64.b64decode(''))
          PYCODE
      - name: Run internal safety tests
        run: python stage19/test_stage19.py
      - name: Run v5 stage19 research ranking
        run: python stage19/build_stage19.py
      - name: Upload stage19 results
        uses: actions/upload-artifact@v4
        with:
          name: v5-stage19-investment-research
          path: stage19_output/
          if-no-files-found: error
          retention-days: 30
