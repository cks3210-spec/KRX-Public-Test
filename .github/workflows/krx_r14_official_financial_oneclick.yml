name: KRX R14 Official Financial One-Click Audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify scripts and financial inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/krx_official_r14_bridge.py scripts/krx_r14_official_financial_join.py
          test -s data/latest.csv
          test -s data/v5_financial_m/annual_financial_index_m.csv
          test -s data/v5_financial_m/status.json
      - name: Download latest verified official snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/krx_official /tmp/krx_bridge_output /tmp/krx_join_output
          gh run list --repo "$GH_REPO" --workflow v5-official-market-date-collector.yml --limit 30 --json databaseId,conclusion --jq '.[] | select(.conclusion=="success") | .databaseId' > /tmp/krx_run_ids
          found=0
          while read -r rid; do
            [ -n "$rid" ] || continue
            rm -f /tmp/krx_official/*
            if gh run download "$rid" --repo "$GH_REPO" --name krx-v5-official-market-snapshot --dir /tmp/krx_official 2>/dev/null && [ -s /tmp/krx_official/official_daily_market.csv ] && [ -s /tmp/krx_official/status.json ]; then
              if python -c 'import json; s=json.load(open("/tmp/krx_official/status.json")); assert s.get("state")=="VERIFIED_OFFICIAL_MARKET_SNAPSHOT"'; then
                echo "Verified official collector run: $rid"; found=1; break
              fi
            fi
          done < /tmp/krx_run_ids
          [ "$found" -eq 1 ] || { echo 'BLOCKED: no verified official snapshot'; exit 1; }
      - name: Run existing read-only official R14 bridge
        shell: bash
        run: |
          set -euo pipefail
          python scripts/krx_official_r14_bridge.py --official /tmp/krx_official/official_daily_market.csv --status /tmp/krx_official/status.json --existing data/latest.csv --out /tmp/krx_bridge_output
      - name: Join verified market and existing OpenDART financial evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/krx_r14_official_financial_join.py --bridge /tmp/krx_bridge_output/r14_market_bridge.csv --bridge-status /tmp/krx_bridge_output/status.json --financial data/v5_financial_m/annual_financial_index_m.csv --financial-status data/v5_financial_m/status.json --out /tmp/krx_join_output
      - name: Upload evidence and status (never modify production)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-r14-official-financial-oneclick-audit
          path: |
            /tmp/krx_bridge_output/status.json
            /tmp/krx_join_output/
          if-no-files-found: warn
