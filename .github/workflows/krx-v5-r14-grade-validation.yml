name: KRX v5 R14 Grade Engine Fast Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/krx_v5_r14_grade_engine.py'
      - '.github/workflows/krx-v5-r14-grade-validation.yml'
permissions:
  contents: read
jobs:
  grade-fast-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax and synthetic grade rules
        run: |
          python -m py_compile scripts/krx_v5_r14_grade_engine.py
          python scripts/krx_v5_r14_grade_engine.py | tee r14-grade-test.json
          python - <<'PY'
          import json
          r=json.load(open('r14-grade-test.json',encoding='utf-8'))
          assert r['result']=='SELF_TEST_PASS' and r['tests']>=6
          assert 'no grades issued' in r['note']
          print('GRADE_ENGINE_FAST_VALIDATION_PASS')
          PY
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r14-grade-validation-evidence
          path: r14-grade-test.json
          if-no-files-found: ignore
