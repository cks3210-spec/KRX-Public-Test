name: KRX v5 Stage 7 Sector Valuation Research
'on':
  workflow_dispatch: {}
  workflow_run:
    workflows: ['KRX v5 KIS Daily Valuation']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: krx-v5-stage7-sector-research
  cancel-in-progress: false
jobs:
  research:
    if: ${{ github.repository == 'cks3210-spec/KRX-Public-Test' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated archive reader
        run: python -m pip install --disable-pip-version-check 'cryptography>=44,<49'
      - name: Reuse Stage 6-1 and 6-2 on the same checked-out market date (no API)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          from pathlib import Path
          from textwrap import dedent
          import subprocess, sys, shutil
          for n, filename in [('1','v5-stage6-1-growth-quality.yml'),('2','v5-stage6-2-financial-health.yml')]:
              lines=(Path('.github/workflows')/filename).read_text(encoding='utf-8').splitlines()
              marker=f"cat > /tmp/krx_stage6_{n}.py <<'PYTHON'"
              starts=[i for i,line in enumerate(lines) if line.strip()==marker]
              if len(starts)!=1: raise ValueError('STAGE6_SOURCE_LAYOUT_CHANGED')
              start=starts[0]+1
              end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PYTHON')
              p=Path(f'/tmp/krx_stage6_{n}.py')
              p.write_text(dedent('\n'.join(lines[start:end]) )+'\n',encoding='utf-8')
              subprocess.run([sys.executable,str(p)],check=True)
          dest=Path('/tmp/krx-stage7-input');dest.mkdir(exist_ok=True)
          for name in ('quality_report.json','financial_health_report.json'):
              shutil.copyfile(Path('/tmp/krx-stage6-quality')/name,dest/name)
          PYTHON
      - name: Calculate comparable peer valuation only with reviewed evidence
        env:
          KIS_DATA_ARCHIVE_KEY: ${{ secrets.KIS_DATA_ARCHIVE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/krx_stage7.py <<'PYTHON'
          import csv, json, hashlib, re, sys, os, datetime as dt, unicodedata
          from pathlib import Path
          from decimal import Decimal, InvalidOperation, ROUND_HALF_UP
          from collections import Counter
          ROOT=Path.cwd().resolve()
          OUT=Path('/tmp/krx-stage7')
          D=Decimal
          MIN_PEERS=8  # reuse Stage55 minimum comparison sample, provisional
          MIN_CAP=D('100000000000')
          MAX_DISAGREE=D('1.5')  # provisional model disagreement guard

          def require(ok,msg):
              if not ok: raise ValueError(msg)
          def read(p): return json.loads(p.read_text(encoding='utf-8-sig'))
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def dec(x):
              try:
                  z=D(str(x)); return z if z.is_finite() else None
              except (InvalidOperation,ValueError): return None
          def pos(x):
              v=dec(x); return v if v is not None and v>0 else None
          def checked(p,h):
              p=(ROOT/p).resolve();require(p.is_relative_to(ROOT) and p.is_file() and sha(p)==h,'SOURCE_HASH_MISMATCH');return p
          def rows(p,key):
              with p.open(encoding='utf-8-sig',newline='') as f:
                  reader=csv.DictReader(f);out={}
                  require(reader.fieldnames and len(reader.fieldnames)==len(set(reader.fieldnames)),'INVALID_HEADER')
                  for r in reader:
                      require(None not in r and r.get(key) and r[key] not in out,'INVALID_OR_DUPLICATE_ROW');out[r[key]]=r
                  return out
          def money(x): return str(x.quantize(D('1'),rounding=ROUND_HALF_UP))
          def quantile(xs,p):
              a=sorted(xs);require(bool(a),'EMPTY_SAMPLE');i=D(len(a)-1)*p;j=int(i)
              return a[j]+(a[min(j+1,len(a)-1)]-a[j])*(i-j)
          def estimate(target, peers):
              # Same provider, accounting basis, industry, day and common-share evidence.
              # Never use the target in its own comparison group.
              if target['sector_type']!='GENERAL': return {'state':'HOLD_SPECIAL_SECTOR_MODEL_REQUIRED'}
              if len(peers)<MIN_PEERS: return {'state':'HOLD_INSUFFICIENT_COMPARABLE_PEERS','peer_count':len(peers)}
              eps,bps=pos(target['eps']),pos(target['bps'])
              if eps is None or bps is None: return {'state':'HOLD_NONPOSITIVE_EPS_OR_BPS'}
              pe=[pos(r['per']) for r in peers];pb=[pos(r['pbr']) for r in peers]
              require(all(v is not None for v in pe+pb),'INVALID_PEER_RATIO')
              p25,p50,p75=[quantile(pe,D(x))*eps for x in ('.25','.50','.75')]
              b25,b50,b75=[quantile(pb,D(x))*bps for x in ('.25','.50','.75')]
              if max(p50,b50)/min(p50,b50)>MAX_DISAGREE:
                  return {'state':'HOLD_VALUATION_MODEL_DISAGREEMENT','peer_count':len(peers)}
              # Conservative overlap; no invented growth premium or leverage discount.
              lo,hi=max(p25,b25),min(p75,b75)
              if lo>hi:return {'state':'HOLD_NONOVERLAPPING_MODEL_RANGES','peer_count':len(peers)}
              mid=max(lo,min(hi,min(p50,b50)));close=pos(target['close_krw']);require(close is not None,'INVALID_CLOSE')
              return {'state':'PEER_RANGE_RESEARCH_ONLY','peer_count':len(peers),'research_low_krw':money(lo),'research_mid_krw':money(mid),'research_high_krw':money(hi),'research_discount_to_mid_pct':str(((1-close/mid)*100).quantize(D('.01'))),'relative_price_state':'BELOW_RANGE' if close<lo else 'ABOVE_RANGE' if close>hi else 'WITHIN_RANGE'}
          def qualify(r,m,day):
              # A future reviewed input adapter must supply explicit evidence; these checks do
              # not independently attest upstream source accuracy or data redistribution rights.
              if not m or not re.fullmatch(r'[0-9A-Z]{6}',r['code']): return False
              if r['market_date']!=day or r['market']!=m['MARKET'] or r['share_class']!='COMMON' or r['security_group']!='STOCK':return False
              if r['sector_type'] not in ('GENERAL','FINANCIAL','REAL_ESTATE','OTHER') or not r['sector_id'].strip():return False
              if r['source_kind'] not in ('KRX_OFFICIAL','KIS_BROKER','OTHER_REVIEWED') or not r['accounting_basis'].strip():return False
              if not all(r[k].strip() for k in ('sector_evidence_ref','ratio_evidence_ref','class_evidence_ref')):return False
              if any(r[k]!='YES' for k in ('sector_date_reviewed','ratio_date_reviewed','class_date_reviewed','basis_reviewed')):return False
              cap=pos(m['MKTCAP']); close=pos(m['TDD_CLSPRC'])
              if cap is None or cap<MIN_CAP or close is None or close!=pos(r['close_krw']):return False
              per,pbr,eps,bps=[pos(r[k]) for k in ('per','pbr','eps','bps')]
              if any(v is None for v in (per,pbr,eps,bps)):return False
              # Allow rounding, not an independent verification of the ratio period.
              return abs(per*eps/close-1)<=D('.05') and abs(pbr*bps/close-1)<=D('.05')
          def comparable(t,p):
              return t['code']!=p['code'] and all(t[k]==p[k] for k in ('sector_id','sector_type','source_kind','accounting_basis','market_date'))
          def self_test():
              t={'code':'123456','sector_type':'GENERAL','sector_id':'X','source_kind':'KIS_BROKER','accounting_basis':'TTM','market_date':'20261126','eps':'100','bps':'1000','close_krw':'1000'}
              pp=[{**t,'code':str(i).zfill(6),'per':str(10+i%3),'pbr':str(D('1')+D(i%3)/10)} for i in range(8)]
              assert estimate(t,pp)['state']=='PEER_RANGE_RESEARCH_ONLY'
              assert estimate(t,pp[:7])['state']=='HOLD_INSUFFICIENT_COMPARABLE_PEERS'
              assert estimate({**t,'sector_type':'FINANCIAL'},pp)['state']=='HOLD_SPECIAL_SECTOR_MODEL_REQUIRED'
              assert estimate({**t,'sector_type':'REAL_ESTATE'},pp)['state']=='HOLD_SPECIAL_SECTOR_MODEL_REQUIRED'
              assert estimate({**t,'eps':'0'},pp)['state']=='HOLD_NONPOSITIVE_EPS_OR_BPS'
              assert estimate({**t,'eps':'1000'},pp)['state']=='HOLD_VALUATION_MODEL_DISAGREEMENT'
              assert estimate({**t,'close_krw':'500'},pp)['relative_price_state']=='BELOW_RANGE'
              assert estimate({**t,'close_krw':'2000'},pp)['relative_price_state']=='ABOVE_RANGE'
              assert not comparable(t,t)
              assert not comparable(t,{**pp[0],'source_kind':'KRX_OFFICIAL'})
              assert not comparable(t,{**pp[0],'accounting_basis':'ANNUAL'})
              assert not comparable(t,{**pp[0],'market_date':'20261125'})
              assert not comparable(t,{**pp[0],'sector_id':'Y'})
              assert quantile([D(1),D(3)],D('.5'))==D(2)
              r={**t,'market':'KOSDAQ','share_class':'COMMON','security_group':'STOCK','per':'10','pbr':'1','sector_evidence_ref':'fixture','ratio_evidence_ref':'fixture','class_evidence_ref':'fixture',**{k:'YES' for k in ('sector_date_reviewed','ratio_date_reviewed','class_date_reviewed','basis_reviewed')}}
              m={'MARKET':'KOSDAQ','MKTCAP':'100000000000','TDD_CLSPRC':'1000'}
              assert qualify(r,m,t['market_date'])
              assert not qualify({**r,'share_class':'PREFERRED'},m,t['market_date'])
              assert not qualify({**r,'ratio_date_reviewed':'NO'},m,t['market_date'])
              assert not qualify({**r,'close_krw':'999'},m,t['market_date'])
              assert not qualify({**r,'per':'50'},m,t['market_date'])
              assert not qualify(r,{**m,'MKTCAP':'99999999999'},t['market_date'])
              print('STAGE7_SELF_TEST_PASS 20')
          def sector_name(v):
              if not isinstance(v,str):return None
              v=unicodedata.normalize('NFC',v).strip()
              if not v or len(v)>120 or v.upper() in ('-','--','N/A','NA','NONE','NULL','0','미분류','기타미분류') or any(unicodedata.category(c).startswith('C') for c in v):return None
              return v

          def open_broker(p,key):
              from cryptography.hazmat.primitives.ciphers.aead import AESGCM
              require(isinstance(key,str) and re.fullmatch(r'[0-9a-fA-F]{64}',key) is not None,'MISSING_OR_INVALID_ARCHIVE_KEY')
              b=p.read_bytes();require(b.startswith(b'KISV2\x00') and len(b)>34,'INVALID_ENCRYPTED_ARCHIVE')
              try:return json.loads(AESGCM(bytes.fromhex(key)).decrypt(b[6:18],b[18:],str(p.relative_to(ROOT)).encode()))
              except Exception:raise ValueError('ARCHIVE_AUTHENTICATION_FAILED') from None

          def load_broker(p,day,key):
              status=read(p.with_name('status.json'))
              require(status.get('encrypted_observation_sha256')==sha(p),'BROKER_ARCHIVE_HASH_MISMATCH')
              b=open_broker(p,key)
              require(isinstance(b,dict) and b.get('observation_session')==day and b.get('source')=='KIS_OPEN_API_INQUIRE_PRICE' and b.get('archive_format')=='AES_256_GCM_V2','BROKER_SOURCE_MISMATCH')
              require(b.get('state') in ('KIS_BROKER_COLLECTION_COMPLETE','KIS_BROKER_PARTIAL_CHECKPOINT') and b.get('investment_decisions_authorized') is False and b.get('final_buy_signals')==0,'BROKER_STATE_INVALID')
              obs=b.get('observations');require(isinstance(obs,dict) and len(obs)==b.get('successful_quotes'),'BROKER_COUNT_MISMATCH')
              require(all(status.get(k)==v for k,v in b.items() if k!='observations'),'BROKER_STATUS_MISMATCH')
              require(all(re.fullmatch(r'\d{6}',k) and isinstance(v,dict) for k,v in obs.items()),'BROKER_CODE_INVALID')
              return b

          def provisional_peers(b,day,market,classes,cs):
              # Coverage only: dated broker observations, arithmetic, and archived class evidence.
              # Unknown accounting basis or unverified class/date can NEVER become a reviewed input.
              obs=b['observations']; counts=Counter(); pool={}; group=Counter()
              for code,r in obs.items():
                  s=sector_name(r.get('sector_name_kis'))
                  if s:counts['sector_rows']+=1
                  vals=[pos(r.get(k)) for k in ('per','pbr','eps','bps')]
                  if all(v is not None for v in vals):counts['positive_four_rows']+=1
                  if not s or any(v is None for v in vals):continue
                  m=market.get(code);cl=classes.get(code)
                  if not m or not cl or cl.get('market')!=m['MARKET'] or cl.get('KIND_STKCERT_TP_NM')!='보통주' or cl.get('SECUGRP_NM')!='주권':continue
                  cap=pos(m['MKTCAP']);close=pos(m['TDD_CLSPRC']);price=pos(r.get('observed_price'))
                  if cap is None or cap<MIN_CAP or close is None or close!=price:continue
                  try:
                      t=dt.datetime.fromisoformat(r['observed_at_kst']);valid=t.tzinfo is not None and t.utcoffset()==dt.timedelta(hours=9) and t.strftime('%Y%m%d')==day
                  except (ValueError,TypeError,KeyError):valid=False
                  if not valid:continue
                  per,pbr,eps,bps=vals
                  if abs(per*eps/close-1)>D('.05') or abs(pbr*bps/close-1)>D('.05'):continue
                  pool[code]=s;group[s]+=1
              ready=[k for k in cs if cs[k]['combined_state']=='GROWTH_AND_HEALTH_CRITERIA_MET_RESEARCH_ONLY']
              return {'observation_rows':len(obs),'sector_rows':counts['sector_rows'],'positive_four_rows':counts['positive_four_rows'],'provisional_comparable_rows':len(pool),'provisional_sector_groups':len(group),'quality_eligible_candidates':len(ready),'quality_candidates_with_8_provisional_peers':sum(k in pool and group[pool[k]]-1>=MIN_PEERS for k in ready),'reviewed_peer_rows_from_broker':0}

          def broker_coverage(day,market,cs):
              base=ROOT/'data/v5_kis_valuation/sessions'; paths=sorted(p for p in base.glob('*/observations.aes') if re.fullmatch(r'20\d{6}',p.parent.name))
              out={'state':'NO_SAVED_ENCRYPTED_KIS_SESSION','market_date':day,'latest_broker_session':None,'observation_rows':0,'same_date_market_join':False,'reviewed_peer_rows_from_broker':0}
              if not paths:return out
              out['latest_broker_session']=paths[-1].parent.name
              p=base/day/'observations.aes'
              if p not in paths:
                  out['state']='WAIT_FOR_SAME_DATE_KRX_AND_FINANCIAL_DATA';return out
              session=day;out['selected_broker_session']=session
              b=load_broker(p,session,os.environ.get('KIS_DATA_ARCHIVE_KEY',''));obs=b['observations']
              out.update(collection_state=b['state'],observation_rows=len(obs),sector_rows=sum(sector_name(r.get('sector_name_kis')) is not None for r in obs.values()),archive_sha256=sha(p))
              out['same_date_market_join']=True
              if b['state']!='KIS_BROKER_COLLECTION_COMPLETE':out['state']='HOLD_PARTIAL_KIS_COLLECTION';return out
              archives=sorted(p for p in (ROOT/'data/v5_official_shareclass_archive').glob('*.json') if re.fullmatch(r'20\d{6}',p.stem) and p.stem<=day)
              classes={};class_day=None
              if archives:
                  a=read(archives[-1]);class_day=archives[-1].stem
                  require(a.get('market_date')==class_day and a.get('row_count')==len(a['rows']),'CLASS_ARCHIVE_INVALID')
                  for r in a['rows']:
                      k=r['ISU_SRT_CD'];require(k not in classes,'DUPLICATE_CLASS_CODE');classes[k]=r
              out.update(provisional_peers(b,day,market,classes,cs),state='KIS_PROVISIONAL_PEER_COVERAGE_ONLY',class_archive_requested_date=class_day,ratio_effective_date_verified=False,sector_date_verified=False,share_class_verified=False,accounting_basis_verified=False)
              return out

          def link_self_test():
              from cryptography.hazmat.primitives.ciphers.aead import AESGCM
              from tempfile import TemporaryDirectory
              global ROOT
              original=ROOT; key='01'*32; day='20261126'
              try:
                  with TemporaryDirectory() as d:
                      ROOT=Path(d);p=ROOT/'data/v5_kis_valuation/sessions'/day/'observations.aes';p.parent.mkdir(parents=True)
                      obs={str(i).zfill(6):{'per':'10','pbr':'1','eps':'100','bps':'1000','observed_price':'1000','sector_name_kis':'테스트','observed_at_kst':'2026-11-26T16:50:00+09:00'} for i in range(9)}
                      b={'observation_session':day,'source':'KIS_OPEN_API_INQUIRE_PRICE','archive_format':'AES_256_GCM_V2','state':'KIS_BROKER_COLLECTION_COMPLETE','investment_decisions_authorized':False,'final_buy_signals':0,'successful_quotes':9,'observations':obs}
                      nonce=b'0'*12;p.write_bytes(b'KISV2\x00'+nonce+AESGCM(bytes.fromhex(key)).encrypt(nonce,json.dumps(b).encode(),str(p.relative_to(ROOT)).encode()))
                      p.with_name('status.json').write_text(json.dumps({**{k:v for k,v in b.items() if k!='observations'},'encrypted_observation_sha256':sha(p)}))
                      assert load_broker(p,day,key)==b
                      for bad in ('02'*32,'invalid'):
                          try:load_broker(p,day,bad)
                          except ValueError:pass
                          else:raise AssertionError('INVALID_KEY_ACCEPTED')
                      m={k:{'MARKET':'KOSDAQ','MKTCAP':'100000000000','TDD_CLSPRC':'1000'} for k in obs};cl={k:{'market':'KOSDAQ','KIND_STKCERT_TP_NM':'보통주','SECUGRP_NM':'주권'} for k in obs};cs={'000000':{'combined_state':'GROWTH_AND_HEALTH_CRITERIA_MET_RESEARCH_ONLY'}}
                      x=provisional_peers(b,day,m,cl,cs);assert x['quality_candidates_with_8_provisional_peers']==1 and x['reviewed_peer_rows_from_broker']==0
                      assert provisional_peers(b,day,m,{k:v for k,v in cl.items() if k!='000001'},cs)['quality_candidates_with_8_provisional_peers']==0
                      assert provisional_peers(b,'20261127',m,cl,cs)['provisional_comparable_rows']==0
                      assert provisional_peers(b,day,{**m,'000001':{**m['000001'],'TDD_CLSPRC':'1001'}},cl,cs)['quality_candidates_with_8_provisional_peers']==0
                      assert sector_name('미분류') is None and sector_name('A\nB') is None
                      # Exact-date selection must ignore newer archives and never fall back.
                      newer=p.parent.parent/'20261127'/'observations.aes';newer.parent.mkdir()
                      newer.write_bytes(b'not a valid archive')
                      from unittest.mock import patch
                      with patch.dict(os.environ,{'KIS_DATA_ARCHIVE_KEY':key}):
                          x=broker_coverage(day,m,cs)
                          assert x['same_date_market_join'] and x['selected_broker_session']==day and x['latest_broker_session']=='20261127'
                          for missing in ('20261125','20261130'):
                              x=broker_coverage(missing,m,cs)
                              assert not x['same_date_market_join'] and x['state']=='WAIT_FOR_SAME_DATE_KRX_AND_FINANCIAL_DATA'
                          try:broker_coverage('20261127',m,cs)
                          except (ValueError,FileNotFoundError):pass
                          else:raise AssertionError('INVALID_MATCHED_ARCHIVE_ACCEPTED')
                      print('STAGE7_EXACT_DATE_SELECTION_PASS')
                      p.write_bytes(p.read_bytes()+b'x')
                      try:load_broker(p,day,key)
                      except ValueError:pass
                      else:raise AssertionError('TAMPER_ACCEPTED')
              finally:ROOT=original
              print('STAGE7_KIS_LINK_SELF_TEST_PASS')

          def main():
              self_test()
              link_self_test()
              if '--self-test' in sys.argv:return
              gp=Path('/tmp/krx-stage7-input/financial_health_report.json');growth=Path('/tmp/krx-stage7-input/quality_report.json')
              h=read(gp);g=read(growth);require(h['state']=='STAGE6_2_COMBINED_QUALITY_RESEARCH_ONLY' and h['growth_report_sha256']==sha(growth),'UPSTREAM_ARTIFACT_INVALID')
              require(h['source_sha256']==g['source_sha256'] and h['market_date']==g['market_date'],'UPSTREAM_ARTIFACT_CONFLICT')
              require(all(x['final_buy_signals']==0 and x['investment_decisions_authorized'] is False for x in (g,h)),'UNEXPECTED_APPROVAL')
              # Exact archived evidence must match this checkout. Stale artifact is not silently reused.
              for p,digest in h['source_sha256'].items():checked(p,digest)
              day=h['market_date'];summary=read(ROOT/'data/summary.json');require(day==summary['latest_trading_date'],'STALE_STAGE6_ARTIFACT')
              market=rows(ROOT/'data/latest.csv','ISU_CD');require(len(market)==h['market_rows'] and {r['BAS_DD'] for r in market.values()}=={day},'MARKET_SCOPE_MISMATCH')
              qstatus=read(ROOT/'data/v5_financial_m/filing_refresh/candidate_regrade/latest_status.json');q=rows(checked(qstatus['queue_path'],qstatus['queue_sha256']),'code')
              cs={r['code']:r for r in h['candidates']};require(len(cs)==len(h['candidates'])==h['candidate_rows']==len(q) and set(cs)==set(q),'CANDIDATE_SCOPE_MISMATCH')
              require(all(r['market_date']==day and r['existing_research_grade']==q[k]['grade_research_only'] and r['annual_receipt']==q[k]['annual_receipt'] and r['investment_authorized'] is False and r['buy_signal'] is False for k,r in cs.items()),'QUALITY_JOIN_MISMATCH')
              coverage=broker_coverage(day,market,cs)
              broker_state=coverage['state'];broker_count=coverage['observation_rows']
              # A separate reviewed adapter is required. Do not upload restricted inputs to a public repo.
              # On this public workflow the optional adapter is intentionally absent until approved.
              # The calculator is executable offline on a lawful, reviewed bundle; no API access.
              inputs=ROOT/'data/v5_stage7_reviewed'/day/'manifest.json';eligible={};input_state='NO_REVIEWED_SECTOR_RATIO_BUNDLE';input_hash=None
              if inputs.is_file():
                  manifest=read(inputs)
                  if manifest.get('market_date')==day and manifest.get('public_derived_output_reviewed') is True and manifest.get('public_input_use_reviewed') is True and manifest.get('review_state')=='MANUALLY_REVIEWED_RESEARCH_INPUT' and manifest.get('review_reference'):
                      p=checked(manifest['csv_path'],manifest['csv_sha256']);require(p.is_relative_to(inputs.parent.resolve()),'BUNDLE_PATH_INVALID');input_hash=sha(p)
                      rr=rows(p,'code');eligible={k:r for k,r in rr.items() if qualify(r,market.get(k),day)};input_state='REVIEWED_INPUT_ASSERTIONS_ACCEPTED_RESEARCH_ONLY'
                  else:input_state='HOLD_BUNDLE_REVIEW_OR_PUBLICATION_PERMISSION_MISSING'
              results=[]
              for k,c in sorted(cs.items()):
                  out={'code':k,'name':c['name'],'existing_research_grade':c['existing_research_grade'],'combined_quality_state':c['combined_state'],'verified_fair_price':None,'final_grade':None,'buy_signal':False,'investment_authorized':False}
                  if c['combined_state']!='GROWTH_AND_HEALTH_CRITERIA_MET_RESEARCH_ONLY':out['state']='HOLD_QUALITY_REVIEW'
                  elif k not in eligible:out['state']='HOLD_SECTOR_OR_RATIO_EVIDENCE'
                  else:
                      t=eligible[k];peers=[r for r in eligible.values() if comparable(t,r)];out.update(estimate(t,peers))
                  results.append(out)
