name: KRX v5 History Checkpoint Batch
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Companies per run (default 45)'
        required: true
        default: '45'
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: write
concurrency:
  group: v5-history-batch-state
  cancel-in-progress: false
jobs:
  history-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch verified financial snapshot and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v5_state v5_history_output
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v5-state/financial_latest.json" -o v5_state/financial_latest.json
          git fetch origin v5-state
          if git cat-file -e origin/v5-state:v5_history/history_metrics.json 2>/dev/null; then
            git show origin/v5-state:v5_history/history_metrics.json > v5_history_output/history_metrics.json
          fi
      - name: Collect next batch with checkpoint
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '45' }}
        run: python v5/v5_history_batch.py --batch-size "$BATCH_SIZE"
      - name: Persist checkpoint to v5-state only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/v5-history-save
          cp v5_history_output/history_metrics.json v5_history_output/history_summary.json /tmp/v5-history-save/
          git worktree add --detach /tmp/v5-history-state origin/v5-state
          cd /tmp/v5-history-state
          mkdir -p v5_history
          cp /tmp/v5-history-save/history_metrics.json /tmp/v5-history-save/history_summary.json v5_history/
          git add v5_history/history_metrics.json v5_history/history_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update v5 history batch checkpoint'
            git push origin HEAD:v5-state
          fi
      - name: Upload batch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-history-batch
          path: v5_history_output/
          if-no-files-found: warn
          retention-days: 30
