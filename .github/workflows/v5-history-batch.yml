name: KRX v5 History Checkpoint Batch
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Companies per run (default 45)'
        required: true
        default: '45'
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: v5-history-batch-state
  cancel-in-progress: false
jobs:
  history-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch verified snapshot and existing checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v5_state v5_history_output
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v5-state/financial_latest.json" -o v5_state/financial_latest.json
          git fetch origin v5-state
          if git cat-file -e origin/v5-state:v5_history/history_metrics.json 2>/dev/null; then
            git show origin/v5-state:v5_history/history_metrics.json > v5_history_output/history_metrics.json
          fi
      - name: Recover 44 verified records from failed first run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f v5_history_output/history_metrics.json ]; then
            count=$(python -c "import json; print(len(json.load(open('v5_history_output/history_metrics.json'))))")
            if [ "$count" -ge 44 ]; then echo "Existing checkpoint has $count records; skip recovery"; exit 0; fi
          fi
          mkdir -p /tmp/v5-recovery
          gh run download 41737796329 --repo "$GITHUB_REPOSITORY" --name krx-v5-history-batch --dir /tmp/v5-recovery
          python - <<'PY'
          import json
          from pathlib import Path
          target=Path('v5_history_output/history_metrics.json')
          recovered=Path('/tmp/v5-recovery/history_metrics.json')
          if not recovered.exists(): raise SystemExit('Recovery artifact missing; abort without re-collecting')
          old=json.loads(target.read_text(encoding='utf-8')) if target.exists() else {}
          new=json.loads(recovered.read_text(encoding='utf-8'))
          if not isinstance(new,dict) or len(new)<44: raise SystemExit('Recovery record count unexpected')
          for k,v in new.items():
              if isinstance(v,dict) and v.get('status') in ('COMPLETE','PARTIAL') and k not in old: old[k]=v
          target.write_text(json.dumps(old,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Recovered checkpoint records:',len(old))
          PY
      - name: Collect next batch with checkpoint
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '45' }}
        run: python v5/v5_history_batch.py --batch-size "$BATCH_SIZE"
      - name: Persist checkpoint to v5-state with retry
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin v5-state
          git worktree add --detach /tmp/v5-history-state origin/v5-state
          for attempt in 1 2 3 4 5; do
            git fetch origin v5-state
            git -C /tmp/v5-history-state reset --hard origin/v5-state
            mkdir -p /tmp/v5-history-state/v5_history
            cp v5_history_output/history_metrics.json v5_history_output/history_summary.json /tmp/v5-history-state/v5_history/
            git -C /tmp/v5-history-state add v5_history/history_metrics.json v5_history/history_summary.json
            if git -C /tmp/v5-history-state diff --cached --quiet; then echo 'Checkpoint unchanged'; exit 0; fi
            git -C /tmp/v5-history-state -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm 'Update v5 history checkpoint'
            if git -C /tmp/v5-history-state push origin HEAD:v5-state; then echo 'Checkpoint persisted'; exit 0; fi
            echo "Push failed, attempt $attempt/5"; sleep $((attempt*15))
          done
          echo 'Checkpoint push failed; download artifact for recovery'; exit 1
      - name: Upload batch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-history-batch
          path: v5_history_output/
          if-no-files-found: warn
          retention-days: 30
