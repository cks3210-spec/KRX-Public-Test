name: KRX v5 Stage52 Full Market Financial Evaluation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
    - name: Download Stage51 full-market results
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p stage51_input

        RUN_ID=$(gh run list --workflow v5-stage51-full-market-dart-integration.yml --status success --limit 30 --json databaseId
        --jq ''.[0].databaseId'')

        test -n "$RUN_ID"

        gh run download "$RUN_ID" --name v5-stage51-full-market-dart-integration --dir stage51_input

        test -s stage51_input/all_research_financial_coverage.csv'
    - name: Score all candidates with comparable annual financials
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      run: "mkdir -p stage52_out\ncat > /tmp/stage52.py <<'PY'\nimport csv,json,os,re,time,io,zipfile,datetime,urllib.request,urllib.parse,collections,pathlib\n\
        P=pathlib.Path('stage52_out');P.mkdir(exist_ok=True)\ndef read(path):\n with open(path,encoding='utf-8-sig',newline='')\
        \ as f:return list(csv.DictReader(f))\ndef write(name,rs,fields):\n with (P/name).open('w',encoding='utf-8-sig',newline='')\
        \ as f:\n  w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore');w.writeheader();w.writerows(rs)\ndef number(s):\n\
        \ try:return float(str(s).replace(',','').strip())\n except:return None\ndef pct(n,d):return round(100*n/d,2) if n\
        \ is not None and d is not None and d>0 else None\ndef get(url):\n req=urllib.request.Request(url,headers={'User-Agent':'KRX-v5-financial-research/1.0'})\n\
        \ with urllib.request.urlopen(req,timeout=90) as r:return r.read()\ndef multi(key,codes,year):\n q=urllib.parse.urlencode({'crtfc_key':key,'corp_code':','.join(codes),'bsns_year':str(year),'reprt_code':'11011'})\n\
        \ return json.loads(get('https://opendart.fss.or.kr/api/fnlttMultiAcnt.json?'+q))\naccount={'revenue':('매출액','영업수익','수익(매출액)','이자수익'),'operating_profit':('영업이익','영업이익(손실)'),'net_income':('당기순이익','당기순이익(손실)'),'total_assets':('자산총계',),'total_liabilities':('부채총계',),'total_equity':('자본총계',)}\n\
        lookup={re.sub(r'\\s+','',name):field for field,names in account.items() for name in names}\ndef extract(items):\n\
        \ fs='CFS' if any(x.get('fs_div')=='CFS' for x in items) else 'OFS'\n out={}\n for x in items:\n  if x.get('fs_div')!=fs:continue\n\
        \  field=lookup.get(re.sub(r'\\s+','',str(x.get('account_nm',''))))\n  v=number(x.get('thstrm_amount'))\n  if field\
        \ and field not in out and v is not None:out[field]=v\n return out\nrows=read('stage51_input/all_research_financial_coverage.csv')\n\
        if len(rows)<500:raise RuntimeError('Stage51 full-universe input too small')\nstatus={'stage':'52_full_market_evaluation','input_rows':len(rows),'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'api_calls':0,'api_errors':[],'official_shareclass_verified':0,'final_grades':0,'buy_signals':0}\n\
        key=(os.getenv('DART_API_KEY') or os.getenv('OPENDART_API_KEY') or '').strip()\nmarket=max(r['BAS_DD'] for r in rows)\n\
        current_year=int(market[:4])-1\nprior_year=current_year-1\nstatus['comparison_periods']=[prior_year,current_year]\n\
        prior={}\nbycorp={r['dart_corp_code']:r for r in rows if r.get('dart_corp_code')}\nif key:\n codes=list(bycorp)\n\
        \ for start in range(0,len(codes),80):\n  batch=codes[start:start+80]\n  try:\n   result=multi(key,batch,prior_year);status['api_calls']+=1\n\
        \   if result.get('status')!='000':\n    status['api_errors'].append({'batch':start//80,'code':result.get('status'),'message':result.get('message','')});continue\n\
        \   grouped=collections.defaultdict(list)\n   for x in result.get('list',[]):grouped[str(x.get('corp_code',''))].append(x)\n\
        \   for code,items in grouped.items():prior[code]=extract(items)\n  except Exception as e:status['api_errors'].append({'batch':start//80,'error':str(e)[:220]})\n\
        \  time.sleep(.25)\nelse:status['api_errors'].append({'error':'Missing DART_API_KEY or OPENDART_API_KEY secret'})\n\
        for r in rows:\n p=prior.get(r.get('dart_corp_code',''),{})\n r['prior_year']=str(prior_year)\n for k in account:r[k+'_prior']=str(p[k])\
        \ if k in p else ''\n growth={}\n for k in ('revenue','operating_profit','net_income'):\n  v=number(r.get(k));pv=p.get(k)\n\
        \  growth[k]=pct(v-pv,pv) if v is not None and pv is not None else None\n  r[k+'_growth_pct']='' if growth[k] is None\
        \ else str(growth[k])\n rev=number(r.get('revenue'));op=number(r.get('operating_profit'));net=number(r.get('net_income'))\n\
        \ assets=number(r.get('total_assets'));debt=number(r.get('total_liabilities'));equity=number(r.get('total_equity'))\n\
        \ margin=pct(op,rev);r['operating_margin_pct']='' if margin is None else str(margin)\n roe=pct(net,equity);r['roe_proxy_pct']=''\
        \ if roe is None else str(roe)\n lev=pct(debt,equity);r['debt_to_equity_pct']='' if lev is None else str(lev)\n r['per']='';r['pbr']='';r['valuation_status']='NOT_CALCULATED_OFFICIAL_EPS_BPS_NOT_AVAILABLE'\n\
        \ # Do not score financial companies / infrastructure trusts using industrial ratios.\n name=r.get('ISU_NM','')\n\
        \ special=bool(re.search(r'스팩|우(?:B|C|\\d|\\(|$)|인프라|리츠|리얼티|맥쿼리|발해',name))\n r['security_review_flag']='NAME_PATTERN_REVIEW'\
        \ if special else 'NONE'\n metrics={'revenue_growth':growth['revenue'],'operating_margin':margin,'roe_proxy':roe,'debt_ratio':lev}\n\
        \ n=sum(v is not None for v in metrics.values());r['metrics_available']=str(n)\n points=0\n if growth['revenue'] is\
        \ not None:points+=25 if growth['revenue']>=15 else 15 if growth['revenue']>=5 else 5 if growth['revenue']>=0 else\
        \ 0\n if margin is not None:points+=25 if margin>=15 else 15 if margin>=7 else 5 if margin>0 else 0\n if roe is not\
        \ None:points+=25 if roe>=15 else 15 if roe>=8 else 5 if roe>0 else 0\n if lev is not None:points+=25 if lev<=70 else\
        \ 15 if lev<=150 else 5 if lev<=250 else 0\n r['available_metric_score']=str(points)\n r['normalized_financial_score']=str(round(points*4/n,1))\
        \ if n else ''\n r['financial_data_quality']='SUFFICIENT' if n==4 else 'PARTIAL' if n else 'MISSING'\n if special:r['provisional_grade']='REVIEW_SECURITY_TYPE'\n\
        \ elif n<3:r['provisional_grade']='INSUFFICIENT_DATA'\n else:\n  s=points*4/n\n  r['provisional_grade']='A' if s>=75\
        \ else 'B' if s>=55 else 'BELOW_B'\n r['final_grade']='WITHHELD';r['buy_signal']='NONE'\nfields=list(dict.fromkeys(k\
        \ for r in rows for k in r))\nwrite('full_market_evaluation.csv',rows,fields)\nwrite('provisional_ab_financial.csv',[r\
        \ for r in rows if r['provisional_grade'] in ('A','B')],fields)\nwrite('data_gaps_and_security_review.csv',[r for\
        \ r in rows if r['financial_data_quality']!='SUFFICIENT' or r['security_review_flag']!='NONE'],fields)\nstatus.update({'prior_year_records':len(prior),'current_financial_covered':sum(r.get('financial_status')=='AVAILABLE'\
        \ for r in rows),'growth_calculable':sum(bool(r['revenue_growth_pct']) for r in rows),'provisional_A':sum(r['provisional_grade']=='A'\
        \ for r in rows),'provisional_B':sum(r['provisional_grade']=='B' for r in rows),'security_review':sum(r['security_review_flag']!='NONE'\
        \ for r in rows),'insufficient_metrics':sum(r['financial_data_quality']!='SUFFICIENT' for r in rows),'caveats':['Financial\
        \ scores are preliminary and omit valuation, market quality, sector-specific scoring and official share-class verification.','ROE\
        \ is net income divided by end-year equity, not average-equity official ROE.','Revenue growth excludes prior-year\
        \ zero or negative base; not treated as zero growth.','No final investment grades or buy signals until security type\
        \ and valuation checks.']})\n(P/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')\n\
        print(json.dumps(status,ensure_ascii=False,indent=2))\nPY\npython /tmp/stage52.py"
    - name: Upload Stage52 consolidated results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v5-stage52-full-market-evaluation
        path: stage52_out/
        if-no-files-found: warn
