
name: Trade Validation Manual

on:
  workflow_dispatch:
  repository_dispatch:
    types: [krx_public_data_updated]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check KRX trading date
        id: trading_day
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Seoul")).date()
          with open("data/summary.json", encoding="utf-8") as f:
              summary = json.load(f)

          latest = str(summary.get("latest_trading_date", ""))
          # KRX API may publish the prior trading session on the following day.
          # Dispatch occurs after a changed public-data publication; allow a
          # recent confirmed session, but reject stale and future snapshots.
          try:
              session_date = datetime.strptime(latest, "%Y%m%d").date()
              age = (today - session_date).days
              allowed = 0 <= age <= 7
          except ValueError:
              age = None
              allowed = False

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run_validation={'true' if allowed else 'false'}\n")

          print(f"KRX latest={latest}, today={today:%Y%m%d}, age_days={age}, run={allowed}")
          PY

      - name: Build candidate records
        if: steps.trading_day.outputs.run_validation == 'true'
        run: python trade_validation/build_records.py

      - name: Build followup records
        if: steps.trading_day.outputs.run_validation == 'true'
        run: python trade_validation/build_followup.py
      - name: Build performance summary
        if: steps.trading_day.outputs.run_validation == 'true'
        run: python trade_validation/build_performance_summary.py
      - name: Build failure analysis
        if: steps.trading_day.outputs.run_validation == 'true'
        run: python trade_validation/build_failure_analysis.py
      - name: Commit updated records
        if: steps.trading_day.outputs.run_validation == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_validation/candidate_history.csv
          git add trade_validation/trade_followup.csv
          git add trade_validation/trade_performance_summary.csv  
          git add trade_validation/trade_failure_analysis.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update trade validation records"
            git push
          fi
