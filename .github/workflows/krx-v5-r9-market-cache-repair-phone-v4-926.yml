name: KRX v5 R9 Auto Financial Accumulation
'on':
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1-5' # 11:30 KST; after Stage60/R4; XKRX session verified in Python
permissions:
  contents: write
  actions: write
concurrency:
  group: krx-v5-r9-financial-persistence
  cancel-in-progress: false
jobs:
  auto_financial:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KRX exchange calendar dependencies
        run: python -m pip install 'exchange_calendars>=4.5,<5' 'pandas>=2,<3'
      - name: Validate R9 program
        run: python -m py_compile scripts/krx_v5_r9_market_cache_repair_phone_v4_926.py
      - name: Disable legacy R7 scheduled collectors to prevent duplicate DART collection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows','--paginate','--slurp'],text=True)
          pages=json.loads(raw)
          workflows=[w for p in pages for w in p.get('workflows',[])]
          names={'krx-v5-financial-annual-bridge-r7-20261117.yml',
                 'krx-v5-financial-annual-bridge-r7-mobile-v2-20261117.yml'}
          for w in workflows:
              if w.get('path','').split('/')[-1] not in names or w.get('state')!='active':
                  continue
              subprocess.check_call(['gh','api','--method','PUT',
                  f'repos/{repo}/actions/workflows/{w["id"]}/disable'])
              print('Disabled legacy R7 workflow:',w['path'])
          PY
      - name: Run incremental R9 collector
        id: collect
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_MAX_REQUESTS: '120'
          R9_RETRY_DAYS: '7'
        run: python scripts/krx_v5_r9_market_cache_repair_phone_v4_926.py
      - name: Persist R9 cache and audit to GitHub
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d data/v5_financial_r9 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/v5_financial_r9/
            if ! git diff --cached --quiet; then
              git commit -m 'v5 R9: persist incremental annual financial coverage'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Upload R9 audit and financial cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-auto-financial-r9
          path: data/v5_financial_r9/
          retention-days: 90
          if-no-files-found: warn
      - name: Verify R9 status and persistent files
        if: steps.collect.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('data/v5_financial_r9')
          s=json.loads((p/'status.json').read_text())
          assert s['state'] in ('RESEARCH_ONLY_NOT_FINAL','SKIPPED_KRX_CLOSED'),s
          if s['state']=='RESEARCH_ONLY_NOT_FINAL':
              for name in ('annual_financial_cache.json','request_attempts.json',
                           'full_market_annual_audit.csv','provisional_ab_watchlist.csv'):
                  assert (p/name).is_file(),name
              assert s['eligible_rows']>0
          print('R9 VERIFIED:',s['state'])
          PY
      - name: Fail workflow if R9 collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
