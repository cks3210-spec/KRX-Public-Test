name: KRX v5 Stage20 Valuation Cross Performance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage20:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare integrated stage20 engine
        shell: bash
        run: |
          mkdir -p stage20
          python - <<'PYCODE'
          import base64,pathlib
          root=pathlib.Path('stage20')
          root.joinpath('stage19_engine.py').write_bytes(base64.b64decode(''))
          root.joinpath('build_stage20.py').write_bytes(base64.b64decode(''))
          root.joinpath('test_stage20.py').write_bytes(base64.b64decode(''))
          PYCODE
      - name: Run internal functional tests
        run: python stage20/test_stage20.py
      - name: Build valuation, true cross and forward performance outputs
        run: python stage20/build_stage20.py --output stage20_output
      - name: Upload integrated research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-stage20-investment-performance
          path: stage20_output/
          if-no-files-found: warn
