name: KRX v5 Primary and Naver Fallback Collector
on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * 1-5' # 19:15 KST
permissions:
  contents: write
concurrency:
  group: v5-krx-naver-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collectors
        run: pip install --disable-pip-version-check pykrx pandas requests beautifulsoup4 lxml
      - name: Run KRX-first collection and independently label fallback
        shell: bash
        run: |
          mkdir -p v5_sources/krx
          cat > /tmp/collect.py <<'PY'
          import csv, datetime as dt, json, pathlib, re, time, traceback
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup
          OUT=pathlib.Path('v5_sources/krx'); OUT.mkdir(parents=True,exist_ok=True)
          now=dt.datetime.now(ZoneInfo('Asia/Seoul'))
          today=now.strftime('%Y%m%d')
          attempts=[]
          def n(s):
              try:return int(float(str(s).replace(',','').replace(' ','').strip()))
              except (ValueError,TypeError):return 0
          def valid(rows):
              codes=[r['ISU_CD'] for r in rows]
              return len(rows)>=1500 and len(codes)==len(set(codes)) and all(len(c)==6 and r['TDD_CLSPRC']>0 and r['MKTCAP']>0 and r['MARKET'] in ('KOSPI','KOSDAQ') for r in rows)
          def krx(day):
              from pykrx import stock
              out=[]
              for market in ('KOSPI','KOSDAQ'):
                  df=stock.get_market_ohlcv_by_ticker(day,market=market)
                  cap=stock.get_market_cap_by_ticker(day,market=market)
                  if df is None or df.empty or cap is None or cap.empty:raise RuntimeError('KRX returned empty '+market)
                  if not {'종가','거래량'}.issubset(df.columns):raise RuntimeError('KRX missing expected columns '+repr(list(df.columns)))
                  for ticker,r in df.iterrows():
                      ticker=str(ticker).zfill(6)
                      if ticker not in cap.index:continue
                      close=n(r['종가']); volume=n(r['거래량']); mcap=n(cap.loc[ticker,'시가총액'])
                      if close<=0 or mcap<=0:continue
                      out.append(dict(BAS_DD=day,ISU_CD=ticker,ISU_NM=stock.get_market_ticker_name(ticker),TDD_CLSPRC=close,ACC_TRDVOL=volume,MKTCAP=mcap,MARKET=market))
              return out
          def naver():
              # Naver's market-cap pages are NOT a dated official OHLCV feed.
              # Collect as a provisional cross-check only; never label as fresh official KRX data.
              session=requests.Session();session.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9'})
              out=[]; issues=[]
              for market,idx in (('KOSPI',0),('KOSDAQ',1)):
                  for page in range(1,46):
                      url=f'https://finance.naver.com/sise/sise_market_sum.naver?sosok={idx}&page={page}'
                      res=session.get(url,timeout=15);res.raise_for_status()
                      soup=BeautifulSoup(res.text,'lxml')
                      table=soup.select_one('table.type_2')
                      if table is None:raise RuntimeError('Naver market table missing')
                      headers=[x.get_text(' ',strip=True) for x in table.select('tr') if x.find('th')]
                      parsed=0
                      for tr in table.select('tr'):
                          a=tr.select_one('a[href*="code="]')
                          if not a:continue
                          m=re.search(r'(?:\?|&)code=(\d{6})',a.get('href',''))
                          if not m:continue
                          cells=[x.get_text(' ',strip=True) for x in tr.find_all('td',recursive=False)]
                          # Naver market-sum table columns: rank,name,price,change,change%,par,market cap(100M KRW),shares,foreign%,volume,PER,ROE
                          if len(cells)<10:continue
                          close=n(cells[2]); mcap=n(cells[6])*100_000_000; volume=n(cells[9])
                          if close<=0 or mcap<=0:continue
                          out.append(dict(BAS_DD='',ISU_CD=m.group(1),ISU_NM=a.get_text(' ',strip=True),TDD_CLSPRC=close,ACC_TRDVOL=volume,MKTCAP=mcap,MARKET=market))
                          parsed+=1
                      if parsed==0:break
                      time.sleep(.08)
              return out
          chosen=None; source=None; date=None
          for delta in range(0,8):
              day=(now.date()-dt.timedelta(days=delta))
              if day.weekday()>4:continue
              ds=day.strftime('%Y%m%d')
              try:
                  rows=krx(ds)
                  if valid(rows):chosen=rows;source='KRX_PYKRX';date=ds;break
                  attempts.append({'source':'KRX_PYKRX','date':ds,'reason':f'invalid count {len(rows)}'})
              except Exception as exc:attempts.append({'source':'KRX_PYKRX','date':ds,'error':str(exc)[:250]})
          if chosen is None:
              try:
                  rows=naver()
                  if valid(rows):chosen=rows;source='NAVER_PROVISIONAL';date=None
                  else:attempts.append({'source':'NAVER','reason':f'invalid count or columns: {len(rows)}'})
              except Exception as exc:attempts.append({'source':'NAVER','error':str(exc)[:350]})
          status={'checked_kst':now.isoformat(),'status':'SOURCE_UNAVAILABLE','source':source,'source_date':date,'row_count':len(chosen or []),'fresh_for_today':bool(source=='KRX_PYKRX' and date==today),'production_data_modified':False,'attempts':attempts}
          if chosen:
              status['status']='COLLECTED_VERIFIED_KRX' if source=='KRX_PYKRX' else 'NAVER_PROVISIONAL_UNDATED'
              name=f'krx_{date}.csv' if source=='KRX_PYKRX' else 'naver_provisional_undated.csv'
              with (OUT/name).open('w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=['BAS_DD','ISU_CD','ISU_NM','TDD_CLSPRC','ACC_TRDVOL','MKTCAP','MARKET']);w.writeheader();w.writerows(chosen)
              status['snapshot']=str(OUT/name)
          (OUT/'fallback_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status,ensure_ascii=False))
          PY
          python /tmp/collect.py
      - name: Commit isolated sources and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_sources/krx/
          if ! git diff --cached --quiet; then
            git commit -m 'v5: KRX primary and labeled Naver fallback'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-krx-naver-fallback
          path: v5_sources/krx/
