name: KRX v5 R13 Integrated Investment Research
'on':
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1-5' # 15:20 KST weekdays; script does not claim current prices
permissions:
  contents: write
concurrency:
  group: krx-v5-r13-integrated-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax validation
        run: python -m py_compile scripts/krx_v5_r13_integrated_investment_engine_mobile_1117_2041.py
      - name: Run R13 integrated research
        run: python scripts/krx_v5_r13_integrated_investment_engine_mobile_1117_2041.py
      - name: Persist R13 outputs only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v5_investment_r13/
          if ! git diff --cached --quiet; then
            git commit -m 'v5 R13: integrated research-only indicators and tracking'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload R13 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-r13-integrated-research
          path: data/v5_investment_r13/
          retention-days: 90
