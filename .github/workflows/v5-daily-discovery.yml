name: V5 Daily Discovery

on:
  workflow_dispatch:
  schedule:
    # 19:30 KST, weekdays. No report is produced if data is stale.
    - cron: '30 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: v5-daily-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check trading date and input freshness
        id: freshness
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, datetime, os
          from zoneinfo import ZoneInfo
          s=json.loads(pathlib.Path('data/summary.json').read_text(encoding='utf-8'))
          d=datetime.datetime.strptime(str(s['latest_trading_date']), '%Y%m%d').date()
          now=datetime.datetime.now(ZoneInfo('Asia/Seoul'))
          # Manual reruns may inspect the latest archived session; scheduled runs must use today's session.
          manual=os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
          run=manual or (now.weekday()<5 and d==now.date())
          print(f'market_date={d}; today_kst={now.date()}; manual={manual}; run={run}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'run={str(run).lower()}\n')
          if not run: print('Skipping: market closed or latest data not updated yet')
          PY
      - name: Build discovery watchlist
        if: steps.freshness.outputs.run == 'true'
        run: python scripts/build_daily_discovery.py
      - name: Upload discovery result
        if: steps.freshness.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-discovery-${{ github.run_number }}
          path: data/daily_discovery.json
          if-no-files-found: error
      - name: Persist discovery for next-day comparison
        if: steps.freshness.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily_discovery.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "data: update daily discovery watchlist"
            git push origin HEAD:main
          fi
