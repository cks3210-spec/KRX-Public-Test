name: V5 Daily Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5' # 19:30 KST on weekdays

permissions:
  contents: write

concurrency:
  group: v5-daily-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check data freshness
        id: freshness
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, datetime, os
          from zoneinfo import ZoneInfo
          summary=json.loads(pathlib.Path('data/summary.json').read_text(encoding='utf-8'))
          date=datetime.datetime.strptime(str(summary['latest_trading_date']), '%Y%m%d').date()
          now=datetime.datetime.now(ZoneInfo('Asia/Seoul'))
          manual=os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch'
          run=manual or (now.weekday()<5 and date==now.date())
          print(f'data_date={date}, local_date={now.date()}, manual={manual}, run={run}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'run={str(run).lower()}\n')
          PY
      - name: Build daily discovery v2
        if: steps.freshness.outputs.run == 'true'
        run: python scripts/build_daily_discovery_v2.py
      - name: Upload discovery artifact
        if: steps.freshness.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-discovery-v2-${{ github.run_number }}
          path: |
            data/daily_discovery.json
            data/daily_discovery_archive/*.json
          if-no-files-found: error
      - name: Commit daily snapshot history
        if: steps.freshness.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily_discovery.json data/daily_discovery_archive/
          if ! git diff --cached --quiet; then
            git commit -m "data: persist daily discovery v2 snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
