name: KRX v5 R14 Ratio Provenance Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and self-tests
        run: |
          python -m py_compile scripts/krx_v5_r14_ratio_audit.py
          python scripts/krx_v5_r14_ratio_audit.py
      - name: Audit real cached financial data and existing K market data
        run: |
          set -euo pipefail
          FIN=data/v5_financial_m/annual_financial_index_m.csv
          MARKET=data/v5_investment_r14_research_k/full_market_ratios_k.csv
          test -s "$FIN"
          if test -s "$MARKET"; then
            python scripts/krx_v5_r14_ratio_audit.py --financial "$FIN" --market "$MARKET" --output r14-ratio-audit.json
          else
            python scripts/krx_v5_r14_ratio_audit.py --financial "$FIN" --output r14-ratio-audit.json
          fi
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r14-ratio-audit-evidence
          path: r14-ratio-audit.json
          retention-days: 30
