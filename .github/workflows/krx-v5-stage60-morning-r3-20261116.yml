name: V5 Stage60 Morning Collection R3
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 0-4' # 08:30 KST Monday-Friday, previous UTC day
permissions:
  contents: write
concurrency:
  group: v5-stage60-0830-integrated-r3
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KRX trading calendar
        run: pip install 'exchange_calendars>=4.5,<5' pandas
      - name: Collect previous KRX session and run existing Stage56-59 chain
        id: collect
        continue-on-error: true
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          RUN_EXISTING_STAGE_CHAIN: '1'
        run: python scripts/krx_v5_stage60_morning_r3_20261116.py
      - name: Persist verified market data even if downstream analysis is incomplete
        if: always()
        run: |
          python - <<'PY'
          import json,os
          p='stage60_0830_output/status.json'
          state=json.load(open(p)) if os.path.exists(p) else {}
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('MARKET_VERIFIED='+('true' if state.get('market_verified') else 'false')+'\n')
          PY
      - name: Commit verified snapshot and date-keyed archive
        if: env.MARKET_VERIFIED == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.csv data/v5_official_market_archive/ stage59_input/daily_prices.csv
          if ! git diff --cached --quiet; then
            git commit -m 'v5: persist verified prior-session KRX snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-stage60-0830-evidence-r3
          path: |
            stage60_0830_output/
            stage60_output/
            stage56_output/
            stage56_financial_basis_output/
            stage57_output/
            stage58_output/
            stage59_output/
          retention-days: 90
          if-no-files-found: warn
      - name: Fail only when official collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
