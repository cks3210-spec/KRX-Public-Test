name: KRX v5 DART Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dart-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test OpenDART on 10 stocks
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python v5/dart_probe.py
      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-dart-probe
          path: v5_output/
          if-no-files-found: warn
