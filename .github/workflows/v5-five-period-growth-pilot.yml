name: KRX v5 Five-Period Growth Pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  growth-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Collect and diagnose five periods read-only
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import base64,pathlib,subprocess,sys
          pathlib.Path('v5_dart_source_adapter.py').write_bytes(base64.b64decode(''))
          pathlib.Path('v5_financial_extension.py').write_bytes(base64.b64decode(''))
          pathlib.Path('v5_growth_extension.py').write_bytes(base64.b64decode(''))
          pathlib.Path('run_stage9.py').write_bytes(base64.b64decode(''))
          sys.exit(subprocess.call([sys.executable,'run_stage9.py']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-five-period-growth-pilot
          path: v5_stage9_output/
          if-no-files-found: warn
