name: KRX v5 Recover Stage56 Nov06 Archived Prices
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: v5-integrated-ledger-write
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Restore and verify archived prices
      run: "mkdir -p v5_recovery_out\ncat > /tmp/v5_recover.py <<'PY'\nimport base64,zlib,csv,io,json,pathlib,collections,datetime,sys\nROOT=pathlib.Path('data/v5_integrated');ROOT.mkdir(parents=True,exist_ok=True)\nOUT=pathlib.Path('v5_recovery_out');OUT.mkdir(exist_ok=True)\nTARGET=ROOT/'daily_prices.csv'\nstatus={'operation':'RESTORE_VERIFIED_STAGE56_20261106','source':'Stage56 uploaded ZIP verified 2026-11-07','target':'data/v5_integrated/daily_prices.csv','git_commit':'PENDING'}\ndef read(s):return list(csv.DictReader(io.StringIO(s)))\ndef valid(rows,date):\n subset=[r for r in rows if r['date']==date]\n counts=collections.Counter(r['market'] for r in subset)\n if counts!={'KOSPI':938,'KOSDAQ':1831}:raise ValueError('unexpected market counts '+str(counts))\n keys=[(r['date'],r['market'],r['code']) for r in subset]\n if len(set(keys))!=2769:raise ValueError('duplicate key in '+date)\n for r in subset:\n  if not r['code'] or float(r['close'])<=0:raise ValueError('invalid close/code')\n return counts\ntry:\n encoded=''\n restore=read(zlib.decompress(base64.b64decode(encoded)).decode('utf-8'))\n valid(restore,'20261106')\n if not TARGET.exists():raise RuntimeError('Existing archive missing; refusing to create replacement')\n old=read(TARGET.read_text(encoding='utf-8-sig'))\n if not old:raise RuntimeError('Existing archive empty')\n keys={}; conflicts=[]\n for r in old:\n  k=(r['date'],r['market'],r['code'])\n  if k in keys and abs(float(keys[k]['close'])-float(r['close']))>0.00001:raise RuntimeError('existing archive conflicting duplicate '+str(k))\n  keys[k]=r\n existing_days=collections.Counter(r['date'] for r in old)\n status['existing_dates']=dict(sorted(existing_days.items()))\n added=0\n for r in restore:\n  k=(r['date'],r['market'],r['code'])\n  if k in keys:\n   if abs(float(keys[k]['close'])-float(r['close']))>0.00001:conflicts.append(k)\n  else:keys[k]=r;added+=1\n if conflicts:raise RuntimeError('conflicting stored prices: '+str(conflicts[:5]))\n merged=sorted(keys.values(),key=lambda r:(r['date'],r['market'],r['code']))\n valid(merged,'20261106')\n # Preserve all existing dates, including any later dates.\n if len(merged)<len(keys):raise RuntimeError('row loss')\n output=io.StringIO();w=csv.DictWriter(output,fieldnames=['date','market','code','close'],lineterminator='\\n');w.writeheader()\n for r in merged:w.writerow({k:r[k] for k in w.fieldnames})\n TARGET.write_text(output.getvalue(),encoding='utf-8')\n status.update(result='RECOVERED' if added else 'ALREADY_PRESENT',rows_added=added,merged_total=len(merged),restored_date='20261106',restored_rows=2769,all_dates=dict(sorted(collections.Counter(r['date'] for r in merged).items())))\nexcept Exception as e:\n status.update(result='FAILED',error=str(e));raise\nfinally:\n (OUT/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')\n\nPY\npython /tmp/v5_recover.py\n"
    - name: Commit recovered prices safely
      run: "set -euo pipefail\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add data/v5_integrated/daily_prices.csv\nif git diff --cached --quiet; then echo \"Already saved; no commit needed\"; exit 0; fi\nfor attempt in 1 2 3; do\n  git commit -m \"v5: restore verified 20261106 market prices\" || true\n  if git push origin HEAD:main; then exit 0; fi\n  echo \"Concurrent update: retrying with fresh main and remerging\"\n  git fetch origin main\n  git reset --hard origin/main\n  python /tmp/v5_recover.py\n  git add data/v5_integrated/daily_prices.csv\n  if git diff --cached --quiet; then exit 0; fi\ndone\nexit 1\n"
    - name: Upload recovery status
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v5-nov06-price-recovery
        path: v5_recovery_out/status.json
        if-no-files-found: warn
