name: KRX v5 Stage50 Full Market Integrated Baseline
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: v5-stage50-full-market-archive
  cancel-in-progress: false
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Find successful Stage50 artifact for recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p stage50_seed
          for ID in $(gh run list --repo "$GH_REPO" --workflow v5-stage50-full-market-integrated.yml --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$ID" --repo "$GH_REPO" --name v5-stage50-full-market-integrated --dir stage50_seed 2>/dev/null && test -s stage50_seed/full_market_issues.csv; then
              echo "Recovery candidate from run $ID"
              break
            fi
          done
          exit 0
      - name: Restore or collect and validate full market snapshot
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage50_out
          cat > /tmp/stage50.py <<'PY'
          import csv,json,os,pathlib,re,collections,urllib.request,urllib.parse
          out=pathlib.Path("stage50_out");out.mkdir(exist_ok=True)
          archive=pathlib.Path("data/v5_integrated/full_market_snapshots");archive.mkdir(parents=True,exist_ok=True)
          status={"stage":"50_full_market_integrated_baseline","api_diagnostics":[],"buy_signals":0,"official_shareclass_verified":0}
          def save(): (out/"status.json").write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding="utf-8")
          def load(p):
           with p.open(encoding="utf-8-sig",newline="") as f:return list(csv.DictReader(f))
          def write(p,rows):
           with p.open("w",encoding="utf-8",newline="") as f:
            w=csv.DictWriter(f,fieldnames=list(rows[0]),extrasaction="ignore");w.writeheader();w.writerows(rows)
          def number(v):
           try:return int(str(v).replace(",","").strip())
           except:return 0
          def verify(rows,day,price):
           counts=collections.Counter();seen=set();match=0;total=0
           for r in rows:
            m=r.get("MARKET");c=r.get("ISU_CD");k=(m,c)
            if m not in ("KOSPI","KOSDAQ") or not re.fullmatch("[0-9A-Z]{6}",str(c)) or k in seen:raise ValueError("Invalid or duplicate issue")
            seen.add(k);counts[m]+=1
            if r.get("BAS_DD")!=day or number(r.get("TDD_CLSPRC"))<=0 or number(r.get("MKTCAP"))<=0:raise ValueError("Invalid market data")
            if k in price:
             total+=1
             if price[k]==number(r["TDD_CLSPRC"]):match+=1
           if counts["KOSPI"]<500 or counts["KOSDAQ"]<1000:raise ValueError("Incomplete both-market snapshot")
           if total<1500 or match/total<.995:raise ValueError(f"Archive price disagreement {match}/{total}")
           return {"counts":dict(counts),"price_matches":match,"price_compared":total}
          def api(day):
           key=os.getenv("KRX_API_KEY","").strip()
           if not key:raise ValueError("Missing KRX_API_KEY")
           rows=[]
           for m,endpoint in (("KOSPI","stk_bydd_trd"),("KOSDAQ","ksq_bydd_trd")):
            diag={"market":m,"date":day}
            try:
             url="https://data-dbg.krx.co.kr/svc/apis/sto/"+endpoint+"?"+urllib.parse.urlencode({"basDd":day})
             req=urllib.request.Request(url,headers={"AUTH_KEY":key,"User-Agent":"Mozilla/5.0","Accept":"application/json"})
             with urllib.request.urlopen(req,timeout=45) as resp:
              diag["http"]=resp.status;body=resp.read()
             diag["bytes"]=len(body);payload=json.loads(body.decode("utf-8-sig"))
             items=payload.get("OutBlock_1")
             diag["rows"]=len(items) if isinstance(items,list) else None
             diag["response_keys"]=list(payload)[:10]
             if not isinstance(items,list):raise ValueError("OutBlock_1 missing")
             for x in items:
              rows.append({"BAS_DD":day,"ISU_CD":str(x.get("ISU_CD","")).strip().upper(),"ISU_NM":str(x.get("ISU_NM","")).strip(),"TDD_CLSPRC":x.get("TDD_CLSPRC",""),"ACC_TRDVOL":x.get("ACC_TRDVOL",""),"MKTCAP":x.get("MKTCAP",""),"MARKET":m})
            except Exception as e:
             diag["error"]=str(e)[:200];status["api_diagnostics"].append(diag);raise
            status["api_diagnostics"].append(diag)
           return rows
          try:
           day=pathlib.Path("data/v5_integrated/last_market_date.txt").read_text().strip()
           if not re.fullmatch(r"\d{8}",day):raise ValueError("Invalid date marker")
           status["market_date"]=day
           price={(r["market"],r["code"]):number(r["close"]) for r in load(pathlib.Path("data/v5_integrated/daily_prices.csv")) if r["date"]==day}
           if len(price)<1500:raise ValueError("Incomplete archived close prices")
           rows=None;snapshot=archive/(day+".csv")
           for candidate,label in ((snapshot,"PERSISTENT_VERIFIED_FULL_MARKET_SNAPSHOT"),(pathlib.Path("stage50_seed/full_market_issues.csv"),"VERIFIED_PRIOR_STAGE50_ARTIFACT")):
            if not candidate.exists():continue
            try:
             trial=load(candidate);status["verification"]=verify(trial,day,price);rows=trial;status["source"]=label;break
            except Exception as e:status[label+"_rejected"]=str(e)[:200]
           if rows is None:
            rows=api(day);status["verification"]=verify(rows,day,price);status["source"]="KRX_API_both_markets"
           spac=re.compile("스팩|SPAC",re.I);pref=re.compile(r"(?:우|우B|우C|[1-9]우|[1-9]우B|[1-9]우C|우선주)$",re.I)
           result=[]
           for r in rows:
            r=dict(r);name=r["ISU_NM"];cap=number(r["MKTCAP"])
            r.update(marketcap_ge_100b_krw="YES" if cap>=100000000000 else "NO",spac_name_flag="YES" if spac.search(name) else "NO",preferred_name_flag="YES" if pref.search(name) else "NO",shareclass_official="UNVERIFIED",financials_verified="NO",evaluation_status="PENDING_FINANCIAL_AND_SHARECLASS_VALIDATION",final_grade="WITHHELD",buy_signal="NONE",eligible_for_research="YES" if cap>=100000000000 and not spac.search(name) and not pref.search(name) else "NO")
            result.append(r)
           result.sort(key=lambda r:(r["MARKET"],r["ISU_CD"]))
           eligible=[r for r in result if r["eligible_for_research"]=="YES"]
           write(out/"full_market_issues.csv",result);write(out/"research_eligible_provisional.csv",eligible)
           write(out/"exceptions_and_review.csv",[r for r in result if r["eligible_for_research"]=="NO" or r["preferred_name_flag"]=="YES"])
           write(snapshot,result)
           status.update(source_dates=[day],total_market_issues=len(result),market_counts=dict(collections.Counter(r["MARKET"] for r in result)),research_eligible_provisional=len(eligible),marketcap_ge_100b=sum(r["marketcap_ge_100b_krw"]=="YES" for r in result),snapshot_is_reference_date=True,coverage_pct=100,result="SUCCESS")
          except Exception as e:
           status.update(result="FAILED",error=str(e));save();raise
          save();print(json.dumps(status,ensure_ascii=False,indent=2))
          PY
          python /tmp/stage50.py
      - name: Persist full market snapshot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v5_integrated/full_market_snapshots/
          if ! git diff --cached --quiet; then
            git commit -m 'v5: save verified full market snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-stage50-full-market-integrated
          path: stage50_out/
          if-no-files-found: warn
