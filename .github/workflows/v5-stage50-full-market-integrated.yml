name: KRX v5 Stage50 Full Market Integrated Baseline
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run archived-date verified full market Stage50
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage50_out
          cat > /tmp/stage50.py <<'PY'
          import csv,json,os,pathlib,urllib.request,urllib.parse,collections,re,datetime
          P=pathlib.Path("stage50_out");P.mkdir(exist_ok=True)
          status={"stage":"50_full_market_integrated_baseline","source":"ARCHIVED_DATE_KRX_REFETCH","buy_signals":0,"official_shareclass_verified":0}
          def save(): (P/"status.json").write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding="utf-8")
          try:
           root=pathlib.Path("data/v5_integrated")
           day=(root/"last_market_date.txt").read_text().strip()
           if not re.fullmatch(r"\d{8}",day):raise ValueError("Invalid archive marker")
           counts=collections.Counter()
           with (root/"daily_prices.csv").open(encoding="utf-8-sig",newline="") as f:
            for r in csv.DictReader(f):
             if r["date"]==day:counts[r["market"]]+=1
           if counts["KOSPI"]<500 or counts["KOSDAQ"]<1000:raise ValueError("Archive latest date is not both-market complete")
           status["archive_counts"]=dict(counts);status["market_date"]=day
           key=os.environ.get("KRX_API_KEY","").strip()
           if not key:raise ValueError("KRX_API_KEY missing")
           rows=[]
           for market,endpoint,minimum in [("KOSPI","stk_bydd_trd",500),("KOSDAQ","ksq_bydd_trd",1000)]:
            url="https://data-dbg.krx.co.kr/svc/apis/sto/"+endpoint+"?"+urllib.parse.urlencode({"basDd":day})
            req=urllib.request.Request(url,headers={"AUTH_KEY":key,"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(req,timeout=45) as response: payload=json.load(response)
            items=payload.get("OutBlock_1")
            if not isinstance(items,list) or len(items)<minimum:raise ValueError("API "+market+" incomplete for "+day)
            for x in items:
             code=str(x.get("ISU_CD","")).strip().upper()
             if not re.fullmatch(r"[0-9A-Z]{6}",code):continue
             rows.append({"BAS_DD":day,"ISU_CD":code,"ISU_NM":str(x.get("ISU_NM","")).strip(),"TDD_CLSPRC":x.get("TDD_CLSPRC",""),"ACC_TRDVOL":x.get("ACC_TRDVOL",""),"MKTCAP":x.get("MKTCAP",""),"MARKET":market})
            status[market+"_api_count"]=len(items)
           if len({(r["MARKET"],r["ISU_CD"]) for r in rows})!=len(rows):raise ValueError("Duplicate market+issue codes")
           if len(rows)<1500:raise ValueError("Insufficient full market")
           spac=re.compile(r"스팩|SPAC",re.I);pref=re.compile(r"(?:우|우B|우C|[1-9]우|[1-9]우B|[1-9]우C|우선주)$",re.I)
           for r in rows:
            try:cap=int(str(r["MKTCAP"]).replace(",",""))
            except:cap=0
            name=r["ISU_NM"]
            r.update(marketcap_ge_100b_krw="YES" if cap>=100_000_000_000 else "NO",spac_name_flag="YES" if spac.search(name) else "NO",preferred_name_flag="YES" if pref.search(name) else "NO",shareclass_official="UNVERIFIED",financials_verified="NO",evaluation_status="PENDING_FINANCIAL_AND_SHARECLASS_VALIDATION",final_grade="WITHHELD",buy_signal="NONE",eligible_for_research="YES" if cap>=100_000_000_000 and not spac.search(name) and not pref.search(name) else "NO")
           rows.sort(key=lambda r:(r["MARKET"],r["ISU_CD"]))
           eligible=[r for r in rows if r["eligible_for_research"]=="YES"]
           fields=list(rows[0])
           def write(name,data):
            with (P/name).open("w",encoding="utf-8-sig",newline="") as f:
             w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(data)
           write("full_market_issues.csv",rows)
           write("research_eligible_provisional.csv",eligible)
           write("exceptions_and_review.csv",[r for r in rows if r["eligible_for_research"]=="NO" or r["preferred_name_flag"]=="YES"])
           status.update(source="KRX_API_both_markets",source_dates=[day],total_market_issues=len(rows),market_counts=dict(collections.Counter(r["MARKET"] for r in rows)),research_eligible_provisional=len(eligible),marketcap_ge_100b=sum(r["marketcap_ge_100b_krw"]=="YES" for r in rows),preferred_name_flags=sum(r["preferred_name_flag"]=="YES" for r in rows),spac_name_flags=sum(r["spac_name_flag"]=="YES" for r in rows),coverage_pct=100,snapshot_is_reference_date=True)
          except Exception as e:
           status.update(source="FAILED_NO_FALLBACK",error=str(e));save();raise
          finally:save()
          PY
          python /tmp/stage50.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-stage50-full-market-integrated
          path: stage50_out/
          if-no-files-found: warn
