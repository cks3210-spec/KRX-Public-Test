name: KRX v5 R14 Fundamental Growth No Cross
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: krx-v5-r14-fundamental-growth-no-cross
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fundamental growth and daily history
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_GROWTH_MAX_CALLS: '60'
        run: |
          python -m py_compile scripts/krx_v5_r14_fundamental_growth_no_cross_20261117_c.py
          python scripts/krx_v5_r14_fundamental_growth_no_cross_20261117_c.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-r14-fundamental-growth-no-cross
          path: data/v5_investment_r14_fundamental/
          retention-days: 90
      - name: Persist only generated results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v5_investment_r14_fundamental/
          if ! git diff --cached --quiet; then
            git commit -m 'R14 fundamental growth and daily history without golden cross'
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi
