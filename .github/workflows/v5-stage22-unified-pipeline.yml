name: KRX v5 Stage22 Unified Daily Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '10 11 * * 1-5' # 20:10 KST; after expected KRX publisher
permissions:
  contents: write
concurrency:
  group: v5-stage22-unified
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore unified orchestration
        run: |
          mkdir -p stage22
          python - <<'PYCODE'
          import base64,pathlib
          pathlib.Path('stage22/prepare_stage22.py').write_bytes(base64.b64decode(''))
          pathlib.Path('stage22/run_stage22.py').write_bytes(base64.b64decode(''))
          PYCODE
      - name: Run KRX v5 pipeline
        run: |
          python stage22/prepare_stage22.py
          python stage22/run_stage22.py
      - name: Commit v5 reports only
        run: |
          if [ -d v5_reports ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add v5_reports/
            if ! git diff --cached --quiet; then
              git commit -m "v5 stage22: publish daily research ledger"
              git push
            fi
          fi
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-stage22-unified
          path: |
            stage20_output/summary.json
            stage20_output/candidates.csv
            v5_reports/latest_status.json
            v5_reports/pipeline_status.json
          if-no-files-found: warn
