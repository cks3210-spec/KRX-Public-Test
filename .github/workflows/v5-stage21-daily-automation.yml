name: KRX v5 Stage21 Daily Automation and Ledger
on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * 1-5" # 19:20 KST weekdays; stale-date gate skips holidays
permissions:
  contents: write
concurrency:
  group: v5-stage21-daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore Stage20 and Stage21 engines
        shell: bash
        run: |
          mkdir -p stage21
          python - <<'PYCODE'
          import base64,pathlib
          root=pathlib.Path("stage21")
          (root/'stage19_engine.py').write_bytes(base64.b64decode(''))
          (root/'build_stage20.py').write_bytes(base64.b64decode(''))
          (root/'test_stage20.py').write_bytes(base64.b64decode(''))
          (root/'persist_stage21.py').write_bytes(base64.b64decode(''))
          (root/'test_stage21.py').write_bytes(base64.b64decode(''))
          PYCODE
      - name: Internal functional tests
        run: |
          python stage21/test_stage20.py
          python stage21/test_stage21.py
      - name: Run full Stage20 integrated engine
        run: python stage21/build_stage20.py --output stage20_output
      - name: Download price series for V signal forward tracking
        run: curl -fLsS --retry 3 --max-time 120 https://raw.githubusercontent.com/cks3210-spec/KRX-Public-Test/main/data/daily_70d.csv.gz -o stage20_output/daily_70d.csv.gz
      - name: Save daily snapshot and signal ledger
        run: python stage21/persist_stage21.py --source stage20_output --root v5_reports
      - name: Commit only v5 research results
        shell: bash
        run: |
          if [ -d v5_reports ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add v5_reports/
            if ! git diff --cached --quiet; then
              git commit -m "v5 stage21: persist research signals and forward outcomes"
              git push
            else
              echo "No new v5 data to commit"
            fi
          fi
      - name: Upload daily research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-stage21-daily-research
          path: |
            stage20_output/summary.json
            stage20_output/candidates.csv
            stage20_output/cross_events.csv
            v5_reports/latest_status.json
          if-no-files-found: warn
