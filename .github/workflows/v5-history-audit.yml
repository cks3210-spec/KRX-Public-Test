name: KRX v5 Historical Data Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current financial and history checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v5_state v5_history_output
          git fetch origin v5-state
          git show origin/v5-state:financial_latest.json > v5_state/financial_latest.json
          git show origin/v5-state:v5_history/history_metrics.json > v5_history_output/history_metrics.json
      - name: Audit snapshot identity and arithmetic
        run: python v5/v5_history_audit.py
      - name: Upload read-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-history-audit
          path: v5_history_audit_output/
          if-no-files-found: warn
          retention-days: 30
