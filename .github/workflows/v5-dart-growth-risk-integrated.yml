name: KRX v5 DART Growth Risk Integrated
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download last successful Stage56 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow v5-stage56-official-financial-verify.yml --status success --limit 30 --json databaseId --jq ".[0].databaseId")
          test -n "$run_id" && test "$run_id" != null
          mkdir -p stage56
          gh run download "$run_id" --name stage56-official-financial-verification --dir stage56
          find stage56 -name owner_fields.csv -print -quit | grep -q owner_fields.csv
      - name: Restore verified cohort and collector
        shell: bash
        run: |
          python - <<'PYRESTORE'
          import base64,zlib,pathlib
          pathlib.Path('collector.py').write_bytes(zlib.decompress(base64.b64decode('')))
          pathlib.Path('bridge.zip').write_bytes(zlib.decompress(base64.b64decode('')))
          PYRESTORE
      - name: Package Stage56 source for collector
        run: |
          python - <<'PYZIP'
          import zipfile,pathlib
          files=list(pathlib.Path("stage56").rglob("owner_fields.csv"))
          assert len(files)==1, files
          with zipfile.ZipFile("stage56.zip","w") as z: z.write(files[0],"owner_fields.csv")
          PYZIP
      - name: Run OpenDART same-period comparisons
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${DART_API_KEY:-${OPENDART_API_KEY:-}}"
          python collector.py --bridge bridge.zip --stage56 stage56.zip --out result --year 2026 --report 11012
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-dart-growth-risk-evidence
          path: result/
          if-no-files-found: warn
          retention-days: 90
