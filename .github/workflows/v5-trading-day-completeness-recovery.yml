name: KRX v5 Trading Day Completeness Recovery
'on':
  workflow_dispatch:
    inputs:
      audit_days:
        description: Calendar days to audit (7-45), ending at promoted market date
        required: false
        default: '14'
permissions:
  contents: write
  actions: read
concurrency:
  group: krx-v5-operational-market-promotion
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'exchange_calendars>=4.5,<5'
      - name: Reuse verified official archives and collector artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUDIT_DAYS: ${{ inputs.audit_days || '14' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v5_recover.py <<'PY'
          import csv, gzip, io, json, os, re, subprocess, tempfile
          from pathlib import Path
          from collections import Counter, defaultdict
          from datetime import datetime, timedelta
          from decimal import Decimal
          from zoneinfo import ZoneInfo
          import exchange_calendars as xc

          COLS=['BAS_DD','ISU_CD','ISU_NM','TDD_CLSPRC','ACC_TRDVOL','MKTCAP','MARKET']
          PCOLS=['date','market','code','close']
          MARKETS=('KOSPI','KOSDAQ')
          CAL=xc.get_calendar('XKRX')
          D=Path('data'); A=D/'v5_official_market_archive'; P=D/'v5_integrated'
          OUT=Path('v5_trade_day_recovery_result'); OUT.mkdir(exist_ok=True)
          report={'status':'STARTED','api_calls':0,'recovered_dates':[],'archive_verified_dates':[], 'history_only_dates':[], 'missing_source_dates':[], 'new_rows':0,'final_buy_signals':0,'investment_decisions_authorized':False}
          def need(ok,msg):
              if not ok: raise ValueError(msg)
          def save():
              (OUT/'status.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def iso(day): return datetime.strptime(day,'%Y%m%d').date().isoformat()
          def read(path,cols):
              with (gzip.open if path.suffix=='.gz' else open)(path,'rt',encoding='utf-8-sig',newline='') as f:
                  reader=csv.DictReader(f);need(set(cols)<=set(reader.fieldnames or []),'BAD_COLUMNS '+str(path));return list(reader)
          def canonical(raw):
              out={}
              for r0 in raw:
                  r={c:str(r0[c]).strip() for c in COLS};k=(r['BAS_DD'],r['MARKET'],r['ISU_CD']);iso(k[0])
                  need(k[1] in MARKETS and re.fullmatch('[0-9A-Z]{6}',k[2]) and k not in out,'BAD_OR_DUPLICATE_KEY '+str(k))
                  for c in ('TDD_CLSPRC','ACC_TRDVOL','MKTCAP'):
                      v=r[c].replace(',','');need(re.fullmatch('[0-9]+',v),'BAD_NUMERIC '+c);r[c]=str(int(v))
                  need(int(r['TDD_CLSPRC'])>0 and int(r['MKTCAP'])>0,'BAD_PRICE_OR_CAP');out[k]=r
              return out
          def complete(rows,day):
              c=Counter(k[1] for k in rows);need({k[0] for k in rows}=={day} and c['KOSPI']>=500 and c['KOSDAQ']>=1000 and len(rows)>=2000,'INCOMPLETE '+day);return dict(c)
          def csvbytes(rows,fields):
              s=io.StringIO(newline='');w=csv.DictWriter(s,fieldnames=fields);w.writeheader();w.writerows(rows);return s.getvalue().encode('utf-8-sig')
          def loadj(p): return json.loads(p.read_text(encoding='utf-8-sig'))
          def price_map(rows): return {k:Decimal(r['TDD_CLSPRC']) for k,r in rows.items()}
          def artifact_sources(wanted):
              if not wanted:return {}
              repo=os.environ['GH_REPO']; result={}
              runs=json.loads(subprocess.check_output(['gh','run','list','--repo',repo,'--workflow','v5-official-market-date-collector.yml','--branch','main','--status','success','--limit','50','--json','databaseId'],text=True,timeout=60))
              with tempfile.TemporaryDirectory() as temp:
                  for run in runs:
                      rid=str(run['databaseId']);root=Path(temp)/rid;root.mkdir()
                      proc=subprocess.run(['gh','run','download',rid,'--repo',repo,'--name','krx-v5-official-market-snapshot','--dir',str(root)],capture_output=True,text=True,timeout=60)
                      if proc.returncode:
                          if any(x in proc.stderr.lower() for x in ('no valid artifacts','no artifacts','not found','expired')):continue
                          raise RuntimeError('ARTIFACT_DOWNLOAD_FAILED '+rid)
                      s=loadj(root/'status.json');day=s.get('market_date')
                      if day not in wanted or s.get('state') not in ('VERIFIED_OFFICIAL_MARKET_SNAPSHOT','VERIFIED_HISTORICAL_SNAPSHOT'):continue
                      need(s.get('source')=='KRX_OPEN_API' and str(s.get('github_run_id'))==rid and s.get('target_market_date')==day and s.get('investment_decisions_authorized') is False and s.get('final_buy_signals')==0,'BAD_ARTIFACT_STATUS '+rid)
                      raw=read(root/'official_daily_market.csv',COLS+['source','source_sha256']);rows=canonical(raw);counts=complete(rows,day)
                      need(counts==s.get('market_counts') and len(rows)==s.get('records_fetched'),'ARTIFACT_COUNT_MISMATCH '+rid)
                      hashes=s.get('response_sha256',{})
                      for m in MARKETS:
                          h=hashes.get(m,'');need(re.fullmatch('[0-9a-f]{64}',h or '') and all(r['source']=='KRX_OPEN_API' and r['source_sha256']==h for r in raw if r['MARKET']==m),'ARTIFACT_PROVENANCE_MISMATCH '+rid)
                      if day in result:need(result[day][0]==rows,'CONFLICTING_ARTIFACTS '+day)
                      else:result[day]=(rows,rid)
                      if set(result)==wanted:break
              return result

          def main():
              now=datetime.now(ZoneInfo('Asia/Seoul'))
              window=int(os.getenv('AUDIT_DAYS','14'));need(7<=window<=45,'INVALID_WINDOW')
              current=canonical(read(D/'latest.csv',COLS));dates={k[0] for k in current};need(len(dates)==1,'MIXED_LATEST');day=dates.pop();c=complete(current,day)
              need(CAL.is_session(iso(day)) and day<now.strftime('%Y%m%d'),'INVALID_PRODUCTION_DATE')
              summary=loadj(D/'summary.json');need(summary.get('latest_trading_date')==day and summary.get('kospi_rows_latest')==c['KOSPI'] and summary.get('kosdaq_rows_latest')==c['KOSDAQ'],'SUMMARY_MISMATCH')
              hist=canonical(read(D/'daily_70d.csv.gz',COLS));byhist=defaultdict(dict)
              for k,r in hist.items():byhist[k[0]][k]=r
              need(len(byhist)==70 and max(byhist)==day and byhist[day]==current and summary.get('sessions_stored')==70 and summary.get('total_rows_stored')==len(hist),'HISTORY_MISMATCH')
              marker=(P/'last_market_date.txt').read_text().strip();need(marker<=day and CAL.is_session(iso(marker)),'INVALID_LEDGER_MARKER')
              ledger={};byledger=defaultdict(dict)
              for r in read(P/'daily_prices.csv',PCOLS):
                  k=(r['date'],r['market'],r['code']);iso(k[0]);v=Decimal(r['close']);need(k[1] in MARKETS and re.fullmatch('[0-9A-Z]{6}',k[2]) and k not in ledger and v.is_finite() and v>0,'INVALID_LEDGER '+str(k));ledger[k]=r['close'];byledger[k[0]][k]=v
              need(ledger and max(byledger)<=day and marker in byledger,'LEDGER_DATE_CONFLICT')
              start=min(datetime.strptime(day,'%Y%m%d').date()-timedelta(days=window-1),datetime.strptime(marker,'%Y%m%d').date())
              expected=[x.strftime('%Y%m%d') for x in CAL.sessions_in_range(start.isoformat(),iso(day))]
              report.update(production_date=day,previous_ledger_date=marker,expected_sessions=expected)
              sources={};wanted=set()
              for d in expected:
                  ap=A/(d+'.csv')
                  if ap.exists():
                      rows=canonical(read(ap,COLS));complete(rows,d)
                      if d in byhist:need(rows==byhist[d],'ARCHIVE_HISTORY_CONFLICT '+d)
                      sources[d]=rows;report['archive_verified_dates'].append(d)
                  elif d in byhist and byledger[d]==price_map(byhist[d]) and d!=day:
                      complete(byhist[d],d);report['history_only_dates'].append(d)
                  else:wanted.add(d)
              found=artifact_sources(wanted)
              for d,(rows,rid) in found.items():
                  if d in byhist:need(rows==byhist[d],'ARTIFACT_HISTORY_CONFLICT '+d)
                  sources[d]=rows;report.setdefault('artifact_source_runs',{})[d]=rid
              report['missing_source_dates']=sorted(wanted-set(found))
              if report['missing_source_dates']:
                  report['status']='BLOCKED_MISSING_OFFICIAL_SOURCE';save();raise ValueError('Run canonical official collector for each missing date; no direct API calls or changes: '+','.join(report['missing_source_dates']))
              need(day in sources and sources[day]==current,'CURRENT_OFFICIAL_SOURCE_MISMATCH')
              changes={}
              for d,rows in sorted(sources.items()):
                  expected_prices=price_map(rows);existing=byledger[d]
                  need(set(existing)<=set(expected_prices),'LEDGER_EXTRA_SECURITY '+d)
                  need(all(expected_prices[k]==v for k,v in existing.items()),'LEDGER_PRICE_CONFLICT '+d)
                  for k in expected_prices.keys()-existing.keys():ledger[k]=rows[k]['TDD_CLSPRC'];report['new_rows']+=1
                  if set(expected_prices)!=set(existing):report['recovered_dates'].append(d)
                  if d in found:changes[A/(d+'.csv')]=csvbytes([rows[k] for k in sorted(rows)],COLS)
              if report['new_rows']:changes[P/'daily_prices.csv']=csvbytes([dict(zip(PCOLS,(*k,ledger[k]))) for k in sorted(ledger)],PCOLS)
              if marker!=day:changes[P/'last_market_date.txt']=(day+'\n').encode()
              # Validate all dates before writing anything. Never touch the rolling history or the financial cache.
              for p,b in changes.items():p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
              report.update(status='READY_TO_COMMIT' if changes else 'VERIFIED_UNCHANGED',planned_paths=[str(p) for p in changes],ledger_date=day,archive_created_dates=sorted(found));save()
          if __name__=='__main__':
              try:main()
              except Exception as exc:
                  if report['status']!='BLOCKED_MISSING_OFFICIAL_SOURCE':report['status']='FAILED_VALIDATION'
                  report['error']=str(exc);save();raise
          PY
          python /tmp/v5_recover.py
      - name: Commit only validated recovery paths without rebase or force
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          p=pathlib.Path('v5_trade_day_recovery_result/status.json')
          s=json.loads(p.read_text())
          def git(*args): return subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE,text=True).stdout.strip()
          try:
              assert s['status'] in ('READY_TO_COMMIT','VERIFIED_UNCHANGED')
              paths=s['planned_paths']
              assert all(x in ('data/v5_integrated/daily_prices.csv','data/v5_integrated/last_market_date.txt') or (x.startswith('data/v5_official_market_archive/') and x.endswith('.csv')) for x in paths)
              if paths:
                  git('config','user.name','github-actions[bot]')
                  git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
                  git('add','--',*paths)
                  assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
                  git('commit','-m','v5: recover missing official archived prices')
                  git('push','origin','HEAD:main')
                  s['status']='COMMITTED'
              else:s['status']='VERIFIED_UNCHANGED'
          except Exception as e:
              s['status']='COMMIT_FAILED';s['error']=str(e);raise
          finally:p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-trading-day-completeness-result
          path: v5_trade_day_recovery_result/
          if-no-files-found: error
