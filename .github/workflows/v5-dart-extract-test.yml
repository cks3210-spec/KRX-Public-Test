name: KRX v5 DART Extraction Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract 2025 financial figures from 10 stocks
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python v5/dart_extract_10.py
      - name: Upload extraction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-dart-extraction-test
          path: v5_output/
          if-no-files-found: warn
