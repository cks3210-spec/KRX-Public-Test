name: KRX v5 Stage39 Full Universe Growth
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        batch:
        - 0
        - 1
        - 2
        - 3
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      BATCH: ${{ matrix.batch }}
      TOTAL_BATCHES: '4'
    steps:
    - uses: actions/checkout@v4
    - name: Collect and validate 2026 vs 2025 H1 growth
      shell: bash
      run: "mkdir -p stage39_out\ncat > /tmp/stage39.py <<'PY'\nimport csv,io,json,os,time,zipfile,urllib.request,urllib.parse,datetime,pathlib,subprocess,xml.etree.ElementTree as ET,collections,re,random\nO=pathlib.Path('stage39_out');O.mkdir(exist_ok=True)\nBATCH=int(os.environ['BATCH']);TOTAL=int(os.environ.get('TOTAL_BATCHES','4'))\ndef num(v):\n try:return int(str(v).replace(',','').strip())\n except (TypeError,ValueError):return None\ndef csvwrite(path,rows,fields):\n with open(path,'w',encoding='utf-8-sig',newline='') as f:\n  w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore');w.writeheader();w.writerows(rows)\ndef fetch(url,params):\n url+='?'+urllib.parse.urlencode(params)\n for i in range(5):\n  try:\n   with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'KRX-v5-research/1.0'}),timeout=45) as r:return r.read()\n  except Exception:\n   if i==4:raise\n   time.sleep(min(30,2**i+random.random()))\ndef api(corp,year,scope,key):\n data=json.loads(fetch('https://opendart.fss.or.kr/api/fnlttSinglAcntAll.json',{'crtfc_key':key,'corp_code':corp,'bsns_year':year,'reprt_code':'11012','fs_div':scope}))\n\
        \ if data.get('status')!='000':return [],'DART_'+str(data.get('status'))\n return data.get('list',[]),None\n# Explicit standard identifiers; do not select ambiguous duplicate accounts.\nIDS={\n 'revenue':{'ifrs-full_Revenue','ifrs_Revenue','ifrs-full_RevenueFromContractsWithCustomers','ifrs_RevenueFromContractsWithCustomers','dart_Revenue'},\n 'operating_profit':{'dart_OperatingIncomeLoss'},\n 'net_income':{'ifrs-full_ProfitLoss','ifrs_ProfitLoss'}\n}\n# Some issuers use custom revenue labels; never guess those automatically.\ndef metrics(items,scope):\n matches=collections.defaultdict(list)\n for x in items:\n  if x.get('fs_div') and x['fs_div']!=scope:continue\n  if x.get('sj_div') not in ('IS','CIS'):continue\n  aid=str(x.get('account_id') or '').strip();v=num(x.get('thstrm_amount'))\n  if v is None:continue\n  for metric,ids in IDS.items():\n   if aid in ids:matches[metric].append((aid,v,x.get('account_nm',''),x.get('sj_div','')))\n out={};flags={}\n for metric in IDS:\n  rows=matches[metric]\n\
        \  values={v for _,v,_,_ in rows}\n  if not rows:out[metric]=None;flags[metric]='MISSING_STANDARD_ACCOUNT'\n  elif len(values)>1:out[metric]=None;flags[metric]='AMBIGUOUS_DUPLICATE_VALUES'\n  else:out[metric]=next(iter(values));flags[metric]='OK'\n return out,flags\nwith open('data/latest.csv',encoding='utf-8-sig',newline='') as f:market=list(csv.DictReader(f))\nveto=re.compile(r'(?:우선주|\\d+우(?:B|C|D)?|우(?:B|C|D)?$|전환우선|상환우선)',re.I)\neligible={str(x.get('ISU_CD','')).zfill(6):x for x in market if (num(x.get('MKTCAP')) or 0)>=100_000_000_000 and not veto.search(re.sub(r'\\s+','',x.get('ISU_NM','')))}\nsubprocess.run(['git','fetch','--depth=1','origin','v5-state'],check=True,capture_output=True,timeout=120)\nfin=json.loads(subprocess.run(['git','show','FETCH_HEAD:financial_latest.json'],check=True,capture_output=True,timeout=120).stdout)\nselected=[(c,p) for i,(c,p) in enumerate(sorted(eligible.items())) if i%TOTAL==BATCH]\nkey=os.getenv('DART_API_KEY','').strip() or os.getenv('OPENDART_API_KEY','').strip()\n\
        if not key:raise RuntimeError('Missing DART_API_KEY or OPENDART_API_KEY')\nblob=fetch('https://opendart.fss.or.kr/api/corpCode.xml',{'crtfc_key':key})\nwith zipfile.ZipFile(io.BytesIO(blob)) as z:root=ET.fromstring(z.read('CORPCODE.xml'))\nmapping={e.findtext('stock_code','').strip():e.findtext('corp_code','').strip() for e in root.findall('list') if e.findtext('stock_code','').strip()}\nfields=['ISU_CD','ISU_NM','corp_code','scope','market_date','metric','current_2026_h1_krw','previous_2025_h1_krw','yoy_pct','status','note']\nerrfields=['ISU_CD','ISU_NM','reason']\nresults=[];errors=[];counter=collections.Counter()\ndef save():\n csvwrite(O/f'growth_batch_{BATCH}.csv',results,fields)\n csvwrite(O/f'errors_batch_{BATCH}.csv',errors,errfields)\n (O/f'status_batch_{BATCH}.json').write_text(json.dumps({'batch':BATCH,'batches':TOTAL,'total_candidates':len(eligible),'batch_target':len(selected),'processed':counter['processed'],'metric_rows':len(results),'verified_growth_rows':counter['YOY_VERIFIED'],'errors':len(errors),'as_of_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'share_class_verified':False,'investment_grades_issued':0},ensure_ascii=False,indent=2),encoding='utf-8')\n\
        for c,p in selected:\n name=p.get('ISU_NM','');corp=mapping.get(c);f=fin.get(c,{})\n if not corp:errors.append({'ISU_CD':c,'ISU_NM':name,'reason':'NO_DART_CORP_CODE'});counter['processed']+=1;continue\n scope='CFS' if isinstance(f,dict) and str(f.get('statement_type','')).upper()=='CFS' else 'OFS'\n try:\n  cur,e1=api(corp,'2026',scope,key);prev,e2=api(corp,'2025',scope,key)\n  if e1 or e2:\n   errors.append({'ISU_CD':c,'ISU_NM':name,'reason':f'2026:{e1 or \"OK\"};2025:{e2 or \"OK\"}'});counter['processed']+=1;continue\n  a,af=metrics(cur,scope);b,bf=metrics(prev,scope)\n  for metric in IDS:\n   av=a[metric];bv=b[metric];status='YOY_VERIFIED' if av is not None and bv is not None and bv>0 else ('NONPOSITIVE_BASELINE' if av is not None and bv is not None else 'MISSING_OR_AMBIGUOUS')\n   yoy=round((av-bv)/bv*100,2) if status=='YOY_VERIFIED' else ''\n   results.append({'ISU_CD':c,'ISU_NM':name,'corp_code':corp,'scope':scope,'market_date':p.get('BAS_DD',''),'metric':metric,'current_2026_h1_krw':av\
        \ if av is not None else '', 'previous_2025_h1_krw':bv if bv is not None else '', 'yoy_pct':yoy,'status':status,'note':af[metric]+' / '+bf[metric]})\n   counter[status]+=1\n except Exception as ex:errors.append({'ISU_CD':c,'ISU_NM':name,'reason':type(ex).__name__+': '+str(ex)[:140]})\n counter['processed']+=1\n if counter['processed']%20==0:save()\n time.sleep(0.13)\nsave()\nprint(json.dumps({'batch':BATCH,'processed':counter['processed'],'verified_growth_rows':counter['YOY_VERIFIED'],'errors':len(errors)},ensure_ascii=False))\n\nPY\npython -m py_compile /tmp/stage39.py\npython /tmp/stage39.py"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stage39-batch-${{ matrix.batch }}
        path: stage39_out/
        if-no-files-found: warn
  combine:
    needs:
    - collect
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: stage39-batch-*
        path: stage39_combined
        merge-multiple: true
    - uses: actions/upload-artifact@v4
      with:
        name: v5-stage39-full-universe-growth
        path: stage39_combined/
        if-no-files-found: warn
