name: KRX v5 Independent DART Evidence Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore frozen 81 candidate seed
        run: |
          python - <<'PYCODE'
          import base64,gzip,pathlib
          pathlib.Path("seed_81.csv").write_bytes(gzip.decompress(base64.b64decode("")))
          PYCODE
      - name: Independent receipt and amount audit
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          cat > independent_audit.py <<'PYCODE'
          import csv,json,os,urllib.request,urllib.parse,hashlib,time,decimal,collections
          from pathlib import Path
          D=decimal.Decimal
          base=Path('evidence_output');base.mkdir(exist_ok=True)
          rows=list(csv.DictReader(open('seed_81.csv',encoding='utf-8-sig')))
          key=os.getenv('DART_API_KEY') or os.getenv('OPENDART_API_KEY')
          if not key:raise SystemExit('Missing DART_API_KEY/OPENDART_API_KEY')
          ids={'revenue':{'ifrs-full_Revenue','ifrs_Revenue'},'operating_profit':{'dart_OperatingIncomeLoss','ifrs-full_ProfitLossFromOperatingActivities'},'liabilities':{'ifrs-full_Liabilities','ifrs_Liabilities'},'equity':{'ifrs-full_Equity','ifrs_Equity'},'ocf':{'ifrs-full_CashFlowsFromUsedInOperatingActivities','ifrs_CashFlowsFromUsedInOperatingActivities'}}
          sj={'revenue':{'IS','CIS'},'operating_profit':{'IS','CIS'},'liabilities':{'BS'},'equity':{'BS'},'ocf':{'CF'}}
          def dec(s):
           try:return D(str(s).replace(',','').strip())
           except:return None
          def fetch(cc,year,fs):
           params=urllib.parse.urlencode(dict(crtfc_key=key,corp_code=cc,bsns_year=year,reprt_code='11012',fs_div=fs))
           with urllib.request.urlopen(urllib.request.Request('https://opendart.fss.or.kr/api/fnlttSinglAcntAll.json?'+params,headers={'User-Agent':'KRX-v5-evidence/1.0'}),timeout=40) as f:return json.load(f)
          def getval(items,k):
           matches=[x for x in items if x.get('account_id') in ids[k] and x.get('sj_div') in sj[k] and x.get('account_detail','-') in ('','-')]
           vals={dec(x.get('thstrm_amount')) for x in matches};vals.discard(None)
           return (next(iter(vals)) if len(vals)==1 else None),matches
          out=[]
          for n,r in enumerate(rows,1):
           record={'code':r['code'],'name':r['name'],'evaluation_price_date':r['evaluation_price_date'],'status':'WITHHELD','reason':'','fs_div':'','2025_receipt':r['2025_receipt_no'],'2026_receipt':r['2026_receipt_no'],'source_sha256_2025':'','source_sha256_2026':'','revenue_growth_calculated':'','operating_profit_growth_calculated':'','debt_ratio_calculated':'','operating_cashflow_calculated':''}
           try:
            if not all(r[y+'_filing_date']<=r['evaluation_price_date'] and r[y+'_receipt_no'] for y in ('2025','2026')):raise ValueError('MISSING_OR_FUTURE_RECEIPT')
            selected={}
            for fs in ('CFS','OFS'):
             tmp={}
             for year in ('2025','2026'):
              obj=fetch(r['corp_code'],year,fs)
              if obj.get('status')!='000':break
              items=obj.get('list') or []
              receipts={x.get('rcept_no') for x in items if x.get('rcept_no')}
              # Never infer receipt identity when API omits receipt numbers.
              if r[year+'_receipt_no'] not in receipts:break
              values={};chosen={}
              for k in ids:
               values[k],chosen[k]=getval(items,k)
              if any(v is None for v in values.values()):break
              payload={'corp_code':r['corp_code'],'year':year,'fs_div':fs,'receipt_no':r[year+'_receipt_no'],'accounts':chosen}
              raw=json.dumps(payload,ensure_ascii=False,sort_keys=True).encode()
              path=base/(r['code']+'_'+year+'_'+fs+'.json');path.write_bytes(raw)
              tmp[year]=(values,hashlib.sha256(raw).hexdigest())
             if len(tmp)==2:selected=tmp;record['fs_div']=fs;break
            if len(selected)!=2:raise ValueError('NO_SAME_FS_RECEIPT_MATCHED_SOURCE_ROWS')
            a=selected['2025'][0];b=selected['2026'][0]
            if a['revenue']==0 or a['operating_profit']==0 or b['equity']==0:raise ValueError('ZERO_DENOMINATOR')
            calculated={'revenue_growth_pct':(b['revenue']/a['revenue']-1)*100,'operating_profit_growth_pct':(b['operating_profit']/a['operating_profit']-1)*100,'debt_ratio_pct':b['liabilities']/b['equity']*100,'operating_cashflow':b['ocf']}
            mapping={'revenue_growth_pct':'revenue_growth_calculated','operating_profit_growth_pct':'operating_profit_growth_calculated','debt_ratio_pct':'debt_ratio_calculated','operating_cashflow':'operating_cashflow_calculated'}
            for k,v in calculated.items():record[mapping[k]]=str(v)
            for year in ('2025','2026'):record['source_sha256_'+year]=selected[year][1]
            for k,v in calculated.items():
             target=dec(r.get(k))
             if target is None or abs(target-v)>max(D('0.015'),abs(v)*D('0.00005')):raise ValueError('AMOUNT_MISMATCH_'+k)
            record['status']='INDEPENDENTLY_RECALCULATED';record['reason']=''
           except Exception as e:record['reason']=str(e)[:150]
           out.append(record)
           print(n,len(rows),r['code'],record['status'],flush=True)
           time.sleep(.1)
          with (base/'independent_evidence_81.csv').open('w',encoding='utf-8-sig',newline='') as f:
           w=csv.DictWriter(f,fieldnames=list(out[0]));w.writeheader();w.writerows(out)
          (base/'status.json').write_text(json.dumps({'total':len(out),'counts':dict(collections.Counter(x['status'] for x in out)),'note':'Source account rows and SHA256 retained; only exact same-receipt and same-FS values compared; no final grades.'},ensure_ascii=False,indent=2))
          PYCODE
          python independent_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-independent-dart-evidence
          path: evidence_output/
          if-no-files-found: warn
