name: KRX v5 R14 OpenDART Auto Continue
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'inventory = read-only no API; collect = existing manual collection'
        type: choice
        required: true
        default: inventory
        options:
          - inventory
          - collect
permissions:
  contents: write
concurrency:
  group: krx-v5-r14-dart-m
  cancel-in-progress: false
jobs:
  inventory:
    name: Read-only official market financial inventory
    if: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'inventory' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare official market universe and existing financial cache without API
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import csv, datetime as dt, hashlib, json, re
          from collections import Counter
          from pathlib import Path

          root=Path('.')
          out=Path('/tmp/r14-financial-inventory')
          paths=[root/'data/summary.json',root/'data/latest.csv',root/'data/v5_financial_m/dart_financial_cache.json',root/'data/v5_financial_m/corp_map.json']

          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          def read(p):
              d=json.loads(p.read_text(encoding='utf-8-sig'))
              if not isinstance(d,dict): raise ValueError('INVALID_OBJECT '+str(p))
              return d

          def inventory(paths,out):
              before={str(p):digest(p) for p in paths}
              summary,cache,mapping=map(read,(paths[0],paths[2],paths[3]))
              if not cache or not mapping: raise ValueError('EMPTY_FINANCIAL_CACHE_OR_MAPPING')
              day=str(summary['latest_trading_date'])
              date=dt.datetime.strptime(day,'%Y%m%d').date()
              year=date.year-1
              md=(date.month,date.day)
              period='q3' if md>=(11,15) else 'half' if md>=(8,14) else 'q1' if md>=(5,15) else ''
              with paths[1].open(encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.DictReader(f))
              markets=Counter(); ids=set(); codes=set()
              for row in rows:
                  market,code=row['MARKET'],row['ISU_CD']
                  if row['BAS_DD']!=day or market not in ('KOSPI','KOSDAQ') or not re.fullmatch('[0-9A-Z]{6}',code): raise ValueError('INVALID_MARKET_ROW')
                  if (market,code) in ids or code in codes: raise ValueError('DUPLICATE_MARKET_IDENTITY')
                  ids.add((market,code));codes.add(code);markets[market]+=1
              if markets['KOSPI']<500 or markets['KOSDAQ']<1000 or len(rows)<2000: raise ValueError('MARKET_COVERAGE_INSUFFICIENT')
              if markets['KOSPI']!=summary['kospi_rows_latest'] or markets['KOSDAQ']!=summary['kosdaq_rows_latest']: raise ValueError('MARKET_COUNT_MISMATCH')
              fields=('profit','equity','revenue','assets','liabilities')
              counts=Counter({k:0 for k in ('numeric','non_numeric','mapped','unmapped_numeric','annual_any','annual_owner_pair','annual_partial_owner','annual_missing','annual_full5','quarter_pair','ttm_profit_inputs','mapping_conflict','ready_review','cooldown','missing_quarter_periods')})
              def num(v): return type(v) is int
              def accounts(rec):
                  if not isinstance(rec,dict) or rec.get('status')!='000' or rec.get('fs_div') not in ('CFS','OFS') or not isinstance(rec.get('accounts'),dict): return {}
                  return {k:v for k,v in rec['accounts'].items() if num(v)}
              def rec(code,y,p): return cache.get(f'{code}:{y}:{p}',{})
              now=dt.datetime.now(dt.timezone.utc)
              def cooling(record):
                  if not isinstance(record,dict): return False
                  try:
                      until=dt.datetime.fromisoformat(str(record.get('retry_after_utc','')))
                      return until.tzinfo is not None and until>now
                  except (ValueError,TypeError): return False
              output=[]
              for row in rows:
                  code=row['ISU_CD']; numeric=code.isdigit()
                  corp=str(mapping.get(code,'')); mapped=bool(re.fullmatch(r'\d{8}',corp))
                  counts['numeric' if numeric else 'non_numeric']+=1
                  if numeric: counts['mapped' if mapped else 'unmapped_numeric']+=1
                  annual=rec(code,year,'annual'); ac=accounts(annual)
                  present=bool(ac); missing=[k for k in fields if k not in ac]
                  owner='profit' in ac and 'equity' in ac
                  full5=not missing
                  qcur=rec(code,date.year,period) if period else {}
                  qprev=rec(code,year,period) if period else {}
                  cc,pc=accounts(qcur),accounts(qprev)
                  quarter_missing=[]
                  if period:
                      if 'profit' not in cc: quarter_missing.append(f'{date.year}:{period}:profit')
                      if 'profit' not in pc: quarter_missing.append(f'{year}:{period}:profit')
                  comparable=bool(period and 'profit' in ac and 'profit' in cc and 'profit' in pc and annual.get('fs_div')==qcur.get('fs_div')==qprev.get('fs_div'))
                  conflict=any(isinstance(r,dict) and r.get('corp_code') and str(r['corp_code'])!=corp for r in (annual,qcur,qprev)) if mapped else False
                  cooldown=any(cooling(r) for r in (annual,qcur,qprev))
                  if numeric:
                      counts['annual_any' if present else 'annual_missing']+=1
                      counts['annual_owner_pair']+=owner
                      counts['annual_partial_owner']+=present and not owner
                      counts['annual_full5']+=full5
                      counts['quarter_pair']+=bool(cc and pc)
                      counts['ttm_profit_inputs']+=comparable
                      counts['mapping_conflict']+=conflict
                      counts['missing_quarter_periods']+=len(quarter_missing)
                  need=bool(missing or quarter_missing or (period and not comparable))
                  if not numeric: action='IDENTIFIER_REVIEW_NON_NUMERIC'
                  elif not mapped: action='CORP_MAPPING_REVIEW'
                  elif conflict: action='CORP_MAPPING_CONFLICT'
                  elif not need: action='REUSE_EXISTING'
                  elif cooldown: action='COOLDOWN_REVIEW';counts['cooldown']+=1
                  else: action='REVIEW_MISSING_ONLY';counts['ready_review']+=1
                  output.append({'market_date':day,'market':row['MARKET'],'code':code,'corp_code':corp if mapped else '',
                    'annual_year':year,'annual_basis':annual.get('fs_div','') if isinstance(annual,dict) else '',
                    'annual_state':'OWNER_PAIR_AVAILABLE' if owner else 'PARTIAL_ACCOUNTS' if present else 'NO_VALID_ACCOUNTS',
                    'missing_annual_fields':'|'.join(missing),'quarter_period':period,'missing_quarter_profit':'|'.join(quarter_missing),
                    'ttm_input_basis_match':comparable,'action':action,'share_class_verified':False})
              assert counts['annual_any']+counts['annual_missing']==counts['numeric']
              assert counts['annual_owner_pair']+counts['annual_partial_owner']==counts['annual_any']
              assert counts['mapped']+counts['unmapped_numeric']==counts['numeric']
              assert len(output)==len(rows)
              after={str(p):digest(p) for p in paths}
              if before!=after: raise ValueError('INPUT_CHANGED_DURING_AUDIT')
              result={'state':'READ_ONLY_FINANCIAL_INVENTORY_COMPLETE','market_date':day,'market_rows':len(rows),'market_counts':dict(markets),'annual_year':year,'quarter_period':period,'cache_records':len(cache),'counts':dict(counts),'actions':dict(Counter(r['action'] for r in output)),'source_sha256':before,'api_calls':0,'production_data_modified':False,'share_class_verified':False,'ttm_cumulative_verified':False,'financial_disclosure_asof_verified':False,'official_per_pbr_verified':False,'investment_decisions_authorized':False,'final_buy_signals':0,'notes':['Inventory only; not a collection approval. Numeric codes are the current M/N parser scope, not a common-share filter.','Owner pair means fields present, not verified current filing values. Missing fields may be legitimately absent.','TTM input basis match does not verify cumulative accounting amounts. Quarter follows current N period convention.','No source cache changes.']}
              out.mkdir(parents=True,exist_ok=True)
              with (out/'financial_inventory.csv').open('w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=list(output[0]));w.writeheader();w.writerows(output)
              (out/'status.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('R14_FINANCIAL_INVENTORY',json.dumps(result,ensure_ascii=False))
              return result

          if __name__=='__main__': inventory(paths,out)
          PYTHON
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: r14-financial-inventory
          path: /tmp/r14-financial-inventory/
          if-no-files-found: error
          retention-days: 30
  collect:
    if: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'collect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate collector and key
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DART_API_KEY" || { echo 'DART_API_KEY secret missing'; exit 1; }
          test -s scripts/krx_v5_r14_dart_incremental_m.py
          test -s scripts/krx_v5_r14_financial_pipeline_n.py
          test -s data/v5_financial_foundation_l/unified_financial_index.csv
          python -m py_compile scripts/krx_v5_r14_dart_incremental_m.py scripts/krx_v5_r14_financial_pipeline_n.py
      - name: Prepare safe cache merger
        run: |
          cat > /tmp/merge_r14_m.py <<'PY'
          import datetime as dt, json, os, subprocess, sys
          from pathlib import Path
          remote=Path('data/v5_financial_m')
          local=Path('/tmp/r14-m-pending')
          remote.mkdir(parents=True,exist_ok=True)
          def read(p,default):
              try: return json.loads(p.read_text(encoding='utf-8-sig'))
              except (OSError,ValueError): return default
          def valid(r):
              return isinstance(r,dict) and r.get('status')=='000' and bool(r.get('accounts'))
          def atomic(p,obj):
              tmp=p.with_suffix('.tmp')
              tmp.write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
              tmp.replace(p)
          old=read(remote/'dart_financial_cache.json',{})
          new=read(local/'dart_financial_cache.json',{})
          merged=dict(old)
          conflicts=0
          for key,entry in new.items():
              previous=merged.get(key)
              if previous is None:
                  merged[key]=entry
              elif previous!=entry:
                  conflicts+=1
                  if valid(entry) and not valid(previous):
                      merged[key]=entry
                  elif valid(entry)==valid(previous) and str(entry.get('fetched_utc',''))>str(previous.get('fetched_utc','')):
                      merged[key]=entry
          atomic(remote/'dart_financial_cache.json',merged)
          mapping=read(remote/'corp_map.json',{})
          mapping.update({k:v for k,v in read(local/'corp_map.json',{}).items() if k not in mapping})
          if mapping: atomic(remote/'corp_map.json',mapping)
          # Filing evidence is additive, independent of financial cache records.
          # Never replace an existing candidate set with less information.
          evidence=read(remote/'dart_disclosure_evidence.json',{})
          new_evidence=read(local/'dart_disclosure_evidence.json',{})
          evidence_conflicts=0
          for key,item in new_evidence.items():
              old_item=evidence.get(key)
              if old_item is None:
                  evidence[key]=item
              elif old_item!=item:
                  evidence_conflicts+=1
                  # Prefer a completed, fuller filing-list scan over an incomplete one.
                  def quality(v):
                      if not isinstance(v,dict): return (-1,0,0)
                      complete = v.get('state') == 'FILING_CANDIDATES_FOUND'
                      return (int(complete), int(v.get('pages_checked',0) or 0),
                              len(v.get('candidates',[]) or []))
                  if quality(item) > quality(old_item):
                      evidence[key]=item
          atomic(remote/'dart_disclosure_evidence.json',evidence)
          current=read(remote/'status.json',{})
          pending=read(local/'status.json',{})
          previous_date=str(current.get('market_date',''))
          incoming_date=str(pending.get('market_date',''))
          if previous_date and incoming_date and incoming_date<previous_date:
              raise SystemExit('BLOCKED_FINANCIAL_DATE_REGRESSION')
          # Keep the snapshot date sourced from the original financial status;
          # never pretend that a KRX evaluation date is a disclosure date.
          status=dict(current)
          status.update(pending)
          status['market_date']=incoming_date or previous_date
          status['cache_records']=len(merged)
          status['disclosure_evidence_records']=len(evidence)
          status['merge_conflicts_seen']=conflicts
          status['disclosure_evidence_conflicts_seen']=evidence_conflicts
          status['financial_disclosure_asof_verified']=False
          status['point_in_time_financials_authorized']=False
          status['investment_decisions_authorized']=False
          status['final_buy_signals']=0
          atomic(remote/'status.json',status)
          env=os.environ.copy();env['R14_REBUILD_ONLY']='1'
          subprocess.run([sys.executable,'scripts/krx_v5_r14_financial_pipeline_n.py'],check=True,env=env)
          print('MERGED',json.dumps({'cache_records':len(merged),'evidence_records':len(evidence),
            'cache_conflicts':conflicts,'evidence_conflicts':evidence_conflicts},ensure_ascii=False))
          PY
      - name: Incremental batches with collision-safe checkpoint commits
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          M_BATCH_LIMIT: '80'
          R14_DISCLOSURE_BATCH_LIMIT: '30'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for batch in 1 2 3 4 5; do
            echo "=== OpenDART batch $batch / 5 ==="
            git fetch origin main
            git reset --hard origin/main
            python scripts/krx_v5_r14_financial_pipeline_n.py
            mkdir -p /tmp/r14-m-pending
            cp -a data/v5_financial_m/. /tmp/r14-m-pending/
            saved=false
            for attempt in 1 2 3 4 5; do
              echo "Checkpoint attempt $attempt / 5"
              git fetch origin main
              git reset --hard origin/main
              python /tmp/merge_r14_m.py
              git add data/v5_financial_m/
              if git diff --cached --quiet; then
                saved=true
                break
              fi
              git commit -m "R14 M: preserve financial and filing-evidence checkpoint batch ${batch}"
              if git push origin HEAD:main; then
                saved=true
                break
              fi
              echo 'Concurrent main update; retrying merged checkpoint'
              sleep 2
            done
            if [ "$saved" != true ]; then
              echo 'ERROR: checkpoint not persisted after 5 merge retries'
              exit 1
            fi
            # Continue if either financial data or disclosure evidence increased.
            if python -c "import json; s=json.load(open('/tmp/r14-m-pending/status.json')); exit(0 if s.get('fetched_this_run',0)==0 and s.get('disclosure_evidence_added_this_run',0)==0 else 1)"; then
              echo 'No new financial records or disclosure evidence; stopping'
              break
            fi
          done
      - name: Upload final checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-r14-dart-auto-checkpoint
          path: |
            data/v5_financial_m/status.json
            data/v5_financial_m/annual_financial_index_m.csv
            data/v5_financial_m/dart_disclosure_evidence.json
          retention-days: 30
  research_grade:
    name: Read-only full-market A/B research validation
    needs: collect
    if: ${{ needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate inputs and research engine
        run: |
          set -euo pipefail
          test -s scripts/krx_v5_r14_grade_engine.py
          test -s data/latest.csv
          test -s data/v5_financial_m/annual_financial_index_m.csv
          test -s data/v5_financial_m/dart_financial_cache.json
          python -m py_compile scripts/krx_v5_r14_grade_engine.py
          python scripts/krx_v5_r14_grade_engine.py --self-test
      - name: Evaluate full market read-only
        run: |
          set -euo pipefail
          mkdir -p /tmp/r14-research
          python scripts/krx_v5_r14_grade_engine.py \
            --financial data/v5_financial_m/annual_financial_index_m.csv \
            --market data/latest.csv \
            --cache data/v5_financial_m/dart_financial_cache.json \
            --output /tmp/r14-research/grade_research.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/r14-research/grade_research.json').read_text(encoding='utf-8'))
          assert r['investment_decisions_authorized'] is False
          assert r['final_buy_signals'] == 0
          assert r['result'] == 'PRELIMINARY_RESEARCH_ONLY'
          assert r['market_rows'] > 0
          print(json.dumps({k:r.get(k) for k in ('market_date','financial_rows','market_rows','candidate_count','excluded_by_reason','final_buy_signals')},ensure_ascii=False))
          PY
      - name: Upload read-only grade research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-r14-grade-research
          path: /tmp/r14-research/grade_research.json
          if-no-files-found: warn
          retention-days: 30
