                  if scripts_before!={str(p):digest(p) for p in script_paths}: raise ValueError('COLLECTOR_CODE_CHANGED_DURING_REPAIR')
                  live_day,live_rows=n.official_market_snapshot()
                  if int(live_day[:4])-1!=year: raise ValueError('ANNUAL_TARGET_CHANGED')
                  with Path('data/latest.csv').open(encoding='utf-8-sig',newline='') as f: live_codes={r['ISU_CD'] for r in csv.DictReader(f)}
                  live=read(CACHE);live_map=read(MAP);live_status=read(STATUS)
                  if live_status.get('market_date')!=live_day or live_status.get('official_market_date')!=live_day or live_status.get('cache_records')!=len(live): raise ValueError('LIVE_MARKET_FINANCIAL_SNAPSHOT_NOT_SYNCHRONIZED')
                  current=read(ATTEMPTS) if ATTEMPTS.exists() else {};old_live=dict(live);written=0;conflicts=0
                  for key,item in pending.items():
                      code=key.split(':')[0];corp=item['corp_code'];candidate=item['candidate'];old=live.get(key,{})
