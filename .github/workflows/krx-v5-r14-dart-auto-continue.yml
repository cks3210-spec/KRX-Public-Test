          MAP=F/'corp_map.json'
          ATTEMPTS=F/'annual_repair_attempts.json'
          STATUS=F/'status.json'
          INDEX=F/'annual_financial_index_m.csv'
          OUT=Path('/tmp/r14-annual-repair')
          FIELDS={'profit','equity','revenue','assets','liabilities'}
