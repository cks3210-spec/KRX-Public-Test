          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def now(): return dt.datetime.now(UTC)
          def parse_date(value):
              try:
                  d=dt.datetime.fromisoformat(str(value));return d if d.tzinfo is not None else None
              except (TypeError,ValueError): return None
          
          def accounts(r):
              if not isinstance(r,dict) or r.get('status')!='000' or r.get('fs_div') not in ('CFS','OFS') or not isinstance(r.get('accounts'),dict): return {}
              return {k:v for k,v in r['accounts'].items() if type(v) is int}
          
          def eligible(cache,mapping,codes,year,attempts,t):
              items=[];counts=Counter()
              for code in sorted(codes):
                  if not re.fullmatch(r'\d{6}',code): counts['identifier_review']+=1;continue
                  corp=str(mapping.get(code,''))
                  if not re.fullmatch(r'\d{8}',corp): counts['mapping_review']+=1;continue
                  key=f'{code}:{year}:annual';old=cache.get(key,{});a=accounts(old)
                  if not isinstance(old,dict): counts['invalid_record_review']+=1;continue
                  if old.get('corp_code') and str(old['corp_code'])!=corp: counts['identity_conflict']+=1;continue
                  if old.get('status')=='000' and (not a or old.get('corp_code')!=corp or str(old.get('year'))!=str(year) or old.get('report')!='annual' or len(a)!=len(old.get('accounts',{}))): counts['invalid_record_review']+=1;continue
                  if FIELDS<=a.keys(): counts['complete_reuse']+=1;continue
                  last=attempts.get(key,{})
                  if not isinstance(last,dict): raise ValueError('INVALID_ATTEMPT_RECORD '+key)
                  due=[parse_date(old.get('retry_after_utc')),parse_date(last.get('retry_after_utc'))]
                  fetched=parse_date(old.get('fetched_utc'))
                  if a and fetched: due.append(fetched+dt.timedelta(days=7))
                  if any(d is not None and d>t for d in due): counts['cooldown']+=1;continue
                  if a: counts['partial_eligible']+=1
                  else: counts['missing_eligible']+=1
                  items.append((bool(a),key,corp,old))
              # Missing records first; partial records after cooldown. Deterministic order.
              return sorted(items,key=lambda x:(x[0],x[1])),dict(counts)
          
          def improvement(old,new,corp,year):
              a,b=accounts(old),accounts(new)
              if not b or new.get('corp_code')!=corp or str(new.get('year'))!=str(year) or new.get('report')!='annual': return 'NO_VALID_RESPONSE'
              if not a:
                  return 'ACCEPTED_NEW' if FIELDS.intersection(b) else 'NO_IMPROVEMENT'
              if old.get('corp_code')!=corp or old.get('fs_div')!=new.get('fs_div'): return 'BASIS_OR_IDENTITY_CONFLICT'
              if any(k in b and b[k]!=v for k,v in a.items()): return 'VALUE_CONFLICT'
              if not a.keys()<=b.keys(): return 'LOSS_OF_EXISTING_FIELDS'
              if not (FIELDS.intersection(b)-FIELDS.intersection(a)): return 'NO_IMPROVEMENT'
