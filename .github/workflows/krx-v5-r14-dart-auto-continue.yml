          def git(*args): return subprocess.run(['git',*args],check=True,text=True,stdout=subprocess.PIPE).stdout.strip()
          
          def main():
              OUT.mkdir(parents=True,exist_ok=True)
              spec=importlib.util.spec_from_file_location('r14_n',ROOT/'scripts/krx_v5_r14_financial_pipeline_n.py')
              n=importlib.util.module_from_spec(spec);spec.loader.exec_module(n)
              m=n.m
              if not m.KEY: raise ValueError('MISSING_DART_API_KEY')
              script_paths=[Path('scripts/krx_v5_r14_financial_pipeline_n.py'),Path('scripts/krx_v5_r14_dart_incremental_m.py')]
              scripts_before={str(p):digest(p) for p in script_paths}
              day,market_rows=n.official_market_snapshot();year=int(day[:4])-1
              with Path('data/latest.csv').open(encoding='utf-8-sig',newline='') as f: codes={r['ISU_CD'] for r in csv.DictReader(f)}
