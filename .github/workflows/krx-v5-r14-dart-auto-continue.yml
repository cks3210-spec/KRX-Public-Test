  repair_annual:
    name: Bounded annual financial missing-field repair
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'repair_annual' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair only missing annual data with protected checkpoint
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          cat > /tmp/r14_annual_repair.py <<'PYTHON'
          import csv, datetime as dt, hashlib, importlib.util, json, os, re, subprocess, sys, time
          from collections import Counter
          from pathlib import Path
          
          ROOT=Path.cwd()
          F=Path('data/v5_financial_m')
