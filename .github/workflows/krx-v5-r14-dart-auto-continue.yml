                  audit[key]={'result':result,'checked_utc':t.isoformat(),'retry_after_utc':(t+dt.timedelta(days=delay)).isoformat(),'api_calls':budget['calls']-start,'market_date':day,'run_id':run_id}
                  if result.startswith(('STOP_API_','FETCH_EXCEPTION_','RESPONSE_IDENTITY_UNVERIFIED_','RESPONSE_BASIS_CONFLICT','CURRENCY_UNSUPPORTED','INVALID_RESPONSE')): stop=result
