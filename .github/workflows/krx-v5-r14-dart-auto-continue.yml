name: KRX v5 R14 OpenDART Auto Continue
on:
  workflow_dispatch:
  schedule:
    # 21:30 KST daily
    - cron: '30 12 * * *'
permissions:
  contents: write
concurrency:
  group: krx-v5-r14-dart-m
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate collector and key
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DART_API_KEY" || { echo 'DART_API_KEY secret missing'; exit 1; }
          test -s scripts/krx_v5_r14_dart_incremental_m.py
          test -s scripts/krx_v5_r14_financial_pipeline_n.py
          test -s data/v5_financial_foundation_l/unified_financial_index.csv
          python -m py_compile scripts/krx_v5_r14_dart_incremental_m.py scripts/krx_v5_r14_financial_pipeline_n.py
      - name: Prepare safe cache merger
        run: |
          cat > /tmp/merge_r14_m.py <<'PY'
          import csv, datetime as dt, json, os
          from pathlib import Path
          remote=Path('data/v5_financial_m')
          local=Path('/tmp/r14-m-pending')
          remote.mkdir(parents=True,exist_ok=True)
          def read(p, default):
              try: return json.loads(p.read_text(encoding='utf-8-sig'))
              except (OSError,ValueError): return default
          def verified(r):
              return isinstance(r,dict) and r.get('status')=='000' and bool(r.get('accounts'))
          old=read(remote/'dart_financial_cache.json',{})
          new=read(local/'dart_financial_cache.json',{})
          merged=dict(old)
          conflicts=0
          for key,entry in new.items():
              previous=merged.get(key)
              if previous is None:
                  merged[key]=entry
              elif previous!=entry:
                  conflicts+=1
                  if verified(entry) and not verified(previous):
                      merged[key]=entry
                  elif verified(entry)==verified(previous) and str(entry.get('fetched_utc',''))>str(previous.get('fetched_utc','')):
                      merged[key]=entry
          def atomic_json(path,obj):
              tmp=path.with_suffix('.tmp')
              tmp.write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
              tmp.replace(path)
          atomic_json(remote/'dart_financial_cache.json',merged)
          for filename in ('corp_map.json',):
              mapping=read(remote/filename,{})
              mapping.update({k:v for k,v in read(local/filename,{}).items() if k not in mapping})
              if mapping: atomic_json(remote/filename,mapping)
          def csvrows(path):
              if not path.exists(): return []
              with path.open(encoding='utf-8-sig',newline='') as f: return list(csv.DictReader(f))
          # Preserve the full market index and refresh values from the merged cache.
          indexed={r['code']:r for r in csvrows(remote/'annual_financial_index_m.csv') if r.get('code')}
          indexed.update({r['code']:r for r in csvrows(local/'annual_financial_index_m.csv') if r.get('code') and r['code'] not in indexed})
          market=read(remote/'status.json',{})
          pending=read(local/'status.json',{})
          market_date=market.get('market_date') or pending.get('market_date') or ''
          year=int(market_date[:4])-1 if len(market_date)>=4 else dt.date.today().year-1
          def roe(p,e,prior):
              if p is None or e is None or prior is None or e<=0 or prior<=0: return ''
              return round(100*p/((e+prior)/2),4)
          fields=['code','year','fs_div','annual_profit','equity','prior_equity','annual_roe_pct','source','ttm_profit','ttm_status']
          for code,row in indexed.items():
              entry=merged.get(f'{code}:{year}:annual',{})
              if not verified(entry): continue
              a=entry['accounts']
              row.update(year=str(year),fs_div=entry.get('fs_div',''),annual_profit=a.get('profit',''),equity=a.get('equity',''),prior_equity=a.get('previous_equity',''),annual_roe_pct=roe(a.get('profit'),a.get('equity'),a.get('previous_equity')),source='OpenDART fnlttSinglAcntAll',ttm_profit='',ttm_status='NOT_YET_COMPUTED')
          if indexed:
              p=remote/'annual_financial_index_m.csv'
              with p.open('w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore');w.writeheader();w.writerows(indexed[k] for k in sorted(indexed))
          status=dict(market)
          status.update({k:v for k,v in pending.items() if k not in ('cache_records','annual_verified_rows')})
          status.update(cache_records=len(merged),annual_verified_rows=sum(verified(v) for k,v in merged.items() if k.endswith(f':{year}:annual')),merge_conflicts_seen=conflicts,generated_utc=dt.datetime.now(dt.timezone.utc).isoformat())
          atomic_json(remote/'status.json',status)
          # Rebuild strict TTM after merging the latest remote and pending cache.
          import subprocess, sys
          env=os.environ.copy(); env['R14_REBUILD_ONLY']='1'
          subprocess.run([sys.executable,'scripts/krx_v5_r14_financial_pipeline_n.py'],check=True,env=env)
          print('MERGED',json.dumps({'cache_records':len(merged),'annual_verified_rows':status['annual_verified_rows'],'conflicts_seen':conflicts},ensure_ascii=False))
          PY
      - name: Incremental batches with collision-safe checkpoint commits
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          M_BATCH_LIMIT: '80'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for batch in 1 2 3 4 5; do
            echo "=== OpenDART batch $batch / 5 ==="
            git fetch origin main
            git reset --hard origin/main
            python scripts/krx_v5_r14_financial_pipeline_n.py
            mkdir -p /tmp/r14-m-pending
            cp -a data/v5_financial_m/. /tmp/r14-m-pending/
            saved=false
            for attempt in 1 2 3 4 5; do
              echo "Checkpoint attempt $attempt / 5"
              git fetch origin main
              git reset --hard origin/main
              python /tmp/merge_r14_m.py
              git add data/v5_financial_m/
              if git diff --cached --quiet; then
                saved=true
                break
              fi
              git commit -m "R14 M: safe OpenDART checkpoint batch ${batch}"
              if git push origin HEAD:main; then
                saved=true
                break
              fi
              echo 'Concurrent main update detected; refreshing and merging before retry'
              sleep 2
            done
            if [ "$saved" != true ]; then
              echo 'ERROR: checkpoint not persisted after 5 merge retries'
              exit 1
            fi
            # A batch with no newly fetched records indicates nothing remains to fetch.
            if python -c "import json; s=json.load(open('/tmp/r14-m-pending/status.json')); exit(0 if s.get('fetched_this_run',0)==0 else 1)"; then
              echo 'No additional records fetched; stopping'
              break
            fi
          done
      - name: Upload final checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-r14-dart-auto-checkpoint
          path: |
            data/v5_financial_m/status.json
            data/v5_financial_m/annual_financial_index_m.csv
          retention-days: 30
