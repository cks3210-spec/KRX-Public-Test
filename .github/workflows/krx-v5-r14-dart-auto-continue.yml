              if before.get('market_date')!=day or before.get('official_market_date')!=day or before.get('cache_records')!=len(cache): raise ValueError('MARKET_FINANCIAL_SNAPSHOT_NOT_SYNCHRONIZED')
              attempts=read(ATTEMPTS) if ATTEMPTS.exists() else {}
              items,counts=eligible(cache,mapping,codes,year,attempts,now())
              budget={'calls':0};pending={};audit={};stop='';run_id=os.getenv('GITHUB_RUN_ID','')
              report={'state':'RUNNING','market_date':day,'annual_year':year,'market_rows':market_rows,'eligible_counts':counts,'max_api_calls':MAX_CALLS,'api_calls':0,'cache_records_before':len(cache),'accepted':0,'production_data_modified':False,'investment_decisions_authorized':False,'financial_disclosure_asof_verified':False,'final_buy_signals':0,'run_id':run_id}
              def checkpoint():
                  report.update(api_calls=budget['calls'],attempted=len(audit),accepted=sum(v['result'].startswith('ACCEPTED_') for v in audit.values()),results=dict(Counter(v['result'] for v in audit.values())),stop_reason=stop)
                  save(OUT/'status.json',report);save(OUT/'attempts.json',audit);save(OUT/'pending.json',pending)
              checkpoint()
