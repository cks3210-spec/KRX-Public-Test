name: KRX v5 Receipt and Financial Recheck
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recheck 2025 and 2026 half-year receipts and financial figures
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          cat > /tmp/unpack.py <<'PY'
          import base64,gzip,pathlib
          pathlib.Path('receipt_period_corrected_96.csv').write_bytes(gzip.decompress(base64.b64decode('')))
          pathlib.Path('dart_disclosure_audit.csv').write_bytes(gzip.decompress(base64.b64decode('')))
          PY
          python /tmp/unpack.py
          cat > /tmp/recheck.py <<'PY'
          import csv,io,os,json,urllib.parse,urllib.request,datetime,collections,decimal
          from pathlib import Path

          def fetch(endpoint,key,**params):
           q=urllib.parse.urlencode({'crtfc_key':key,**params}); req=urllib.request.Request('https://opendart.fss.or.kr/api/'+endpoint+'?'+q,headers={'User-Agent':'KRX-v5-research/1.0'})
           with urllib.request.urlopen(req,timeout=35) as r:return json.load(r)

          def number(v):
           try:return decimal.Decimal(str(v).replace(',','').strip())
           except:return None

          def extract(items,kind):
           ids={'revenue':('ifrs-full_Revenue','ifrs_Revenue','dart_RevenueFromSaleOfGoods','dart_RevenueFromRenderingOfServices'), 'op':('dart_OperatingIncomeLoss','ifrs-full_ProfitLossFromOperatingActivities'), 'liabilities':('ifrs-full_Liabilities','ifrs_Liabilities'), 'equity':('ifrs-full_Equity','ifrs_Equity'), 'ocf':('ifrs-full_CashFlowsFromUsedInOperatingActivities','ifrs_CashFlowsFromUsedInOperatingActivities')}
           sj={'revenue':('IS','CIS'),'op':('IS','CIS'),'liabilities':('BS',),'equity':('BS',),'ocf':('CF',)}
           matched=[r for r in items if r.get('account_id') in ids[kind] and r.get('sj_div') in sj[kind] and (not r.get('account_detail') or r.get('account_detail')=='-')]
           vals={number(r.get('thstrm_amount')) for r in matched};vals.discard(None)
           return next(iter(vals)) if len(vals)==1 else None

          def main():
           key=os.getenv('DART_API_KEY') or os.getenv('OPENDART_API_KEY');assert key,'Missing DART secret'
           src=Path(os.environ.get('SEED_CSV','receipt_period_corrected_96.csv'));corp=Path(os.environ.get('CORP_CSV','dart_disclosure_audit.csv'))
           base=list(csv.DictReader(src.open(encoding='utf-8-sig')));lookup={r['code']:r['corp_code'] for r in csv.DictReader(corp.open(encoding='utf-8-sig'))}
           out=[];api_errors=[]
           for i,r in enumerate(base,1):
            code=r['code'];cc=lookup.get(code,'');date=r['evaluation_price_date'];rec={'code':code,'name':r['name'],'evaluation_price_date':date,'corp_code':cc,'report_code':'11012','2026_receipt_no':'','2026_filing_date':'','2025_receipt_no':'','2025_filing_date':'','receipt_status':'','amount_status':'NOT_VERIFIED','growth_match':'','op_growth_match':'','debt_ratio_match':'','ocf_match':'','reason':'','final_grade':'WITHHELD'}
            if not cc:rec['receipt_status']='NO_CORP_CODE';out.append(rec);continue
            filing={}
            for yr in (2025,2026):
             try:
              x=fetch('list.json',key,corp_code=cc,bgn_de=f'{yr}0701',end_de=f'{yr}1231',pblntf_ty='A',page_count=100)
              if x.get('status')!='000':rec['reason']+=f'LIST_{yr}_{x.get("status")};';continue
              matches=[v for v in x.get('list',[]) if v.get('report_nm','').startswith('반기보고서 (') and f'{yr}.06' in v.get('report_nm','')]
              # Multiple corrections: choose latest filing available as of evaluation date.
              eligible=[v for v in matches if v.get('rcept_dt','')<=date]
              if eligible:filing[yr]=max(eligible,key=lambda v:(v.get('rcept_dt',''),v.get('rcept_no','')))
              elif matches:rec['reason']+=f'FILING_{yr}_AFTER_EVALUATION;'
              else:rec['reason']+=f'NO_HALF_YEAR_FILING_{yr};'
             except Exception as e:rec['reason']+=f'LIST_{yr}_REQUEST_ERROR;';api_errors.append([code,yr,str(e)[:100]])
            for yr,v in filing.items():rec[f'{yr}_receipt_no']=v.get('rcept_no','');rec[f'{yr}_filing_date']=v.get('rcept_dt','')
            if len(filing)!=2:rec['receipt_status']='MISSING_ELIGIBLE_RECEIPT';out.append(rec);continue
            rec['receipt_status']='BOTH_RECEIPTS_BEFORE_EVALUATION'
            financial={};valid=True
            for yr in (2025,2026):
             financial[yr]=None
             for fs in ('CFS','OFS'):
              try:
               x=fetch('fnlttSinglAcntAll.json',key,corp_code=cc,bsns_year=str(yr),reprt_code='11012',fs_div=fs)
               if x.get('status')=='000' and x.get('list'):
                items=x['list'];receipts={v.get('rcept_no') for v in items if v.get('rcept_no')}
                if filing[yr]['rcept_no'] not in receipts:continue
                vals={k:extract(items,k) for k in ('revenue','op','liabilities','equity','ocf')}
                financial[yr]=(fs,vals);break
              except Exception as e:api_errors.append([code,yr,str(e)[:100]])
             if financial[yr] is None:rec['reason']+=f'NO_RECEIPT_MATCHED_FINANCIALS_{yr};';valid=False
            if not valid:rec['amount_status']='RECEIPT_FINANCIALS_NOT_MATCHED';out.append(rec);continue
            if financial[2025][0]!=financial[2026][0]:rec['amount_status']='CFS_OFS_MISMATCH';out.append(rec);continue
            a=financial[2025][1];b=financial[2026][1]
            def eq(expected,actual):
             v=number(expected)
             if v is None or actual is None:return 'MISSING'
             return 'MATCH' if abs(v-actual)<=max(decimal.Decimal('0.015'),abs(actual)*decimal.Decimal('0.00005')) else 'MISMATCH'
            def growth(k):return (b[k]/a[k]-1)*100 if a[k] not in (None,0) and b[k] is not None else None
            rec['growth_match']=eq(r['revenue_growth_pct'],growth('revenue'))
            rec['op_growth_match']=eq(r['operating_profit_growth_pct'],growth('op'))
            rec['debt_ratio_match']=eq(r['debt_ratio_pct'],b['liabilities']/b['equity']*100 if b['liabilities'] is not None and b['equity'] not in (None,0) else None)
            rec['ocf_match']=eq(r['operating_cashflow'],b['ocf'])
            rec['amount_status']='ALL_FOUR_MATCH' if all(rec[k]=='MATCH' for k in ('growth_match','op_growth_match','debt_ratio_match','ocf_match')) else 'PARTIAL_OR_MISMATCH'
            out.append(rec)
            print(i,code,rec['receipt_status'],rec['amount_status'],flush=True)
           root=Path('v5_receipt_recheck');root.mkdir(exist_ok=True)
           with (root/'receipt_financial_audit_96.csv').open('w',encoding='utf-8-sig',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(out[0]));w.writeheader();w.writerows(out)
           (root/'status.json').write_text(json.dumps({'count':len(out),'receipt_status':dict(collections.Counter(x['receipt_status'] for x in out)),'amount_status':dict(collections.Counter(x['amount_status'] for x in out)),'api_errors':api_errors,'note':'No new A/B grades or backtest. Original figures are verified only if same-receipt source values reproduce all four indicators.'},ensure_ascii=False,indent=2))
          if __name__=='__main__':main()
          PY
          python /tmp/recheck.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-receipt-financial-recheck
          path: v5_receipt_recheck/
          if-no-files-found: warn
