name: KRX v5 R14 Financial Foundation L
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: krx-v5-r14-foundation-l
  cancel-in-progress: false
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidate cached financials without re-running F through K
        run: |
          set -euo pipefail
          python -m py_compile scripts/krx_v5_r14_financial_foundation_l.py
          python scripts/krx_v5_r14_financial_foundation_l.py
      - name: Upload L outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-r14-financial-foundation-l
          path: data/v5_financial_foundation_l/
          retention-days: 90
      - name: Save L outputs only
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -a data/v5_financial_foundation_l /tmp/r14-foundation-l
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/v5_financial_foundation_l
            cp -a /tmp/r14-foundation-l/. data/v5_financial_foundation_l/
            git add data/v5_financial_foundation_l/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'R14 L consolidate existing financial cache evidence'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
