name: KRX v5 DART Disclosure Evidence Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit DART periodic filing dates for 96 research candidates
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        shell: bash
        run: |
          cat > /tmp/v5_dart_audit.py <<'PY'
          import os,csv,io,zipfile,xml.etree.ElementTree as ET,json,urllib.request,urllib.parse,datetime,pathlib,base64,gzip
          key=os.environ.get('DART_API_KEY') or os.environ.get('OPENDART_API_KEY')
          if not key:raise SystemExit('DART_API_KEY or OPENDART_API_KEY missing')
          seed=csv.DictReader(io.StringIO(gzip.decompress(base64.b64decode('')).decode('utf-8-sig')))
          candidates={str(r['code']).zfill(6) for r in seed}
          root=pathlib.Path('data/v5_forward_validation');root.mkdir(parents=True,exist_ok=True)
          def get(url,params):
           q=urllib.parse.urlencode(params);req=urllib.request.Request(url+'?'+q,headers={'User-Agent':'KRX-v5-research/1.0'})
           with urllib.request.urlopen(req,timeout=45) as response:return response.read()
          raw=get('https://opendart.fss.or.kr/api/corpCode.xml',{'crtfc_key':key})
          with zipfile.ZipFile(io.BytesIO(raw)) as z:tree=ET.fromstring(z.read(z.namelist()[0]))
          lookup={e.findtext('stock_code','').strip():e.findtext('corp_code','').strip() for e in tree.findall('list') if e.findtext('stock_code','').strip()}
          rows=[];today=datetime.date.today();end=today.strftime('%Y%m%d');start=(today-datetime.timedelta(days=550)).strftime('%Y%m%d')
          for code in sorted(candidates):
           corp=lookup.get(code,'');row=dict(code=code,corp_code=corp,filing_date='',receipt_no='',report_name='',report_year='',report_code='',status='NO_CORP_CODE' if not corp else 'NO_PERIODIC_REPORT',api_status='')
           if corp:
            try:
             payload=json.loads(get('https://opendart.fss.or.kr/api/list.json',{'crtfc_key':key,'corp_code':corp,'bgn_de':start,'end_de':end,'pblntf_ty':'A','page_count':100,'sort':'date','sort_mth':'desc'}))
             row['api_status']=payload.get('status','')
             if payload.get('status')=='000':
              reports=[]
              for r in payload.get('list',[]):
               nm=r.get('report_nm','');d=r.get('rcept_dt','')
               # Only exact primary periodic report, not audit/correction/other report.
               kinds=[('사업보고서','11011'),('반기보고서','11012'),('분기보고서','11013')]
               if nm.startswith('사업보고서 (') or nm.startswith('반기보고서 (') or nm.startswith('분기보고서 ('):
                typ=next(((n,c) for n,c in kinds if nm.startswith(n+' (')),None)
                if typ:reports.append((d,r,typ))
              if reports:
               d,r,typ=max(reports,key=lambda x:x[0]);row.update(filing_date=d,receipt_no=r.get('rcept_no',''),report_name=r.get('report_nm',''),report_year=r.get('report_nm',''),report_code=typ[1],status='DISCLOSURE_FOUND_NOT_FEATURE_VERIFIED')
             elif payload.get('status') not in ('013',):row['status']='API_ERROR'
            except Exception as e:row['status']='REQUEST_ERROR';row['api_status']=str(e)[:120]
           rows.append(row)
          fields=list(rows[0]);out=root/'dart_disclosure_audit.csv'
          with out.open('w',encoding='utf-8',newline='') as f:w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          counts={k:sum(r['status']==k for r in rows) for k in sorted({r['status'] for r in rows})}
          (root/'dart_disclosure_status.json').write_text(json.dumps({'candidate_count':len(candidates),'counts':counts,'note':'Disclosure metadata only. No verified_features.csv or A/B grades generated. Receipt date alone does not prove the financial figures used by the model were available at entry time.'},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(counts,ensure_ascii=False))
          PY
          python /tmp/v5_dart_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v5-dart-disclosure-audit
          path: |
            data/v5_forward_validation/dart_disclosure_audit.csv
            data/v5_forward_validation/dart_disclosure_status.json
          if-no-files-found: error
