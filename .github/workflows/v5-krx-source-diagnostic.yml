name: KRX v5 Source Diagnostic - HTTP Response
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Inspect upstream responses without changing production data
        shell: bash
        run: |
          mkdir -p v5_reports/source_diagnostic
          cat > /tmp/diagnose.py <<'PY'
          import datetime,json,pathlib,requests,time
          from zoneinfo import ZoneInfo
          root=pathlib.Path('v5_reports/source_diagnostic')
          now=datetime.datetime.now(ZoneInfo('Asia/Seoul'))
          dates=[(now.date()-datetime.timedelta(days=i)).strftime('%Y%m%d') for i in range(1,6)]
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; KRX-research-diagnostic/1.0)','Accept':'application/json, text/plain, */*'})
          checks=[]
          targets=[
            ('krx_main','https://data.krx.co.kr/'),
            ('krx_json','http://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd'),
            ('naver_market','https://finance.naver.com/sise/sise_market_sum.naver?sosok=0&page=1'),
            ('fdr_listing','https://raw.githubusercontent.com/FinanceData/FinanceDataReader/master/README.md'),
          ]
          for name,url in targets:
            try:
              if name=='krx_json':
                response=session.post(url.replace('http:','https:'),data={'bld':'dbms/MDC/STAT/standard/MDCSTAT01501','locale':'ko_KR','mktId':'STK','trdDd':dates[0],'share':'1','money':'1','csvxls_isNo':'false'},timeout=15,headers={'Referer':'https://data.krx.co.kr/'})
              else:response=session.get(url,timeout=15)
              checks.append({'source':name,'status_code':response.status_code,'content_type':response.headers.get('Content-Type',''),'response_bytes':len(response.content),'response_preview':response.text[:180].replace('\n',' '),'json_keys':list(response.json())[:15] if 'json' in response.headers.get('Content-Type','').lower() and isinstance(response.json(),dict) else []})
            except Exception as e:checks.append({'source':name,'error':str(e)[:300]})
            time.sleep(.3)
          status={'status':'DIAGNOSTIC_ONLY','checked_kst':now.isoformat(),'attempted_reference_dates':dates,'checks':checks,'production_data_modified':False,'next_step':'Choose validated source only after examining HTTP responses; no fabricated prices.'}
          (root/'http_probe.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status,ensure_ascii=False,indent=2))
          PY
          python /tmp/diagnose.py
      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_reports/source_diagnostic/
          if ! git diff --cached --quiet; then
            git commit -m 'v5: diagnose upstream market data responses'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-krx-http-diagnostic
          path: v5_reports/source_diagnostic/
