name: KRX v5 Forward Validation Archive
on:
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * 1-5' # 19:35 KST on weekdays; stale market dates are not re-added
permissions:
  contents: write
concurrency:
  group: v5-forward-validation-main
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Archive candidate closes and track forward outcomes
        shell: bash
        run: |
          cat > /tmp/v5_forward.py <<'PY'
          import csv, io, json, os, pathlib, datetime, base64, gzip
          ROOT=pathlib.Path('data/v5_forward_validation');ROOT.mkdir(parents=True,exist_ok=True)
          def load(p):
           if not pathlib.Path(p).exists():return []
           with open(p,encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def write(p,rows,fields):
           with open(p,'w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          seed=csv.DictReader(io.StringIO(gzip.decompress(base64.b64decode('')).decode('utf-8-sig')))
          candidates={str(r['code']).zfill(6):r for r in seed}
          latest=load('data/latest.csv')
          if not latest:raise SystemExit('No data/latest.csv; cannot snapshot')
          dates={r.get('BAS_DD','') for r in latest}
          if len(dates)!=1 or not next(iter(dates)).isdigit():raise SystemExit('Mixed or invalid market dates')
          date=next(iter(dates))
          if len(date)!=8:raise SystemExit('Invalid date')
          if date>datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime('%Y%m%d'):raise SystemExit('Future market date')
          archive=ROOT/'market_closes.csv'; existing=load(archive)
          fields=['date','code','market','close','name']
          known={(r['date'],r['code']) for r in existing}
          new=[]
          for r in latest:
           code=str(r.get('ISU_CD','')).zfill(6)
           if code not in candidates or (date,code) in known:continue
           try:close=float(str(r.get('TDD_CLSPRC','')).replace(',',''))
           except ValueError:continue
           if close<=0:continue
           new.append(dict(date=date,code=code,market=r.get('MARKET',''),close=str(close),name=r.get('ISU_NM','')))
          if new:
           existing+=new;existing.sort(key=lambda r:(r['date'],r['code']));write(archive,existing,fields)
          # A forward entry must have a timestamped contemporaneous model feature record.
          # This workflow does NOT invent model scores, disclosure dates, or backtest entries.
          features=load(ROOT/'verified_features.csv')
          entries=load(ROOT/'entries.csv');entryfields=['entry_date','code','entry_close','model_version','feature_asof','disclosure_date','score','grade']
          entrykeys={(r['entry_date'],r['code'],r['model_version']) for r in entries}
          bycode={r['code']:r for r in new}
          newentries=0;blocked=0
          for f in features:
           code=str(f.get('code','')).zfill(6)
           if code not in bycode:continue
           asof=f.get('feature_asof','');disclosed=f.get('disclosure_date','');version=f.get('model_version','')
           if not (len(asof)==8 and asof.isdigit() and len(disclosed)==8 and disclosed.isdigit() and asof<=date and disclosed<=date and version and f.get('score') and f.get('grade') in ('A','B')):
            blocked+=1;continue
           key=(date,code,version)
           if key in entrykeys:continue
           entries.append(dict(entry_date=date,code=code,entry_close=bycode[code]['close'],model_version=version,feature_asof=asof,disclosure_date=disclosed,score=f['score'],grade=f['grade']));newentries+=1
          if entries:write(ROOT/'entries.csv',entries,entryfields)
          # Count only distinct archived market dates after the entry date (never calendar days).
          price={(r['date'],r['code']):float(r['close']) for r in existing}
          all_dates=sorted({r['date'] for r in existing})
          results=[]
          for e in entries:
           future=[d for d in all_dates if d>e['entry_date']]
           for h in (5,10,20):
            result=dict(entry_date=e['entry_date'],code=e['code'],model_version=e['model_version'],horizon=h,target_date='',target_close='',return_pct='',result='PENDING')
            if len(future)>=h:
             target=future[h-1];p=price.get((target,e['code']))
             if p is not None:
              result.update(target_date=target,target_close=p,return_pct=round((p/float(e['entry_close'])-1)*100,4),result='DONE')
            results.append(result)
          if results:write(ROOT/'forward_performance.csv',results,['entry_date','code','model_version','horizon','target_date','target_close','return_pct','result'])
          status=dict(market_date=date,new_market_rows=len(new),archived_rows=len(existing),candidate_count=len(candidates),verified_feature_rows=len(features),new_entries=newentries,total_entries=len(entries),blocked_feature_rows=blocked,performance_done=sum(r['result']=='DONE' for r in results),performance_pending=sum(r['result']=='PENDING' for r in results),status='WAITING_FOR_VERIFIED_FEATURES' if not entries else 'TRACKING',note='Existing 954 historical rows are not modified. Forward model performance requires verified_features.csv with point-in-time evidence.')
          (ROOT/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(status,ensure_ascii=False))
          PY
          python /tmp/v5_forward.py
      - name: Commit changed archive only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v5_forward_validation/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive KRX v5 forward validation snapshot'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v5-forward-validation
          path: data/v5_forward_validation/
          if-no-files-found: error
