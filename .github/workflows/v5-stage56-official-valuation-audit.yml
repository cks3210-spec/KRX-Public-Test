name: V5 Stage56 Official PER PBR Auto Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run KRX official valuation field probe
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          python scripts/v5_stage56_auto_valuation.py
      - name: Upload Stage56 audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-stage56-auto-valuation-audit
          path: stage56_output/
