name: KRX v5 Integrated Quality Gate 50 (One Click)
on:
  workflow_dispatch: 
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
    - name: Run growth and quality trial
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
        KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      shell: bash
      run: "python - <<'PYCODE'\nimport os,csv,json,io,zipfile,urllib.request,urllib.parse,datetime,time,base64,gzip,pathlib,collections,math,xml.etree.ElementTree as ET,re\nOUT=pathlib.Path('v5_cashflow_50_result');OUT.mkdir(exist_ok=True)\nKST=datetime.timezone(datetime.timedelta(hours=9));TODAY=datetime.datetime.now(KST).date()\nCAND=json.loads(gzip.decompress(base64.b64decode('')).decode())\nDKEY=next((os.getenv(x,'').strip() for x in ('DART_API_KEY','OPENDART_API_KEY','OPEN_DART_API_KEY') if os.getenv(x,'').strip()),'')\nKKEY=os.getenv('KRX_API_KEY','').strip()\nstatus={'run_date_kst':str(TODAY),'candidate_count':len(CAND),'production_data_modified':False,'final_investment_grades_created':0,'official_market_verified':False,'warnings':[],'method':'growth_quality_trial_v1','grade_policy':'TRIAL_ONLY'}\ndef request(url,params=None,headers=None,binary=False):\n    if params:url+='?'+urllib.parse.urlencode(params)\n    for attempt in range(3):\n        try:\n            with urllib.request.urlopen(urllib.request.Request(url,headers=headers or {'User-Agent':'KRX-v5-audit/1.0'}),timeout=28) as res:data=res.read()\n            return data if binary else json.loads(data.decode('utf-8-sig'))\n        except Exception:\n            if attempt==2:raise\n            time.sleep(1.5*(attempt+1))\ndef dart(ep,**params):\n    obj=request('https://opendart.fss.or.kr/api/'+ep+'.json',dict(crtfc_key=DKEY,**params))\n    if obj.get('status') not in ('000','013'):raise RuntimeError('DART_'+ep+'_'+str(obj.get('status')))\n    return obj\n\ndef num(s):\n    try:\n        if s is None or str(s).strip() in ('','-'):return None\n        v=float(str(s).replace(',',''))\n        return v if math.isfinite(v) else None\n    except (ValueError,TypeError):return None\n\ndef pick(items,ids,section):\n    for aid in ids:\n        matches=[r for r in items if r.get('sj_div') in section and r.get('account_id')==aid and r.get('account_detail','-') in ('-','')]\n        if len(matches)==1:return matches[0]\n    return None\nACCOUNTS={\n'revenue':(['ifrs-full_Revenue','ifrs_Revenue','ifrs-full_RevenueFromContractsWithCustomers'],['IS','CIS']),\n'operating_profit':(['dart_OperatingIncomeLoss'],['IS','CIS']),\n'net_parent':(['ifrs-full_ProfitLossAttributableToOwnersOfParent','ifrs_ProfitLossAttributableToOwnersOfParent'],['IS','CIS']),\n'net_total':(['ifrs-full_ProfitLoss','ifrs_ProfitLoss'],['IS','CIS']),\n'equity_parent':(['ifrs-full_EquityAttributableToOwnersOfParent','ifrs_EquityAttributableToOwnersOfParent'],['BS']),\n'equity_total':(['ifrs-full_Equity','ifrs_Equity'],['BS']),\n'liabilities':(['ifrs-full_Liabilities','ifrs_Liabilities'],['BS']),\n'current_assets':(['ifrs-full_CurrentAssets','ifrs_CurrentAssets'],['BS']),\n'current_liabilities':(['ifrs-full_CurrentLiabilities','ifrs_CurrentLiabilities'],['BS']),\n'cashflow':(['ifrs-full_CashFlowsFromUsedInOperatingActivities','ifrs_CashFlowsFromUsedInOperatingActivities','ifrs-full_CashFlowsFromUsedInOperations','ifrs_CashFlowsFromUsedInOperations'],['CF'])}\ndef extract(items,field='thstrm_amount',interim=False):\n    result={}\n    for key,(ids,sections) in ACCOUNTS.items():\n        item=pick(items,ids,sections)\n        if key=='cashflow' and item is None:\n            # Standard taxonomy IDs vary; use a narrowly defined Korean label fallback.\n            # Ambiguous matches are deliberately rejected, never guessed.\n            aliases={'영업활동현금흐름','영업활동으로인한현금흐름','영업활동으로부터의현금흐름','영업활동으로인한현금흐름(순액)'}\n            matches=[r for r in items if r.get('sj_div')=='CF' and re.sub(r'\\s+','',r.get('account_nm','')) in aliases and r.get('account_detail','-') in ('-','')]\n            if len(matches)==1:item=matches[0]\n        amountfield=('thstrm_add_amount' if interim and key in ('revenue','operating_profit','net_parent','net_total','cashflow') else field)\n        # Never silently use quarterly 3-month amount as YTD.\n        value=num(item.get(amountfield)) if item else None\n        if key=='cashflow' and item is not None and value is None and interim:\n            # CF in interim statements is cumulative YTD; some filings only populate thstrm_amount.\n            value=num(item.get('thstrm_amount'))\n        result[key]=value\n    return result\n\ndef growth(a,b):return None if a is None or b is None or b<=0 else (a/b-1)*100\ndef ratio(a,b):return None if a is None or b is None or b<=0 else a/b\ndef clamp(x,lo,hi):return max(lo,min(hi,x))\ndef scale(v,lo,hi):return None if v is None else round(clamp((v-lo)/(hi-lo),0,1)*100,2)\nmarket={};date=''\ntry:\n    with open('data/latest.csv',encoding='utf-8-sig',newline='') as f:allrows=list(csv.DictReader(f))\n    dates=sorted({r.get('BAS_DD','') for r in allrows if re.fullmatch(r'\\d{8}',r.get('BAS_DD',''))})\n    date=dates[-1]\n    market={r['ISU_CD'].strip().zfill(6):r for r in allrows if r.get('BAS_DD')==date}\n    status.update(market_date=date,market_rows=len(market),market_age_days=(TODAY-datetime.datetime.strptime(date,'%Y%m%d').date()).days)\nexcept Exception as e:status['warnings'].append('MARKET_INPUT_ERROR:'+str(e)[:100])\nif KKEY and date:\n    try:\n        official={}\n        for ep in ('sto/stk_bydd_trd','sto/ksq_bydd_trd'):\n            obj=request('https://data-dbg.krx.co.kr/svc/apis/'+ep,{'basDd':date},{'AUTH_KEY':KKEY,'User-Agent':'KRX-v5-audit/1.0'})\n            for x in obj.get('OutBlock_1',[]):\n                k=x.get('ISU_CD','').strip().zfill(6)\n                if k in official:raise ValueError('OFFICIAL_DUPLICATE_CODE')\n                official[k]=x\n        diff=[k for k,x in market.items() if k not in official or num(x.get('MKTCAP'))!=num(official[k].get('MKTCAP')) or num(x.get('TDD_CLSPRC'))!=num(official[k].get('TDD_CLSPRC'))]\n        status.update(official_rows=len(official),market_mismatch_count=len(diff),official_market_verified=bool(market) and set(official)==set(market) and not diff)\n    except Exception as e:status['warnings'].append('KRX_API_ERROR:'+str(e)[:120])\nelse:status['warnings'].append('KRX_KEY_MISSING_OR_MARKET_MISSING')\ncorp={}\nif DKEY:\n    try:\n        raw=request('https://opendart.fss.or.kr/api/corpCode.xml',{'crtfc_key':DKEY},binary=True)\n        with zipfile.ZipFile(io.BytesIO(raw)) as zz:root=ET.fromstring(zz.read('CORPCODE.xml'))\n        corp={x.findtext('stock_code'):x.findtext('corp_code') for x in root.findall('list') if x.findtext('stock_code')}\n    except Exception as e:status['warnings'].append('DART_CORP_ERROR:'+str(e)[:120])\nelse:status['warnings'].append('DART_KEY_MISSING')\n\nrows=[]\nfor i,c in enumerate(CAND):\n    code=c['code'].zfill(6);m=market.get(code,{});cap=num(m.get('MKTCAP'))\n    record={'code':code,'name':c['name'],'market_date':date,'marketcap_krw':cap,'fs_div':'','latest_period':'','filing_date':'','revenue_growth_yoy_pct':None,'operating_profit_growth_yoy_pct':None,'revenue_cagr_2yr_pct':None,'operating_margin_pct':None,'roe_ttm_pct':None,'debt_to_equity_pct':None,'current_ratio_pct':None,'operating_cashflow_ttm_krw':None,'cash_conversion_ratio':None,'per_ttm':None,'pbr':None,'growth_score':None,'profitability_score':None,'stability_score':None,'valuation_score':None,'cashflow_score':None,'total_trial_score':None,'data_coverage_pct':0,'trial_grade':'NOT_RATED','flags':''}\n    flags=[];cc=corp.get(code)\n    if not cc:flags.append('CORP_NOT_FOUND')\n    if not m or cap is None or cap<100000000000:flags.append('MARKETCAP_BELOW_100B_OR_MISSING')\n    if cc and DKEY:\n        try:\n            filings=dart('list',corp_code=cc,bgn_de=str(TODAY.year-3)+'0101',end_de=TODAY.strftime('%Y%m%d'),pblntf_ty='A',page_count='100',last_reprt_at='Y').get('list',[])\n            opts=[]\n            for f in filings:\n                match=re.search(r'(사업보고서|반기보고서|분기보고서).*?\\((\\d{4})\\.(\\d{2})\\)',f.get('report_nm',''))\n                if not match:continue\n                typ,yr,mo=match.groups();rc='11011' if typ=='사업보고서' else '11012' if typ=='반기보고서' else ('11013' if mo=='03' else '11014' if mo=='09' else '')\n                if rc:opts.append((int(yr),int(mo),rc,f))\n            opts.sort(key=lambda x:(x[0],x[1],x[3].get('rcept_dt','')),reverse=True)\n            if not opts:flags.append('NO_PERIODIC_REPORT')\n            else:\n                yr,mo,rc,f=opts[0];record['latest_period']=str(yr)+'-'+str(mo).zfill(2);record['filing_date']=f.get('rcept_dt','')\n                cache={}\n                def fetch(y,report,basis):\n                    k=(y,report,basis)\n                    if k not in cache:\n                        obj=dart('fnlttSinglAcntAll',corp_code=cc,bsns_year=str(y),reprt_code=report,fs_div=basis)\n                        cache[k]=obj.get('list',[]) if obj.get('status')=='000' else []\n                    return cache[k]\n                for basis in ('CFS','OFS'):\n                    curr=fetch(yr,rc,basis)\n                    if not curr:continue\n                    current=extract(curr,interim=(rc!='11011'))\n                    if current['revenue'] is None or current['operating_profit'] is None:continue\n                    record['fs_div']=basis\n                    if basis=='OFS':flags.append('OFS_BASIS')\n                    annual={y:extract(fetch(y,'11011',basis)) for y in (yr-3,yr-2,yr-1)}\n                    latestannual=extract(curr) if rc=='11011' else annual[yr-1]\n                    prevannual=annual[yr-1] if rc=='11011' else annual[yr-2]\n                    prior2=annual[yr-2] if rc=='11011' else annual[yr-3]\n                    if rc!='11011':\n                        # Prior same-period YTD comes from the comparable prior-year report, not a 3-month field.\n                        previous=extract(fetch(yr-1,rc,basis),interim=True)\n                        ttm={k:(latestannual[k]+current[k]-previous[k] if all(v is not None for v in (latestannual[k],current[k],previous[k])) else None) for k in ('revenue','operating_profit','net_parent','net_total','cashflow')}\n                        record['revenue_growth_yoy_pct']=growth(current['revenue'],previous['revenue'])\n                        record['operating_profit_growth_yoy_pct']=growth(current['operating_profit'],previous['operating_profit'])\n                    else:\n                        ttm={k:current[k] for k in ('revenue','operating_profit','net_parent','net_total','cashflow')}\n                        record['revenue_growth_yoy_pct']=growth(current['revenue'],prevannual['revenue'])\n                        record['operating_profit_growth_yoy_pct']=growth(current['operating_profit'],prevannual['operating_profit'])\n                    if latestannual['revenue'] is not None and prior2['revenue'] is not None and prior2['revenue']>0:record['revenue_cagr_2yr_pct']=((latestannual['revenue']/prior2['revenue'])**0.5-1)*100\n                    record['operating_margin_pct']=ratio(ttm['operating_profit'],ttm['revenue'])*100 if ratio(ttm['operating_profit'],ttm['revenue']) is not None else None\n                    net=ttm['net_parent'] if basis=='CFS' else ttm['net_total']\n                    equity=current['equity_parent'] if basis=='CFS' else current['equity_total']\n                    prev_eq=latestannual['equity_parent'] if basis=='CFS' else latestannual['equity_total']\n                    if rc=='11011':prev_eq=prevannual['equity_parent'] if basis=='CFS' else prevannual['equity_total']\n                    if basis=='CFS' and (net is None or equity is None):flags.append('PARENT_ATTRIBUTION_MISSING')\n                    if net is not None and equity is not None and prev_eq is not None and (equity+prev_eq)>0:record['roe_ttm_pct']=net/((equity+prev_eq)/2)*100\n                    if equity is not None and equity>0:\n                        record['debt_to_equity_pct']=ratio(current['liabilities'],equity)*100 if current['liabilities'] is not None else None\n                        record['pbr']=cap/equity if cap else None\n                    if current['current_assets'] is not None and current['current_liabilities'] is not None and current['current_liabilities']>0:record['current_ratio_pct']=current['current_assets']/current['current_liabilities']*100\n                    if net is not None and net>0 and cap:record['per_ttm']=cap/net\n                    if net is not None and net<=0:flags.append('PER_NM_NEGATIVE_EARNINGS')\n                    record['operating_cashflow_ttm_krw']=ttm['cashflow']\n                    if net is not None and net>0 and ttm['cashflow'] is not None:record['cash_conversion_ratio']=ttm['cashflow']/net\n                    break\n                if not record['fs_div']:flags.append('CORE_ACCOUNTS_MISSING')\n        except Exception as e:flags.append('DART_ERROR:'+str(e)[:100])\n    # 30 growth, 25 profitability, 20 stability, 15 valuation, 10 cashflow.\n    groups={\n        'growth_score':[(record['revenue_growth_yoy_pct'],0,20,12),(record['operating_profit_growth_yoy_pct'],0,30,12),(record['revenue_cagr_2yr_pct'],0,15,6)],\n        'profitability_score':[(record['roe_ttm_pct'],0,20,15),(record['operating_margin_pct'],0,20,10)],\n        'stability_score':[(None if record['debt_to_equity_pct'] is None else -record['debt_to_equity_pct'],-200,-30,12),(record['current_ratio_pct'],80,200,8)],\n        'valuation_score':[(None if record['per_ttm'] is None else -record['per_ttm'],-30,-8,9),(None if record['pbr'] is None else -record['pbr'],-3,-0.8,6)],\n        'cashflow_score':[(record['cash_conversion_ratio'],0,1.2,10)]}\n    total=0;available=0\n    for name,metrics in groups.items():\n        available_weight=sum(w for v,lo,hi,w in metrics if v is not None)\n        if available_weight:\n            value=sum(scale(v,lo,hi)*w/100 for v,lo,hi,w in metrics if v is not None)\n            record[name]=round(value/sum(w for _,_,_,w in metrics)*100,2)\n            total+=value;available+=available_weight\n    record['data_coverage_pct']=round(available,2)\n    if available>=70 and status['official_market_verified'] and record['fs_div'] and cap is not None and cap>=100000000000:\n        record['total_trial_score']=round(total/available*100,2)\n        if record['total_trial_score']>=80:record['trial_grade']='A (TRIAL)'\n        elif record['total_trial_score']>=65:record['trial_grade']='B (TRIAL)'\n    else:flags.append('INSUFFICIENT_COVERAGE_OR_MARKET_VERIFICATION')\n    # A/B only trial output; NOT investment grades.\n    if record['revenue_growth_yoy_pct'] is None:flags.append('GROWTH_COMPARABLE_MISSING')\n    if record['cashflow_score'] is None:flags.append('CASHFLOW_METRIC_MISSING')\n    record['flags']=';'.join(flags);rows.append(record)\n    if (i+1)%10==0:print('processed',i+1,'/',len(CAND),flush=True)\nfields=list(rows[0])\ndef writecsv(name,items):\n    with (OUT/name).open('w',encoding='utf-8-sig',newline='') as f:\n        w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(items)\nwritecsv('v5_cashflow_recovery_all_50.csv',rows)\nwritecsv('v5_cashflow_recovery_AB_only.csv',sorted((r for r in rows if r['trial_grade']!='NOT_RATED'),key=lambda r:-r['total_trial_score']))\nstatus.update(financial_rows=sum(bool(r['fs_div']) for r in rows),trial_grade_counts=dict(collections.Counter(r['trial_grade'] for r in rows)),growth_data_count=sum(r['revenue_growth_yoy_pct'] is not None for r in rows),cashflow_data_count=sum(r['operating_cashflow_ttm_krw'] is not None for r in rows),cashflow_missing_count=sum(r['operating_cashflow_ttm_krw'] is None for r in rows),status='CASHFLOW_RECOVERY_TRIAL_COMPLETE' if any(r['fs_div'] for r in rows) else 'BLOCKED')\n(OUT/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')\nprint(json.dumps(status,ensure_ascii=False,indent=2))\nPYCODE"
    - name: Audit financial quality and sector exceptions
      if: always()
      shell: bash
      run: "python - <<'AUDITPY'\nimport csv,json,pathlib,collections,math\nroot=pathlib.Path('v5_cashflow_50_result');root.mkdir(exist_ok=True)\nsource=root/'v5_cashflow_recovery_all_50.csv'\nif not source.exists():\n    (root/'quality_audit_status.json').write_text(json.dumps({'status':'SOURCE_MISSING','final_investment_grades_created':0},indent=2))\n    raise SystemExit(0)\nwith source.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))\ndef n(r,k):\n    try:\n        v=float(r.get(k,''));return v if math.isfinite(v) else None\n    except (TypeError,ValueError):return None\nresults=[]\nfor r in rows:\n    flags=[];notes=[]\n    name=r['name'];fs=r.get('fs_div','');netratio=n(r,'cash_conversion_ratio');ocf=n(r,'operating_cashflow_ttm_krw')\n    if not fs:flags.append('NO_VALID_FINANCIAL_STATEMENTS')\n    if fs=='OFS':flags.append('SEPARATE_STATEMENTS_USED');notes.append('연결재무제표 미확보: 별도재무제표 기준 비교 주의')\n    if ocf is None:flags.append('OCF_UNAVAILABLE')\n    elif ocf<0:flags.append('NEGATIVE_OPERATING_CASHFLOW')\n    if netratio is None:\n        flags.append('CASH_CONVERSION_NOT_COMPUTABLE')\n        if ocf is not None:notes.append('영업현금흐름은 있으나 순이익이 0 이하이거나 순이익 계정이 누락되어 현금전환비율 계산 불가')\n    elif netratio<0.5:flags.append('LOW_CASH_CONVERSION_LT_0_5')\n    if n(r,'per_ttm') is None:flags.append('PER_NOT_MEANINGFUL_OR_MISSING')\n    if n(r,'roe_ttm_pct') is None:flags.append('ROE_MISSING')\n    if n(r,'revenue_growth_yoy_pct') is None or n(r,'operating_profit_growth_yoy_pct') is None:flags.append('GROWTH_COMPARISON_INCOMPLETE')\n    if n(r,'debt_to_equity_pct') is None or n(r,'current_ratio_pct') is None:flags.append('BALANCE_SHEET_RATIO_INCOMPLETE')\n    if name in ('롯데손해보험',):\n        flags.append('INSURANCE_SECTOR_EXCEPTION');notes.append('보험업: 일반기업 유동비율·영업현금흐름 점수 적용 부적절 가능; 보험계약부채, K-ICS 등 별도 검증 필요')\n    if name in ('스틱인베스트먼트',):\n        flags.append('INVESTMENT_COMPANY_EXCEPTION');notes.append('투자회사: 투자손익·자산가치·현금흐름 분류의 업종별 검증 필요')\n    if n(r,'data_coverage_pct') is not None and n(r,'data_coverage_pct')<100:flags.append('PARTIAL_SCORE_COVERAGE')\n    if n(r,'revenue_growth_yoy_pct') is not None and n(r,'revenue_growth_yoy_pct')>80:flags.append('HIGH_GROWTH_BASE_EFFECT_REVIEW')\n    if n(r,'operating_profit_growth_yoy_pct') is not None and n(r,'operating_profit_growth_yoy_pct')>100:flags.append('HIGH_OP_GROWTH_ONE_OFF_REVIEW')\n    if r.get('flags'):flags+=['UPSTREAM_'+v for v in r['flags'].split(';') if v]\n    results.append({'code':r['code'],'name':name,'trial_grade_before_audit':r['trial_grade'],'trial_score_before_audit':r['total_trial_score'],'financial_basis':fs,'operating_cashflow_ttm_krw':r.get('operating_cashflow_ttm_krw',''),'cash_conversion_ratio':r.get('cash_conversion_ratio',''),'data_coverage_pct':r.get('data_coverage_pct',''),'audit_flags':';'.join(dict.fromkeys(flags)),'review_notes':' | '.join(notes),'audit_disposition':'REVIEW_REQUIRED' if flags else 'NO_AUTOMATIC_EXCEPTION','final_investment_grade':'NOT_ASSIGNED'})\nfields=list(results[0]);out=root/'v5_financial_quality_audit_50.csv'\nwith out.open('w',encoding='utf-8-sig',newline='') as f:\n    w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(results)\ncounts=collections.Counter(flag for r in results for flag in r['audit_flags'].split(';') if flag)\nsummary={'status':'QUALITY_AUDIT_COMPLETED','candidates':len(results),'cashflow_present':sum(n(r,'operating_cashflow_ttm_krw') is not None for r in rows),'cash_conversion_computable':sum(n(r,'cash_conversion_ratio') is not None for r in rows),'cashflow_present_but_conversion_uncomputable':sum(n(r,'operating_cashflow_ttm_krw') is not None and n(r,'cash_conversion_ratio') is None for r in rows),'cashflow_missing_names':[r['name'] for r in rows if n(r,'operating_cashflow_ttm_krw') is None],'audit_flags':dict(counts),'final_investment_grades_created':0,'note':'Diagnostic audit only; sector-specific accounting, account-level traceability and amended filings require additional official verification.'}\n(root/'quality_audit_status.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')\nprint(json.dumps(summary,ensure_ascii=False,indent=2))\nAUDITPY"
    - name: Integrated cash conversion, growth persistence and sector quality gate
      if: always()
      shell: bash
      run: "python - <<'QUALITYPY'\nimport csv,json,pathlib,collections,math\nroot=pathlib.Path('v5_cashflow_50_result');root.mkdir(exist_ok=True)\nsource=root/'v5_cashflow_recovery_all_50.csv'\nif not source.exists():\n    (root/'integrated_quality_status.json').write_text(json.dumps({'status':'SOURCE_MISSING','final_investment_grades_created':0},indent=2))\n    raise SystemExit(1)\nwith source.open(encoding='utf-8-sig',newline='') as f:rows=list(csv.DictReader(f))\ndef val(r,k):\n    try:\n        x=float(r.get(k,''));return x if math.isfinite(x) else None\n    except (TypeError,ValueError):return None\nout=[];counts=collections.Counter()\nfor r in rows:\n    flags=[];notes=[];ocf=val(r,'operating_cashflow_ttm_krw');conv=val(r,'cash_conversion_ratio');per=val(r,'per_ttm')\n    basis=r.get('fs_div','');sector='STANDARD';name=r['name']\n    if name=='롯데손해보험':sector='INSURANCE';flags.append('SECTOR_SPECIFIC_MODEL_REQUIRED')\n    if name=='스틱인베스트먼트':sector='INVESTMENT';flags.append('SECTOR_SPECIFIC_MODEL_REQUIRED')\n    if not basis:flags.append('NO_FINANCIAL_STATEMENTS')\n    if basis=='OFS':flags.append('SEPARATE_ONLY_REVIEW')\n    if ocf is None:reason='OCF_NOT_RETRIEVED';flags.append(reason)\n    elif conv is not None:reason='CONVERSION_COMPUTABLE'\n    elif per is None or 'PER_NM_NEGATIVE_EARNINGS' in r.get('flags',''):\n        reason='NET_PROFIT_NONPOSITIVE_OR_UNVERIFIED';flags.append('CASH_CONVERSION_NOT_APPLICABLE')\n    else:reason='NET_PROFIT_ATTRIBUTION_OR_DENOMINATOR_UNVERIFIED';flags.append('CASH_CONVERSION_UNVERIFIED')\n    if ocf is not None and ocf<0:flags.append('NEGATIVE_OCF')\n    if conv is not None and conv<0.5:flags.append('LOW_CASH_CONVERSION')\n    rg=val(r,'revenue_growth_yoy_pct');og=val(r,'operating_profit_growth_yoy_pct');cagr=val(r,'revenue_cagr_2yr_pct')\n    if rg is None or og is None:flags.append('GROWTH_COMPARISON_INCOMPLETE')\n    if og is not None and og>100:flags.append('OPERATING_PROFIT_SURGE_VERIFY_BASE_AND_ONE_OFF')\n    if rg is not None and rg>80:flags.append('REVENUE_SURGE_VERIFY_BASE_AND_ONE_OFF')\n    if rg is not None and cagr is not None and rg>30 and cagr<5:flags.append('RECENT_GROWTH_NOT_YET_SUSTAINED')\n    if rg is not None and og is not None and rg<0 and og>50:flags.append('PROFIT_GROWTH_WITH_REVENUE_DECLINE')\n    if val(r,'data_coverage_pct') is None or val(r,'data_coverage_pct')<85:flags.append('DATA_COVERAGE_BELOW_85')\n    if sector!='STANDARD':disposition='SECTOR_HOLD'\n    elif not basis or ocf is None or val(r,'data_coverage_pct') is None or val(r,'data_coverage_pct')<85:disposition='DATA_HOLD'\n    elif any(x in flags for x in ('CASH_CONVERSION_UNVERIFIED','OPERATING_PROFIT_SURGE_VERIFY_BASE_AND_ONE_OFF','REVENUE_SURGE_VERIFY_BASE_AND_ONE_OFF','RECENT_GROWTH_NOT_YET_SUSTAINED','PROFIT_GROWTH_WITH_REVENUE_DECLINE','SEPARATE_ONLY_REVIEW')):disposition='MANUAL_REVIEW'\n    else:disposition='PROVISIONAL_RESEARCH_ONLY'\n    grade=r.get('trial_grade','NOT_RATED')\n    # No automatic upgrade of previous provisional grades. Review flags do not prove fraud or one-offs.\n    if grade not in ('A (TRIAL)','B (TRIAL)'):grade='NOT_RATED'\n    if grade!='NOT_RATED' and disposition=='PROVISIONAL_RESEARCH_ONLY':candidate='A/B_RESEARCH_CANDIDATE'\n    elif grade!='NOT_RATED':candidate='A/B_REVIEW_PENDING'\n    else:candidate='NOT_RATED'\n    for x in flags:counts[x]+=1\n    out.append({'code':r['code'],'name':name,'sector_route':sector,'market_date':r.get('market_date',''),'financial_basis':basis,'cashflow_ttm_krw':r.get('operating_cashflow_ttm_krw',''),'cash_conversion_ratio':r.get('cash_conversion_ratio',''),'cash_conversion_reason':reason,'revenue_growth_yoy_pct':r.get('revenue_growth_yoy_pct',''),'operating_profit_growth_yoy_pct':r.get('operating_profit_growth_yoy_pct',''),'revenue_cagr_2yr_pct':r.get('revenue_cagr_2yr_pct',''),'data_coverage_pct':r.get('data_coverage_pct',''),'original_trial_grade':grade,'original_trial_score':r.get('total_trial_score',''),'quality_disposition':disposition,'research_candidate_status':candidate,'quality_flags':';'.join(flags),'final_investment_grade':'NOT_ASSIGNED'})\ndef save(name,records):\n    with (root/name).open('w',encoding='utf-8-sig',newline='') as f:\n        w=csv.DictWriter(f,fieldnames=list(out[0]));w.writeheader();w.writerows(records)\nsave('v5_integrated_quality_all_50.csv',out)\nsave('v5_integrated_AB_research_only.csv',[r for r in out if r['research_candidate_status'].startswith('A/B_')])\nstatus={'status':'INTEGRATED_QUALITY_GATE_COMPLETED','candidates':len(out),'cashflow_reasons':dict(collections.Counter(r['cash_conversion_reason'] for r in out)),'quality_dispositions':dict(collections.Counter(r['quality_disposition'] for r in out)),'research_candidate_statuses':dict(collections.Counter(r['research_candidate_status'] for r in out)),'flags':dict(counts),'final_investment_grades_created':0,'important_limitations':['Cash conversion reason is inferred from available summary fields; parent-attributable net profit needs account-level trace verification.','Operating profit surge and low CAGR are review flags, not proof of one-off earnings.','Insurance and investment-company sector models are not implemented; these are held out.','No final investment A/B grades assigned.']}\n(root/'integrated_quality_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')\nprint(json.dumps(status,ensure_ascii=False,indent=2))\nQUALITYPY"
    - name: Upload one result ZIP
