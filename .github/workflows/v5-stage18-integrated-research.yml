name: KRX v5 Stage18 Integrated Research Pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare integrated research engine
        shell: bash
        run: |
          mkdir -p stage18
          python - <<'PYCODE'
          import base64,pathlib
          pathlib.Path('stage18/build_pipeline.py').write_bytes(base64.b64decode(''))
          pathlib.Path('stage18/test_pipeline.py').write_bytes(base64.b64decode(''))
          PYCODE
      - name: Run unit tests
        run: cd stage18 && python -m unittest -v test_pipeline.py
      - name: Run integrated pipeline with latest public data
        run: python stage18/build_pipeline.py --out stage18_results
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-stage18-integrated-research
          path: stage18_results/
          if-no-files-found: warn
