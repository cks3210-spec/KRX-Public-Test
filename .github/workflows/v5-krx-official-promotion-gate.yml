name: KRX Official Promotion Readiness Gate (Controlled Integration)
'on':
  workflow_dispatch:
    inputs:
      target_market_date:
        description: 'Exact official KRX BAS_DD (YYYYMMDD); blank = latest verified newer artifact'
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: krx-v5-operational-market-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
      - name: Install KRX calendar
        run: python -m pip install 'exchange-calendars>=4.5,<5'          with:
          python-version: '3.11'
      - name: Download verified official artifact for exact market date
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_DATE: ${{ inputs.target_market_date }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/krx-official-input market_promotion_output
          found=0
          for id in $(gh run list --repo "$GH_REPO" --workflow v5-official-market-date-collector.yml --status success --limit 35 --json databaseId --jq '.[].databaseId'); do
            rm -f /tmp/krx-official-input/*
            if ! gh run download "$id" --repo "$GH_REPO" --name krx-v5-official-market-snapshot --dir /tmp/krx-official-input >/dev/null 2>&1; then continue; fi
            if SOURCE_RUN_ID="$id" python - <<'PY'
          import csv, json, os, pathlib, re
          p=pathlib.Path('/tmp/krx-official-input')
          try:
              s=json.loads((p/'status.json').read_text(encoding='utf-8-sig'))
              day=str(s.get('market_date',''))
              wanted=os.environ.get('REQUESTED_DATE','').strip()
              assert re.fullmatch(r'20\d{6}',day)
              assert not wanted or day==wanted
              assert s.get('state')=='VERIFIED_OFFICIAL_MARKET_SNAPSHOT'
              assert s.get('source')=='KRX_OPEN_API'
              assert s.get('final_buy_signals')==0
              assert s.get('investment_decisions_authorized') is False
              assert s.get('production_data_modified') is False
              assert str(s.get('github_run_id'))==os.environ['SOURCE_RUN_ID']
              with (p/'official_daily_market.csv').open(encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)>=2000 and {r['BAS_DD'] for r in rows}=={day}
              assert {r['source'] for r in rows}=={'KRX_OPEN_API'}
          except (KeyError,ValueError,AssertionError,OSError,csv.Error):raise SystemExit(1)
          PY
            then
              echo "OFFICIAL_SOURCE_RUN_ID=$id" >> "$GITHUB_ENV"
              found=1; break
            fi
          done
          test "$found" = 1 || { echo 'No matching verified official artifact'; exit 1; }
      - name: Validate and stage market-date-only atomic update
        env:
          REQUESTED_DATE: ${{ inputs.target_market_date }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/krx_safe_promotion.py <<'PY'
          import csv, gzip, hashlib, io, json, os, pathlib, re, collections, datetime as dt
          from zoneinfo import ZoneInfo
          BASE=pathlib.Path('data')
          SRC=pathlib.Path('/tmp/krx-official-input')
          OUT=pathlib.Path('market_promotion_output')
          OUT.mkdir(exist_ok=True)
          FIELDS=['BAS_DD','ISU_CD','ISU_NM','TDD_CLSPRC','ACC_TRDVOL','MKTCAP','MARKET']
          def read_csv(p, gz=False):
              opening=gzip.open if gz else open
              with opening(p,'rt',encoding='utf-8-sig',newline='') as f:
                  dr=csv.DictReader(f)
                  if not set(FIELDS).issubset(dr.fieldnames or []):raise ValueError('MISSING_REQUIRED_COLUMNS_'+str(p))
                  return list(dr)
          def normalize(r):
              d={k:str(r.get(k,'')).strip() for k in FIELDS}
              if not re.fullmatch(r'20\d{6}',d['BAS_DD']):raise ValueError('BAD_DATE')
              if d['MARKET'] not in ('KOSPI','KOSDAQ') or not re.fullmatch(r'[A-Z0-9]{6}',d['ISU_CD']):raise ValueError('BAD_KEY')
              for key in ('TDD_CLSPRC','ACC_TRDVOL','MKTCAP'):
                  val=d[key].replace(',','')
                  if not re.fullmatch(r'\d+',val):raise ValueError('BAD_NUMBER_'+key)
                  d[key]=str(int(val))
              if int(d['TDD_CLSPRC'])<=0 or int(d['MKTCAP'])<=0:raise ValueError('BAD_PRICE_OR_CAP')
              return d
          def checked(rows, label):
              norm=[normalize(r) for r in rows]
              keys=[(r['BAS_DD'],r['MARKET'],r['ISU_CD']) for r in norm]
              if len(keys)!=len(set(keys)):raise ValueError('DUPLICATE_'+label)
              return norm
          def csv_bytes(rows):
              out=io.StringIO(newline='')
              w=csv.DictWriter(out,fieldnames=FIELDS)
              w.writeheader();w.writerows(rows)
              return out.getvalue().encode('utf-8-sig')
          def write_report(obj):
              (OUT/'status.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def main():
              source=json.loads((SRC/'status.json').read_text(encoding='utf-8-sig'))
              day=str(source.get('market_date',''))
              if source.get('state')!='VERIFIED_OFFICIAL_MARKET_SNAPSHOT' or source.get('source')!='KRX_OPEN_API':raise ValueError('SOURCE_UNVERIFIED')
              if source.get('final_buy_signals')!=0 or source.get('investment_decisions_authorized') is not False:raise ValueError('SOURCE_INVESTMENT_GATE')
              if not re.fullmatch(r'20\d{6}',day):raise ValueError('SOURCE_DATE_INVALID')
              requested=os.environ.get('REQUESTED_DATE','').strip()
              if requested and requested!=day:raise ValueError('REQUEST_DATE_MISMATCH')
              if dt.datetime.strptime(day,'%Y%m%d').date() > dt.datetime.now(ZoneInfo('Asia/Seoul')).date():raise ValueError('FUTURE_DATE')
              source_rows=read_csv(SRC/'official_daily_market.csv')
              if {r['BAS_DD'] for r in source_rows}!={day}:raise ValueError('MIXED_SOURCE_DATE')
              if {r.get('source') for r in source_rows}!={'KRX_OPEN_API'}:raise ValueError('SOURCE_LABEL_MISMATCH')
              official=checked(source_rows,'OFFICIAL')
              cnt=collections.Counter(r['MARKET'] for r in official)
              if cnt['KOSPI']<500 or cnt['KOSDAQ']<1000 or dict(cnt)!=source.get('market_counts'):raise ValueError('MARKET_COVERAGE_MISMATCH')
              for m in ('KOSPI','KOSDAQ'):
                  h=source.get('response_sha256',{}).get(m,'')
                  if not re.fullmatch('[0-9a-f]{64}',str(h)) or any(r.get('source_sha256')!=h for r in source_rows if r['MARKET']==m):raise ValueError('SOURCE_HASH_MISMATCH_'+m)
              old_latest=checked(read_csv(BASE/'latest.csv'),'OLD_LATEST')
              old_days={r['BAS_DD'] for r in old_latest}
              if len(old_days)!=1:raise ValueError('OLD_LATEST_MIXED_DATE')
              previous=next(iter(old_days))
              if day<=previous:raise ValueError('NOT_NEWER_THAN_PRODUCTION')
              history=checked(read_csv(BASE/'daily_70d.csv.gz',gz=True),'OLD_HISTORY')
              days=sorted({r['BAS_DD'] for r in history})
              if len(days)!=70 or days[-1]!=previous:raise ValueError('HISTORY_AND_LATEST_DATE_MISMATCH')
              last_history={(r['MARKET'],r['ISU_CD']):r for r in history if r['BAS_DD']==previous}
              if len(last_history)!=len(old_latest) or any(last_history.get((r['MARKET'],r['ISU_CD']))!=r for r in old_latest):raise ValueError('LATEST_HISTORY_CONTENT_MISMATCH')
              # Do not skip any trading session between previous and incoming dates.
              # A single-session promotion is safe only for consecutive business days;
              # public holidays or missing dates require a separate verified calendar/evidence check.
              import exchange_calendars as xc
              calendar=xc.get_calendar('XKRX')
              prev=dt.datetime.strptime(previous,'%Y%m%d').date()
              next_session=calendar.next_session(prev.isoformat()).strftime('%Y%m%d')
              if day!=next_session:raise ValueError('GAP_OR_NONCONSECUTIVE_SESSION_'+next_session)
              if len(official)<len(old_latest)*0.80:raise ValueError('UNIVERSE_SHRINKAGE')
              merged=[r for r in history if r['BAS_DD']!=days[0]] + official
              merged=sorted(merged,key=lambda r:(r['BAS_DD'],r['MARKET'],r['ISU_CD']))
              checked(merged,'MERGED')
              new_days=sorted({r['BAS_DD'] for r in merged})
              if len(new_days)!=70 or new_days[-1]!=day:raise ValueError('MERGE_SESSION_FAILURE')
              (OUT/'latest.csv').write_bytes(csv_bytes(sorted(official,key=lambda r:(r['MARKET'],r['ISU_CD']))))
              with (OUT/'daily_70d.csv.gz').open('wb') as stream:
                  with gzip.GzipFile(fileobj=stream,mode='wb',compresslevel=6,mtime=0) as z:
                      z.write(csv_bytes(merged))
              # Keep existing vetted indicator series unchanged; never pretend research recalculation matches V4/G rules.
              summ=json.loads((BASE/'summary.json').read_text(encoding='utf-8-sig'))
              if summ.get('latest_trading_date')!=previous:raise ValueError('SUMMARY_PREVIOUS_DATE_MISMATCH')
              summ.update(latest_trading_date=day,sessions_stored=70,total_rows_stored=len(merged),
                          kospi_rows_latest=cnt['KOSPI'],kosdaq_rows_latest=cnt['KOSDAQ'],
                          marketcap_1000uk_screened=sum(int(r['MKTCAP'])>=100_000_000_000 for r in official),
                          technical_indicators_asof=previous,
                          technical_indicators_status='STALE_PENDING_ORIGINAL_V4_G_REBUILD',
                          indicator_metrics_asof=previous,
                          note='Market price source promoted using official KRX snapshot. Existing V4/Golden Cross indicators preserved at their earlier source date. Research only, no trading signals.')
              # Previous technical count fields are intentionally NOT recertified for the new date.
              (OUT/'summary.json').write_text(json.dumps(summ,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              result={'state':'READY_FOR_MARKET_ONLY_COMMIT','source_run_id':source.get('github_run_id'),
                      'source_market_date':day,'previous_market_date':previous,
                      'source_mode':source.get('trigger_mode'),'market_counts':dict(cnt),
                      'prior_history_rows':len(history),'promoted_history_rows':len(merged),
                      'history_sessions':70,'technical_indicators_asof':previous,
                      'technical_indicator_files_modified':False,
                      'investment_decisions_authorized':False,'final_buy_signals':0,
                      'output_sha256':{name:hashlib.sha256((OUT/name).read_bytes()).hexdigest() for name in ('latest.csv','daily_70d.csv.gz','summary.json')}}
              write_report(result)
              print(json.dumps(result,ensure_ascii=False))
          try:main()
          except Exception as exc:
              write_report({'state':'BLOCKED_NO_PRODUCTION_CHANGES','error':type(exc).__name__+': '+str(exc),
                            'technical_indicator_files_modified':False,'investment_decisions_authorized':False,'final_buy_signals':0})
              raise
          PY
          python -m py_compile /tmp/krx_safe_promotion.py
          python /tmp/krx_safe_promotion.py
      - name: Commit only verified market, 70-session history, and provenance summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s=json.load(open('market_promotion_output/status.json'))
          assert s['state']=='READY_FOR_MARKET_ONLY_COMMIT'
          assert s['history_sessions']==70 and s['final_buy_signals']==0
          assert s['technical_indicator_files_modified'] is False
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Main changed; no stale market commit'; exit 1; }
          cp market_promotion_output/latest.csv data/latest.csv
          cp market_promotion_output/daily_70d.csv.gz data/daily_70d.csv.gz
          cp market_promotion_output/summary.json data/summary.json
          git add data/latest.csv data/daily_70d.csv.gz data/summary.json
          if git diff --cached --quiet; then echo 'No change'; exit 0; fi
          git commit -m 'KRX v5: promote official market, safe rolling history, preserve v4/g indicators'
          git push origin HEAD:main
      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-official-promotion-evidence
          path: market_promotion_output/status.json
          if-no-files-found: warn
          retention-days: 30
