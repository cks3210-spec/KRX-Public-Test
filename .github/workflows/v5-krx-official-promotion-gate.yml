name: KRX Official Promotion Readiness Gate (Controlled Integration)
'on':
  workflow_dispatch:
    inputs:
      target_market_date:
        description: 'Exact KRX BAS_DD YYYYMMDD; blank = latest verified artifact or current matched archive'
        required: false
        type: string
  workflow_run:
    workflows: ['KRX v5 Official Market Date Collector']
    types: [completed]
    branches: [main]
# No separate scheduled calls: the canonical 08:30 collector triggers this workflow.
permissions:
  contents: write
  actions: read
concurrency:
  group: krx-v5-operational-market-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KRX exchange calendar
        run: python -m pip install --disable-pip-version-check 'exchange-calendars>=4.5,<5'
      - name: Select exact collector result or verified manual recovery source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/krx_promotion_inputs market_promotion_output
          if [ -n "$SOURCE_RUN" ]; then
            runs="$SOURCE_RUN"
          else
            runs=$(gh run list --repo "$GH_REPO" --workflow v5-official-market-date-collector.yml --status success --limit 15 --json databaseId --jq '.[].databaseId')
          fi
          for id in $runs; do
            mkdir -p "/tmp/krx_promotion_inputs/$id"
            if ! gh run download "$id" --repo "$GH_REPO" --name krx-v5-official-market-snapshot --dir "/tmp/krx_promotion_inputs/$id"; then
              rm -rf "/tmp/krx_promotion_inputs/$id"
              if [ -n "$SOURCE_RUN" ]; then exit 1; fi
            fi
          done
      - name: Validate and publish market archive, price ledger and financial link
        env:
          SOURCE_RUN: ${{ github.event.workflow_run.id || '' }}
          REQUESTED_DATE: ${{ inputs.target_market_date || '' }}
          R14_REBUILD_ONLY: '1'
          DART_API_KEY: ''
          OPENDART_API_KEY: ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cat > /tmp/krx_promotion_13.py <<'PYCODE'
          import csv, gzip, io, json, os, re, datetime as dt, hashlib, subprocess, sys
          from pathlib import Path
          from collections import Counter
          from decimal import Decimal
          from zoneinfo import ZoneInfo
          import exchange_calendars as xc

          D=Path('data'); OUT=Path('market_promotion_output'); OUT.mkdir(exist_ok=True)
          A=D/'v5_official_market_archive'; P=D/'v5_integrated'; F=D/'v5_financial_m'
          COLS=['BAS_DD','ISU_CD','ISU_NM','TDD_CLSPRC','ACC_TRDVOL','MKTCAP','MARKET']
          PCOLS=['date','market','code','close']; markets={'KOSPI','KOSDAQ'}
          CAL=xc.get_calendar('XKRX')
          now=dt.datetime.now(ZoneInfo('Asia/Seoul'))
          report={'state':'INIT','market_committed':False,'financial_committed':False,'final_buy_signals':0,'investment_decisions_authorized':False,'api_calls':0,'run_id':os.getenv('GITHUB_RUN_ID','')}
          def save(state,**kw):
              report.update(state=state,**kw)
              (OUT/'status.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
              print(json.dumps(report,ensure_ascii=False),flush=True)
          def need(test,msg):
              if not test: raise ValueError(msg)
          def session(day):
              return dt.datetime.strptime(day,'%Y%m%d').date().isoformat()
          def read(path, cols, gz=False):
              with (gzip.open if gz else open)(path,'rt',encoding='utf-8-sig',newline='') as f:
                  r=csv.DictReader(f);need(set(cols)<=set(r.fieldnames or []),'BAD_COLUMNS '+str(path));return list(r)
          def key(r): return (r['BAS_DD'],r['MARKET'],r['ISU_CD'])
          def canonical(rows):
              out={}
              for raw in rows:
                  r={c:str(raw[c]).strip() for c in COLS};k=key(r)
                  session(k[0]);need(k[1] in markets and re.fullmatch('[0-9A-Z]{6}',k[2]),'BAD_SECURITY_KEY')
                  for c in ('TDD_CLSPRC','ACC_TRDVOL','MKTCAP'):
                      v=r[c].replace(',','');need(re.fullmatch('[0-9]+',v),'BAD_NUMERIC '+c);r[c]=str(int(v))
                  need(int(r['TDD_CLSPRC'])>0 and int(r['MKTCAP'])>0,'NONPOSITIVE_PRICE_CAP')
                  need(k not in out,'DUPLICATE_MARKET_KEY '+str(k));out[k]=r
              return out
          def counts(rows): return Counter(k[1] for k in rows)
          def complete(rows,day):
              c=counts(rows);need({k[0] for k in rows}=={day} and c['KOSPI']>=500 and c['KOSDAQ']>=1000 and len(rows)>=2000,'INCOMPLETE_DATE '+day);return c
          def csvbytes(rows,fields):
              s=io.StringIO(newline='');w=csv.DictWriter(s,fieldnames=fields);w.writeheader();w.writerows(rows);return s.getvalue().encode('utf-8-sig')
          def loadj(p):return json.loads(p.read_text(encoding='utf-8-sig'))
          def writej(p,obj):p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          def git(*args):return subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE,text=True).stdout.strip()
          def commit(paths,message):
              # No force push; a concurrent commit cannot overwrite another writer.
              git('add','--',*[str(p) for p in paths]); staged=git('diff','--cached','--name-only').splitlines()
              need(set(staged)<=set(str(p) for p in paths),'UNEXPECTED_STAGED_FILES')
              if not staged:return False
              git('commit','-m',message);git('push','origin','HEAD:main');return True

          def validate_artifact(root, run_id=None):
              s=loadj(root/'status.json');day=s.get('market_date','')
              need(s.get('state')=='VERIFIED_OFFICIAL_MARKET_SNAPSHOT' and s.get('source')=='KRX_OPEN_API','UNVERIFIED_ARTIFACT')
              need(s.get('investment_decisions_authorized') is False and s.get('final_buy_signals')==0,'BAD_INVESTMENT_GATE')
              need(str(s.get('github_run_id'))==(run_id or root.name),'SOURCE_RUN_ID_MISMATCH')
              need(s.get('target_market_date')==day and CAL.is_session(session(day)),'INVALID_ARTIFACT_DATE')
              need(day<now.strftime('%Y%m%d') and (now.hour,now.minute)>=(8,30),'UNPUBLISHED_SESSION_OR_EARLY_RUN')
              raw=read(root/'official_daily_market.csv',COLS+['source','source_sha256']);rows=canonical(raw);c=complete(rows,day)
              need(dict(c)==s.get('market_counts') and len(rows)==s.get('records_fetched'),'SOURCE_COUNT_MISMATCH')
              for m in markets:
                  h=s.get('response_sha256',{}).get(m,'');need(re.fullmatch('[0-9a-f]{64}',h or ''),'MISSING_RESPONSE_HASH')
                  need(all(r['source']=='KRX_OPEN_API' and r['source_sha256']==h for r in raw if r['MARKET']==m),'SOURCE_HASH_MISMATCH')
              return day,rows,s

          def market_phase():
              latest=D/'latest.csv';history=D/'daily_70d.csv.gz';summary=D/'summary.json';price=P/'daily_prices.csv';marker=P/'last_market_date.txt'
              current=canonical(read(latest,COLS));dates={k[0] for k in current};need(len(dates)==1,'MIXED_LATEST_DATES');old=dates.pop();oldc=complete(current,old)
              oldsum=loadj(summary);need(oldsum.get('latest_trading_date')==old and oldsum.get('kospi_rows_latest')==oldc['KOSPI'] and oldsum.get('kosdaq_rows_latest')==oldc['KOSDAQ'],'SUMMARY_MISMATCH')
              hist=canonical(read(history,COLS,True));sessions=sorted({k[0] for k in hist})
              need(len(sessions)==70 and sessions[-1]==old and {k:r for k,r in hist.items() if k[0]==old}==current,'ROLLING_HISTORY_BASELINE_MISMATCH')
              need(oldsum.get('sessions_stored')==70 and oldsum.get('total_rows_stored')==len(hist),'HISTORY_SUMMARY_MISMATCH')
              requested=os.getenv('REQUESTED_DATE','').strip();source=os.getenv('SOURCE_RUN','').strip();base=Path('/tmp/krx_promotion_inputs')
              candidates=[];skip=None
              if requested: session(requested)
              for root in sorted(base.iterdir()) if base.exists() else []:
                  if not root.is_dir():continue
                  try:
                      s=loadj(root/'status.json')
                      if s.get('state') in ('SKIPPED_BEFORE_0830_KST','SKIPPED_KRX_CLOSED','SKIPPED_ALREADY_VERIFIED_MARKET_DATE'):
                          if source==root.name:skip=s
                          continue
                      if s.get('state')=='VERIFIED_OFFICIAL_MARKET_BATCH':
                          need(str(s.get('github_run_id'))==root.name and s.get('source')=='KRX_OPEN_API' and s.get('investment_decisions_authorized') is False and s.get('final_buy_signals')==0,'INVALID_BATCH_MANIFEST')
                          days=s.get('batch_dates',[])
                          need(isinstance(days,list) and 1<=len(days)<=5 and days==sorted(set(days)),'INVALID_BATCH_DATES')
                          need(days==[x.strftime('%Y%m%d') for x in CAL.sessions_in_range(session(days[0]),session(days[-1]))],'BATCH_DATE_GAP')
                          need(s.get('market_date')==days[-1] and days[-1]<now.strftime('%Y%m%d') and (now.hour,now.minute)>=(8,30),'INVALID_BATCH_END')
                          verified=[]
                          for d in days:
                              child=root/'sessions'/d; cs=loadj(child/'status.json')
                              if cs.get('state')=='VERIFIED_PERMANENT_ARCHIVE':
                                  need(cs.get('market_date')==d and str(cs.get('github_run_id'))==root.name,'INVALID_ARCHIVE_MANIFEST')
                                  p=A/(d+'.csv');rows=canonical(read(p,COLS));complete(rows,d)
                                  need(cs.get('archive_sha256')==digest(p),'ARCHIVE_CHANGED_AFTER_COLLECTION')
                                  verified.append((d,rows,cs))
                              else:
                                  found=validate_artifact(child,root.name);need(found[0]==d,'BATCH_CHILD_DATE_MISMATCH');verified.append(found)
                          candidates.extend(verified)
                      else:
                          candidates.append(validate_artifact(root))
                  except Exception as e:
                      if source==root.name:raise
                      print('MANUAL_ARTIFACT_REJECTED',root.name,str(e),flush=True)
              if source and not candidates:
                  need(skip is not None,'TRIGGER_ARTIFACT_NOT_VERIFIED')
                  if skip.get('state')!='SKIPPED_ALREADY_VERIFIED_MARKET_DATE' or skip.get('market_date')!=old:
                      need(skip.get('state')!='SKIPPED_ALREADY_VERIFIED_MARKET_DATE' or str(skip.get('market_date',''))<=old,'VERIFIED_ARTIFACT_NOT_PROMOTED_MANUAL_RECOVERY_REQUIRED')
                      save('SKIPPED_COLLECTOR_NOOP',collector_state=skip['state'],market_date=old);return None
              eligible=[x for x in candidates if not requested or x[0]<=requested]
              choice=max(eligible,key=lambda x:(x[0],int(x[2]['github_run_id']))) if eligible else None
              if requested and requested!=old and (not choice or choice[0]!=requested):raise ValueError('REQUESTED_ARTIFACT_NOT_FOUND')
              if choice and choice[0]<old:
                  if requested or source:save('SKIPPED_OLDER_SOURCE',market_date=old,source_date=choice[0]);return None
                  choice=None
              day=choice[0] if choice else old;rows=choice[1] if choice else current
              if choice:
                  report['source_run_id']=choice[2]['github_run_id'];report['source_mode']='VERIFIED_COLLECTOR_ARTIFACT_OR_ARCHIVE'
              else:
                  ap=A/(old+'.csv');need(ap.is_file() and canonical(read(ap,COLS))==current,'CURRENT_OFFICIAL_ARCHIVE_NOT_MATCHED');report['source_mode']='EXISTING_ARCHIVE_MATCHED_LATEST_AND_HISTORY'
              if day==old:need(rows==current,'SAME_DATE_OFFICIAL_CONFLICT')
              # Every intermediate session must have a verified collector artifact or permanent archive.
              advances=[x.strftime('%Y%m%d') for x in CAL.sessions_in_range(session(old),session(day)) if x.strftime('%Y%m%d')>old]
              advance_sources={}
              previous=current
              for d in advances:
                  options=[x[1] for x in candidates if x[0]==d]
                  p=A/(d+'.csv')
                  if p.exists():options.append(canonical(read(p,COLS)))
                  need(bool(options),'MISSING_OFFICIAL_MARKET_SESSION '+d)
                  x=options[0];complete(x,d)
                  need(all(y==x for y in options),'CONFLICTING_OFFICIAL_SOURCES '+d)
                  need(len(x)>=.8*len(previous),'MARKET_UNIVERSE_SHRINKAGE '+d)
                  advance_sources[d]=x;previous=x
              if advances:need(advance_sources[day]==rows,'FINAL_SOURCE_CONFLICT')
              # Ledger is append-only. Do not rewrite conflicting old observations.
              ledger={};ledgerrows=read(price,PCOLS)
              for r in ledgerrows:
                  k=(r['date'],r['market'],r['code']);session(k[0]);v=Decimal(r['close'])
                  need(k[1] in markets and re.fullmatch('[0-9A-Z]{6}',k[2]) and v.is_finite() and v>0,'INVALID_LEDGER_ROW')
                  need(k not in ledger,'EXISTING_LEDGER_DUPLICATE '+str(k));ledger[k]=r['close']
              need(bool(ledger),'EMPTY_EXISTING_LEDGER');oldmarker=marker.read_text().strip();session(oldmarker)
              need(max(k[0] for k in ledger)<=day and oldmarker<=day,'LEDGER_DATE_REGRESSION')
              marker_counts=Counter(k[1] for k in ledger if k[0]==oldmarker)
              need(marker_counts['KOSPI']>=500 and marker_counts['KOSDAQ']>=1000,'LEDGER_MARKER_INCOMPLETE')
              sources={**advance_sources,day:rows}
              # Recover known official archives between ledger marker and target, without API.
              for p in sorted(A.glob('*.csv')):
                  if oldmarker<p.stem<=day:
                      x=canonical(read(p,COLS));complete(x,p.stem)
                      need(CAL.is_session(session(p.stem)),'ARCHIVE_NONTRADING_DAY')
                      if p.stem in sources:need(x==sources[p.stem],'PERMANENT_ARCHIVE_CONFLICT')
                      sources[p.stem]=x
              if day>oldmarker:
                  expected={x.strftime('%Y%m%d') for x in CAL.sessions_in_range(session(oldmarker),session(day)) if x.strftime('%Y%m%d')>oldmarker}
                  need(expected<=set(sources),'MISSING_OFFICIAL_LEDGER_SESSIONS '+str(sorted(expected-set(sources))))
              added=0
              for d,x in sorted(sources.items()):
                  complete(x,d)
                  for k,r in x.items():
                      v=r['TDD_CLSPRC']
                      if k in ledger:need(Decimal(ledger[k])==Decimal(v),'LEDGER_PRICE_CONFLICT '+str(k))
                      else:ledger[k]=v;added+=1
                  need({k for k in ledger if k[0]==d}==set(x),'LEDGER_UNIVERSE_CONFLICT '+d)
              ap=A/(day+'.csv');paths=[]
              for d,x in sorted({**advance_sources,day:rows}.items()):
                  p=A/(d+'.csv')
                  if p.exists():need(canonical(read(p,COLS))==x,'PERMANENT_ARCHIVE_CONFLICT '+d)
                  else:
                      p.write_bytes(csvbytes([x[k] for k in sorted(x)],COLS));paths.append(p)
              if day>old:
                  newhist=dict(hist)
                  for x in advance_sources.values():newhist.update(x)
                  keep=set(sorted({k[0] for k in newhist})[-70:])
                  newhist={k:r for k,r in newhist.items() if k[0] in keep}
                  need(len({k[0] for k in newhist})==70,'ROLLING_SESSION_COUNT')
                  c=complete(rows,day);latest.write_bytes(csvbytes([rows[k] for k in sorted(rows)],COLS))
                  history.write_bytes(gzip.compress(csvbytes([newhist[k] for k in sorted(newhist)],COLS),compresslevel=6,mtime=0))
                  oldsum.update(latest_trading_date=day,sessions_stored=70,total_rows_stored=len(newhist),kospi_rows_latest=c['KOSPI'],kosdaq_rows_latest=c['KOSDAQ'],marketcap_1000uk_screened=sum(int(r['MKTCAP'])>=100_000_000_000 for r in rows.values()),technical_indicators_asof=oldsum.get('technical_indicators_asof',old),indicator_metrics_asof=oldsum.get('indicator_metrics_asof',old),technical_indicators_status='STALE_PENDING_ORIGINAL_V4_G_REBUILD',note='Official KRX price source updated; technical indicator metrics retain their own as-of date; no investment authorization.')
                  writej(summary,oldsum);paths.extend([latest,history,summary])
              if added:
                  price.write_bytes(csvbytes([dict(zip(PCOLS,(*k,ledger[k]))) for k in sorted(ledger)],PCOLS));paths.append(price)
              if oldmarker!=day:marker.write_text(day+'\n');paths.append(marker)
              report.update(promoted_dates=advances,market_date=day,previous_market_date=old,previous_ledger_date=oldmarker,ledger_date=day,ledger_rows_added=added,official_archive=str(ap),market_rows=len(rows),technical_indicators_asof=oldsum.get('technical_indicators_asof',old))
              save('MARKET_READY_TO_COMMIT');report['market_committed']=commit(paths,'KRX v5: promote official session and append permanent price ledger') if paths else False
              report['market_persisted']=True;save('MARKET_PERSISTED_FINANCIAL_PENDING');return day

          def finance_phase(day):
              # Refresh after market publication; if another writer advanced market, never relabel.
              need(loadj(D/'summary.json')['latest_trading_date']==day,'MARKET_ADVANCED_RETRY')
              need((P/'last_market_date.txt').read_text().strip()==day,'LEDGER_DATE_MISMATCH')
              status=F/'status.json';index=F/'annual_financial_index_m.csv';before=loadj(status)
              protected=[p for p in F.glob('*.json') if p!=status];hashes={str(p):digest(p) for p in protected}
              need((F/'dart_financial_cache.json').is_file() and (F/'dart_disclosure_evidence.json').is_file(),'MISSING_FINANCIAL_CACHE')
              need(str(before.get('market_date',''))<=day,'FINANCIAL_DATE_REGRESSION')
              if before.get('market_date')!=day or before.get('official_market_date')!=day:
                  env=dict(os.environ,R14_REBUILD_ONLY='1',DART_API_KEY='',OPENDART_API_KEY='',GITHUB_WORKSPACE=str(Path.cwd()))
                  subprocess.run([sys.executable,'scripts/krx_v5_r14_financial_pipeline_n.py'],env=env,check=True)
              s=loadj(status);rr=read(index,['code','annual_profit','ttm_profit','ttm_status'])
              need(s['market_date']==s['official_market_date']==day and s['official_market_source_rows']==report['market_rows'],'FINANCIAL_DATE_MISMATCH')
              need(s.get('investment_decisions_authorized') is False and s.get('final_buy_signals')==0,'FINANCIAL_GATE')
              need(s.get('cache_records')==before.get('cache_records') and s.get('annual_verified_rows',0)>=before.get('annual_verified_rows',0),'FINANCIAL_CACHE_OR_COVERAGE_REGRESSION')
              need(hashes=={str(p):digest(p) for p in F.glob('*.json') if p!=status},'FINANCIAL_CACHE_CHANGED')
              need(len(rr)==s['base_rows']==len({r['code'] for r in rr}),'FINANCIAL_INDEX_MISMATCH')
              report['financial_committed']=commit([status,index],'KRX v5: synchronize financial evaluation date (cache only)')
              save('MARKET_AND_FINANCIAL_PERSISTED',financial_date=day,financial_cache_records=s['cache_records'],financial_disclosure_asof_verified=s.get('financial_disclosure_asof_verified',False),official_per_pbr_verified=False)

          if __name__=='__main__':
              try:
                  day=market_phase()
                  if day:finance_phase(day)
              except Exception as e:
                  save('BLOCKED_FINANCIAL_LINK' if report.get('market_persisted') else 'BLOCKED_MARKET_PROMOTION',error=type(e).__name__+': '+str(e)[:400]);raise
          PYCODE
          python -m py_compile /tmp/krx_promotion_13.py
          python /tmp/krx_promotion_13.py
      - name: Preserve promotion result and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-official-promotion-evidence
          path: market_promotion_output/
          if-no-files-found: warn
          retention-days: 90
