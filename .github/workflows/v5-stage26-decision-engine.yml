name: KRX v5 Stage26 Investment Decision Research
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decision-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore and run Stage26 decision engine
        run: |
          python - <<'PYCODE'
          import base64,pathlib
          pathlib.Path('/tmp/stage26.py').write_bytes(base64.b64decode(''))
          PYCODE
          python /tmp/stage26.py
      - name: Commit Stage26 research output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_reports/stage26/
          if ! git diff --cached --quiet; then
            git commit -m 'v5 stage26: decision research output'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v5-stage26-decision-research
          path: v5_reports/stage26/
