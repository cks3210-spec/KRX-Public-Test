                  'source_sha256':{str(p):sha(p) for p in (SUMMARY,EXCL,vsp,rsp,vcp,rcp)},
                  'notes':[
                     'Prior research cohort remains observation-only; it has not been revalidated for investment.',
                     'New leads with only cached receipt metadata remain evidence-review queue, not approved A/B recommendations.',
                     'New leads absent from cached annual filing metadata are deferred from the research shortlist without asserting that a filing does not exist.',
                     'Missing corrected filings remain excluded per prior R14 policy.',
                     'No ratio export, live price, filing retrieval or additional APIs are accessed.'
                  ]
              }
              folder=OUT/day
              for name,values in (
                  ('all_158_provisional_disposition.csv',all_rows),
                  ('prior_cohort_research_observation.csv',obs),
                  ('new_cached_filing_review_queue.csv',review),
                  ('new_missing_cached_receipt_deferred.csv',deferred)):
                  frozen_write(folder/name,csv_bytes(values))
              payload=(json.dumps(summary,sort_keys=True,ensure_ascii=False,indent=2)+'\n').encode('utf-8')
              frozen_write(folder/'status.json',payload)
              OUT.mkdir(parents=True,exist_ok=True)
              (OUT/'latest_status.json').write_bytes(payload)
              print(json.dumps({k:summary[k] for k in (
                  'state','official_market_date','total_preliminary_ab',
                  'prior_cohort_research_observation_rows','new_filing_review_queue_rows',
                  'new_deferred_missing_cached_annual_receipt_rows','final_buy_signals')},ensure_ascii=False))

          if __name__=='__main__':main()
          PYCODE
          python -m py_compile /tmp/krx_v5_candidate_triage.py
          python /tmp/krx_v5_candidate_triage.py
      - name: Commit daily financial/growth, full-market grades, valuation and evidence-triage records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_reports/r14_daily_financial_join/ v5_reports/r14_full_market_readiness/ v5_reports/r14_daily_market_regrade/ v5_reports/r14_daily_valuation_readiness/ v5_reports/r14_daily_candidate_triage/
          if git diff --cached --quiet; then
            echo 'Identical daily research evidence already saved, no commit.'
            exit 0
          fi
          git commit -m 'KRX v5: archive R14 provisional grades and valuation evidence gate'
          git pull --rebase origin main
          git push origin HEAD:main
