                  'provisional_grade_research_only','research_score','research_cohort',
                  'current_official_close_krw','current_official_marketcap_krw',
                  'annual_receipt_metadata_state','historic_basic_cap_scope',
                  'research_handling','evidence_actions_needed',
                  'financial_point_in_time_verified','official_per_pbr_verified',
                  'final_grade','fair_price_krw','buy_signal','investment_authorized']


          def guard(condition,label):
              if not condition: raise ValueError('R14_CANDIDATE_TRIAGE_'+label)


          def read_json(p):
              guard(p.is_file(),'MISSING_'+p.name)
              return json.loads(p.read_text(encoding='utf-8-sig'))


          def read_csv(p):
              guard(p.is_file(),'MISSING_'+p.name)
              with p.open(encoding='utf-8-sig',newline='') as f:
                  r=csv.DictReader(f)
                  guard(bool(r.fieldnames),'INVALID_CSV_HEADER_'+p.name)
                  return list(r)


          def csv_bytes(rows):
              buff=io.StringIO(newline='')
              writer=csv.DictWriter(buff,fieldnames=FIELDS,extrasaction='raise')
              writer.writeheader()
              writer.writerows(rows)
              return buff.getvalue().encode('utf-8-sig')


          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()


          def frozen_write(p,b):
              p.parent.mkdir(parents=True,exist_ok=True)
              if p.exists(): guard(p.read_bytes()==b,'IMMUTABLE_HISTORY_CONFLICT_'+p.name)
              else: p.write_bytes(b)


