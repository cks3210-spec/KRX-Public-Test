          #!/usr/bin/env python3
          """Read-only R14 evidence / price-readiness gate. No fetching or investment authorization.
          
          This step runs after R14 full-market regrade in the existing workflow. Older
          request-bound KRX basic security and DART filing metadata never establish a
          provider-attested as-of date or independent per-account point-in-time proof.
          """
          from collections import Counter
          import csv
          import hashlib
          import io
          import json
          from pathlib import Path
          import re
          
          ROOT = Path('.')
          REVAL_ROOT = ROOT / 'v5_reports/r14_daily_market_regrade'
          OUTPUT_ROOT = ROOT / 'v5_reports/r14_daily_valuation_readiness'
          REVAL_STATUS = REVAL_ROOT / 'latest_status.json'
          RATIO_PROOF = ROOT / 'v5_reports/stage28/r14_stage55_p2_provenance_gate_20261120.json'
          P3_PROOF = ROOT / 'v5_reports/stage28/r14_stage54_p3_cached_evidence_20261120.json'
          EXCLUSIONS = ROOT / 'v5_reports/stage28/r14_candidate_exclusion_gate.json'
          R14_RECEIPT = ROOT / 'v5_reports/stage28/r14_filing_receipt_audit.json'
          R14_ACCOUNT = ROOT / 'v5_reports/stage28/r14_financial_value_reconciliation_cache.json'
          ANNUAL_META = ROOT / 'data/v5_financial_m/dart_disclosure_evidence.json'
          BASIC = ROOT / 'data/v5_official_shareclass_archive/20261120.json'
          MARKET_SUMMARY = ROOT / 'data/summary.json'
          FIELDS = [
              'official_market_date','stock_code','stock_name','market',
              'research_grade_asof_market_date','provisional_grade','score','candidate_origin',
              'current_official_close_krw','current_official_marketcap_krw',
              'annual_financial_index_snapshot_date',
              'r14_filing_receipt_metadata_state','r14_account_comparison_state',
              'cached_2025_annual_filing_metadata_state','cached_annual_receipt_count',
              'historic_basic_snapshot_date','historic_common_share_state','historic_cap_scope_state',
              'basic_api_asof_independently_attested',
              'point_in_time_account_values_verified',
              'official_dated_provider_per_pbr_verified',
              'sector_model_calibrated','price_adjustment_verified',
              'valuation_eligibility','blocked_reasons','certified_fair_price_krw',
              'actionable_buy_price_krw','final_grade','buy_signal','investment_authorized'
          ]
          
          
          def require(ok, tag):
              if not ok:
                  raise ValueError('R14_VALUATION_EVIDENCE_' + tag)
          
          
          def document(path):
              require(path.is_file(), 'MISSING_' + path.name)
              return json.loads(path.read_text(encoding='utf-8-sig'))
          
          
          def records(path):
              require(path.is_file(), 'MISSING_' + path.name)
              with path.open(encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  require(bool(reader.fieldnames), 'NO_CSV_FIELDS_' + path.name)
                  return list(reader)
          
          
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          
          def make_csv(rows):
              buf = io.StringIO(newline='')
              writer = csv.DictWriter(buf, fieldnames=FIELDS, extrasaction='raise')
              writer.writeheader()
              writer.writerows(rows)
              return buf.getvalue().encode('utf-8-sig')
          
          
          def immutable(path, body):
              path.parent.mkdir(parents=True, exist_ok=True)
              if path.exists():
                  require(path.read_bytes() == body, 'IMMUTABLE_HISTORY_CONFLICT_' + path.name)
              else:
                  path.write_bytes(body)
          
          
          def main():
              reval = document(REVAL_STATUS)
              market_summary = document(MARKET_SUMMARY)
              day = str(reval.get('official_market_date', ''))
              require(re.fullmatch(r'20\d{6}', day) is not None, 'BAD_MARKET_DAY')
              require(reval.get('state') == 'RESEARCH_ONLY_FULL_MARKET_GRADE_ENGINE_RECALCULATED', 'NOT_RESEARCH_GRADE_OUTPUT')
              require(market_summary.get('latest_trading_date') == day, 'OPERATING_MARKET_DATE_STALE')
              source = REVAL_ROOT / day / 'provisional_ab_full_market.csv'
              source_status = document(REVAL_ROOT / day / 'status.json')
              require(reval == source_status, 'DATE_AND_LATEST_REGRADING_STATUS_DIFFER')
              all_rows = records(source)
