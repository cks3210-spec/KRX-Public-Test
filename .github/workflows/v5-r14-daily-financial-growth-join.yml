              guard(rs.get('state')=='RESEARCH_ONLY_FULL_MARKET_GRADE_ENGINE_RECALCULATED','REGRADING_INPUT_NOT_VERIFIED')
              guard(vs.get('final_buy_signals')==rs.get('final_buy_signals')==0 and
