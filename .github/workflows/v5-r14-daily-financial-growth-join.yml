name: KRX v5 R14 Daily Financial and Growth Join (Research Only)
'on':
  workflow_dispatch: {}
  workflow_run:
    workflows: ['KRX v5 R14 Daily Official Price Join (Research Only)']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: krx-v5-r14-daily-financial-growth-join
  cancel-in-progress: false
jobs:
  financial-growth-join:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Join cached financial and growth evidence to official daily research prices
        shell: bash
        run: |
          cat > /tmp/krx_v5_r14_financial_growth_join.py <<'PYCODE'
          #!/usr/bin/env python3
          """Join frozen R14 research cohort to existing annual/growth financial evidence.
          
          No API calls, scraping, credentials, private KRX exports, valuation certification,
          current-grade recertification, target prices, or trade signals are created.
          """
          import csv
          import hashlib
          import io
          import json
          from collections import Counter
          from pathlib import Path
          import re
          
          ROOT = Path('.')
          MARKET_STATUS = ROOT / 'v5_reports/r14_daily_market_join/latest_status.json'
          GROWTH_CSV = ROOT / 'data/v5_investment_r14_fundamental/provisional_ab_enriched.csv'
          GROWTH_STATUS = ROOT / 'data/v5_investment_r14_fundamental/status.json'
          ANNUAL_CSV = ROOT / 'data/v5_financial_m/annual_financial_index_m.csv'
          ANNUAL_STATUS = ROOT / 'data/v5_financial_m/status.json'
          EVIDENCE_CSV = ROOT / 'v5_reports/stage28/r14_calculated_ratio_evidence_tiers.csv'
          PROVENANCE_JSON = ROOT / 'v5_reports/stage28/r14_stage55_p2_provenance_gate_20261120.json'
          OUTROOT = ROOT / 'v5_reports/r14_daily_financial_join'
          
          FIELDS = [
              'official_market_date','research_market_date','stock_code','stock_name','market',
              'frozen_research_grade','frozen_research_score','current_official_close_krw',
              'unadjusted_close_change_pct','current_marketcap_krw','current_volume',
              'current_marketcap_100bn_eligible','financial_enrichment_state',
              'growth_market_date','growth_provenance','financial_report_year',
              'annual_index_snapshot_date','annual_financial_source','annual_fs_div',
              'annual_owner_profit_krw','ttm_owner_profit_krw','ttm_calculation_status',
              'annual_roe_pct','revenue_yoy_pct','operating_profit_yoy_pct',
              'owner_profit_yoy_pct','growth_coverage','derived_research_per_asof_cohort',
              'derived_research_pbr_asof_cohort','derived_ratio_evidence_tier',
              'ratio_provider_verified','financial_point_in_time_verified',
              'current_grade_revalidated','actionable_fair_price_krw','final_buy_signal',
              'investing_authorized'
          ]
          
          
          def require(cond, why):
              if not cond:
                  raise ValueError('R14_FINANCIAL_JOIN_' + why)
          
          
          def jsonread(p):
              return json.loads(p.read_text(encoding='utf-8-sig'))
          
          
          def csvread(p):
              with p.open(encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  require(reader.fieldnames is not None and len(reader.fieldnames) == len(set(reader.fieldnames)),
                          'BAD_CSV_HEADER_' + p.name)
                  return list(reader)
          
          
          def index_unique(rows, key, label):
              out = {}
              for row in rows:
                  keyval = key(row)
                  require(keyval not in out, 'DUPLICATE_' + label + '_' + str(keyval))
                  out[keyval] = row
              return out
          
          
          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          
          
          def datelike(s):
              return isinstance(s, str) and re.fullmatch(r'20\d{6}', s) is not None
          
          
          def csvbytes(rows):
              file = io.StringIO(newline='')
              writer = csv.DictWriter(file, fieldnames=FIELDS, extrasaction='raise', lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
              return file.getvalue().encode('utf-8-sig')
          
          
          def immutable_write(p, content):
              if p.exists():
                  require(p.read_bytes() == content, 'IMMUTABLE_SOURCE_CHANGED_' + p.name)
                  return
              p.write_bytes(content)
          
          
          def main():
              market_status = jsonread(MARKET_STATUS)
              official_day = market_status.get('official_market_date', '')
              cohort_day = market_status.get('research_market_date', '')
              require(market_status.get('state') == 'RESEARCH_ONLY_FULL_JOIN_VERIFIED', 'MARKET_JOIN_NOT_VERIFIED')
              require(datelike(official_day) and datelike(cohort_day) and cohort_day <= official_day,
                      'MARKET_COHORT_DATE_MISMATCH')
              require(market_status.get('investment_decisions_authorized') is False and
                      market_status.get('official_per_pbr_verified') is False and
                      market_status.get('current_grade_revalidated') is False, 'UNEXPECTED_MARKET_AUTHORIZATION')
          
              market_csv = ROOT / ('v5_reports/r14_daily_market_join/' + official_day +
                                   '/r14_ab_official_price_join.csv')
              market_rows = csvread(market_csv)
              require(len(market_rows) == market_status.get('matched_candidates'), 'MARKET_JOIN_COUNTS_CHANGED')
              require(len(market_rows) == market_status.get('research_candidates'), 'MARKET_JOIN_UNEXPECTED_MISSING')
              require(len(market_rows) >= 1, 'EMPTY_MARKET_JOIN')
          
              growth_status = jsonread(GROWTH_STATUS)
              annual_status = jsonread(ANNUAL_STATUS)
              provenance = jsonread(PROVENANCE_JSON)
              growth_date = growth_status.get('market_date', '')
              annual_date = annual_status.get('market_date', '')
              require(datelike(growth_date) and growth_date <= official_day, 'FUTURE_GROWTH_SNAPSHOT')
              require(datelike(annual_date) and annual_date <= official_day, 'FUTURE_FINANCIAL_SNAPSHOT')
              require(growth_status.get('final_buy_signals') == 0 and
                      growth_status.get('official_per_pbr_verified') == 0, 'GROWTH_SOURCE_AUTHORIZATION_UNEXPECTED')
              require(annual_status.get('investment_decisions_authorized') is False and
                      annual_status.get('point_in_time_financials_authorized') is False,
                      'FINANCIAL_SOURCE_AUTHORIZATION_UNEXPECTED')
              require(provenance.get('research_market_date') == cohort_day and
                      provenance.get('candidate_count') == len(market_rows) and
                      provenance.get('authorized_trade_decisions') is False and
                      provenance.get('p2_official_per_verified_count') == 0 and
                      provenance.get('p2_official_pbr_verified_count') == 0,
                      'PROVENANCE_GATE_MISMATCH')
          
              growth = index_unique(csvread(GROWTH_CSV),
                                    lambda r: (r['ISU_CD'], r['MARKET']), 'GROWTH_SECURITY')
              annual = index_unique(csvread(ANNUAL_CSV), lambda r: r['code'], 'ANNUAL_SECURITY')
              evidence = index_unique(csvread(EVIDENCE_CSV), lambda r: r['code'], 'RATIO_EVIDENCE')
              p2 = index_unique(provenance['candidate_states'], lambda r: r['code'], 'PROVENANCE_SECURITY')
              market_codes = set()
              result, eligible = [], []
              metrics = Counter()
              absent_growth = []
              for mr in market_rows:
                  code, market = mr['stock_code'], mr['market']
                  require(re.fullmatch(r'[A-Z0-9]{6}', code) is not None and
                          market in ('KOSPI', 'KOSDAQ'), 'BAD_MARKET_SECURITY_KEY')
                  require(code not in market_codes, 'DUPLICATE_DAILY_MARKET_CODE')
                  market_codes.add(code)
                  require(mr['official_market_date'] == official_day and
                          mr['research_market_date'] == cohort_day and
                          mr['join_status'] == 'MATCHED_OFFICIAL_PRICE' and
                          mr['research_grade_asof'] in ('A', 'B') and
                          mr['official_per_pbr_verified'] == 'NO' and
                          mr['investment_decisions_authorized'] == 'NO' and
                          mr['buy_signal'] == 'NONE', 'INVALID_MARKET_JOIN_RECORD')
                  require(mr['marketcap_100bn_eligible'] in ('YES', 'NO'), 'BAD_MARKETCAP_GATE')
                  src_growth = growth.get((code, market))
                  src_annual = annual.get(code)
                  src_ev = evidence.get(code)
                  src_p2 = p2.get(code)
                  require(src_annual is not None, 'MISSING_ANNUAL_FINANCIAL_' + code)
                  require(src_ev is not None and src_p2 is not None, 'MISSING_RATIO_PROVENANCE_' + code)
                  require(src_ev['research_market_date'] == cohort_day and
                          src_ev['grade_research_only'] == mr['research_grade_asof'] and
                          src_ev['calculated_ratio_is_research_only'] == 'True' and
                          src_ev['investment_decisions_authorized'] == 'False' and
                          src_p2['grade_research_only'] == mr['research_grade_asof'] and
                          src_p2['buy_signal'] is False and
                          src_p2['p2'] == 'NO_INDEPENDENTLY_AUTHENTICATED_DATED_RATIO',
                          'UNEXPECTED_RATIO_EVIDENCE_' + code)
                  if src_growth:
                      require(src_growth['BAS_DD'] == growth_date and
                              src_growth['BAS_DD'] <= official_day and
                              src_growth['eligible'] == '1', 'GROWTH_DATE_OR_ELIGIBILITY_' + code)
                      metrics['growth_matched'] += 1
                  else:
                      absent_growth.append(code)
                  report_year = src_annual['year']
                  require(re.fullmatch(r'20\d{2}', report_year) is not None and
                          int(report_year) <= int(cohort_day[:4]), 'ANNUAL_YEAR_INVALID')
                  metrics['annual_financial_matched'] += 1
                  def metric(k):
                      v = src_growth[k].strip() if src_growth else ''
                      if v:
                          metrics[k + '_available'] += 1
                      return v
                  row = {
                      'official_market_date': official_day,
                      'research_market_date': cohort_day,
                      'stock_code': code, 'stock_name': mr['stock_name'], 'market': market,
                      'frozen_research_grade': mr['research_grade_asof'],
                      'frozen_research_score': mr['research_score_asof'],
                      'current_official_close_krw': mr['official_close_krw'],
                      'unadjusted_close_change_pct': mr['unadjusted_close_change_pct'],
                      'current_marketcap_krw': mr['official_marketcap_krw'],
                      'current_volume': mr['official_volume'],
                      'current_marketcap_100bn_eligible': mr['marketcap_100bn_eligible'],
                      'financial_enrichment_state': 'GROWTH_ENRICHMENT_AVAILABLE' if src_growth
                                                    else 'GROWTH_ENRICHMENT_NOT_FOUND',
                      'growth_market_date': src_growth['BAS_DD'] if src_growth else '',
                      'growth_provenance': src_growth['growth_source'] if src_growth else '',
                      'financial_report_year': report_year,
                      'annual_index_snapshot_date': annual_date,
                      'annual_financial_source': src_annual['source'],
                      'annual_fs_div': src_annual['fs_div'],
                      'annual_owner_profit_krw': src_annual['annual_profit'],
                      'ttm_owner_profit_krw': src_annual['ttm_profit'],
                      'ttm_calculation_status': src_annual['ttm_status'],
                      'annual_roe_pct': src_annual['annual_roe_pct'],
                      'revenue_yoy_pct': metric('revenue_yoy_pct'),
                      'operating_profit_yoy_pct': metric('operating_profit_yoy_pct'),
                      'owner_profit_yoy_pct': metric('owner_profit_yoy_pct'),
                      'growth_coverage': src_growth['growth_coverage'] if src_growth else '',
                      'derived_research_per_asof_cohort': src_ev['per_calculated_research'],
                      'derived_research_pbr_asof_cohort': src_ev['pbr_calculated_research'],
                      'derived_ratio_evidence_tier': src_ev['evidence_tier'],
                      'ratio_provider_verified': 'NO',
                      'financial_point_in_time_verified': 'NO',
                      'current_grade_revalidated': 'NO',
                      'actionable_fair_price_krw': '',
                      'final_buy_signal': 'NONE',
                      'investing_authorized': 'NO'
                  }
                  for k in ('ttm_owner_profit_krw', 'annual_roe_pct', 'derived_research_per_asof_cohort',
                            'derived_research_pbr_asof_cohort'):
                      if row[k].strip():
                          metrics[k + '_available'] += 1
                  result.append(row)
                  if mr['marketcap_100bn_eligible'] == 'YES':
                      eligible.append(row)
              require(len(result) == len(market_rows) == len(evidence) == len(p2), 'FINAL_UNIVERSE_MISMATCH')
              require(len(eligible) == market_status.get('eligible_at_current_marketcap_100bn'),
                      'ELIGIBLE_MARKETCAP_MISMATCH')
              result.sort(key=lambda r: (r['frozen_research_grade'], r['stock_code']))
              eligible.sort(key=lambda r: (r['frozen_research_grade'], r['stock_code']))
          
              status = {
                  'version': 'KRX_V5_R14_DAILY_FINANCIAL_GROWTH_JOIN_V1',
                  'state': 'RESEARCH_FINANCIAL_GROWTH_JOIN_VERIFIED',
                  'official_market_date': official_day,
                  'frozen_research_grade_date': cohort_day,
                  'growth_snapshot_date': growth_date,
                  'annual_financial_index_snapshot_date': annual_date,
                  'annual_financial_years': sorted({r['financial_report_year'] for r in result}),
                  'candidate_rows': len(result),
                  'current_marketcap_eligible_rows': len(eligible),
                  'growth_enrichment_rows': metrics['growth_matched'],
                  'missing_growth_enrichment_codes': sorted(absent_growth),
                  'annual_index_rows_matched': metrics['annual_financial_matched'],
                  'coverage': dict(sorted(metrics.items())),
                  'official_per_pbr_verified': False,
                  'financial_point_in_time_verified': False,
                  'current_research_grade_revalidated': False,
                  'final_buy_signals': 0,
                  'investment_decisions_authorized': False,
                  'source_sha256': {
                      'market_join_csv': digest(market_csv),
                      'market_join_status': digest(MARKET_STATUS),
                      'growth_csv': digest(GROWTH_CSV),
                      'growth_status': digest(GROWTH_STATUS),
                      'annual_financial_index': digest(ANNUAL_CSV),
                      'annual_financial_status': digest(ANNUAL_STATUS),
                      'calculated_research_ratios': digest(EVIDENCE_CSV),
                      'stage55_provenance_gate': digest(PROVENANCE_JSON)
                  },
                  'warnings': [
                      'Financial and growth values are preserved from earlier snapshots and are not fresh 1-day fundamentals.',
                      'Annual index source does not prove point-in-time filing or corrected-filing applicability.',
                      'PER/PBR values are derived research ratios as of the frozen cohort, not official daily provider ratios.',
                      'Latest market closes are not corporate-action adjusted for the displayed price change.',
                      'Frozen A/B are research cohorts, not current investment recommendations; fair price/buy signals withheld.'
                  ]
              }
              text = (json.dumps(status, indent=2, ensure_ascii=False, sort_keys=True) + '\n').encode('utf-8')
              out = OUTROOT / official_day
              out.mkdir(parents=True, exist_ok=True)
              immutable_write(out / 'all_ab_research_financial_join.csv', csvbytes(result))
              immutable_write(out / 'marketcap_eligible_ab_financial_join.csv', csvbytes(eligible))
              immutable_write(out / 'status.json', text)
              OUTROOT.mkdir(parents=True, exist_ok=True)
              (OUTROOT / 'latest_status.json').write_bytes(text)
              print(json.dumps({k: status[k] for k in ('state', 'official_market_date', 'candidate_rows',
                  'current_marketcap_eligible_rows', 'growth_enrichment_rows',
                  'missing_growth_enrichment_codes', 'annual_index_rows_matched')}, ensure_ascii=False))
          
          
          if __name__ == '__main__':
              main()
          PYCODE
          python -m py_compile /tmp/krx_v5_r14_financial_growth_join.py
          python /tmp/krx_v5_r14_financial_growth_join.py
      - name: Audit entire official market against cached research evidence (no API, no regrade)
        shell: bash
        run: |
          cat > /tmp/krx_v5_full_market_readiness.py <<'PYCODE'
          #!/usr/bin/env python3
          """KRX v5: daily whole-market research coverage, never a trading screen.
          
          Use existing official close, frozen R14 evidence and cached financial data only.
          No network, new official ratio requests, recalculated grades or buy signals.
          """
          from __future__ import annotations
          import csv
          import hashlib
          import io
          import json
          import re
          from collections import Counter
          from pathlib import Path
          
          MARKET = Path('data/latest.csv')
          SUMMARY = Path('data/summary.json')
          ANNUAL = Path('data/v5_financial_m/annual_financial_index_m.csv')
          ANNUAL_STATUS = Path('data/v5_financial_m/status.json')
          GROWTH = Path('data/v5_investment_r14_fundamental/provisional_ab_enriched.csv')
          GROWTH_STATUS = Path('data/v5_investment_r14_fundamental/status.json')
          FIN_JOIN = Path('v5_reports/r14_daily_financial_join/latest_status.json')
          PRICE_JOIN = Path('v5_reports/r14_daily_market_join/latest_status.json')
          EXCLUSIONS = Path('v5_reports/stage28/r14_candidate_exclusion_gate.json')
          ROOT = Path('v5_reports/r14_full_market_readiness')
          COLS = [
           'official_market_date', 'stock_code', 'market', 'stock_name', 'official_close_krw',
           'official_volume', 'official_marketcap_krw', 'marketcap_100bn_eligible',
           'six_digit_stock_code', 'annual_cache_present', 'annual_report_year',
           'annual_financial_snapshot_date', 'annual_fs_div', 'annual_roe_pct_cached',
           'annual_ttm_status', 'growth_cache_present', 'growth_snapshot_date',
           'revenue_yoy_pct_cached', 'operating_profit_yoy_pct_cached',
           'owner_profit_yoy_pct_cached', 'frozen_ab_research_grade',
           'frozen_ab_research_date', 'historic_correction_evidence_excluded',
           'research_coverage_state', 'official_per_pbr_verified',
           'financial_point_in_time_verified', 'current_grade_revalidated',
           'final_buy_signal', 'investment_decisions_authorized'
          ]
          
          def guard(ok, name):
              if not ok:
                  raise ValueError('FULL_MARKET_READINESS_' + name)
          
          def js(path):
              return json.loads(path.read_text(encoding='utf-8-sig'))
          
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          def table(path, cols):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  guard(set(cols).issubset(reader.fieldnames or []), 'COLUMNS_' + path.name)
                  return list(reader)
          
          def index(rows, keys, name):
              result = {}
              for row in rows:
                  key = tuple(row[k].strip() for k in keys)
                  guard(key not in result, 'DUPLICATE_' + name)
                  result[key] = row
              return result
          
          def immutable(path, data):
              if path.exists():
                  guard(path.read_bytes() == data, 'IMMUTABLE_CONFLICT_' + path.name)
              else:
                  path.write_bytes(data)
          
          def csv_bytes(rows):
              b = io.StringIO(newline='')
              w = csv.DictWriter(b, fieldnames=COLS, extrasaction='raise')
              w.writeheader()
              w.writerows(rows)
              return b.getvalue().encode('utf-8-sig')
          
          def main():
              required = [MARKET, SUMMARY, ANNUAL, ANNUAL_STATUS, GROWTH, GROWTH_STATUS, FIN_JOIN, PRICE_JOIN, EXCLUSIONS]
              for p in required:
                  guard(p.is_file(), 'INPUT_MISSING_' + p.name)
              summary = js(SUMMARY)
              join = js(FIN_JOIN)
              price = js(PRICE_JOIN)
              ann_status = js(ANNUAL_STATUS)
              growth_status = js(GROWTH_STATUS)
              exclusion = js(EXCLUSIONS)
              day = str(summary['latest_trading_date'])
              guard(re.fullmatch(r'20\d{6}', day) is not None, 'MARKET_DAY')
              guard(join.get('state') == 'RESEARCH_FINANCIAL_GROWTH_JOIN_VERIFIED', 'JOIN_NOT_VERIFIED')
              guard(join.get('official_market_date') == day, 'STALE_FINANCIAL_JOIN')
              guard(price.get('state') == 'RESEARCH_ONLY_FULL_JOIN_VERIFIED' and price.get('official_market_date') == day,
                    'PRICE_JOIN_STALE_OR_UNVERIFIED')
              guard(sha(MARKET) == price.get('source_sha256',{}).get('latest_market'), 'OFFICIAL_PRICE_HASH_MISMATCH')
              guard(join.get('investment_decisions_authorized') is False and join.get('final_buy_signals') == 0,
                    'UPSTREAM_TRADING_AUTHORIZATION')
              guard(join.get('official_per_pbr_verified') is False and join.get('financial_point_in_time_verified') is False,
                    'INVALID_SOURCE_VALUATION_ASSERTION')
              guard(ann_status.get('investment_decisions_authorized') is False and not ann_status.get('financial_disclosure_asof_verified'),
                    'ANNUAL_PROVENANCE_GATE')
              guard(growth_status.get('final_buy_signals') == 0 and growth_status.get('official_per_pbr_verified') == 0,
                    'GROWTH_PROVENANCE_GATE')
              guard(exclusion.get('investment_decisions_authorized') is False, 'EXCLUSION_PROVENANCE_GATE')
              guard(exclusion.get('research_market_date') == join.get('frozen_research_grade_date'),
                    'COHORT_EXCLUSION_DATE_MISMATCH')
              hist_date = join.get('frozen_research_grade_date')
              join_csv = Path(f'v5_reports/r14_daily_financial_join/{day}/all_ab_research_financial_join.csv')
              guard(join_csv.is_file(), 'JOIN_CSV_MISSING')
              market = table(MARKET, ['BAS_DD','ISU_CD','ISU_NM','TDD_CLSPRC','ACC_TRDVOL','MKTCAP','MARKET'])
              annual = table(ANNUAL, ['code','year','fs_div','annual_roe_pct','ttm_status'])
              growth = table(GROWTH, ['BAS_DD','MARKET','ISU_CD','revenue_yoy_pct','operating_profit_yoy_pct','owner_profit_yoy_pct'])
              research = table(join_csv, ['stock_code','market','official_market_date','frozen_research_grade','current_marketcap_100bn_eligible'])
              guard(len(market) >= 2000 and len(research) == join['candidate_rows'], 'SOURCE_COUNTS')
              guard({x['BAS_DD'] for x in market} == {day}, 'MARKET_DATE_MISMATCH')
              guard({x['official_market_date'] for x in research} == {day}, 'JOIN_DATE_MISMATCH')
              annual_idx = index(annual, ['code'], 'ANNUAL')
              growth_idx = index(growth, ['MARKET','ISU_CD'], 'GROWTH')
              research_idx = index(research, ['market','stock_code'], 'RESEARCH')
              market_idx = index(market, ['MARKET','ISU_CD'], 'MARKET')
              excluded_codes = set(exclusion['excluded_codes'])
              guard(excluded_codes.isdisjoint({x['stock_code'] for x in research}), 'EXCLUSION_LEAK')
              guard({x['stock_code'] for x in research}.issubset({x['ISU_CD'] for x in market}), 'RESEARCH_NOT_IN_MARKET')
              rows=[]
              counters = Counter()
              grades=Counter()
              for x in market:
                  code, mk = x['ISU_CD'], x['MARKET']
                  guard(re.fullmatch(r'[0-9A-Z]{6}', code) is not None, 'BAD_SECURITY_CODE')
                  guard(mk in ('KOSPI','KOSDAQ'), 'INVALID_MARKET')
                  guard(x['TDD_CLSPRC'].replace(',','').isdigit() and int(x['TDD_CLSPRC'].replace(',',''))>0, 'BAD_CLOSE')
                  guard(x['MKTCAP'].replace(',','').isdigit() and int(x['MKTCAP'].replace(',',''))>0, 'BAD_MARKETCAP')
                  six = re.fullmatch(r'\d{6}', code) is not None
                  cap = int(x['MKTCAP'].replace(',','')) >= 100_000_000_000
                  a = annual_idx.get((code,))
                  g = growth_idx.get((mk,code))
                  c = research_idx.get((mk,code))
                  if code in excluded_codes:
                      state = 'EXCLUDED_MISSING_CORRECTION_EVIDENCE'
                  elif not six:
                      state = 'NOT_REEVALUATED_NON_NUMERIC_CODE'
                  elif c and not cap:
                      state = 'FROZEN_AB_BELOW_CURRENT_MARKETCAP'
                  elif c and not a:
                      state = 'FROZEN_AB_ANNUAL_CACHE_MISSING'
                  elif c and not g:
                      state = 'FROZEN_AB_GROWTH_CACHE_MISSING'
                  elif c:
                      state = 'FROZEN_AB_RESEARCH_WITH_CACHED_EVIDENCE'
                  elif not cap:
                      state = 'NOT_IN_FROZEN_AB_AND_BELOW_CAP'
                  else:
                      state = 'NOT_IN_FROZEN_AB_RESEARCH_COHORT'
                  if c:
                      guard(c['current_marketcap_100bn_eligible'] == ('YES' if cap else 'NO'), 'COHORT_MARKETCAP_CONFLICT')
                      guard(c['frozen_research_grade'] in ('A','B'), 'INVALID_RESEARCH_GRADE')
                      grades[c['frozen_research_grade']]+=1
                  if a and six:
                      counters['annual_cache_present']+=1
                  if g:
                      counters['growth_cache_present']+=1
                  if cap:
                      counters['marketcap_eligible']+=1
                  if c and cap:
                      counters['frozen_ab_current_cap_eligible']+=1
                  if c and cap and a and g:
                      counters['frozen_ab_cached_growth_present']+=1
                  if not six:
                      counters['nonnumeric_codes']+=1
                  counters[state]+=1
                  rows.append({
                      'official_market_date':day, 'stock_code':code, 'market':mk, 'stock_name':x['ISU_NM'],
                      'official_close_krw':x['TDD_CLSPRC'], 'official_volume':x['ACC_TRDVOL'],
                      'official_marketcap_krw':x['MKTCAP'], 'marketcap_100bn_eligible':'YES' if cap else 'NO',
                      'six_digit_stock_code':'YES' if six else 'NO',
                      'annual_cache_present':'YES' if a else 'NO', 'annual_report_year':a['year'] if a else '',
                      'annual_financial_snapshot_date':ann_status.get('market_date','') if a else '',
                      'annual_fs_div':a['fs_div'] if a else '', 'annual_roe_pct_cached':a['annual_roe_pct'] if a else '',
                      'annual_ttm_status':a['ttm_status'] if a else '',
                      'growth_cache_present':'YES' if g else 'NO',
                      'growth_snapshot_date':g['BAS_DD'] if g else '',
                      'revenue_yoy_pct_cached':g['revenue_yoy_pct'] if g else '',
                      'operating_profit_yoy_pct_cached':g['operating_profit_yoy_pct'] if g else '',
                      'owner_profit_yoy_pct_cached':g['owner_profit_yoy_pct'] if g else '',
                      'frozen_ab_research_grade':c['frozen_research_grade'] if c else '',
                      'frozen_ab_research_date':hist_date if c else '',
                      'historic_correction_evidence_excluded':'YES' if code in excluded_codes else 'NO',
                      'research_coverage_state':state,
                      'official_per_pbr_verified':'NO', 'financial_point_in_time_verified':'NO',
                      'current_grade_revalidated':'NO', 'final_buy_signal':'NONE',
                      'investment_decisions_authorized':'NO'
                  })
              guard(sum(grades.values()) == join['candidate_rows'], 'GRADE_COHORT_COUNT')
              guard(counters['frozen_ab_current_cap_eligible'] == join['current_marketcap_eligible_rows'],
                    'FROZEN_ELIGIBLE_COUNT')
              guard(len(rows) == len(market_idx), 'UNIQUE_MARKET_ROWS')
              rows.sort(key=lambda x:(x['market'],x['stock_code']))
              status = {
                  'version':'KRX_V5_FULL_MARKET_DAILY_RESEARCH_READINESS_V1',
                  'state':'WHOLE_MARKET_SOURCE_COVERAGE_RECORDED',
                  'official_market_date':day,
                  'frozen_research_grade_date':hist_date,
                  'source_market_rows':len(rows),
                  'marketcap_100bn_rows':counters['marketcap_eligible'],
                  'numeric_stock_codes':len(rows)-counters['nonnumeric_codes'],
                  'annual_cache_rows_matched':counters['annual_cache_present'],
                  'growth_cache_rows_matched':counters['growth_cache_present'],
                  'frozen_ab_candidate_rows':join['candidate_rows'],
                  'frozen_ab_grade_counts':dict(grades),
                  'frozen_ab_current_cap_eligible':counters['frozen_ab_current_cap_eligible'],
                  'frozen_ab_current_cap_with_growth_cache':counters['frozen_ab_cached_growth_present'],
                  'source_states':dict(sorted((k,v) for k,v in counters.items() if k.startswith(('FROZEN_AB_','NOT_','EXCLUDED_')))),
                  'official_per_pbr_verified':False,
                  'financial_point_in_time_verified':False,
                  'current_grade_revalidated':False,
                  'investment_decisions_authorized':False,
                  'final_buy_signals':0,
                  'source_sha256':{str(p):sha(p) for p in required+[join_csv]},
                  'notes':[
                      'Whole-market coverage is not a full-market current A/B regrade.',
                      'Non-numeric six-character codes are unreviewed, not assumed to be non-common shares.',
                      'Annual and growth records are earlier cached snapshots, not current-date filings.',
                      'The frozen R14 grades are research only; missing corrected filing evidence remains excluded.',
                      'Official KRX PER/PBR and verified trade entry prices are not released.'
                  ]
              }
              folder=ROOT/day
              folder.mkdir(parents=True,exist_ok=True)
              immutable(folder/'whole_market_coverage.csv',csv_bytes(rows))
              official_candidates=[x for x in rows if x['frozen_ab_research_grade'] and x['marketcap_100bn_eligible']=='YES']
              immutable(folder/'frozen_ab_current_cap.csv',csv_bytes(official_candidates))
              body=(json.dumps(status,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode('utf-8')
              immutable(folder/'status.json',body)
              ROOT.mkdir(parents=True,exist_ok=True)
              (ROOT/'latest_status.json').write_bytes(body)
              print(json.dumps({k:status[k] for k in ('state','official_market_date','source_market_rows','marketcap_100bn_rows','annual_cache_rows_matched','growth_cache_rows_matched','frozen_ab_current_cap_eligible')},ensure_ascii=False))
          
          if __name__=='__main__':
              main()
          PYCODE
          python -m py_compile /tmp/krx_v5_full_market_readiness.py
          python /tmp/krx_v5_full_market_readiness.py
      - name: Regrade entire market with existing R14 engine (provisional research only)
        shell: bash
        run: |
          python scripts/krx_v5_r14_grade_engine.py --self-test
          python scripts/krx_v5_r14_grade_engine.py \
            --financial data/v5_financial_m/annual_financial_index_m.csv \
            --market data/latest.csv \
            --cache data/v5_financial_m/dart_financial_cache.json \
            --output /tmp/krx_v5_fullmarket_regrade_engine.json
          cat > /tmp/krx_v5_fullmarket_regrade_audit.py <<'PYCODE'
          #!/usr/bin/env python3
          """Audit existing R14 provisional full-market scoring on a new promoted market date.

          Reads: cached OpenDART inputs and the existing R14 grade engine's preliminary report.
          Emits: dated and immutable *research-only* candidate comparisons, not trade signals.
          No requests, no revised DART records, no KRX ratio imports, no current final grades.
          """
          import csv
          import hashlib
          import io
          import json
          import re
          from collections import Counter
          from pathlib import Path

          ROOT = Path('.')
          REPORT = Path('/tmp/krx_v5_fullmarket_regrade_engine.json')
          MARKET = ROOT / 'data/latest.csv'
          SUMMARY = ROOT / 'data/summary.json'
          COVERAGE = ROOT / 'v5_reports/r14_full_market_readiness/latest_status.json'
          FIN_STATUS = ROOT / 'data/v5_financial_m/status.json'
          FROZEN = ROOT / 'v5_reports/stage28/r14_eligible_research_candidates.json'
          EXCLUDED = ROOT / 'v5_reports/stage28/r14_candidate_exclusion_gate.json'
          GRADE_SCRIPT = ROOT / 'scripts/krx_v5_r14_grade_engine.py'
          FIN_INDEX = ROOT / 'data/v5_financial_m/annual_financial_index_m.csv'
          FIN_CACHE = ROOT / 'data/v5_financial_m/dart_financial_cache.json'
          OUTROOT = ROOT / 'v5_reports/r14_daily_market_regrade'
          FIELDS = [
              'official_market_date', 'stock_code', 'stock_name', 'market', 'official_close_krw',
              'official_marketcap_krw', 'current_provisional_grade_research_only',
              'current_research_score', 'research_roe_pct', 'research_debt_pct',
              'derived_ttm_per_not_official', 'derived_pbr_not_official',
              'previous_frozen_grade_asof', 'previous_research_date', 'candidate_evidence_gate',
              'annual_financial_index_snapshot_date', 'financial_point_in_time_verified',
              'official_per_pbr_verified', 'final_grade', 'fair_value_verified',
              'actionable_entry_price', 'buy_signal', 'investment_decisions_authorized'
          ]


          def require(condition, reason):
              if not condition:
                  raise ValueError('R14_FULL_MARKET_PROVISIONAL_REGRADING_' + reason)


          def read_csv(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))


          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def csv_bytes(rows, fields):
              s = io.StringIO(newline='')
              writer = csv.DictWriter(s, fieldnames=fields, extrasaction='raise')
              writer.writeheader()
              writer.writerows(rows)
              return s.getvalue().encode('utf-8-sig')


          def immutable_write(path, content):
              path.parent.mkdir(parents=True, exist_ok=True)
              if path.exists():
                  require(path.read_bytes() == content, 'EXISTING_IMMUTABLE_SNAPSHOT_CONFLICT_' + path.name)
                  return
              path.write_bytes(content)


          def main():
              baseline = json.loads(REPORT.read_text(encoding='utf-8-sig'))
              summary = json.loads(SUMMARY.read_text(encoding='utf-8-sig'))
              coverage = json.loads(COVERAGE.read_text(encoding='utf-8-sig'))
              fin = json.loads(FIN_STATUS.read_text(encoding='utf-8-sig'))
              frozen = json.loads(FROZEN.read_text(encoding='utf-8-sig'))
              excluded = json.loads(EXCLUDED.read_text(encoding='utf-8-sig'))
              market = read_csv(MARKET)

              date = str(summary.get('latest_trading_date', ''))
              require(re.fullmatch(r'20\d{6}', date) is not None, 'BAD_OFFICIAL_DATE')
              require({r['BAS_DD'] for r in market} == {date}, 'OFFICIAL_MARKET_DATE_MISMATCH')
              require(len(market) >= 2600 and len(market) == summary['kospi_rows_latest'] + summary['kosdaq_rows_latest'], 'OFFICIAL_UNIVERSE_UNEXPECTED')
              require(coverage['state'] == 'WHOLE_MARKET_SOURCE_COVERAGE_RECORDED' and coverage['official_market_date'] == date, 'UPSTREAM_FULLMARKET_NOT_VERIFIED')
              require(coverage['source_market_rows'] == len(market), 'MARKET_ROW_COUNT_MISMATCH')
              require(coverage['source_sha256']['data/latest.csv'] == sha(MARKET), 'UPSTREAM_MARKET_HASH_MISMATCH')
              require(baseline.get('result') == 'PRELIMINARY_RESEARCH_ONLY', 'ENGINE_RESULT_NOT_RESEARCH')
              require(baseline.get('market_date') == date, 'ENGINE_MARKET_DATE_MISMATCH')
              require(baseline.get('financial_rows') == coverage['numeric_stock_codes'], 'ENGINE_FINANCIAL_COVERAGE_MISMATCH')
              require(baseline.get('investment_decisions_authorized') is False and baseline.get('final_buy_signals') == 0, 'ENGINE_SIGNALS_UNEXPECTED')
              require(baseline.get('financial_disclosure_asof_verified') is False, 'UNEXPECTED_FINANCIAL_CERTIFICATION')
              require(len(baseline['candidates']) == baseline['candidate_count'] and baseline['candidate_count'] >= 30, 'ENGINE_CANDIDATE_COVERAGE_UNEXPECTED')
              require(frozen.get('research_market_date') < date, 'FROZEN_DATE_NOT_OLDER_THAN_CURRENT_MARKET')
              require(frozen['candidate_count'] == len(frozen['candidates']) == 137, 'FROZEN_COHORT_MODIFIED')
              require(excluded['research_market_date'] == frozen['research_market_date'], 'EXCLUSION_DATE_MISMATCH')
              require(excluded['excluded_candidate_count'] == len(excluded['excluded_codes']) == 5, 'EXCLUSION_GATE_COUNT_CHANGED')
              require(fin.get('financial_disclosure_asof_verified') is False, 'PIT_SNAPSHOT_UNEXPECTED')
              require(fin.get('point_in_time_financials_authorized') is False, 'PIT_APPROVAL_UNEXPECTED')
              require(coverage['official_per_pbr_verified'] is False, 'RATIO_STATE_CHANGED')

              marks = {}
              for row in market:
                  code = row['ISU_CD']
                  if code.isdigit() and len(code) == 6:
                      require(code not in marks, 'DUPLICATE_NUMERIC_CODE')
                      marks[code] = row
              require(len(marks) == coverage['numeric_stock_codes'], 'NUMERIC_MARKET_UNIVERSE_MISMATCH')
              frozen_by_code = {r['code']: r for r in frozen['candidates']}
              require(len(frozen_by_code) == 137, 'DUPLICATE_FROZEN_CANDIDATES')
              exclusions = set(excluded['excluded_codes'])
              require(len(exclusions) == 5, 'EXCLUDED_CODE_DUPLICATES')

              result, newly_discovered, excluded_candidates = [], [], []
              engine_seen = set()
              for r in baseline['candidates']:
                  code = str(r['code'])
                  require(code in marks and code not in engine_seen, 'UNKNOWN_OR_DUPLICATE_ENGINE_CODE')
                  engine_seen.add(code)
                  market_row = marks[code]
                  grade = r.get('grade')
                  score = r.get('score')
                  require(grade in ('A','B') and isinstance(score, int), 'UNKNOWN_RESEARCH_GRADE')
                  require((grade == 'A' and score >= 85) or (grade == 'B' and score >= 65), 'ENGINE_GRADE_SCORE_MISMATCH')
                  require(r.get('buy_signal') is False and r.get('actionable_entry_price') is not True, 'ENGINE_UNSAFE_ACTIONABLE_OUTPUT')
                  require(int(market_row['MKTCAP']) >= 100_000_000_000, 'ENGINE_CAP_FILTER_MISMATCH')
                  old = frozen_by_code.get(code)
                  reason = ('EXCLUDED_MISSING_CORRECTION_EVIDENCE' if code in exclusions else
                            'EXISTING_FROZEN_COHORT_RESEARCH_ONLY' if old else
                            'NEW_RESEARCH_CANDIDATE_PENDING_FILING_AND_SHARECLASS_REVIEW')
                  x = {
                      'official_market_date':date, 'stock_code':code,
                      'stock_name':market_row['ISU_NM'], 'market':market_row['MARKET'],
                      'official_close_krw':market_row['TDD_CLSPRC'],
                      'official_marketcap_krw':market_row['MKTCAP'],
                      'current_provisional_grade_research_only':grade, 'current_research_score':score,
                      'research_roe_pct':r.get('roe_pct'), 'research_debt_pct':r.get('debt_pct'),
                      'derived_ttm_per_not_official':r.get('ttm_per_est'),
                      'derived_pbr_not_official':r.get('pbr_est'),
                      'previous_frozen_grade_asof':old['grade'] if old else '',
                      'previous_research_date':frozen['research_market_date'] if old else '',
                      'candidate_evidence_gate':reason,
                      'annual_financial_index_snapshot_date':fin['market_date'],
                      'financial_point_in_time_verified':'NO', 'official_per_pbr_verified':'NO',
                      'final_grade':'WITHHELD', 'fair_value_verified':'NO',
                      'actionable_entry_price':'NO', 'buy_signal':'NONE',
                      'investment_decisions_authorized':'NO'
                  }
                  if code in exclusions:
                      excluded_candidates.append(x)
                  else:
                      result.append(x)
                      if old is None:
                          newly_discovered.append(x)
              result.sort(key=lambda r: (-int(r['current_research_score']), r['stock_code']))
              newly_discovered.sort(key=lambda r: (-int(r['current_research_score']), r['stock_code']))
              excluded_candidates.sort(key=lambda r: r['stock_code'])
              retained = len([x for x in result if x['previous_frozen_grade_asof']])
              no_longer_pass = sorted(code for code in frozen_by_code if code not in engine_seen)
              require(len(result)+len(excluded_candidates)==baseline['candidate_count'], 'ENGINE_COHORT_RECONCILIATION_MISMATCH')
              require(retained+len(newly_discovered)==len(result), 'NEW_DISCOVERY_COUNT_MISMATCH')

              status={
                  'version':'KRX_V5_R14_FULL_MARKET_PROVISIONAL_REGRADING_V1',
                  'state':'RESEARCH_ONLY_FULL_MARKET_GRADE_ENGINE_RECALCULATED',
                  'official_market_date':date,
                  'source_market_rows':len(market),
                  'numeric_codes':len(marks),
                  'source_financial_rows':baseline['financial_rows'],
                  'source_financial_snapshot_date':fin['market_date'],
                  'source_annual_financial_years':sorted({row['year'] for row in read_csv(FIN_INDEX)}),
                  'source_70_session_market_archive_preserved':True,
                  'marketcap_100bn_rows':coverage['marketcap_100bn_rows'],
                  'engine_preliminary_ab':baseline['candidate_count'],
                  'engine_preliminary_ab_grade_counts':dict(Counter(x['grade'] for x in baseline['candidates'])),
                  'research_ab_after_historic_correction_exclusion':len(result),
                  'retained_prior_frozen_candidates':retained,
                  'new_provisional_discoveries_pending_filing_and_shareclass_review':len(newly_discovered),
                  'previous_frozen_cohort_not_currently_passing':len(no_longer_pass),
                  'excluded_missing_correction_evidence_passed_raw_score':len(excluded_candidates),
                  'new_discovery_codes':[x['stock_code'] for x in newly_discovered],
                  'previous_frozen_not_currently_passing_codes':no_longer_pass,
                  'excluded_raw_grade_codes':[x['stock_code'] for x in excluded_candidates],
                  'historical_provisional_grades_revised':False,
                  'current_grade_finally_verified':False,
                  'official_per_pbr_verified':False,
                  'financial_point_in_time_verified':False,
                  'investment_decisions_authorized':False,
                  'final_buy_signals':0,
                  'source_sha256':{str(p):sha(p) for p in (MARKET,SUMMARY,COVERAGE,FIN_STATUS,FROZEN,EXCLUDED,GRADE_SCRIPT,FIN_INDEX,FIN_CACHE)},
                  'warnings':[
                      'Existing R14 financial score model reused; current inputs include earlier annual/TTM cached values.',
                      'New findings are PROVISIONAL research leads, not official final A/B investment grades.',
                      'Unreviewed security classes, prior filing versions and missing corrected documents block approval.',
                      'Derived PER/PBR must never be represented as official KRX multiples.',
                      'No fair-value prices or executable buy recommendations are published.',
                      'No API calls, live intraday prices, retries, or upstream cache modifications.'
                  ]
              }
              out = OUTROOT / date
              immutable_write(out/'provisional_ab_full_market.csv',csv_bytes(result,FIELDS))
              immutable_write(out/'new_provisional_candidates_review_queue.csv',csv_bytes(newly_discovered,FIELDS))
              immutable_write(out/'excluded_preliminary_grades_audit.csv',csv_bytes(excluded_candidates,FIELDS))
              text=(json.dumps(status,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode('utf-8')
              immutable_write(out/'status.json',text)
              OUTROOT.mkdir(parents=True,exist_ok=True)
              (OUTROOT/'latest_status.json').write_bytes(text)
              print(json.dumps({k:status[k] for k in ('state','official_market_date','source_market_rows','marketcap_100bn_rows','engine_preliminary_ab','research_ab_after_historic_correction_exclusion','retained_prior_frozen_candidates','new_provisional_discoveries_pending_filing_and_shareclass_review','excluded_missing_correction_evidence_passed_raw_score')},ensure_ascii=False))


          if __name__=='__main__':
              main()
          PYCODE
          python -m py_compile /tmp/krx_v5_fullmarket_regrade_audit.py
          python /tmp/krx_v5_fullmarket_regrade_audit.py
      - name: Commit daily financial/growth, full-market coverage, and R14 provisional regrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_reports/r14_daily_financial_join/ v5_reports/r14_full_market_readiness/ v5_reports/r14_daily_market_regrade/
          if git diff --cached --quiet; then
            echo 'Identical daily research evidence already saved, no commit.'
            exit 0
          fi
          git commit -m 'KRX v5: archive full-market R14 provisional regrade evidence'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve independently verified financial growth research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-r14-financial-growth-join
          path: |
            v5_reports/r14_daily_financial_join/
            v5_reports/r14_full_market_readiness/
            v5_reports/r14_daily_market_regrade/
          if-no-files-found: warn
          retention-days: 45
