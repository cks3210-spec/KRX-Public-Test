name: KRX v5 Three-Period TTM Pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ttm-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect three periods read-only
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import base64, json, pathlib, urllib.request, sys, os
          base=pathlib.Path('v5_stage7_runtime');base.mkdir(exist_ok=True)
          (base/'v5_dart_source_adapter.py').write_bytes(base64.b64decode(''))
          (base/'v5_dart_live_collector.py').write_bytes(base64.b64decode(''))
          sys.path.insert(0,str(base.resolve()))
          from v5_dart_live_collector import request, corp_mapping, collect
          url='https://raw.githubusercontent.com/cks3210-spec/KRX-Public-Test/v5-state/v5_history/history_metrics.json'
          with urllib.request.urlopen(url,timeout=45) as resp: history=json.load(resp)
          mapping=corp_mapping(request('corpCode.xml',binary=True))
          results=collect(history,mapping,limit=10,sleep=.15)
          out=pathlib.Path('v5_stage7_output');out.mkdir(exist_ok=True)
          (out/'ttm_provisional.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          from collections import Counter
          statuses=dict(Counter(x['status'] for x in results.values()))
          missing=dict(Counter(k for v in results.values() for k in (v.get('financial') or {}).get('missing',[])))
          summary={'companies':len(results),'statuses':statuses,'missing_fields':missing,'source_reconciled':False,'investment_grades_created':0,'mode':'READ_ONLY'}
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          if not results or all(x['status']=='FETCH_ERROR' for x in results.values()):raise SystemExit('No usable DART data')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-three-period-ttm-pilot
          path: v5_stage7_output/
          if-no-files-found: warn
