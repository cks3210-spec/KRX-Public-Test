name: KRX v5 Filing Timeline Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  filing-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check OpenDART filing timeline for 10 stocks
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python v5/dart_filing_timeline_10.py
      - name: Upload filing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-v5-filing-timeline-10
          path: v5_output/filing_*
          if-no-files-found: warn
