name: KRX v5 Integrated Fix - Existing Financial History Recovery
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover historical OpenDART research from v5-state
        shell: bash
        run: |
          mkdir -p v5_history
          git show origin/v5-state:v5_history/history_metrics.json > v5_history/history_metrics.json
      - name: Join existing history with current fundamental and market inputs
        shell: bash
        run: |
          mkdir -p v5_reports/integrated_fix
          python - <<'PY'
          import base64,pathlib
          pathlib.Path('/tmp/v5_integrated_fix.py').write_bytes(base64.b64decode(''))
          PY
          python /tmp/v5_integrated_fix.py
      - name: Save isolated integration results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_reports/integrated_fix/
          if ! git diff --cached --quiet; then
            git commit -m 'v5 fix: reconnect existing financial history'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v5-integrated-fix
          path: v5_reports/integrated_fix/
