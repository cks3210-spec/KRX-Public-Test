name: V5 Stage18 Offline Financial Audit R3
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-stage18-offline-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Stage17 persisted cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('data/v5_stage15_annual_cache.json')
          data=json.loads(p.read_text(encoding='utf-8-sig'))
          entries=data['entries']
          success={k:v for k,v in entries.items() if isinstance(v,dict) and isinstance(v.get('filing'),dict) and bool(v['filing'])}
          y25=sum(k.endswith(':2025') for k in success)
          y24=sum(k.endswith(':2024') for k in success)
          print(f'persisted cache: {len(success)} successes; 2025={y25}; 2024={y24}')
          if (len(success),y25,y24)!=(1672,839,833):
              raise SystemExit('Stage17 cache counts differ from verified snapshot; stopping before audit')
          PY
      - name: Run existing Stage18 audit (read-only input)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage18_results
          python -m py_compile scripts/KRX18_Financial_Audit_Nov16.py
          python scripts/KRX18_Financial_Audit_Nov16.py --data-dir data --output-dir stage18_results
      - name: Validate Stage18 outputs
        shell: bash
        run: |
          python - <<'PY'
          import csv,json,pathlib
          d=pathlib.Path('stage18_results')
          summary=json.loads((d/'v5_stage18_financial_audit_summary.json').read_text(encoding='utf-8'))
          with (d/'v5_stage18_financial_audit.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==summary['analyzed_count'] and len(rows)>0
          assert summary['verified_grade_count']==0
          assert all(r['official_per_verified']=='False' and r['official_pbr_verified']=='False' for r in rows)
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## Stage18 Offline Financial Audit\n\n')
              for key in ('analyzed_count','annual_comparable_count','proxy_counts','provisional_grade_counts','verified_grade_count','issue_counts','classification'):
                  f.write(f'- **{key}**: `{summary.get(key)}`\n')
          PY
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage18-offline-audit-r3-${{ github.run_number }}
          path: stage18_results/
          if-no-files-found: warn
